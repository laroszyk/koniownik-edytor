      return;
    }

    if (trybTor) {
      // Zasięg chwytu zależy od tego, co pod palcem. Punkty figury stoją gęsto,
      // co dwa i pół metra na obwodzie wolty, a rysowane są drobno — łapane
      // z osiemdziesięciu centymetrów zjadały cały prześwit między dwiema woltami
      // i nie dało się tam postawić punktu trasy.
      let trafiony = -1, najD = Infinity;
      stan.tor.forEach((t, i) => {
        const zasieg = !t.figId ? 0.8 : (koniecFigury(i) ? 0.5 : 0.35);
        const d = Math.hypot(t.x - p0.x, t.y - p0.y);
        if (d < zasieg && d < najD) { najD = d; trafiony = i; }
      });

      // dotknięcie końca figury = „stąd rysuję dalej"; koń wyjeżdża z figury w tor
      if (trafiony >= 0 && stan.tor[trafiony].figId) {
        const idx = indeksyFigury(stan.tor[trafiony].figId);
        const pierwszy = idx[0], ostatni = idx[idx.length - 1];
        if (trafiony === ostatni || trafiony === pierwszy) {
          const przed = trafiony === pierwszy && trafiony !== ostatni;
          // Wolta zaczyna się i kończy w tym samym miejscu, więc jedno kółeczko jest
          // i początkiem, i końcem — dotknięcie go ma znaczyć „wjazd", tak jak przy
          // półwolcie dotknięcie jej początku.
          const zamknieta = Math.hypot(stan.tor[pierwszy].x - stan.tor[ostatni].x,
                                       stan.tor[pierwszy].y - stan.tor[ostatni].y) < 0.05;
          // dotknięty wjazd w figurę, a na placu jest już narysowana linia:
          // doprowadzamy ją do figury, zamiast zaczynać osobne rysowanie „przed"
          if ((przed || zamknieta) && dolaczLinieDoFigury(stan.tor[pierwszy])) return;
          if (kontynuacja && kontynuacja.indeks === trafiony && kontynuacja.przed === przed) {
            kontynuacja = null;
            rysuj(); odswiezKontekst();
            pokazPodpowiedz("Dorysowywanie od tego końca wyłączone");
          } else {
            kontynuacja = { indeks: trafiony, przed: przed };
            rysuj(); odswiezKontekst();   // wybrany koniec ma się od razu podświetlić
            pokazPodpowiedz("Stąd rysuję dalej — dotykaj placu, żeby ciągnąć trasę, albo dotknij innej figury, żeby ją tu podłączyć");
          }
          return;
        }
      }

      if (trafiony >= 0) {
        // istniejący punkt: przeciągnięcie przesuwa, samo dotknięcie przełącza narożnik.
        // Punkt figury ciągnie ze sobą całą figurę — kółko przesuwane punkt po punkcie
        // przestałoby być kółkiem po pierwszym ruchu.
        zapiszHistorie();
        ciagnietyPunkt = trafiony;
        ruszyl = false;
        const chwyt = stan.tor[trafiony];
        grupaFigury = chwyt.figId
          ? stan.tor.filter((t) => t.figId === chwyt.figId).map((t) => ({ t: t, x: t.x, y: t.y }))
          : null;
        offset = { x: p0.x - stan.tor[trafiony].x, y: p0.y - stan.tor[trafiony].y };
        svg.setPointerCapture(ev.pointerId);
        return;
      }

      zapiszHistorie();
      const nowy = {
        x: zaokr(p0.x, 0, stan.dl),
        y: zaokr(p0.y, 0, stan.sz),
        ostry: ostryNarożnik,
        przerwa: nowyOdcinek || undefined
      };
      zwiazPunkt(nowy);          // postawiony na drągu = przyklejony do tego drąga
      if (kontynuacja) {
        // dorysowujemy od wskazanego końca figury, a nie na samym końcu listy punktów
        if (kontynuacja.przed) {
          const stary = stan.tor[kontynuacja.indeks];
          if (stary && stary.przerwa) { delete stary.przerwa; nowy.przerwa = true; }
          stan.tor.splice(kontynuacja.indeks, 0, nowy);
        } else {
          stan.tor.splice(kontynuacja.indeks + 1, 0, nowy);
          kontynuacja.indeks++;
        }
      } else {
        // Punkt postawiony zaraz po figurze zaczyna nową linię, a nie doczepia się
        // do wolty. Wyjazd z figury jest świadomym wyborem — dotyka się jej końca —
        // więc nie dostaje się go za samo narysowanie czegokolwiek po niej.
        const ost = stan.tor[stan.tor.length - 1];
        const poFigurze = !!(ost && ost.figId) && !nowy.przerwa;
        if (poFigurze) nowy.przerwa = true;
        stan.tor.push(nowy);
        if (poFigurze) {
          rysuj(); zapiszLokalnie(); odswiezKontekst(); odswiezLiczniki(); odswiezOstrzezenia();
          nowyOdcinek = false;
          return pokazPodpowiedz("Nowa linia obok figury · żeby jechać dalej od figury, dotknij jej końca");
        }
      }
      nowyOdcinek = false;
      rysuj(); zapiszLokalnie(); odswiezKontekst(); odswiezLiczniki(); odswiezOstrzezenia();
      return;
    }

    // uchwyt zaznaczonej figury ma pierwszeństwo: leży na jej linii, więc bez tego
    // każde dotknięcie uchwytu zaczynałoby przesuwanie zamiast rozciągania
    if (zaznaczonaFigura) {
      const u = uchwytFigury(zaznaczonaFigura);
      if (u && Math.hypot(u.x - p0.x, u.y - p0.y) < CHWYT_UCHWYTU) {
        stanPrzedRuchem = klon(stan);
        ruszyl = false;
        ciagnietyUchwyt = { figId: zaznaczonaFigura, u: u };
        svg.setPointerCapture(ev.pointerId);
        pokazPodpowiedz(`Ciągnij, żeby zmienić średnicę · teraz ${fmtL(u.d)} m`);
        return;
      }
    }

    // gałka obrotu zaznaczonej przeszkody ma pierwszeństwo — leży poza jej kształtem,
    // więc nic innego się o nią nie potyka
    const zazn0 = znajdz(zaznaczony);
    if (zazn0 && !trybMiarka && !trybNumerowania) {
      const u = punktUchwytuObrotu(zazn0);
      if (Math.hypot(u.x - p0.x, u.y - p0.y) < chwytGalki()) {
        stanPrzedRuchem = klon(stan);
        ruszyl = false;
        ciagnietyObrot = { e: zazn0 };
        svg.setPointerCapture(ev.pointerId);
        pokazPodpowiedz("Kręć, żeby obrócić · puść, żeby zostawić");
        return;
      }
    }

    // Punkt na trasie leży na samej linii, więc musi mieć pierwszeństwo przed
    // chwytaniem linii i przed przeszkodami, nad którymi bywa położony.
    if (!trybMiarka && !kropkiSchowane) {
      const qP = punktTrasyPod(p0);
      if (qP) {
        zaznaczony = null; zaznaczonaFigura = null; zaznaczonyOdcinek = null;
        zaznaczonyPunkt = qP.id;
        stanPrzedRuchem = klon(stan);

        q.t.y = okr(Math.min(stan.sz, Math.max(0, q.y + dy)));

      if (c.cel) {
        const w = polaczKropki(c.od, c.cel);
        if (w && w.blad) pokazPodpowiedz(w.blad);
        else if (w && w.sklejone) pokazPodpowiedz(
          "Ćwiczenia sklejone — trasa znów jest jedną linią"
          + " · cofniesz strzałką w nagłówku");
        else if (w) pokazPodpowiedz((w.powrot
          ? `${w.opis} mijany ${RAZ[w.ile] || (w.ile + ". ")}raz — to ${w.nr}`
          : (w.zeStartu
              ? `${w.opis} to 1 — pierwsza po starcie`
              : `${w.opis} to ${w.nr}`))
          + " · ciągnij dalej, dotknij zielonej kropki, żeby zdjąć, albo poza placem, gdy gotowe");
        else pokazPodpowiedz("Tego się nie da wpiąć samego w siebie");
      } else if (!c.ruszyl && zdejmijKropke(c.od)) {
        // nic więcej — zdejmijKropke samo powiedziało, co zrobiło
      } else if (!c.ruszyl && c.tryb === "numeruj") {
        numerujPod(c.skad);       // dotknięcie bez pociągnięcia działa jak dawniej
      } else if (!c.ruszyl) {
        // Samo dotknięcie kropki na placu zaznacza to, do czego ona należy —
        // inaczej dotknięcie tuż obok przeszkody odznaczałoby wszystko.
        zaznaczonyPunkt = null;
        if (c.od.el !== undefined) { zaznaczony = c.od.el; zaznaczonaFigura = null; }
        else { zaznaczonaFigura = c.od.fig; zaznaczony = null; }
        zaznaczonyOdcinek = null;
        odswiezPomiar();
        pokazPodpowiedz("Ciągnij od tej kropki tam, gdzie koń jedzie dalej");
      } else if (c.ruszyl && naPiasku(c.p) && !kropkaBlisko(c.p)) {
        // Puszczone na pustym piasku = punkt na trasie. To jest odpowiednik
        // „Punktu na trasie" z parkour.design: miejsce, przez które koń jedzie,
        // choć nic tam nie stoi. Dzięki temu linię da się wygiąć ręką.
        const w = dodajPunktTrasy(c.od, c.p);
        if (w) {
          zaznaczonyPunkt = w.id;
          pokazPodpowiedz(`Punkt na trasie — to ${w.nr} · przeciągnij, żeby wygiąć, dotknij, żeby zdjąć`);
        } else {
          pokazPodpowiedz("Najpierw wepnij coś w trasę, potem dokładaj punkty");
        }
      } else {
        pokazPodpowiedz("Puść na zielonej kropce przy tym, przez co koń jedzie dalej"
          + " · albo na pustym piasku, żeby dołożyć punkt trasy");
      }
      rysuj(); zapiszLokalnie(); odswiezKontekst(); odswiezLiczniki(); odswiezOstrzezenia();
      try { svg.releasePointerCapture(ev.pointerId); } catch (err) {}
      return;
    }

    if (ciagnietyOdcinek) {
      const pierwszy = ciagnietyOdcinek.punkty.length ? ciagnietyOdcinek.punkty[0].t : null;
      ciagnietyOdcinek = null;
      stanPrzedRuchem = null;
      let sklejone = null;
      if (ruszyl && pierwszy) sklejone = sprobujPolaczyc(pierwszy);
      if (sklejone) { zaznaczonyOdcinek = null; zaznaczoneZlaczenie = sklejone.styk; }
      if (ruszyl && sklejone) pokazPodpowiedz("Złączone w jedną trasę — „Rozłącz\u201d w pasku poniżej je rozdzieli");
      else if (ruszyl) pokazPodpowiedz("Linia przesunięta");
      else pokazPodpowiedz("Linia zaznaczona — przeciągnij, żeby ją przesunąć, albo usuń w pasku poniżej");
      rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
      odswiezLiczniki(); odswiezOstrzezenia();
    }

    if (ciagnietyUchwyt) {
      const d = ciagnietyUchwyt.u.d, typ = ciagnietyUchwyt.u.typ;
      ciagnietyUchwyt = null;
      stanPrzedRuchem = null;
      rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
      odswiezLiczniki(); odswiezOstrzezenia();
      if (ruszyl) pokazPodpowiedz(`${FIGURY[typ].nazwa} ${fmtL(d)} m`);
    }

    if (ciagnietaFigura) {
      const wFigurze = ciagnietaFigura.punkty.length ? ciagnietaFigura.punkty[0].t : null;
      const ciagnieteKolaOsemki = drugieKoloOsemki(ciagnietaFigura.figId) != null;
      ciagnietaFigura = null;
      stanPrzedRuchem = null;
      let sklejone = null;
      if (ruszyl && wFigurze) {
        // figura bywa calym odcinkiem — wtedy jej poczatek jest poczatkiem linii
        const g = odcinkiToru(stan.tor).find((x) => x.indexOf(wFigurze) >= 0);
        if (g) sklejone = sprobujPolaczyc(g[0]);
      }
      if (sklejone) { zaznaczonaFigura = null; zaznaczoneZlaczenie = sklejone.styk; }
      if (ruszyl && sklejone) pokazPodpowiedz("Złączone w jedną trasę — „Rozłącz\u201d w pasku poniżej je rozdzieli");
      else if (ruszyl) pokazPodpowiedz(ciagnieteKolaOsemki ? "Ósemka przesunięta" : "Figura przesunięta");
      rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
      odswiezLiczniki(); odswiezOstrzezenia();
    }

    if (przesuwanieWidoku) {
      // dotknięcie bez ruchu to nadal „odznacz", przeciągnięcie przesunęło widok
      if (!przesuwanieWidoku.ruszyl) {
        zaznaczony = null; rysuj(); odswiezPomiar(); odswiezKontekst();
      }
      przesuwanieWidoku = null;
    }

    if (ciagnietyPunkt !== null) {
      const t = stan.tor[ciagnietyPunkt];
      if (!ruszyl && t.zlaczenie) {
        // w trybie Tor grzebiemy w pojedynczych punktach, wiec tu dotkniecie rozlacza od razu
        ciagnietyPunkt = null;
        grupaFigury = null;
        rozlacz(t);
        return;
      }
      if (!ruszyl && t.figId) {
        pokazPodpowiedz("Punkt gotowej figury — przeciągnij, a pojedzie cała figura");
      } else if (!ruszyl) {
        t.ostry = !t.ostry;
        pokazPodpowiedz(t.ostry ? "Ten punkt to teraz kąt prosty" : "Ten punkt jest znowu zaokrąglony");
      } else if (t.figId) {
        pokazPodpowiedz("Figura przesunięta");
      } else {
        // punkt przeciągnięty na przeszkodę przykleja się do niej, ściągnięty z niej — odczepia
        const bylo = t.el;
        zwiazPunkt(t);
        if (t.el !== bylo) {
          pokazPodpowiedz(t.el !== undefined
            ? "Punkt trasy przyklejony do przeszkody — pojedzie razem z nią"
            : "Punkt trasy odczepiony od przeszkody");
        }
      }
      ciagnietyPunkt = null;
      grupaFigury = null;
      rysuj(); zapiszLokalnie(); odswiezKontekst(); odswiezLiczniki(); odswiezOstrzezenia();
    }
    if (ciagnietyObrot) {
      ciagnietyObrot = null;
      stanPrzedRuchem = null;
      rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
      odswiezLiczniki(); odswiezOstrzezenia();
    }

    if (ciagniety) {
      // Upuszczony na trasie zapina się do niej — bez ruszania linii. Dotyczy tak samo
      // świeżo postawionego, jak i przestawionego: wcześniej tylko świeży się wpinał
      // i przeciągnięcie kawaletki na figurę nic nie dawało.
      if (ruszyl) {
        const swiezy = ciagniety.swiezy;
        delete ciagniety.swiezy;
        zakotwiczWTorze(ciagniety);
        // Postawienie sprzętu NIE dopisuje go do przejazdu — i to trzeba powiedzieć
        // od razu, bo inaczej człowiek czeka, aż coś samo się połączy.
        if (swiezy && moglbyByc(ciagniety) && krokiTrasy().length < 1) {
          pokazPodpowiedz("Stoi na placu · przejazd ułożysz, ciągnąc od kropki do kropki");
        }
      }
      ciagniety = null;
      torPrzyElemencie = null;
      stanPrzedRuchem = null;
      zapiszLokalnie();
      // bez tego ostrzeżenie „stoją na sobie" wisiało po rozsunięciu elementów
      odswiezLiczniki(); odswiezOstrzezenia();
    }
    try { svg.releasePointerCapture(ev.pointerId); } catch (e) {}
  }
  svg.addEventListener("pointerup", koniec);
  svg.addEventListener("pointercancel", koniec);

  function zaokr(v, min, max) {
    const k = przyciaganie ? Math.round(v * 4) / 4 : Math.round(v * 100) / 100;
    return Math.min(max, Math.max(min, k));
  }

  // ====================== pomiar ======================

  // Ile odległość może odbiegać od wzoru i nadal być do przejechania.
  // Tabele branżowe podają widełki szerokie na ok. metr (1 fula 7,3–7,9 m,
  // 2 fule 10,5–11,0 m), więc ±0,25 m było za ostre i czerwieniło poprawne odległości.
  const LUZ_OK = 0.5, LUZ_BLISKO = 1.0;

  // Zwraca ocenę jednego rozstawu dla jednej wielkości konia.
  function ocen(d, klucz, naziemneDragi) {
    const k = KONIE[klucz];
    if (naziemneDragi) {
      const tab = DRAGI[klucz];
      const chod = najblizszyChod(d, tab);
      if (!chod) {
        // Za daleko na rozstaw pod jeden krok — to odległość na kilka fuli galopu.
        // Przy drągach na ziemi nie ma zapasu na lądowanie i odbicie.
        const fule = d / k.fula;
        if (fule < 1.35) return { klasa: "", tekst: "między chodami", krotki: "między chodami", opis: "" };
        const n = Math.round(fule);
        const wzor = n * k.fula;
        const roz = d - wzor;
        let klasa, tekst, krotki;
        if (Math.abs(roz) <= 0.25) {
          klasa = "ok"; tekst = `${n} ${odmianaFuli(n)} galopu`; krotki = `${n} ${odmianaFuli(n)}`;
        } else if (Math.abs(roz) <= LUZ_BLISKO) {
          klasa = "blisko";
          tekst = `${n} ${odmianaFuli(n)} — ${roz < 0 ? "koń musi skrócić" : "koń musi wydłużyć"}`;
          krotki = `${n} ${odmianaFuli(n)} ${rozciagniecie(n, roz)}`;
        } else {
          klasa = "zle";
          const lo = roz < 0 ? n - 1 : n, hi = roz < 0 ? n : n + 1;
          // mówimy, co z tym zrobić, a nie że „wypada pomiędzy": na mniejszą liczbę
          // fuli trzeba je wyciągnąć, na większą skrócić
          tekst = `${lo} ${odmianaFuli(lo)} ${rozciagniecie(lo, 1)} albo ${hi} ${rozciagniecie(hi, -1)}`;
          krotki = `${lo} albo ${hi}`;
        }
        return { klasa, tekst, krotki, opis: `${n} ${odmianaFuli(n)} = ${fmt(wzor)} m` };
      }
      const [lo, hi] = tab[chod];
      const nazwa = { step: "stęp", klus: "kłus", galop: "galop" }[chod];
      let klasa, tekst;
      if (d >= lo - 0.005 && d <= hi + 0.005) { klasa = "ok"; tekst = nazwa; }
      else if (d >= lo - 0.12 && d <= hi + 0.12) { klasa = "blisko"; tekst = nazwa + (d < lo ? " ciasno" : " luźno"); }
      else { klasa = "zle"; tekst = d < lo ? "za krótko" : "za długo"; }
      return { klasa, tekst, krotki: tekst, opis: `${nazwa} ${fmt(lo)}–${fmt(hi)} m` };
    }
    const zapas = zapasKonia(klucz);
    const fule = (d - zapas) / k.fula;
    // własna klasa, bo to jedyny przypadek, w którym odległości fizycznie nie da się
    // przejechać — reszta ocen mówi „jak", ta mówi „nie tutaj"
    // Język od Luizy, 17 września: liczba fuli, a przy nietypowym dystansie jedno
    // słowo — „ciasno" (trzeba skrócić krok) albo „obszernie" (trzeba wydłużyć).
    // Żadnych ptaszków i żadnego „2 albo 3": instruktorka chce wiedzieć ILE fuli
    // i czy koń musi coś z tym zrobić.
    if (fule < 0.6) {
      const nn = Math.max(1, Math.round(Math.max(0, d) / k.fula));
      return { klasa: "stop", tekst: "ciasno — nie zmieści się lądowanie i odbicie",
               krotki: "ciasno — nie zmieści się", slowo: "ciasno", n: nn, opis: "", zapas: zapas };
    }
    const n = Math.round(fule);
    const wzor = zapas + n * k.fula;
    const roz = d - wzor;
    let klasa, slowo;
    if (Math.abs(roz) <= LUZ_OK) { klasa = "ok"; slowo = ""; }
    else {
      klasa = Math.abs(roz) <= LUZ_BLISKO ? "blisko" : "zle";
      slowo = roz < 0 ? "ciasno" : "obszernie";
    }
    const ile = `${n} ${odmianaFuli(n)}`;
    const krotki = slowo ? `${ile} · ${slowo}` : ile;
    const tekst = slowo
      ? `${ile} — ${slowo === "ciasno" ? "trzeba skrócić krok" : "trzeba wydłużyć krok"}`
      : ile;
    // n i zapas wracają na wierzch, żeby wiersz mógł pokazać rachunek tak, jak się
    // go robi w głowie: „tyle fuli się mieści, tyle metrów zostaje"
    return { klasa, tekst, krotki, slowo: slowo, opis: `${ile} = ${fmt(wzor)} m`,
             n: n, zapas: zapas };
  }

  // Dwa znaki dla dwóch kolorów: „✓" wychodzi na pełną liczbę fuli, „–" wypada
  // pomiędzy. Krzyżyk odpadł razem z czerwienią — to nie jest błąd, tylko inna
  // odległość, a instruktorka sama wie, czy chce ją tak zostawić.
  const ZNAKI = { ok: "✓", blisko: "✓", zle: "–", stop: "·", "": "·" };

  // „1 fula wydłużona", „2 fule skrócone", „5 fuli wydłużonych"
  function odmianaPrzym(n, formy) {
    if (n === 1) return formy[0];
    const j = n % 10, d = n % 100;
    return (j >= 2 && j <= 4 && !(d >= 12 && d <= 14)) ? formy[1] : formy[2];
  }
  function rozciagniecie(n, roz) {
    return roz > 0
      ? odmianaPrzym(n, ["wydłużona", "wydłużone", "wydłużonych"])
      : odmianaPrzym(n, ["skrócona", "skrócone", "skróconych"]);
  }
  const KROTKO = { duzy: "koń duży", maly: "koń mały", kuc: "kuc" };

  function odswiezPomiar() {
    const box = $("pomiar");
    const a = miarkaA ? znajdz(miarkaA) : null;
    const b = miarkaB ? znajdz(miarkaB) : null;

    if (!a || !b) {
      if (trybMiarka) {
        box.className = "pomiar pusty";
        box.innerHTML = "<span class='liczba'>" +
          (a ? "Teraz dotknij drugiego elementu" : "Dotknij pierwszego elementu") + "</span>";
        return;
      }
      // Bez trybu mierzenia: zaznaczenie drąga pokazuje ocenę rozstawu, gdy coś nie gra.
      // Szereg drągów stoi zwykle bliżej niż 2 m, więc na torze nie ma tam żadnych podpisów.
      // Panel nie wyskakuje sam — wszystko, co trzeba, jest na placu przy linii.
      // Pojawia się wyłącznie wtedy, gdy sama włączysz „Zmierz".
      box.className = "pomiar schowany";
      box.innerHTML = "";
      return;
    }

    pokazPomiar(a, b, null);
  }

  // Najbliższy element leżący w tej samej linii co zaznaczony — jego sąsiad w szeregu.
  function sasiadWSzeregu(e) {
    if (SZEREG_TYPY.indexOf(e.typ) < 0) return null;
    const lista = szereg(e).lista;
    const i = lista.findIndex((x) => x.id === e.id);
    if (i < 0) return null;
    let naj = null, najD = Infinity;
    [lista[i - 1], lista[i + 1]].forEach((k) => {
      if (!k) return;
      const d = Math.hypot(k.x - e.x, k.y - e.y);
      if (d < najD) { najD = d; naj = k; }
    });
    return naj;
  }

  function pokazPomiar(a, b, etykieta) {
    const box = $("pomiar");
    const srodki = Math.hypot(b.x - a.x, b.y - a.y);
    const naziemne = TYPY[a.typ].naziemny && TYPY[b.typ].naziemny;
    const naziemneDragi = naziemne
      && (a.typ === "drag" || a.typ === "kawaletka")
      && (b.typ === "drag" || b.typ === "kawaletka");

    let d, konwencja;
    if (naziemne) {
      d = srodki;
      konwencja = "od środka do środka";
    } else {
      d = srodki - glebokosc(a) / 2 - glebokosc(b) / 2;
      konwencja = "od tyłu pierwszej do podstawy następnej";
    }

    const wybrane = grupy();
    const oceny = ["duzy", "maly", "kuc"].map((klucz) => {
      const o = ocen(d, klucz, naziemneDragi);
      return `<span class="kon ${o.klasa}${wybrane.indexOf(klucz) >= 0 ? " wybrany" : ""}" title="${KONIE[klucz].dop}${o.opis ? " — " + o.opis : ""}">` +
             `<span class="znak">${ZNAKI[o.klasa]}</span>${KROTKO[klucz]} · ${o.tekst}</span>`;
    }).join("");

    box.className = "pomiar";
    box.innerHTML =
      (etykieta ? `<span class="skad">${etykieta}</span>` : "") +
      `<span class="liczba">${fmt(d)} m</span>` +
      `<span class="konie">${oceny}</span>` +
      `<span class="konwencja">${konwencja}</span>`;
  }

  function najblizszyChod(d, tab) {
    let naj = null, dyst = Infinity;
    for (const chod in tab) {
      const [lo, hi] = tab[chod];
      const r = d < lo ? lo - d : (d > hi ? d - hi : 0);
      if (r < dyst) { dyst = r; naj = chod; }
    }
    return dyst <= 0.5 ? naj : null;
  }

  function odmianaFuli(n) {
    if (n === 1) return "fula";
    const o = n % 10, d = n % 100;
    if (o >= 2 && o <= 4 && !(d >= 12 && d <= 14)) return "fule";
    return "fuli";
  }

  function fmt(v) { return v.toFixed(2).replace(".", ","); }

  // ====================== paleta ======================

  const POZYCJE = [
    { typ: "start",      podpis: "Start" },
    { sep: true },
    { typ: "drag",       podpis: "Drąg" },
    { typ: "kawaletka",  podpis: "Kawaletka" },
    { typ: "stacjonata", podpis: "Stacjonata" },
    { typ: "okser",      podpis: "Okser" },
    { sep: true },
    { fig: "wolta",      podpis: "Wolta" },
    { fig: "polwolta",   podpis: "Półwolta" },
    { fig: "serpentyna", podpis: "Serpentyna" },
    { fig: "osemka",     podpis: "Ósemka" },
    { typ: "zatrzymanie", podpis: "Zatrzymanie" },
    { sep: true },
    { typ: "pacholek",   podpis: "Pachołek" },
    { typ: "opona",      podpis: "Opona" },
    { typ: "litera",     podpis: "Litera" },
    { typ: "inny",       podpis: "Inny" }
  ];

  function zbudujPalete() {
    const p = $("paleta");
    p.querySelectorAll(".zwykly, .moja, .rozdziel.dodany").forEach((n) => n.remove());
    POZYCJE.forEach((poz) => {
      if (poz.sep) { const s = document.createElement("div"); s.className = "rozdziel dodany"; p.appendChild(s); return; }
      const b = document.createElement("button");
      b.className = "zwykly";
      if (poz.fig) {
        b.dataset.fig = poz.fig;
        b.title = FIGURY[poz.fig].opis;
        b.innerHTML = `<span class="ikonka">${ikonaFigury(poz.fig)}</span><span class="nazwa">${poz.podpis}</span>`;
        b.addEventListener("click", () => oknoFigury(poz.fig));
      } else {
        b.dataset.typ = poz.typ;
        b.innerHTML = `<span class="ikonka">${ikona(poz.typ)}</span><span class="nazwa">${poz.podpis}</span>`;
        b.addEventListener("click", () => dodaj(poz.typ));
      }
      p.appendChild(b);
    });

    if (mojePrzeszkody.length) {
      const sep = document.createElement("div");
      sep.className = "rozdziel dodany";
      p.appendChild(sep);
      mojePrzeszkody.forEach((mp, i) => {
        const b = document.createElement("button");
        b.className = "moja";
        b.title = mp.nazwa + " — prawy przycisk albo Shift usuwa z palety";
        b.innerHTML = `<span class="ikonka">${ikona(mp.typ)}</span><span class="nazwa">${mp.nazwa}</span>` +
                      `<span class="licznik">${mp.wysokosc ? mp.wysokosc + " cm" : fmt(mp.dlugosc) + " m"}</span>`;
        b.addEventListener("click", (ev) => {
          if (ev.shiftKey) { usunMojaPrzeszkode(i); return; }
          dodaj(mp.typ, { dlugosc: mp.dlugosc, wysokosc: mp.wysokosc, rozstaw: mp.rozstaw });
        });
        b.addEventListener("contextmenu", (ev) => { ev.preventDefault(); usunMojaPrzeszkode(i); });
        p.appendChild(b);
      });
    }
  }

  function usunMojaPrzeszkode(i) {
    const n = mojePrzeszkody[i].nazwa;
    mojePrzeszkody.splice(i, 1);
    zapiszUstawienia("przeszkody", mojePrzeszkody);
    zbudujPalete(); odswiezLiczniki(); odswiezOstrzezenia();
    pokazPodpowiedz(`Usunięto „${n}" z palety`);
  }

  // pasek pojawiający się tylko wtedy, gdy coś jest zaznaczone
  function odswiezKontekst() {
    odswiezKontekstWewn();
    ozdobLiczby($("kontekst"));
  }

  function odswiezKontekstWewn() {
    const k = document.getElementById("kontekst");

    if (trybTor) {
      k.className = "kontekst widoczny";
      k.textContent = "";

      const nowy = document.createElement("button");
      nowy.className = "glowny";
      nowy.textContent = "+ Nowy odcinek";
      nowy.classList.toggle("on", nowyOdcinek);
      nowy.disabled = !stan.tor.length;
      nowy.addEventListener("click", () => {
        nowyOdcinek = !nowyOdcinek;
        kontynuacja = null;
        odswiezKontekst();
        pokazPodpowiedz(nowyOdcinek
          ? "Następny punkt zacznie nową linię — poprzednia zostaje bez zmian"
          : "Kolejne punkty dopisują się do bieżącej linii");
      });
      k.appendChild(nowy);

      const kreska1 = document.createElement("div");
      kreska1.className = "pion";
      k.appendChild(kreska1);

      const etykieta = document.createElement("span");
      etykieta.className = "co";
      etykieta.textContent = "narożnik";
      k.appendChild(etykieta);

      [["Łuk", false], ["Kąt", true]].forEach(([txt, wart]) => {
        const b = document.createElement("button");
        b.textContent = txt;
        b.classList.toggle("on", ostryNarożnik === wart);
        b.addEventListener("click", () => {
          ostryNarożnik = wart;
          odswiezKontekst();
          pokazPodpowiedz(wart
            ? "Kolejne punkty będą kątami prostymi · dotknij istniejącego punktu, żeby go przełączyć"
            : "Kolejne punkty będą zaokrąglone · dotknij istniejącego punktu, żeby go przełączyć");
        });
        k.appendChild(b);
      });

      const kreska2 = document.createElement("div");
      kreska2.className = "pion";
      k.appendChild(kreska2);

      if (kontynuacja) {
        const dalej = document.createElement("button");
        dalej.className = "glowny on";
        dalej.textContent = "Rysuję od figury";
        dalej.title = "Kolejne dotknięcia przedłużają trasę od końca figury · kliknij, żeby wyłączyć";
        dalej.addEventListener("click", () => {
          kontynuacja = null; odswiezKontekst();
          pokazPodpowiedz("Kolejne punkty wracają na koniec trasy");
        });
        k.appendChild(dalej);
      }

      const saNarysowane = stan.tor.some((t) => !t.figId);

      const cofnijPkt = document.createElement("button");
      cofnijPkt.textContent = "Cofnij punkt";
      cofnijPkt.title = "Zdejmuje ostatni postawiony punkt · figur nie rusza";
      cofnijPkt.disabled = !saNarysowane;
      cofnijPkt.addEventListener("click", cofnijPunktToru);
      k.appendChild(cofnijPkt);

      const usunLinie = document.createElement("button");
      usunLinie.className = "usun";
      usunLinie.textContent = "Usuń linię";
      usunLinie.title = "Kasuje ostatnią narysowaną linię · figury zostają";
      usunLinie.disabled = !saNarysowane;
      usunLinie.addEventListener("click", usunOstatniaLinie);
      k.appendChild(usunLinie);

      const usunTor = document.createElement("button");
      usunTor.className = "usun";
      usunTor.textContent = "Usuń tor";
      usunTor.title = "Kasuje wszystko, co narysowane · wolta, półwolta i serpentyna zostają";
      usunTor.disabled = !saNarysowane;
      usunTor.addEventListener("click", usunNarysowanyTor);
      k.appendChild(usunTor);
      return;
    }

    if (zaznaczoneZlaczenie && zaznaczoneZlaczenie.zlaczenie
        && stan.tor.indexOf(zaznaczoneZlaczenie) >= 0) {
      k.className = "kontekst widoczny";
      k.textContent = "";

      const opis = document.createElement("span");
      opis.className = "co";
      opis.textContent = "Złączone końcówki";
      k.appendChild(opis);

      const g = odcinkiToru(stan.tor).find((x) => x.indexOf(zaznaczoneZlaczenie) >= 0);
      if (g) {
        const dl = document.createElement("span");
        dl.className = "co";
        dl.style.color = "var(--ink)";
        dl.textContent = `jedna trasa · ${Math.round(dlugoscOdcinka(g))} m`;
        k.appendChild(dl);
      }

      const roz = document.createElement("button");
      roz.className = "usun";
      roz.textContent = "Rozłącz";
      roz.title = "Rozdziela to z powrotem na dwie osobne linie";
      roz.addEventListener("click", () => rozlacz(zaznaczoneZlaczenie));
      k.appendChild(roz);
      return;
    }

    if (zaznaczonaFigura && indeksyFigury(zaznaczonaFigura).length) {
      const pierwszy = stan.tor[indeksyFigury(zaznaczonaFigura)[0]];
      const typ = pierwszy.figTyp;
      k.className = "kontekst widoczny";
      k.textContent = "";

      const opis = document.createElement("span");
      opis.className = "co";
      const przyScianie = pierwszy.figSciana
        && Math.abs(pierwszy.figD - maksFigury(pierwszy)) < 0.3;
      opis.textContent = pierwszy.figOsemka
        ? "Koło ósemki"
        : (typ ? FIGURY[typ].nazwa : "Figura") + (przyScianie ? " od ściany do ściany" : "");
      k.appendChild(opis);

      const zeSciany = !!pierwszy.figSciana;
      const gornyLimit = typ ? maksFigury(pierwszy) : 40;
      if (typ) {
        const zastosuj = () => {
          const d = +poleD.value;
          const l = poleL ? Math.max(2, Math.min(8, +poleL.value || 3)) : (pierwszy.figLuki || 3);
          if (!(d >= MIN_FIG)) { poleD.value = pierwszy.figD; return pokazPodpowiedz(`Średnica od ${fmtL(MIN_FIG)} m w górę`); }
          if (d > gornyLimit + 0.01) {
            poleD.value = fmtL(gornyLimit);
            return pokazPodpowiedz(zeSciany
              ? `Więcej się nie da — ${fmtL(gornyLimit)} m to szerokość placu, czyli od ściany do ściany`
              : `Więcej się nie da — ${fmtL(gornyLimit)} m to wszystko, co mieści się w tym miejscu placu`);
          }
          if (d === pierwszy.figD && l === pierwszy.figLuki) return;
          przebudujFigure(zaznaczonaFigura, d, l);
        };

        const etD = document.createElement("span");
        etD.className = "co";
        etD.textContent = zeSciany ? "szer. m" : "śr. m";
        k.appendChild(etD);

        var poleD = document.createElement("input");
        poleD.type = "number"; poleD.min = String(MIN_FIG); poleD.max = String(gornyLimit); poleD.step = "0.5";
        // przecinek dziesiętny w input[type=number] to pusta wartość, stąd liczba wprost
        poleD.value = pierwszy.figD;
        poleD.style.width = "4.5rem";
        poleD.addEventListener("change", zastosuj);
        poleD.addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); zastosuj(); } });
        k.appendChild(poleD);

        var poleL = null;
        if (typ === "serpentyna" && !zeSciany) {
          const etL = document.createElement("span");
          etL.className = "co";
          etL.textContent = "łuki";
          k.appendChild(etL);
          poleL = document.createElement("input");
          poleL.type = "number"; poleL.min = "2"; poleL.max = "8"; poleL.step = "1";
          poleL.value = pierwszy.figLuki || 3;
          poleL.style.width = "3.6rem";
          poleL.addEventListener("change", zastosuj);
          poleL.addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); zastosuj(); } });
          k.appendChild(poleL);
        }

        [["−", -1], ["+", 1]].forEach(([txt, kier]) => {
          const b = document.createElement("button");
          b.textContent = txt;
          b.title = kier > 0 ? "Większa o metr" : "Mniejsza o metr";
          b.addEventListener("click", () => {
            const d = Math.max(MIN_FIG, Math.min(gornyLimit, (pierwszy.figD || 10) + kier));
            if (d === pierwszy.figD) {
              return pokazPodpowiedz(kier > 0
                ? (zeSciany
                    ? `Więcej się nie da — ${fmtL(gornyLimit)} m to szerokość placu`
                    : `Więcej się nie da — ${fmtL(gornyLimit)} m to wszystko, co mieści się w tym miejscu placu`)
                : `Mniej się nie da — ${fmtL(MIN_FIG)} m to minimum`);
            }
            przebudujFigure(zaznaczonaFigura, d, pierwszy.figLuki || 3);
          });
          k.appendChild(b);
        });
      }

      if (drugieKoloOsemki(zaznaczonaFigura) != null) {
        const b = document.createElement("button");
        b.textContent = "Rozdziel ósemkę";
        b.title = "Od tej pory oba koła jeżdżą osobno";
        b.addEventListener("click", () => rozdzielOsemke(zaznaczonaFigura));
        k.appendChild(b);
      }

      if (typ && zeSciany) {
        const et = document.createElement("span");
        et.className = "co";
        et.textContent = "łuki";
        k.appendChild(et);
        const pole = document.createElement("input");
        pole.type = "number"; pole.min = "2"; pole.max = "8"; pole.step = "1";
        pole.value = pierwszy.figLuki || 3;
        pole.style.width = "3.6rem";
        const zmien = () => {
          const l = Math.max(2, Math.min(8, +pole.value || 3));
          if (l !== pierwszy.figLuki) przebudujFigure(zaznaczonaFigura, pierwszy.figD, l);
        };
        pole.addEventListener("change", zmien);
        pole.addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); zmien(); } });
        k.appendChild(pole);
      }

      if (typ) {
        const przerzuc = document.createElement("button");
        przerzuc.textContent = "Przerzuć";
        przerzuc.title = "Odbija figurę na drugą stronę punktu, w którym siedzi";
        przerzuc.addEventListener("click", () => przerzucFigure(zaznaczonaFigura));
        k.appendChild(przerzuc);

        const obroc90 = document.createElement("button");
        obroc90.textContent = "Obróć o 90°";
        obroc90.title = "Ustawia figurę w poprzek zamiast wzdłuż";
        obroc90.addEventListener("click", () => obrocFigure(zaznaczonaFigura));
        k.appendChild(obroc90);
      }

      const usun = document.createElement("button");
      usun.className = "usun";
      usun.textContent = "Usuń";
      usun.addEventListener("click", () => usunFigure(zaznaczonaFigura));
      k.appendChild(usun);
      return;
    }

    if (zaznaczonyOdcinek && grupaOdcinka(zaznaczonyOdcinek)) {
      const g = grupaOdcinka(zaznaczonyOdcinek);
      k.className = "kontekst widoczny";
      k.textContent = "";

      const opis = document.createElement("span");
      opis.className = "co";
      opis.textContent = "Linia toru";
      k.appendChild(opis);

      const dl = document.createElement("span");
      dl.className = "co";
      dl.style.color = "var(--ink)";
      dl.textContent = `${Math.round(dlugoscOdcinka(g))} m · ${g.length} ${g.length < 5 ? "punkty" : "punktów"}`;
      k.appendChild(dl);

      const usun = document.createElement("button");
      usun.className = "usun";
      usun.textContent = "Usuń";
      usun.title = "Kasuje tę jedną linię, reszta toru zostaje";
      usun.addEventListener("click", () => usunOdcinek(zaznaczonyOdcinek));
      k.appendChild(usun);
      return;
    }

    // wolny punkt na trasie: tylko wygięcie i kasowanie — nie ma czego obracać
    const qZ = zaznaczonyPunkt !== null ? punktTrasy(zaznaczonyPunkt) : null;
    if (qZ) {
      k.className = "kontekst widoczny";
      k.textContent = "";
      const co = document.createElement("span");
      co.className = "co"; co.textContent = "punkt trasy " + qZ.nr;
      k.appendChild(co);

      const para = document.createElement("label");
      para.className = "para";
      const et = document.createElement("span");
      et.className = "co"; et.textContent = "wygięcie";
      para.appendChild(et);
      const pole = document.createElement("input");
      pole.type = "number"; pole.min = "0.2"; pole.max = "3"; pole.step = "0.1";
      pole.value = qZ.moc || 1;
      pole.title = "Im większe, tym pełniejszy łuk w tym miejscu · 1 to zwykła krzywa";
      pole.style.cssText = "width:4.4rem; text-align:center; font-family:var(--f-num); background:var(--chrome-2); color:var(--ink); border:1px solid var(--line); border-radius:8px; min-height:38px";
      pole.addEventListener("change", () => {
        zapiszHistorie();
        qZ.moc = Math.max(0.2, Math.min(3, +pole.value || 1));
        rysuj(); zapiszLokalnie();
      });
      para.appendChild(pole);
      k.appendChild(para);

      const kreskaP = document.createElement("div");
      kreskaP.className = "pion"; k.appendChild(kreskaP);

      const usunP = document.createElement("button");
      usunP.className = "usun"; usunP.textContent = "Usuń";
      usunP.title = "Zdejmuje ten punkt — reszta trasy zostaje";
      usunP.addEventListener("click", () => {
        zapiszHistorie();
        usunPunktTrasy(qZ);
        zaznaczonyPunkt = null;
        rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
        odswiezLiczniki(); odswiezOstrzezenia();
        pokazPodpowiedz("Punkt na trasie zdjęty — linia wróciła do prostej drogi");
      });
      k.appendChild(usunP);
      return;
    }

    const e = znajdz(zaznaczony);
    if (!e) { k.className = "kontekst"; k.textContent = ""; return; }

    k.className = "kontekst widoczny";
    k.textContent = "";
    const opis = document.createElement("span");
    opis.className = "co";
    opis.textContent = TYPY[e.typ].nazwa + (e.typ === "litera" ? " " + (e.litera || "") : "");

    // Przecięcie da się cofnąć nie tylko strzałką: przeszkoda, od której zaczyna
    // się kolejne ćwiczenie, dostaje guzik sklejający je z poprzednim.
    if (e.nowe) {
      const sklej = document.createElement("button");
      sklej.className = "glowny";
      sklej.textContent = "Połącz z poprzednim";
      sklej.title = "Zdejmuje przecięcie — oba ćwiczenia wracają do jednej trasy";
      sklej.addEventListener("click", () => {
        zapiszHistorie();
        delete e.nowe;
        rysuj(); zapiszLokalnie(); odswiezKontekst(); odswiezLiczniki(); odswiezOstrzezenia();
        pokazPodpowiedz("Ćwiczenia sklejone w jedną trasę");
      });
      k.appendChild(sklej);
      const kreskaS = document.createElement("div");
      kreskaS.className = "pion"; k.appendChild(kreskaS);
    }
    k.appendChild(opis);

    // „Oddziel od trasy" stoi zaraz przy nazwie: na telefonie pasek się przewija,
    // a tego guzika po prostu nie było widać na jego końcu.
    // Łuk albo kąt — Luiza chciała to zostawić przy przejściu na trasę z kolejności.
    // Domyślnie łuk, bo koń jedzie łukiem; kąt jest dla ostrego zawrotu. Dotyczy
    // wszystkiego, co ma numer, nie tylko drągów: na pachołku zawraca się najczęściej.
    {
      if (e.nr && wlasnaNumeracja()) {
        // Numer, który zobaczy jeździec. Puste = ten z kolejności na trasie.
        // To pole NIE przestawia przejazdu — kolejność układa się kropkami.
        const paraNr = document.createElement("label");
        paraNr.className = "para";
        const etNr = document.createElement("span");
        etNr.className = "co"; etNr.textContent = "nr";
        paraNr.appendChild(etNr);
        const poleNr = document.createElement("input");
        poleNr.type = "number"; poleNr.min = "0"; poleNr.max = "99";
        poleNr.value = e.numer || "";
        poleNr.placeholder = "—";
        poleNr.style.cssText = "width:4.2rem; text-align:center; font-family:var(--f-num); background:var(--chrome-2); color:var(--ink); border:1px solid var(--line); border-radius:8px; min-height:38px";
        poleNr.title = `Twój numer na rysunku. Puste = bez numeru.`
                     + ` Koń jedzie tu jako ${e.nr}. w kolejności — tego pole nie zmienia.`;
        poleNr.addEventListener("change", () => {
          const v = parseInt(poleNr.value, 10);
          if (v > 0) e.numer = v; else delete e.numer;
          rysuj(); zapiszLokalnie();
        });
        paraNr.appendChild(poleNr);
        k.appendChild(paraNr);

        const kreskaN = document.createElement("div");
        kreskaN.className = "pion"; k.appendChild(kreskaN);
      }
      if (e.nr) {
        const luk = document.createElement("button");
        luk.textContent = stan.ostreKaty ? "Kąty" : "Łuki";
        luk.className = "glowny";
        luk.title = "Dotyczy CAŁEJ trasy — pomieszane łuki i kąty na jednym schemacie"
                  + " tylko myliły";
        luk.addEventListener("click", przelaczKatyTrasy);
        k.appendChild(luk);

        const kreskaL = document.createElement("div");
        kreskaL.className = "pion"; k.appendChild(kreskaL);
      }
    }

    if (e.typ !== "start") {
      // O byciu w przejeździe mówi numer i tylko numer. Guzik nazywa czynność.
      const naTrasie = document.createElement("button");
      const ilu = ilePrzejsc(e);
      naTrasie.textContent = ilu > 1 ? "Zdejmij powrót" : (e.nr ? "Wyjmij z trasy" : "Dopnij na końcu trasy");
      naTrasie.title = ilu > 1
        ? "Koń mija to dwa razy — ten guzik kasuje tylko drugie przejście"
        : (e.nr
            ? "Zdejmuje numer — sprzęt zostaje na placu, ale koń go nie robi"
            : "Dokłada na samym końcu przejazdu · w środek wpina się, ciągnąc od kropki");
      naTrasie.addEventListener("click", () => {
        if (e.nr) {
          const mial = zdejmijNumer({ el: e, opis: TYPY[e.typ].nazwa });
          pokazPodpowiedz(`${TYPY[e.typ].nazwa}: numer ${mial} zdjęty — reszta przesunięta`);
        } else {
          zapiszHistorie();
          e.nr = nastepnyWolnyNumer();
          pokazPodpowiedz(`${TYPY[e.typ].nazwa} dopięta na końcu — to ${e.nr}`);
        }
        rysuj(); zapiszLokalnie(); odswiezKontekst(); odswiezLiczniki(); odswiezOstrzezenia();
      });
      k.appendChild(naTrasie);

      const kreskaT = document.createElement("div");
      kreskaT.className = "pion"; k.appendChild(kreskaT);
    }

    // Dwa guziki po 15° wypadły 14 września: obrót palcem za gałkę robi to samo
    // dokładniej, a pasek na telefonie i tak przewija się za daleko. „Obróć o 90°"
    // zostaje, bo jest precyzyjny i o niego chodzi najczęściej.
    const obroc90 = document.createElement("button");
    obroc90.textContent = "Obróć o 90°";
    obroc90.addEventListener("click", () => obroc(90));
    k.appendChild(obroc90);

    // Ramka na to, po co sięga się rzadko. Na telefonie pasek miał 1165 px przy
    // ekranie 390 px — zawijanie mieści wszystko, ale rozpychało go na pięć rzędów
    // i zjadało plac. Więc rzadkie chowamy pod jeden guzik.
    const rzadko = document.createElement("div");
    rzadko.className = "rzadko";
    const wiecej = document.createElement("button");
    wiecej.className = "wiecej";
    const opiszWiecej = () => {
      const on = k.classList.contains("rozwiniety");
      wiecej.innerHTML = `<span>${on ? "Mniej" : "Więcej"}</span>` + (on ? STRZALKA_GORA : STRZALKA_DOL);
    };
    wiecej.addEventListener("click", () => { k.classList.toggle("rozwiniety"); opiszWiecej(); });
    opiszWiecej();
    k.appendChild(wiecej);
    k.appendChild(rzadko);

    if (e.typ !== "start") {     // start jest jeden, nie ma czego powielać
      const kopia = document.createElement("button");
      kopia.textContent = "Powiel";
      kopia.addEventListener("click", powiel);
      rzadko.appendChild(kopia);
    }

    if (e.typ === "drag" || e.typ === "kawaletka" || e.typ === "stacjonata" || e.typ === "okser") {
      const kreska = document.createElement("div");
      kreska.className = "pion"; k.appendChild(kreska);

      const liczba = (podpis, wart, min, max, krok, ustaw) => {
        const para = document.createElement("label");
        para.className = "para";
        const et = document.createElement("span");
        et.className = "co"; et.textContent = podpis;
        para.appendChild(et);
        const i = document.createElement("input");
        i.type = "number"; i.value = wart; i.min = min; i.max = max; i.step = krok;
        i.style.cssText = "width:4.6rem; text-align:center; font-family:var(--f-num); background:var(--chrome-2); color:var(--ink); border:1px solid var(--line); border-radius:8px; min-height:38px";
        i.addEventListener("change", () => {
          ustaw(+i.value);
          wsunElement(e);   // wydłużony drąg nie ma prawa wystawać na bandę
          rysuj(); zapiszLokalnie();
        });
        para.appendChild(i);
        k.appendChild(para);
      };

      liczba("dł. m", e.dlugosc || TYPY[e.typ].dlugosc, 1, 6, 0.5, (v) => e.dlugosc = v);
      if (e.typ === "stacjonata" || e.typ === "okser") {
        liczba("wys. cm", e.wysokosc || 60, 20, 160, 5, (v) => e.wysokosc = v);
      }
      if (e.typ === "okser") {
        liczba("rozstaw m", e.rozstaw || 1.0, 0.4, 2.2, 0.1, (v) => e.rozstaw = v);
      }

      // Pole „nr" stało tu kiedyś i pisało wprost do e.nr, czyli przestawiało
      // KOLEJNOŚĆ przejazdu. Dziś własny numer wpisuje się osobnym polem, które
      // pokazuje się tylko przy numeracji własnej — a kolejność układa się kropkami.
      const rozstawBtn = document.createElement("button");
      rozstawBtn.textContent = "Rozstaw równo";
      rozstawBtn.addEventListener("click", () => oknoRozstaw(e));
      rzadko.appendChild(rozstawBtn);

      const zapiszMoja = document.createElement("button");
      zapiszMoja.textContent = "Zapisz jako moją";
      zapiszMoja.addEventListener("click", () => oknoZapiszPrzeszkode(e));
      rzadko.appendChild(zapiszMoja);
    }

    if (e.typ === "litera") {
      const wpis = document.createElement("input");
      wpis.type = "text"; wpis.value = e.litera || ""; wpis.maxLength = 2;
      wpis.style.cssText = "width:3.2rem; text-align:center; font-family:var(--f-num); background:var(--chrome-2); color:var(--ink); border:1px solid var(--line); border-radius:8px; min-height:38px";
      wpis.placeholder = "?";
      wpis.addEventListener("input", () => { e.litera = wpis.value.toUpperCase(); rysuj(); zapiszLokalnie(); });
      k.appendChild(wpis);
      if (!e.litera) setTimeout(() => { wpis.focus(); wpis.select(); }, 0);
    }

    // Przy Starcie ramka „rzadkich" była pusta, a guzik i tak stał w pasku:
    // rozwijał nic i wyglądał na zepsuty. Luiza, 16 września: „nie wiem, po co
    // mamy opcję więcej, po naciśnięciu nic się nie dodaje".
    if (!rzadko.childElementCount) { wiecej.remove(); rzadko.remove(); }

    const usunBtn = document.createElement("button");
    usunBtn.className = "usun"; usunBtn.textContent = "Usuń";
    usunBtn.addEventListener("click", usun);
    k.appendChild(usunBtn);
  }

  function ikona(typ) {
    const s = (inner) => `<svg viewBox="0 0 24 20" width="26" height="20">${inner}</svg>`;
    switch (typ) {
      case "drag":       return s('<rect x="2" y="8.5" width="20" height="3" rx="1.5" fill="#F2ECDF"/><rect x="2" y="8.5" width="4" height="3" rx="1.5" fill="#C0503F"/><rect x="18" y="8.5" width="4" height="3" rx="1.5" fill="#C0503F"/>');
      case "kawaletka":  return s('<rect x="4" y="8.5" width="16" height="3" rx="1.5" fill="#F2ECDF"/><path d="M3 5 L7 15 M7 5 L3 15 M17 5 L21 15 M21 5 L17 15" stroke="#A98A5E" stroke-width="1.6" stroke-linecap="round"/>');
      case "stacjonata": return s('<rect x="3" y="9" width="18" height="2.5" rx="1.2" fill="#F2ECDF"/><rect x="2" y="4" width="2.6" height="12" rx="1" fill="#8A745A"/><rect x="19.4" y="4" width="2.6" height="12" rx="1" fill="#8A745A"/>');
      case "okser":      return s('<rect x="3" y="6" width="18" height="2.2" rx="1.1" fill="#F2ECDF"/><rect x="3" y="12" width="18" height="2.2" rx="1.1" fill="#F2ECDF"/><rect x="2" y="3" width="2.4" height="14" rx="1" fill="#8A745A"/><rect x="19.6" y="3" width="2.4" height="14" rx="1" fill="#8A745A"/>');
      case "pacholek":   return s('<path d="M8 15 L12 4 L16 15 Z" fill="#E4762F"/><rect x="6.5" y="14.5" width="11" height="2.4" rx="1" fill="#B8571F"/>');
      case "opona":      return s('<circle cx="12" cy="10" r="6" fill="none" stroke="#6E6154" stroke-width="3"/>');
      case "litera":     return s('<rect x="6" y="3" width="12" height="14" rx="2" fill="#FAFAF7"/><text x="12" y="14" text-anchor="middle" font-size="11" font-weight="700" font-family="Bricolage Grotesque, sans-serif" fill="#2B211A">K</text>');
      case "zatrzymanie":return s('<path d="M5 3 L19 17 M19 3 L5 17" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/>');
      case "start":      return s('<circle cx="5" cy="10" r="2.6" fill="var(--accent)"/><path d="M8 10 H18" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/><path d="M15 6.5 L19 10 L15 13.5" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>');
      default:           return s('<rect x="6" y="4" width="12" height="12" rx="2.5" fill="none" stroke="#9BAAB6" stroke-width="1.8" stroke-dasharray="3 2"/>');
