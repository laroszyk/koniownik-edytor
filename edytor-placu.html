  function ikonaFigury(f) {
    const s = (inner) => `<svg viewBox="0 0 24 20" width="26" height="20" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round">${inner}</svg>`;
    switch (f) {
      case "wolta":      return s('<circle cx="12" cy="10" r="6"/>');
      case "polwolta":   return s('<path d="M4 4h6a5 5 0 0 1 0 10H9"/><path d="M9 14 3 17"/>');
      case "serpentyna": return s('<path d="M2 12c0-4 4-4 4 0s4 4 4 0 4-4 4 0 4 4 4 0"/>');
      case "osemka":     return s('<circle cx="7" cy="10" r="4.6"/><circle cx="16.6" cy="10" r="4.6"/>');
      default:           return s('<circle cx="12" cy="10" r="6"/>');
    }
  }

  // ====================== działania ======================

  function dodaj(typ, opcje) {
    // wybór narzędzia wychodzi z trybu toru i miarki, żeby dało się od razu przesuwać
    if (trybMiarka) {
      trybMiarka = false;
      miarkaA = null; miarkaB = null;
      $("btnMiarka").classList.remove("on");
      odswiezPomiar();
    }
    czekaNaPostawienie = null;
    // Start jest jeden. Drugi nie ma sensu — zamiast go dokładać, zaznaczamy ten,
    // który już stoi, żeby dało się go od razu przesunąć.
    if (typ === "start" && punktStartu()) {
      zaznaczony = punktStartu().id;
      rysuj(); odswiezKontekst(); odswiezPomiar();
      return pokazPodpowiedz("Start już stoi na placu — przeciągnij go tam, gdzie ma być");
    }
    // Start stawia się dotknięciem placu, a nie na środku — patrz czekaNaPostawienie.
    if (typ === "start" && !(opcje && opcje.gdzie)) {
      czekaNaPostawienie = "start";
      zaznaczony = null;
      rysuj(); odswiezKontekst();
      return pokazPodpowiedz("Dotknij placu tam, gdzie koń zaczyna przejazd");
    }
    zapiszHistorie();
    const gdzie = (opcje && opcje.gdzie) || null;
    const e = Object.assign({
      id: stan.nast++, typ: typ,
      x: gdzie ? okr(gdzie.x) : Math.round(stan.dl / 2),
      y: gdzie ? okr(gdzie.y) : Math.round(stan.sz / 2),
      kat: (typ === "drag" || typ === "kawaletka" || typ === "stacjonata" || typ === "okser") ? 90 : 0
    }, opcje || {});
    delete e.gdzie;
    if (typ === "litera" && !e.litera) e.litera = "";
    // dopóki nie postawisz go na miejsce, nie jest częścią trasy — inaczej przeszkoda
    // postawiona na środku od razu łapałaby tor i ciągnęła go za sobą w wybrzuszenie.
    // Postawiony palcem stoi już tam, gdzie ma stać.
    if (!gdzie) e.swiezy = true;
    stan.elementy.push(e);
    zaznaczony = e.id;
    rysuj(); zapiszLokalnie(); odswiezKontekst(); odswiezLiczniki(); odswiezOstrzezenia();
    pokazPodpowiedz(typ === "start"
      ? "Start postawiony — gałką obróć go w stronę jazdy, a potem pociągnij od jego kropki do pierwszej przeszkody"
      : `${TYPY[typ].nazwa} postawiony na środku — przeciągnij go tam, gdzie ma być`);
  }

  function obroc(o) {
    const e = znajdz(zaznaczony);
    if (!e) return pokazPodpowiedz("Najpierw dotknij elementu, który chcesz obrócić");
    zapiszHistorie();
    e.kat = (e.kat + o + 360) % 360;
    // wpięta w figurę: obrót ręką ma zostać, więc przesuwamy kąt WZGLĘDEM trasy —
    // inaczej pierwszy ruch figury cofnąłby to, co przed chwilą zrobiła ręka
    if (e.naFig) e.naFig.dkat = Math.round((((e.naFig.dkat || 0) + o) % 360) * 10) / 10;
    wsunElement(e);   // obrócony drąg bywa dłuższy w tę stronę, w którą stoi banda
    // punkt toru stojący na drągu obraca się razem z nim, żeby nie zjechał z niego przy obrocie
    const rad = o * Math.PI / 180, cs = Math.cos(rad), sn = Math.sin(rad);
    stan.tor.forEach((t) => {
      if (t.el !== e.id) return;
      const dx = t.x - e.x, dy = t.y - e.y;
      t.x = okr(Math.min(stan.dl, Math.max(0, e.x + dx * cs - dy * sn)));
      t.y = okr(Math.min(stan.sz, Math.max(0, e.y + dx * sn + dy * cs)));
    });
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst(); odswiezLiczniki(); odswiezOstrzezenia();
  }

  function powiel() {
    const e = znajdz(zaznaczony);
    if (!e) return pokazPodpowiedz("Najpierw dotknij elementu, który chcesz powielić");
    zapiszHistorie();
    const n = Object.assign({}, e, { id: stan.nast++, x: Math.min(stan.dl, e.x + 1.5), y: e.y, swiezy: true });
    delete n.el;
    stan.elementy.push(n);
    zaznaczony = n.id;
    rysuj(); zapiszLokalnie(); odswiezKontekst(); odswiezLiczniki(); odswiezOstrzezenia();
  }

  function usun() {
    if (zaznaczony === null) return pokazPodpowiedz("Najpierw dotknij elementu, który chcesz usunąć");
    zapiszHistorie();
    stan.elementy = stan.elementy.filter((e) => e.id !== zaznaczony);
    odwiazOd(zaznaczony);
    if (miarkaA === zaznaczony) miarkaA = null;
    if (miarkaB === zaznaczony) miarkaB = null;
    zaznaczony = null;
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst(); odswiezLiczniki(); odswiezOstrzezenia();
  }

  function przelaczLitery() {
    stan.litery = !stan.litery;
    // sprzątamy po starszej wersji, gdzie litery były zwykłymi elementami
    if (stan.litery) {
      const standardowe = new Set(["A","C","K","F","E","B","H","M","V","P","S","R"]);
      stan.elementy = stan.elementy.filter((e) => !(e.typ === "litera" && standardowe.has(e.litera)));
    }
    rysuj(); zapiszLokalnie(); odswiezPodpisLiter();
    pokazPodpowiedz(stan.litery
      ? (LITERY[stan.dl]
          ? `Litery włączone — układ dla placu 20 × ${stan.dl} m`
          : "Litery mam tylko dla placu 20 × 40 i 20 × 60 m")
      : "Litery wyłączone");
  }

  function odswiezPodpisLiter() {
    const b = $("btnLitery");
    b.classList.toggle("wlaczony", !!stan.litery);
    b.textContent = stan.litery ? "Litery ujeżdżeniowe ✓" : "Litery ujeżdżeniowe";
  }

  function dodajCicho(typ, opcje) {
    stan.elementy.push(Object.assign({ id: stan.nast++, typ: typ, kat: 0 }, opcje));
  }

  function cofnij() {
    if (!historia.length) return pokazPodpowiedz("Nie ma czego cofać");
    stan = historia.pop();
    zaznaczony = null; miarkaA = null; miarkaB = null;
    zaznaczonaFigura = null; kontynuacja = null; zaznaczonyOdcinek = null;
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst(); odswiezLiczniki(); odswiezOstrzezenia();
  }

  function wyczysc() {
    zapiszHistorie();
    // Wszystko, co stoi na placu. Wolne punkty trasy (`stan.punkty`) też — bez
    // nich zostawała po wyczyszczeniu sama linia ze strzałką i krzyżykiem, czyli
    // „start i jakieś kreski" (Luiza, 22 września). Punkt trasy nie jest
    // sprzętem, więc nikt o nim nie pamiętał.
    stan.elementy = []; stan.tor = []; stan.punkty = [];
    stan.nast = 1;
    zaznaczony = null; miarkaA = null; miarkaB = null;
    zaznaczonaFigura = null; kontynuacja = null; zaznaczonyOdcinek = null;
    zaznaczonyPunkt = null; ciagnietyPunktTrasy = null; ciagnietaLinia = null;
    czekaNaPostawienie = null;
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst(); odswiezLiczniki(); odswiezOstrzezenia();
    pokazPodpowiedz("Plac wyczyszczony — cofnij, jeśli to była pomyłka");
  }

  // ====================== obraz ======================

  let bezLiczb = false;    // wersja dla jeźdźca: numery zostają, odległości znikają
  let trybDruku = false;   // wersja na kartkę A4 do powieszenia w stajni

  // Czarno-biała paleta na drukarkę — mniej tuszu, wyższy kontrast na kartce.
  const PALETA_DRUKU = {
    "--piasek": "#FFFFFF", "--piasek-2": "#FFFFFF", "--banda": "#111111",
    "--accent": "#111111", "--ink-faint": "#777777", "--ink": "#111111",
    "--ink-soft": "#444444", "--chrome-2": "#FFFFFF", "--chrome-3": "#FFFFFF",
    "--drag-jasny": "#FFFFFF", "--drag-ciemny": "#111111",
    "--pacholek": "#FFFFFF", "--pacholek-2": "#FFFFFF", "--pacholek-3": "#FFFFFF",
    "--guma": "#111111", "--drewno": "#111111", "--krzyz": "#111111",
    "--kontur": "#111111", "--litera": "#FFFFFF", "--tor": "#111111",
    "--ostrzez": "#111111", "--blad": "#111111", "--ok": "#111111", "--line": "#999999"
  };

  // Zapisanie obrazka ma dwie drogi, bo strona chodzi w dwóch miejscach.
  // 1. Otwarta wprost z pliku: zwykły <a download> i po sprawie.
  // 2. Na stronie podglądowej (artefakt) strona siedzi w ramce, w której
  //    przeglądarka blokuje pobieranie zaczęte przez samą stronę — tam plik
  //    podaje platforma, po potwierdzeniu przez oglądającego.
  // Guzik pokazujemy tylko wtedy, gdy któraś z tych dróg naprawdę działa;
  // martwy guzik jest gorszy od jego braku.
  let zapisPlatformy = null;     // namespace „downloads", gdy jest dostępny
  let ostatniObrazBlob = null;   // gotowy PNG do podania platformie

  function pobieranieMozliwe() {
    try { return window.self === window.top; } catch (e) { return false; }
  }

  if (typeof window.claude === "object" && window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then((d) => {
      zapisPlatformy = d || null;
      // okno mogło się już otworzyć, zanim platforma odpowiedziała
      if (zapisPlatformy && $("oknoObraz") && $("oknoObraz").src) przygotujPobieranie($("oknoObraz").src);
    }).catch(() => {});
  }

  function nazwaObrazu() {
    const d = new Date();
    const dwa = (n) => String(n).padStart(2, "0");
    const kiedy = `${d.getFullYear()}-${dwa(d.getMonth() + 1)}-${dwa(d.getDate())}`;
    const jaki = trybDruku ? "kartka" : (bezLiczb ? "dla-jezdzca" : "z-odleglosciami");
    return `koniownik-${stan.dl}x${stan.sz}-${jaki}-${kiedy}.png`;
  }

  function przygotujPobieranie(dane) {
    const a = $("oknoPobierz"), opis = $("oknoOpis");
    if (!pobieranieMozliwe() && !zapisPlatformy) {
      a.hidden = true;
      opis.textContent = "Przytrzymaj obrazek palcem (albo kliknij prawym) i wybierz „Zapisz obraz”.";
      return;
    }
    a.hidden = false;
    a.href = dane;
    a.download = nazwaObrazu();
    opis.textContent = "Pobierz obraz albo przytrzymaj go palcem i wybierz „Zapisz obraz”.";
  }

  $("oknoPobierz").addEventListener("click", (ev) => {
    if (!zapisPlatformy) return;               // zwykły <a download> da radę sam
    ev.preventDefault();
    const nazwa = $("oknoPobierz").download || nazwaObrazu();
    const dane = ostatniObrazBlob || $("oknoObraz").src;
    if (!dane) return;
    zapisPlatformy.save({ filename: nazwa, data: dane }).then(() => {
      pokazPodpowiedz(`Zapisane jako ${nazwa}`);
    }).catch((err) => {
      const kod = err && err.code;
      if (kod === "declined") return;          // powiedziała „nie" i tyle
      if (kod === "rate_limited") {
        return pokazPodpowiedz("Chwila — poprzednie pytanie o zapis jeszcze czeka");
      }
      $("oknoPobierz").hidden = true;
      $("oknoOpis").textContent = "Przytrzymaj obrazek palcem (albo kliknij prawym) i wybierz „Zapisz obraz”.";
      pokazPodpowiedz("Tu nie da się pobrać pliku — przytrzymaj obrazek palcem i zapisz go stamtąd");
    });
  });

  function oknoEksportu() {
    pokazOkno("Zapisz obraz", (t) => {
      const info = document.createElement("p");
      info.style.cssText = "color:var(--ink-soft); font-size:0.86rem; margin:0 0 0.4rem";
      info.textContent = "To samo ustawienie w trzech wersjach — sobie zostaw liczby, jeźdźcowi daj czysty rysunek, a na ścianę w stajni weź kartkę.";
      t.appendChild(info);

      [["Dla siebie — z odległościami i fulami", false, false],
       ["Dla jeźdźca — same numery, bez liczb", true, false],
       ["Na kartkę A4 — czarno-biała, do powieszenia", false, true]].forEach(([txt, tryb, druk]) => {
        const b = document.createElement("button");
        b.textContent = txt;
        b.style.cssText = "width:100%; margin-bottom:0.4rem; text-align:left";
        b.addEventListener("click", () => {
          bezLiczb = tryb; trybDruku = druk;
          $("zaslonaOkno").classList.remove("widoczna");
          zrobObraz();
        });
        t.appendChild(b);
      });

      const kreska = document.createElement("div");
      kreska.style.cssText = "height:1px; background:var(--line); margin:0.5rem 0";
      t.appendChild(kreska);

      const lista = document.createElement("div");
      lista.innerHTML = `<div class="drobne" style="margin-bottom:0.3rem">DO PRZYNIESIENIA NA PLAC</div>` +
        listaSprzetu().map((w) => `<div class="wiersz"><span class="etykieta">${w.nazwa}</span><span class="drobne">${w.ile}</span></div>`).join("");
      t.appendChild(lista);
    });
  }

  // Co fizycznie trzeba wynieść na plac, żeby postawić ten schemat.
  function listaSprzetu() {
    const licz = {};
    stan.elementy.forEach((e) => { licz[e.typ] = (licz[e.typ] || 0) + 1; });
    const out = [];
    const dragi = zuzyteDragi();
    if (dragi) out.push({ nazwa: "Drągi (łącznie, też w przeszkodach)", ile: dragi });
    Object.keys(licz).forEach((typ) => {
      if (typ === "drag") return;
      out.push({ nazwa: TYPY[typ].nazwa, ile: licz[typ] });
    });
    const stojaki = (licz.stacjonata || 0) * 2 + (licz.okser || 0) * 2;
    if (stojaki) out.push({ nazwa: "Stojaki", ile: stojaki });
    if (!out.length) out.push({ nazwa: "Plac jest pusty", ile: "—" });
    return out;
  }

  function zrobObraz() {
    // podpisy trzymają stałą wielkość na ekranie, więc do obrazka rysujemy plac
    // od nowa przy powiększeniu 1:1 — inaczej byłyby za małe albo za duże
    const widokPrzed = { k: widok.k, dx: widok.dx, dy: widok.dy };
    const trzebaWrocic = widok.k !== 1 || widok.dx || widok.dy;
    if (trzebaWrocic) { widok.k = 1; widok.dx = 0; widok.dy = 0; rysuj(); }

    const kopia = svg.cloneNode(true);
    kopia.setAttribute("xmlns", NS);
    const w = kopia.querySelector("#widok");
    if (w) w.setAttribute("transform", "translate(0 0) scale(1)");
    if (bezLiczb) kopia.querySelectorAll(".podpis-odleglosci").forEach((n) => n.remove());
    // Kropki wpięcia są narzędziem do układania trasy, a nie częścią schematu —
    // na kartce dla jeźdźca nie mają czego szukać.
    kopia.querySelectorAll(".kropka, .guma, .uchwyt").forEach((n) => n.remove());

    // Klon dostaje własną szerokość i wysokość. Bez nich <img> rasteryzuje SVG
    // w zastępczym rozmiarze, a część przeglądarek w ogóle odmawia.
    const vb = (kopia.getAttribute("viewBox") || "").split(/\s+/).map(Number);
    if (vb.length === 4 && vb[2] > 0 && vb[3] > 0) {
      kopia.setAttribute("width", Math.round(vb[2] * 24));
      kopia.setAttribute("height", Math.round(vb[3] * 24));
      kopia.setAttribute("preserveAspectRatio", "xMidYMid meet");
    }

    // wstaw kolory na sztywno — zmienne CSS nie przechodzą do obrazka
    const style = getComputedStyle(document.documentElement);
    let tekst = new XMLSerializer().serializeToString(kopia);
    tekst = tekst.replace(/var\(--[a-z0-9-]+\)/g, (dopasowanie) => {
      const nazwa = dopasowanie.slice(4, -1);
      if (trybDruku && PALETA_DRUKU[nazwa]) return PALETA_DRUKU[nazwa];
      return style.getPropertyValue(nazwa).trim() || "#000000";
    });
    tekst = tekst.replace(/<circle class="zazn"[^>]*\/>/g, "");

    if (trzebaWrocic) {
      widok.k = widokPrzed.k; widok.dx = widokPrzed.dx; widok.dy = widokPrzed.dy;
      rysuj();
    }

    // Proporcje bierzemy z viewBoxa, a nie z wymiarów placu. Plac postawiony
    // w pionie jest rysowany obrócony (viewBox ma zamienione boki), a płótno
    // liczone z stan.dl × stan.sz było poziome — rysunek wchodził w nie na siłę
    // i wychodził rozciągnięty: koła robiły się elipsami. Luiza, 16 września:
    // „podgląd spłaszczony, spłaszczony podgląd też się pobiera".
    const wPionie = !!stan.pion;
    const L = (wPionie ? stan.sz : stan.dl) + 2 * MARGINES;   // szerokość viewBoxa
    const W = (wPionie ? stan.dl : stan.sz) + 2 * MARGINES;   // wysokość viewBoxa
    let cw, ch, ox, oy, rw, rh, tlo, atrament, drugiAtrament;
    let kegel = 40;   // wielkość podpisu — potrzebna też przy rysowaniu stopki

    if (trybDruku) {
      // proporcje A4 poziomo, 200 dpi — kartka do koszulki foliowej na płocie
      cw = 2339; ch = 1654;
      const rzedyOdl = Math.ceil(odleglosciTrasy.length / 2);
      const marg = 110, stopka = 250 + rzedyOdl * 46;
      const sk = Math.min((cw - 2 * marg) / L, (ch - 2 * marg - stopka) / W);
      rw = L * sk; rh = W * sk;
      ox = (cw - rw) / 2; oy = marg + (ch - 2 * marg - stopka - rh) / 2;
      tlo = "#FFFFFF"; atrament = "#111111"; drugiAtrament = "#444444";
    } else {
      // Pasek z podpisem tylko pod spodem ciągnął plac do góry. Równy margines
      // nad i pod nim stawia rysunek dokładnie na środku obrazka.
      const skala = Math.min(2400 / L, 1400 / W);
      rw = Math.round(L * skala); rh = Math.round(W * skala);
      // Podpis leży poziomo, więc jego wielkość bierze się z SZEROKOŚCI obrazka.
      // Liczony z wysokości rósł na wąskim, wysokim placu w pionie tak, że nie
      // mieścił się w kadrze.
      kegel = Math.max(16, Math.min(44, Math.round(rw * 0.026)));
      const pasek = Math.round(kegel * 1.7);
      cw = rw; ch = rh + 2 * pasek;
      ox = 0; oy = pasek;
      tlo = "#F6F1E8"; atrament = "#2B211A"; drugiAtrament = "#6C7B87";
    }

    const plotno = document.createElement("canvas");
    plotno.width = cw; plotno.height = ch;
    const ctx = plotno.getContext("2d");
    ctx.fillStyle = tlo;
    ctx.fillRect(0, 0, cw, ch);

    const img = new Image();
    // Luiza, 16 września: „robię zapisz i wyskakuje komunikat, że nie da się
    // zapisać, nie ma nawet podglądu". U mnie to samo działało — więc problem nie
    // jest w rysunku, tylko w tym, JAK go podajemy przeglądarce. W okienku
    // artefaktu strona chodzi w piaskownicy, a tam adres blob: bywa zablokowany
    // przez politykę bezpieczeństwa i <img> odpala onerror. Dlatego najpierw
    // podajemy rysunek wprost jako data:, a blob: zostaje jako zapasowe wyjście.
    const zrodla = [];
    try {
      zrodla.push({ nazwa: "data", url: "data:image/svg+xml;charset=utf-8," + encodeURIComponent(tekst) });
    } catch (err) {}
    let doOdwolania = null;
    try {
      const blob = new Blob([tekst], { type: "image/svg+xml;charset=utf-8" });
      doOdwolania = URL.createObjectURL(blob);
      zrodla.push({ nazwa: "blob", url: doOdwolania });
    } catch (err) {}
    const sprzataj = () => {
      if (doOdwolania) { try { URL.revokeObjectURL(doOdwolania); } catch (err) {} doOdwolania = null; }
    };
    if (!zrodla.length) {
      trybDruku = false;
      return pokazPodpowiedz("Nie udało się przygotować rysunku do zapisu");
    }
    let ktoreZrodlo = 0;

    img.onload = function () {
      sprzataj();
      try { dokonczObraz(); }
      catch (err) {
        trybDruku = false;
        // Rysunek się złożył, ale nie dał się zamienić na plik — w piaskownicy
        // potrafi to być SecurityError na płótnie. Mówimy wprost, co poszło nie tak.
        pokazPodpowiedz("Rysunek się złożył, ale nie dał się zapisać: "
          + ((err && err.message) ? err.message : String(err)));
      }
    };

    function dokonczObraz() {
      ctx.drawImage(img, ox, oy, rw, rh);

      const podpis = `plac ${stan.sz} × ${stan.dl} m · ${opisGrup()} · fula ` +
                     grupy().map((k) => fmt(KONIE[k].fula)).join(" / ") + " m";
      ctx.textBaseline = "middle";

      if (trybDruku) {
        // tabelka odległości pod planem — tak wygląda prawdziwy plan parkuru
        const rzedy = Math.ceil(odleglosciTrasy.length / 2);
        const yTab = ch - 185 - rzedy * 46;
        if (rzedy) {
          ctx.strokeStyle = "#CCCCCC"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(110, yTab - 42); ctx.lineTo(cw - 110, yTab - 42); ctx.stroke();
          ctx.font = '30px "IBM Plex Mono", monospace';
          odleglosciTrasy.forEach((w, i) => {
            const kol = i < rzedy ? 0 : 1;
            const x = 110 + kol * (cw - 220) / 2;
            const yy = yTab + (i % rzedy) * 46;
            ctx.fillStyle = "#111111";
            ctx.fillText(w.skad || "—", x, yy);
            ctx.fillText(w.co, x + 100, yy);
            ctx.fillStyle = "#555555";
            ctx.fillText(w.oceny.map((oc) => `${oc.nazwa || oc.grupa}: ${oc.krotko}`).join("   "),
                         x + 380, yy);
          });
        }

        const y = ch - 120;
        ctx.strokeStyle = "#CCCCCC"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(110, y - 44); ctx.lineTo(cw - 110, y - 44); ctx.stroke();
        ctx.fillStyle = atrament;
        ctx.font = '700 44px "Bricolage Grotesque", sans-serif';
        ctx.fillText("Koniownik", 110, y);
        // odstęp z realnej szerokości nazwy — wpisany na sztywno rozjeżdżał się
        // przy każdej zmianie nazwy aplikacji
        const szerMarki = ctx.measureText("Koniownik").width;
        ctx.font = '34px "IBM Plex Mono", monospace';
        ctx.fillStyle = drugiAtrament;
        ctx.fillText(podpis, 110 + szerMarki + 60, y);
        // co wynieść na plac — na kartce to najbardziej praktyczna linijka
        const sprzet = listaSprzetu().map((w) => `${w.nazwa.replace(/ \(.*\)/, "")}: ${w.ile}`).join("   ");
        ctx.font = '30px "IBM Plex Mono", monospace';
        ctx.fillText(sprzet, 110, y + 52);
        ctx.font = '26px "IBM Plex Mono", monospace';
        ctx.fillStyle = "#777777";
        ctx.fillText("Liczby to fule między przeszkodami · odległości orientacyjne, zależne od tempa konia.", 110, y + 96);
      } else {
        // Szerokość marki mierzyliśmy PO ustawieniu czcionki monospace, czyli nie
        // tą czcionką, którą jest napisana — na wąskim obrazku podpis wchodził na
        // markę. Mierzymy każdą jej własną, a gdy oba napisy nie mieszczą się
        // w kadrze, zwężamy je razem.
        const marg = Math.round(kegel * 0.7);
        const linia = ch - Math.round(kegel * 0.8);
        let k1 = kegel, k2 = Math.max(9, Math.round(kegel * 0.78));
        const zmierz = () => {
          ctx.font = `700 ${k1}px "Bricolage Grotesque", sans-serif`;
          const marka = ctx.measureText("Koniownik").width;
          ctx.font = `${k2}px "IBM Plex Mono", monospace`;
          return { marka: marka, razem: marka + k1 * 1.6 + ctx.measureText(podpis).width };
        };
        let m = zmierz();
        while (m.razem > cw - 2 * marg && k2 > 10) {
          k1 = Math.max(12, Math.round(k1 * 0.92));
          k2 = Math.max(9, Math.round(k2 * 0.92));
          m = zmierz();
        }
        ctx.fillStyle = atrament;
        ctx.font = `700 ${k1}px "Bricolage Grotesque", sans-serif`;
        ctx.fillText("Koniownik", marg, linia);
        ctx.fillStyle = drugiAtrament;
        ctx.font = `${k2}px "IBM Plex Mono", monospace`;
        ctx.fillText(podpis, marg + m.marka + k1 * 1.6, linia);
      }

      const dane = plotno.toDataURL("image/png");
      $("oknoObraz").src = dane;
      ostatniObrazBlob = null;
      if (plotno.toBlob) plotno.toBlob((b) => { ostatniObrazBlob = b; }, "image/png");
      przygotujPobieranie(dane);
      $("zaslona").classList.add("widoczna");
      trybDruku = false;
    }

    img.onerror = function () {
      ktoreZrodlo++;
      if (ktoreZrodlo < zrodla.length) { img.src = zrodla[ktoreZrodlo].url; return; }
      sprzataj();
      trybDruku = false;
      pokazPodpowiedz("Nie udało się złożyć obrazka — przeglądarka odmówiła ("
        + zrodla.map((z) => z.nazwa).join(" i ") + ")");
    };
    img.src = zrodla[0].url;
  }

  // ====================== drobiazgi ======================

  let timerPodpowiedzi = null;
  // Podpowiedź startowa pojawia się z opóźnieniem i kasowała to, co użytkownik
  // zdążył w tym czasie zrobić — teraz ustępuje pierwszej podpowiedzi z akcji.
  let bylaAkcja = false;
  function pokazPodpowiedz(txt, startowa, dlugo) {
    if (startowa && bylaAkcja) return;
    if (!startowa) bylaAkcja = true;
    const p = $("podpowiedz");
    p.textContent = txt;
    p.style.opacity = "1";
    clearTimeout(timerPodpowiedzi);
    timerPodpowiedzi = setTimeout(() => { p.style.opacity = "0"; }, dlugo ? 9000 : 3800);
  }

  // Nazwy figur stojących na placu, po jednej na rodzaj, w kolejności postawienia.
  function figuryNaPlacu() {
    const nazwy = [], byly = {};
    stan.tor.forEach((t) => {
      if (!t.figId || !t.figTyp || byly[t.figTyp] || !FIGURY[t.figTyp]) return;
      byly[t.figTyp] = true;
      nazwy.push(FIGURY[t.figTyp].nazwa.toLowerCase());
    });
    return nazwy;
  }

  // „wolta", „wolta i półwolta", „wolta, półwolta i serpentyna"
  function wyliczenie(lista) {
    if (lista.length < 2) return lista[0] || "";
    return lista.slice(0, -1).join(", ") + " i " + lista[lista.length - 1];
  }

  // Co powiedzieć po włączeniu trybu Tor. Z figurami na placu trzeba powiedzieć
  // wprost, że są dwie drogi — inaczej trasa sama doczepia się do wolty i wygląda
  // to jak decyzja edytora, a nie wybór instruktorki.
  // Co powiedzieć, gdy człowiek patrzy na plac i nie wie, co dalej.
  function podpowiedzNaStart() {
    const ile = stan.elementy.filter(moglbyByc).length + figuryNaPlacu().length;
    if (krokiTrasy().length > 1) {
      if (!punktStartu()) return "Przejazd ułożony — postaw jeszcze „Start\u201d, żeby było wiadomo, skąd koń rusza";
      return kropkiSchowane
        ? "Przejazd ułożony · dotknij placu, żeby wrócić do kropek"
        : "Przejazd ułożony · kolejność zmienisz kropkami, a dotknięcie poza placem je chowa";
    }
    if (!ile) return "Postaw sprzęt z paska na dole — potem pociągniesz trasę od kropki do kropki";
    if (!punktStartu()) return "Postaw „Start\u201d tam, skąd ruszasz, a potem pociągnij od jego kropki do pierwszej przeszkody";
    return "Pociągnij od kropki przy starcie do kropki przy pierwszej przeszkodzie";
  }

  function podpowiedzTrybuToru() {
    const fig = figuryNaPlacu();
    if (!fig.length) {
      return "Dotykaj placu tam, gdzie jedziesz · dotknięcie istniejącego punktu zmienia łuk w kąt prosty";
    }
    return `Na placu ${fig.length > 1 ? "są" : "jest"} ${wyliczenie(fig)}`
      + " · dotknij placu tam, gdzie ma się zacząć trasa, albo dotknij końca figury,"
      + " żeby jechać dalej od niej";
  }

  function ustawWyborWymiaru() {
    const sel = $("wymiar");
    const pasuje = `${stan.dl}x${stan.sz}`;
    let znalazl = false;
    [...sel.options].forEach((o, i) => { if (o.value === pasuje) { sel.selectedIndex = i; znalazl = true; } });
    if (!znalazl) sel.value = "wlasny";
    sel.dispatchEvent(new Event("zmiana-etykiety"));
  }

  function ustawWymiar() {
    const v = $("wymiar").value;
    const wlasny = v === "wlasny";
    $("dl").hidden = !wlasny; $("sz").hidden = !wlasny;
    if (!wlasny) {
      const [L, W] = v.split("x").map(Number);
      zapiszHistorie();
      stan.dl = L; stan.sz = W;
      $("dl").value = L; $("sz").value = W;
    } else {
      zapiszHistorie();
      stan.dl = +$("dl").value; stan.sz = +$("sz").value;
    }
    wsunElementy();   // po zmianie placu cały sprzęt ma nadal leżeć na piasku
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst(); odswiezLiczniki(); odswiezOstrzezenia();
  }

  // ====================== podpięcia ======================

  $("wymiar").addEventListener("change", ustawWymiar);
  $("dl").addEventListener("change", ustawWymiar);
  $("wymiar").addEventListener("change", () => { if (typeof wyborWymiar !== "undefined") wyborWymiar.odswiez(); });
  $("sz").addEventListener("change", ustawWymiar);
  $("kon").addEventListener("change", () => {
    const v = $("kon").value;
    if (v === "mieszana" || !KONIE[v]) return;   // etykietę zbiorczą ustawia ustawEtykieteGrup
    stan.grupy = [v]; stan.kon = v;
    zapiszLokalnie(); rysuj(); odswiezPomiar(); odswiezOstrzezenia();
  });

  function obrocPlac() {
    stan.pion = !stan.pion;
    rysuj(); zapiszLokalnie();
    pokazPodpowiedz(stan.pion ? "Plac ustawiony pionowo" : "Plac ustawiony poziomo");
  }
  // Jedno miejsce: guzik przy Cofnij. Kiedyś stał też w menu i to była dokładnie
  // ta pomyłka, którą Luiza wytknęła 16 września — ustawienie w dwóch miejscach
  // znaczy, że w jednym z nich prędzej czy później pokazuje co innego.
  $("btnObrocGora").addEventListener("click", obrocPlac);

  $("btnSnap").addEventListener("click", function () {
    przyciaganie = !przyciaganie;
    this.classList.toggle("wlaczony", przyciaganie);
    this.innerHTML = (przyciaganie ? "Równe ustawianie ✓" : "Równe ustawianie")
      + `<span class="pod">sprzęt sam trafia na równe odległości — łatwiej ustawić drągi w rzędzie.`
      + ` Wyłącz, żeby stawiać dokładnie tam, gdzie palec.</span>`;
    pokazPodpowiedz(przyciaganie
      ? "Sprzęt sam trafia na równe odległości — łatwiej ustawić drągi w rzędzie"
      : "Sprzęt idzie płynnie — staje dokładnie tam, gdzie palec");
  });

  $("btnPlus").addEventListener("click", () => zoomWokol(srodekPlacu(), 1.35));
  $("btnMinus").addEventListener("click", () => zoomWokol(srodekPlacu(), 1 / 1.35));
  $("btnResetWidoku").addEventListener("click", () => ustawWidok(1, 0, 0));
  $("trasaDlugosc").addEventListener("click", oknoOdleglosci);
  $("paskiOdleglosci").addEventListener("click", (ev) => {
    if (ev.target.closest("[data-filtr]")) {
      tylkoProblemy = !tylkoProblemy;
      odswiezPasekOdleglosci();
      return;
    }
    oknoOdleglosci();
  });

  // „2 fule × 3,66 = 7,32 m · zostaje 2,62 m na lądowanie i odbicie (przyjmuję 3,60)"
  function rachunekWiersza(w) {
    if (w.naziemne) return "";
    const wiele = w.oceny.length > 1;
    const linie = w.oceny.map((o) => {
      if (!o.n || !o.fula || !o.zapas) return "";
      const wzor = o.n * o.fula;
      const zostaje = w.d - wzor;
      const przed = wiele ? `${o.nazwa || o.grupa}: ` : "";
      return `${przed}${o.n} ${odmianaFuli(o.n)} × ${fmt(o.fula)} = ${fmt(wzor)} m · `
        + (zostaje >= 0
            ? `zostaje ${fmt(zostaje)} m, potrzeba ~${fmt(o.zapas)}`
            : `brakuje ${fmt(-zostaje)} m nawet bez lądowania`);
    }).filter(Boolean);
    return linie.join("<br>");
  }

  // Ile ten koń potrzebuje na lądowanie i odbicie. Domyślnie nasze liczby;
  // kto zna swojego konia, wpisuje własne i cała aplikacja liczy z nich.
  function oknoZapasu(zOkna) {
    pokazOkno("Lądowanie i odbicie", (t) => {
      const info = document.createElement("p");
      info.style.cssText = "color:var(--ink-soft); font-size:0.84rem; margin:0 0 0.7rem; line-height:1.55";
      info.textContent = "Ile metrów zjada lądowanie po pierwszej przeszkodzie razem z odbiciem "
        + "przed drugą. To zależy od konia — od temperamentu i od tego, jaki ma wykrok. "
        + "Nasze liczby są orientacyjne; jeśli znasz swojego konia, wpisz swoją.";
      t.appendChild(info);

      const pola = {};
      grupy().forEach((k) => {
        const w = document.createElement("div");
        w.className = "wiersz";
        w.innerHTML = `<span class="etykieta">${KONIE[k].nazwa}<span style="opacity:0.6"> · standardowo ${fmt(KONIE[k].zapas)} m</span></span>`;
        const pole = document.createElement("input");
        pole.type = "number"; pole.min = "1"; pole.max = "8"; pole.step = "0.1";
        pole.value = fmt(zapasKonia(k)).replace(",", ".");
        pole.style.width = "5rem";
        w.appendChild(pole);
        t.appendChild(w);
        pola[k] = pole;
      });

      const blad = document.createElement("p");
      blad.style.cssText = "margin:0.35rem 0 0; color:var(--blad); font-size:0.82rem; min-height:1.1rem";
      t.appendChild(blad);

      const zapisz = document.createElement("button");
      zapisz.className = "wstaw";
      zapisz.textContent = "Zapisz";
      zapisz.addEventListener("click", () => {
        const nowe = {};
        for (const k of Object.keys(pola)) {
          const v = +pola[k].value;
          if (!(v >= 1 && v <= 8)) {
            blad.textContent = `${KONIE[k].nazwa}: wpisz od 1 do 8 metrów`;
            pola[k].focus(); pola[k].select();
            return;
          }
          nowe[k] = Math.round(v * 100) / 100;
        }
        zapiszHistorie();
        stan.zapasy = Object.assign({}, stan.zapasy || {}, nowe);
        $("zaslonaOkno").classList.remove("widoczna");
        rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
        odswiezLiczniki(); odswiezOstrzezenia();
        pokazPodpowiedz("Zapisane — odległości liczą się teraz z twoich wartości");
        if (zOkna) oknoOdleglosci();
      });
      t.appendChild(zapisz);

      const wroc = document.createElement("button");
      wroc.className = "mini";
      wroc.style.cssText = "margin-top:0.5rem";
      wroc.textContent = "Przywróć standardowe";
      wroc.addEventListener("click", () => {
        zapiszHistorie();
        delete stan.zapasy;
        $("zaslonaOkno").classList.remove("widoczna");
        rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
        odswiezLiczniki(); odswiezOstrzezenia();
        pokazPodpowiedz("Wróciły wartości standardowe");
        if (zOkna) oknoOdleglosci();
      });
      t.appendChild(wroc);
    });
  }

  function oknoOdleglosci() {
    if (!odleglosciTrasy.length) return pokazPodpowiedz("Narysuj tor przez przeszkody, a policzę odległości");
    pokazOkno("Odległości", (t) => {
      // Nie udajemy, że znamy tempo konia — mówimy wprost, z jakiej fuli liczymy
      // i co znaczy każdy znak. To jest podstawa wyliczenia, nie wyrocznia.
      // Jedna linijka podstawy — reszta wyjaśnień siedzi zwinięta pod listą.
      // Luiza, 17 września: „mam slalom zrobiony z opon, a i tak wyświetla mi się,
      // czy ilość fuli się zmieści. Ilość fuli ma być TYLKO przy przeszkodach."
      // Pachołka i opony się nie skacze — nie ma tam ani lądowania, ani odbicia,
      // więc całe wyjaśnienie o fulach jest nie na temat i tylko myli.
      const saFule = odleglosciTrasy.some((w) => w.oceny && w.oceny.length);

      const panel = document.createElement("div");
      panel.className = "odl-panel";

      // Tekst wprost od Luizy, 17 września — jej słowa, jej kolejność.
      const info = document.createElement("p");
      info.className = "odl-wstep";
      info.textContent = saFule
        ? "Fule pokazujemy tylko między przeszkodami do skakania. Przy pachołkach i oponach zostaje sama odległość."
        : "Na tej trasie nie ma nic do skakania — pachołki i opony się mija, więc zostaje sama odległość, bez fuli.";
      panel.appendChild(info);

      const tempo = document.createElement("p");
      tempo.className = "odl-tempo";
      tempo.hidden = !saFule;
      tempo.textContent = "Ilość fuli jest orientacyjna — zależy od tempa, poziomu konia i celu ćwiczenia. ";
      const zmien = document.createElement("button");
      zmien.className = "zmien";
      zmien.textContent = "Ustaw swoje";
      zmien.title = "Ile TWÓJ koń potrzebuje na lądowanie i odbicie";
      zmien.addEventListener("click", () => oknoZapasu(true));
      tempo.appendChild(zmien);
      panel.appendChild(tempo);

      // Jak czyta się wiersz — na przykładzie, a nie w opisie.
      const przyklad = document.createElement("div");
      przyklad.className = "odl-przyklad";
      przyklad.hidden = !saFule;
      przyklad.innerHTML =
        `<div class="wiersz-przyk"><span class="para">1 → 2</span><span class="ile-m">18,00 m</span></div>` +
        grupy().map((g) => {
          const oc = ocen(18, g, false);

  // „brakuje 2 drągów", nie „brakuje 2 × drąg"
  const DOPELNIACZ = {
    drag: ["drąga", "drągów"], kawaletka: ["kawaletki", "kawaletek"],
    stacjonata: ["stacjonaty", "stacjonat"], okser: ["okseru", "okserów"],
    pacholek: ["pachołka", "pachołków"], opona: ["opony", "opon"]
  };

  // Czego zabraknie, żeby postawić dany układ z zadeklarowanego sprzętu.
  // Pachołek i opona robią w slalomie to samo — kto ma opony zamiast pachołków,
  // dalej ułoży ten układ. Drąg i kawaletka NIE są wymienne: podniesienie drąga
  // zmienia ćwiczenie i odległości, więc to musi być świadomy wybór.
  const WYMIENNE = { pacholek: "slalomowe", opona: "slalomowe" };
  const NAZWA_PULI = { slalomowe: ["pachołka lub opony", "pachołków lub opon"] };

  function pula(typ) { return WYMIENNE[typ] || typ; }

  function brakiDla(elementy) {
    const potrzeba = { drag: 0 };
    elementy.forEach((e) => {
      const typ = Array.isArray(e) ? e[0] : e.typ;
      potrzeba.drag += DRAGI_W[typ] || 0;
      if (typ !== "drag" && DOMYSLNY_SPRZET[typ] !== undefined) {
        const k = pula(typ);
        potrzeba[k] = (potrzeba[k] || 0) + 1;
      }
    });
    const mam = (typ) => (mojSprzet[typ] != null ? mojSprzet[typ] : DOMYSLNY_SPRZET[typ]);
    const braki = [];
    Object.keys(potrzeba).forEach((k) => {
      const skladniki = Object.keys(DOMYSLNY_SPRZET).filter((t) => pula(t) === k);
      const masz = skladniki.length ? skladniki.reduce((sum, t) => sum + mam(t), 0) : mam(k);
      const brak = potrzeba[k] - masz;
      if (brak > 0) {
        const slowa = NAZWA_PULI[k] || DOPELNIACZ[k];
        braki.push(`${brak} ${slowa[brak === 1 ? 0 : 1]}`);
      }
    });
    return braki;
  }

  let tylkoMojSprzet = false;
  let tylkoUlubione = false;
  let filtrDysc = "";     // "" = wszystkie
  let filtrCel = "";      // "" = wszystkie

  const DYSCYPLINY_NAZWY = { ujezdzenie: "Ujeżdżenie", skoki: "Skoki", western: "Western" };
  const CHODY_NAZWY = { step: "stęp", klus: "kłus", galop: "galop" };

  // Chód nie jest etykietą do wpisania — wynika z rozstawu drągów. Trzy drągi
  // co 1,35 m to kłus, bo tyle mierzy fula kłusa, a nie dlatego, że ktoś tak nazwał.
  // Gdzie rozstawu nie ma (same przeszkody, pachołki, drągi nie w linii) — nic nie piszemy.
  function rozstawDragow(pr) {
    const naziemne = pr.el.filter((e) => e[0] === "drag" || e[0] === "kawaletka");
    if (naziemne.length < 2) return null;
    const kat = naziemne[0][3] || 0;
    if (!naziemne.every((e) => (e[3] || 0) === kat)) return null;   // nie w jednej linii

    const odl = (a, b) => Math.sqrt((a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2);
    const posort = naziemne.slice().sort((a, b) => (a[1] - b[1]) || (a[2] - b[2]));
    const przerwy = [];
    for (let i = 1; i < posort.length; i++) przerwy.push(odl(posort[i - 1], posort[i]));
    const sr = przerwy.reduce((a, b) => a + b, 0) / przerwy.length;
    if (przerwy.some((d) => Math.abs(d - sr) > 0.35)) return null;  // nierówny rozstaw
    return sr;
  }

  function chodPrzykladu(pr) {
    const d = rozstawDragow(pr);
    if (d == null) return null;
    const g = grupy()[0];
    const widelki = DRAGI[g];
    for (const chod of ["step", "klus", "galop"]) {
      if (d >= widelki[chod][0] - 0.06 && d <= widelki[chod][1] + 0.06)
        return { klasa: chod, napis: CHODY_NAZWY[chod] };
    }
    return { klasa: "inny", napis: `co ${fmtL(d)} m` };
  }

  // To, czego układ wymaga, jest cechą układu. Trudność nie — ta zależy od tego,
  // którędy i jak pojedziesz, a trasy celowo nie zapisujemy.
  function rodzajPrzykladu(pr) {
    const skok = pr.el.some((e) => e[0] === "stacjonata" || e[0] === "okser");
    return skok ? { klasa: "skoki", napis: "ze skokami" }
                : { klasa: "naziemne", napis: "naziemne" };
  }

  // Mały podgląd układu — instruktor wybiera ćwiczenie okiem, nie czytając nazwy.
  function miniaturaPrzykladu(pr) {
    const S = 2.5, M = 3, W = pr.dl * S + M * 2, H = pr.sz * S + M * 2;
    let sr = `<rect x="${M}" y="${M}" width="${pr.dl * S}" height="${pr.sz * S}" ` +
             `fill="var(--chrome-3)" stroke="var(--line)" stroke-width="1" rx="2"/>`;

    if (pr.tor && pr.tor.length > 1) {
      const d = pr.tor.map((t) => `${M + t.x * S},${M + t.y * S}`).join(" ");
      sr += `<polyline points="${d}" fill="none" stroke="var(--ink-faint)" ` +
            `stroke-width="1" stroke-dasharray="2 2" opacity="0.7"/>`;
    }

    pr.el.forEach((e) => {
      const typ = e[0], x = M + e[1] * S, y = M + e[2] * S, kat = e[3] || 0;
      if (typ === "pacholek" || typ === "opona") {
        sr += `<circle cx="${x}" cy="${y}" r="1.6" fill="none" stroke="var(--ink-soft)" stroke-width="1.1"/>`;
        return;
      }
      if (typ === "litera" || typ === "inny") return;
      const przeszkoda = typ === "stacjonata" || typ === "okser";
      const dl = 3 * S / 2;
      sr += `<line x1="${-dl}" y1="0" x2="${dl}" y2="0" ` +
            `transform="translate(${x} ${y}) rotate(${kat})" ` +
            `stroke="${przeszkoda ? "#E8A05C" : "var(--accent)"}" ` +
            `stroke-width="${przeszkoda ? 2.4 : 1.7}" stroke-linecap="round"/>`;
    });
    return `<svg class="miniatura" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">${sr}</svg>`;
  }

  function pasujeDoFiltrow(pr) {
    if (tylkoMojSprzet && brakiDla(pr.el).length) return false;
    if (tylkoUlubione && ulubione.indexOf(pr.nazwa) < 0) return false;
    if (filtrDysc && (pr.dysc || []).indexOf(filtrDysc) < 0) return false;
    if (filtrCel && pr.cel !== filtrCel) return false;
    return true;
  }

  function oknoPrzyklady() {
    pokazOkno("Gotowe ustawienia", (t) => {
      const info = document.createElement("p");
      info.style.cssText = "color:var(--ink-soft); font-size:0.86rem; margin:0 0 0.5rem";
      info.textContent = "Wczytanie zastąpi to, co masz na placu. Cofnij przywraca poprzedni układ.";
      t.appendChild(info);

      const pasujace = PRZYKLADY.filter(pasujeDoFiltrow);

      const los = document.createElement("button");
      los.textContent = "🎲 Wylosuj, co dziś postawić";
      los.style.cssText = "width:100%; margin-bottom:0.5rem; border-color:var(--accent); color:var(--accent); font-weight:600";
      los.addEventListener("click", () => {
        if (!pasujace.length) return pokazPodpowiedz("Przy tych filtrach nie ma z czego losować");
        wczytajPrzyklad(pasujace[Math.floor(Math.random() * pasujace.length)]);
      });
      t.appendChild(los);

        mini.innerHTML = miniaturaPrzykladu(pr);

        const znaczki =
          (chod ? `<span class="znak chod-${chod.klasa}">${chod.napis}</span>` : "") +
          `<span class="znak rodzaj-${rodzaj.klasa}">${rodzaj.napis}</span>`;
        const stanSprzetu = braki.length

                         `<span class="znaki">${znaczki}</span>${stanSprzetu}`;

        gwiazdka.addEventListener("click", () => {

  // ====================== moje place i mój sprzęt ======================

  const DOMYSLNY_SPRZET = { drag: 12, kawaletka: 4, stacjonata: 6, okser: 3, pacholek: 12, opona: 4 };

  function oknoZapiszPrzeszkode(e) {

  // Każde pole z liczbą dostaje własne strzałki — systemowe wyglądają jak z panelu
  // sterowania i nie pasują do reszty. Wołamy to po zbudowaniu okna i paska,
  // bo oba budują swoje pola od nowa przy każdym otwarciu.
  const STRZALKA_GORA = '<svg viewBox="0 0 12 8" width="11" height="7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 5.5 6 2l3.5 3.5"/></svg>';
  const STRZALKA_DOL  = '<svg viewBox="0 0 12 8" width="11" height="7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 2.5 6 6l3.5-3.5"/></svg>';

  function ozdobLiczby(korzen) {
    if (!korzen) return;
    korzen.querySelectorAll('input[type="number"]').forEach((pole) => {
      if (pole.dataset.zeStrzalkami || pole.hidden) return;
      pole.dataset.zeStrzalkami = "1";
      const obudowa = document.createElement("span");
      obudowa.className = "liczba";
      pole.parentNode.insertBefore(obudowa, pole);
      obudowa.appendChild(pole);

      const strzalki = document.createElement("span");
      strzalki.className = "strzalki";
      // „Więcej"/„Mniej" myliło się z guzikiem rozwijającym pasek — to są strzałki
      // do liczby, więc nazywają się tak, jak to, co robią.
      [[STRZALKA_GORA, 1, "Zwiększ"], [STRZALKA_DOL, -1, "Zmniejsz"]].forEach(([ikona, kier, tytul]) => {
        const b = document.createElement("button");
        b.type = "button";
        b.tabIndex = -1;              // klawiatura ma strzałki w samym polu
        b.title = tytul;
        b.setAttribute("aria-label", tytul);
        b.innerHTML = ikona;
        b.addEventListener("click", (ev) => {
          ev.preventDefault();
          if (pole.disabled) return;
          // puste pole: pierwszy klik ustawia sensowny start, a nie zero
          if (!pole.value.trim()) pole.value = pole.min || "0";
          else if (kier > 0) pole.stepUp(); else pole.stepDown();
          // te same zdarzenia, co przy pisaniu ręką — inaczej okna nie zauważą zmiany
          pole.dispatchEvent(new Event("input", { bubbles: true }));
          pole.dispatchEvent(new Event("change", { bubbles: true }));
        });
        strzalki.appendChild(b);
      });
      obudowa.appendChild(strzalki);
    });
  }

    return stan.elementy.reduce((suma, e) => suma + (DRAGI_W[e.typ] || 0), 0);
  }


  // ====================== moje schematy ======================

  // Schemat to wszystko naraz: plac, elementy, tor i koń, dla którego liczone są odległości.
  function oknoSchematy() {

      const info = document.createElement("p");
      info.style.cssText = "color:var(--ink-soft); font-size:0.86rem; margin:0 0 0.4rem";
      info.textContent = "Zapisuje plac, wszystkie elementy i tor. Wczytanie zastąpi to, co masz teraz — Cofnij przywraca poprzedni układ.";

        const usunS = document.createElement("button");

          oknoSchematy();

        w.appendChild(wczytaj); w.appendChild(usunS);

      const dodaj = document.createElement("div");

        }
        const n = (nazwa.value || "").trim() || `Schemat z ${new Date().toLocaleDateString("pl-PL")}`;

        const nowy = zrzutSchematu(n);
        if (istnieje >= 0) mojeSchematy[istnieje] = nowy;
        else mojeSchematy.unshift(nowy);

  function zrzutSchematu(nazwa) {
    return {
      nazwa: nazwa,
      data: new Date().toLocaleDateString("pl-PL"),
      dl: stan.dl, sz: stan.sz, kon: stan.kon, grupy: grupy(), litery: stan.litery,
      elementy: stan.elementy.map((e) => Object.assign({}, e)),
      tor: stan.tor.map((p) => Object.assign({}, p))
    };
  }

  function wczytajSchemat(sc) {
    zapiszHistorie();
    stan.dl = sc.dl; stan.sz = sc.sz;
    stan.elementy = (sc.elementy || []).map((e) => Object.assign({}, e));
    stan.tor = (sc.tor || []).map((p) => Object.assign({}, p));
    stan.nast = stan.elementy.reduce((m, e) => Math.max(m, e.id), 0) + 1;
    sprzatnijWiazania();
    if (sc.litery !== undefined) stan.litery = sc.litery;
    const zeSchematu = (sc.grupy && sc.grupy.length ? sc.grupy : [sc.kon])
      .map((k) => (k === "kucDuzy" || k === "kucMaly" ? "kuc" : k))
      .filter((k, i, a) => KONIE[k] && a.indexOf(k) === i);
    if (zeSchematu.length) {
      stan.grupy = KOLEJNOSC_GRUP.filter((k) => zeSchematu.indexOf(k) >= 0);
      stan.kon = stan.grupy[0];
      ustawEtykieteGrup();
    }
    zaznaczony = null; miarkaA = null; miarkaB = null;
    wsunElementy();   // schemat zapisany starszą wersją mógł mieć sprzęt na bandzie
    $("dl").value = stan.dl; $("sz").value = stan.sz;
    ustawWyborWymiaru();
    odswiezPodpisLiter();
    odswiezNumeracje();
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
    odswiezLiczniki(); odswiezOstrzezenia();
    $("zaslonaOkno").classList.remove("widoczna");
    pokazPodpowiedz(`Wczytano „${sc.nazwa}"`);
  }

      t.appendChild(info);

      [["Zamień strony (lewa ↔ prawa)", "poprzek", "odbicie względem długiej osi placu"],
       ["Zamień końce (przód ↔ tył)", "wzdluz", "odbicie względem krótkiej osi placu"]].forEach(([txt, os, opis]) => {
        const w = document.createElement("div");

  function odbij(os) {
    if (!stan.elementy.length && !stan.tor.length) {
      pokazPodpowiedz("Plac jest pusty — nie ma czego odbijać");
      return;
    }
    zapiszHistorie();
    const poprzek = os === "poprzek";
    stan.elementy.forEach((e) => {
      if (poprzek) e.y = okr(stan.sz - e.y);
      else e.x = okr(stan.dl - e.x);
      const k = e.kat || 0;
      e.kat = (((poprzek ? -k : 180 - k) % 360) + 360) % 360;
    });
    stan.tor.forEach((p) => {
      if (poprzek) p.y = okr(stan.sz - p.y);
      else p.x = okr(stan.dl - p.x);
    });
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
    odswiezLiczniki(); odswiezOstrzezenia();
    $("zaslonaOkno").classList.remove("widoczna");
    pokazPodpowiedz(poprzek ? "Układ odbity — teraz najeżdżasz z drugiej strony" : "Układ odbity — przód i tył zamienione");
  }

  // ====================== równy rozstaw ======================

  // Ta sama liczba fuli daje różne metry różnym koniom — pokaż widełki, nie jedną liczbę.
  function rozrzut(wartosci) {
    const lo = Math.min.apply(null, wartosci), hi = Math.max.apply(null, wartosci);
    return lo === hi ? `${fmt(lo)} m` : `${fmt(lo)}–${fmt(hi)} m, średnio ${fmt((lo + hi) / 2)}`;
  }

  function odmianaEl(n) {
    if (n === 1) return "element";
    const j = n % 10, d = n % 100;
    if (j >= 2 && j <= 4 && !(d >= 12 && d <= 14)) return "elementy";
    return "elementów";
  }

  const SZEREG_TYPY = ["drag", "kawaletka", "stacjonata", "okser"];
  const SZEREG_BOK = 1.8;      // ile w bok element może odstawać, żeby liczyć się do szeregu
  const SZEREG_KAT = 0.36;     // sinus różnicy kątów ≈ 21°

  // Elementy leżące w jednej linii z zaznaczonym, po kolei w kierunku jazdy.
  function szereg(e) {
    const rad = (e.kat || 0) * Math.PI / 180;
    const ux = Math.cos(rad), uy = Math.sin(rad);   // wzdłuż drąga
    const vx = -uy, vy = ux;                         // kierunek jazdy, w poprzek drąga
    const lista = stan.elementy
      .filter((o) => SZEREG_TYPY.indexOf(o.typ) >= 0)
      .filter((o) => Math.abs(Math.sin(((o.kat || 0) - (e.kat || 0)) * Math.PI / 180)) < SZEREG_KAT)
      .map((o) => {
        const dx = o.x - e.x, dy = o.y - e.y;
        return { e: o, wzdluz: dx * vx + dy * vy, bok: dx * ux + dy * uy };
      })
      .filter((o) => Math.abs(o.bok) <= SZEREG_BOK);
    lista.sort((a, b) => a.wzdluz - b.wzdluz);
    return { lista: lista.map((o) => o.e), vx: vx, vy: vy };
  }

  function oknoRozstaw(e) {
    const znal = szereg(e);
    const gr = grupy();
    const naziemny = e.typ === "drag" || e.typ === "kawaletka";
    const dlaKogo = gr.length === 1 ? KONIE[gr[0]].dop : gr.map((g) => GRUPA_KROTKO[g]).join(" + ");

    pokazOkno("Rozstaw równo", (t) => {
      const info = document.createElement("p");
      info.style.cssText = "color:var(--ink-soft); font-size:0.86rem; margin:0 0 0.4rem";
      info.textContent = znal.lista.length > 1
        ? `Znalazłam w tej linii ${znal.lista.length} ${odmianaEl(znal.lista.length)}. Pierwszy zostaje na miejscu, resztę ustawię od niego — dla ${dlaKogo}.`
        : `Ustawię szereg od tego elementu — dla ${dlaKogo}. Brakujące dostawię sama.`;
      t.appendChild(info);

      const w1 = document.createElement("div");
      w1.className = "wiersz";
      w1.innerHTML = `<span class="etykieta">Ile elementów w szeregu</span>`;
      const ile = document.createElement("input");
      ile.type = "number"; ile.min = "2"; ile.max = "8";
      ile.value = Math.max(2, znal.lista.length);
      w1.appendChild(ile);
      t.appendChild(w1);

      const opcje = [];
      let rozjazd = false;   // czy któryś chód nie ma odległości dobrej dla wszystkich
      if (naziemny) {
        [["step", "Stęp"], ["klus", "Kłus"], ["galop", "Galop"]].forEach(([klucz, nazwa]) => {
          // wspólne okno dla wszystkich wybranych grup: najwyższe dolne, najniższe górne
          const lo = Math.max.apply(null, gr.map((g) => DRAGI[g][klucz][0]));
          const hi = Math.min.apply(null, gr.map((g) => DRAGI[g][klucz][1]));
          if (lo <= hi) {
            opcje.push({ nazwa: nazwa, opis: lo === hi ? `${fmt(lo)} m` : `${fmt(lo)}–${fmt(hi)} m`, m: (lo + hi) / 2 });
          } else {
            rozjazd = true;
            // nie ma odległości dobrej dla wszystkich — każda grupa dostaje własną
            gr.forEach((g) => {
              const [a, bb] = DRAGI[g][klucz];
              opcje.push({ nazwa: `${nazwa} — ${GRUPA_KROTKO[g]}`, opis: `${fmt(a)}–${fmt(bb)} m`, m: (a + bb) / 2 });
            });
          }
        });
        [1, 2].forEach((n) => {
          const w = gr.map((g) => n * KONIE[g].fula);
          opcje.push({ nazwa: n === 1 ? "Jedna fula galopu" : "Dwie fule galopu",
                       opis: rozrzut(w), m: w.reduce((a, b) => a + b, 0) / w.length });
        });
      } else {
        for (let n = 1; n <= 4; n++) {
          const w = gr.map((g) => KONIE[g].zapas + n * KONIE[g].fula);
          opcje.push({ nazwa: `${n} ${odmianaFuli(n)}`, opis: rozrzut(w),
                       m: w.reduce((a, b) => a + b, 0) / w.length });
        }
      }

      if (rozjazd) {
        const uwaga = document.createElement("p");
        uwaga.style.cssText = "color:var(--ostrzez); font-size:0.84rem; margin:0.3rem 0 0.2rem";
        uwaga.textContent = "Przy tej mieszance nie ma jednej odległości dobrej dla wszystkich. Albo ustawiasz pod jedną wielkość i reszta skraca lub wydłuża, albo stawiasz dwa szeregi obok siebie — po jednym dla każdej.";
        t.appendChild(uwaga);
      }

      opcje.forEach((o) => {
        const w = document.createElement("div");
        w.className = "wiersz";
        const werdykty = gr.length > 1
          ? `<br><span class="drobne">${gr.map((g) => {
               const oc = ocen(o.m, g, naziemny);
               const kolor = { ok: "var(--ok)", blisko: "var(--accent)",
                               zle: "var(--ostrzez)", stop: "var(--blad)" }[oc.klasa] || "var(--ink-faint)";
               const tytul = (KONIE[g].dop + (oc.tekst ? " — " + oc.tekst : "")).replace(/"/g, "");
               return `<span title="${tytul}" style="color:${kolor}">${NAZWA_GRUPY[g]}: ${oc.krotki}</span>`;
             }).join(" · ")}</span>`
          : "";
        w.innerHTML = `<span class="etykieta">${o.nazwa}${werdykty}</span><span class="drobne">${o.opis}</span>`;
        const b = document.createElement("button");
        b.className = "mini";
        b.textContent = "Ustaw";
        b.addEventListener("click", () => rozstawSzereg(e, o.m, Math.max(2, Math.min(8, +ile.value || 2)), o.nazwa.toLowerCase()));
        w.appendChild(b);
        t.appendChild(w);
      });

      const wlasna = document.createElement("div");
      wlasna.className = "wiersz";
      wlasna.style.borderTop = "1px solid var(--line)";
      wlasna.innerHTML = `<span class="etykieta">Własna odległość</span>`;
      const pole = document.createElement("input");
      pole.type = "number"; pole.min = "0.4"; pole.max = "30"; pole.step = "0.05";
      pole.placeholder = "m";
      const ust = document.createElement("button");
      ust.className = "mini";
      ust.textContent = "Ustaw";
      ust.addEventListener("click", () => {
        const d = +pole.value;
        if (!(d > 0.3)) { pole.focus(); return; }
        rozstawSzereg(e, d, Math.max(2, Math.min(8, +ile.value || 2)), `co ${fmt(d)} m`);
      });
      wlasna.appendChild(pole); wlasna.appendChild(ust);
      t.appendChild(wlasna);

      const stopka = document.createElement("p");
      stopka.className = "drobne";
      stopka.style.marginTop = "0.4rem";
      stopka.textContent = naziemny
        ? "Drągi na ziemi mierzone od środka do środka."
        : "Przeszkody mierzone od tyłu pierwszej do podstawy następnej — zapas na lądowanie i odbicie jest już wliczony.";
      t.appendChild(stopka);
    });
  }

  function rozstawSzereg(e, odleglosc, ile, podpis) {
    const znal = szereg(e);
    let lista = znal.lista.slice();
    let vx = znal.vx, vy = znal.vy;

    zapiszHistorie();

    // dostawiamy kopie zaznaczonego, gdy w linii jest ich za mało
    while (lista.length < ile) {
      const n = Object.assign({}, e, { id: stan.nast++ });
      delete n.nr;
      stan.elementy.push(n);
      lista.push(n);
    }
    // nadmiar zdejmujemy od końca
    while (lista.length > ile) {
      const zbedny = lista.pop();
      stan.elementy = stan.elementy.filter((x) => x.id !== zbedny.id);
      odwiazOd(zbedny.id);
      if (miarkaA === zbedny.id) miarkaA = null;
      if (miarkaB === zbedny.id) miarkaB = null;
      if (zaznaczony === zbedny.id) zaznaczony = lista.length ? lista[0].id : null;
    }

    const wzor = lista[0];
    const przesuniecia = [0];
    for (let i = 1; i < lista.length; i++) {
      const a = lista[i - 1], b = lista[i];
      const naziemne = TYPY[a.typ].naziemny && TYPY[b.typ].naziemny;
      const srodki = naziemne ? odleglosc : odleglosc + glebokosc(a) / 2 + glebokosc(b) / 2;
      przesuniecia.push(przesuniecia[i - 1] + srodki);
    }
    const calosc = przesuniecia[przesuniecia.length - 1];

    // jeśli w tę stronę szereg wyjdzie poza plac, kładziemy go w drugą
    const mieszczy = (zx, zy) => {
      const x = wzor.x + zx * calosc, y = wzor.y + zy * calosc;
      return x >= 0.4 && x <= stan.dl - 0.4 && y >= 0.4 && y <= stan.sz - 0.4;
    };
    if (!mieszczy(vx, vy) && mieszczy(-vx, -vy)) { vx = -vx; vy = -vy; }

    const x0 = wzor.x, y0 = wzor.y, kat = wzor.kat || 0;
    zakotwiczWszystkie();
    const przedRozstawem = lista.map((o) => ({ id: o.id, x: o.x, y: o.y }));
    lista.forEach((o, i) => {
      o.x = okr(x0 + vx * przesuniecia[i]);
      o.y = okr(y0 + vy * przesuniecia[i]);
      o.kat = kat;
    });
    przesunTorZaElementami(przedRozstawem);

    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
    odswiezLiczniki(); odswiezOstrzezenia();
    $("zaslonaOkno").classList.remove("widoczna");
    const poza = !mieszczy(vx, vy);
    pokazPodpowiedz(poza
      ? `Rozstawione co ${fmt(odleglosc)} m, ale szereg nie mieści się na placu — przesuń pierwszy element albo zmniejsz ich liczbę`
      : `${lista.length} ${odmianaEl(lista.length)} co ${fmt(odleglosc)} m — ${podpis}`);
  }

  // ---- czerwone flagi: to, co na placu może się nie udać ----

  const MIN_MIEDZY = 0.6;      // bliżej niż tyle = elementy na sobie

  function sprawdzPlac() {
    const flagi = [];
    const el2 = stan.elementy;

    // 1. elementy stojące na sobie
    for (let i = 0; i < el2.length; i++) {
      for (let j = i + 1; j < el2.length; j++) {
        const a = el2[i], b = el2[j];
        if (a.typ === "litera" || b.typ === "litera") continue;
        if (odlegloscOd(a, { x: b.x, y: b.y }) < MIN_MIEDZY) {
          flagi.push({ tekst: `${TYPY[a.typ].nazwa} i ${TYPY[b.typ].nazwa} stoją na sobie`, id: b.id });
        }
      }
    }

    // 3. trasa przecina coś, przez co się nie przejeżdża
    // Warunek pytał kiedyś o stan.tor, bo tam mieszkał cały przejazd. Po przebudowie
    // z 14 września siedzą tam tylko figury — i to ostrzeżenie przestało się kiedykolwiek
    // odzywać, bo plac bez figur ma pusty stan.tor. Pytamy więc o kroki przejazdu.
    if (krokiTrasy().length > 1 || stan.tor.length > 1) {
      const probki = [];
      svg.querySelectorAll("path.tor").forEach((sc) => {
        let dl = 0;
        try { dl = sc.getTotalLength(); } catch (err) { return; }
        const krok = Math.max(1, Math.round(dl / 0.3));
        for (let i = 0; i <= krok; i++) {
          const q = sc.getPointAtLength(dl * i / krok);
          probki.push(q);
        }
      });
      el2.forEach((e) => {
        if (["pacholek", "opona", "litera", "inny"].indexOf(e.typ) < 0) return;
        // Kiedyś pachołek z numerem był z tego wyjęty: skoro stoi w przejeździe,
        // to linia MA przez niego iść. Od 16 września linia OMIJA każdy pachołek
        // w trasie, więc numer niczego już nie usprawiedliwia — jeśli linia go
        // dotyka, to znaczy, że mija go przy okazji, jadąc gdzie indziej. Luiza
        // zauważyła to na filmie: po przestawieniu kolejności trasa wyprostowała
        // się i przeszła tuż obok pachołka nr 4, bez słowa ostrzeżenia.
        const blisko = probki.some((q) => Math.hypot(q.x - e.x, q.y - e.y) < 0.55);
        if (blisko) flagi.push({ tekst: `Trasa przechodzi przez ${TYPY[e.typ].nazwa.toLowerCase()}`, id: e.id });
      });
    }

    return flagi;
  }

  function odswiezOstrzezenia() {
    const box = $("ostrzezenia");
    const flagi = sprawdzPlac();
    box.textContent = "";
    if (!flagi.length) { box.className = "ostrzezenia"; return; }
    box.className = "ostrzezenia widoczne";
    flagi.slice(0, 4).forEach((f) => {
      const b = document.createElement("button");
      b.className = "flaga";
      b.innerHTML = `<span class="znak">▲</span><span>${f.tekst}</span>`;
      b.addEventListener("click", () => {
        zaznaczony = f.id;
        trybMiarka = false;
        $("btnMiarka").classList.remove("on");
        rysuj(); odswiezKontekst(); odswiezPomiar();
      });
      box.appendChild(b);
    });
    if (flagi.length > 4) {
      const w = document.createElement("div");
      w.className = "flaga";
      w.textContent = `…i jeszcze ${flagi.length - 4}`;
      box.appendChild(w);
    }
  }

  // liczniki na palecie: ile użyte z ilu posiadanych
  function odswiezLiczniki() {
    Object.keys(DOMYSLNY_SPRZET).forEach((typ) => {
      const b = document.querySelector(`.paleta button[data-typ="${typ}"]`);
      if (!b) return;
      let uzyte = stan.elementy.filter((e) => e.typ === typ).length;
      if (typ === "drag") uzyte = zuzyteDragi();
      const masz = mojSprzet[typ] != null ? mojSprzet[typ] : DOMYSLNY_SPRZET[typ];
      let licznik = b.querySelector(".licznik");
      if (!licznik) {
        licznik = document.createElement("span");
        licznik.className = "licznik";
        b.appendChild(licznik);
      }
      licznik.textContent = `${uzyte}/${masz}`;
      b.classList.toggle("brakuje", uzyte > masz);
    });
  }

  // ====================== własny rozwijany wybór ======================

  const PTASZEK = '<svg class="ptaszek" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 6.2 12 13 4.5"/></svg>';
  const STRZALKA = '<svg class="strzalka" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6 8 10.5 12.5 6"/></svg>';

  // opcje.wielokrotny — lista działa jak checklista: dotknięcie dokłada albo zdejmuje
  // pozycję, lista zostaje otwarta, a etykietę przycisku ustawia kod na zewnątrz.
  function zbudujWybor(idSelecta, opcje) {
    opcje = opcje || {};
    const sel = $(idSelecta);
    const otoczka = document.createElement("div");
    otoczka.className = "wybor";

    const przycisk = document.createElement("button");
    przycisk.type = "button";
    przycisk.setAttribute("aria-haspopup", "listbox");
    przycisk.setAttribute("aria-expanded", "false");

    const lista = document.createElement("div");
    lista.className = "wybor-lista";
    lista.setAttribute("role", "listbox");

    function odswiez() {
      const wybrana = sel.options[sel.selectedIndex];
      przycisk.innerHTML = `<span>${wybrana ? wybrana.textContent : ""}</span>${STRZALKA}`;
      if (opcje.wielokrotny) {
        const zazn = opcje.zaznaczone();
        [...lista.children].forEach((b) => {
          b.setAttribute("aria-selected", zazn.indexOf(b.dataset.wartosc) >= 0 ? "true" : "false");
        });
        return;
      }
      [...lista.children].forEach((b, i) => {
        b.setAttribute("aria-selected", i === sel.selectedIndex ? "true" : "false");
      });
    }

    [...sel.options].forEach((opt, i) => {
      if (opcje.pomijaj && opcje.pomijaj.indexOf(opt.value) >= 0) return;
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("role", "option");
      b.dataset.wartosc = opt.value;
      b.innerHTML = `<span>${opt.textContent}</span>` + PTASZEK;
      b.addEventListener("click", (ev) => {
        if (opcje.wielokrotny) {
          ev.stopPropagation();        // lista zostaje otwarta, można dobrać kolejną
          opcje.przelacz(opt.value);
          odswiez();
          return;
        }
        sel.selectedIndex = i;
        sel.dispatchEvent(new Event("change", { bubbles: true }));
        zamknij();
        odswiez();
      });
      lista.appendChild(b);
    });

    function otworz() {
      zamknijWszystkie();
      otoczka.classList.add("otwarty");
      przycisk.setAttribute("aria-expanded", "true");
    }
    function zamknij() {
      otoczka.classList.remove("otwarty");
      przycisk.setAttribute("aria-expanded", "false");
    }

    przycisk.addEventListener("click", (e) => {
      e.stopPropagation();
      otoczka.classList.contains("otwarty") ? zamknij() : otworz();
    });
    przycisk.addEventListener("keydown", (e) => {
      if (e.key === "Escape") zamknij();
      if (opcje.wielokrotny) return;
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        const kier = e.key === "ArrowDown" ? 1 : -1;
        const n = Math.min(sel.options.length - 1, Math.max(0, sel.selectedIndex + kier));
        if (n !== sel.selectedIndex) {
          sel.selectedIndex = n;
          sel.dispatchEvent(new Event("change", { bubbles: true }));
          odswiez();
        }
      }
    });

    sel.addEventListener("change", odswiez);
    sel.addEventListener("zmiana-etykiety", odswiez);
    sel.parentNode.insertBefore(otoczka, sel);
    otoczka.appendChild(przycisk);
    otoczka.appendChild(lista);
    otoczka.appendChild(sel);
    odswiez();
    return { odswiez, zamknij };
  }

  function zamknijWszystkie() {
    document.querySelectorAll(".wybor.otwarty").forEach((w) => {
      w.classList.remove("otwarty");
      const b = w.querySelector("button");
      if (b) b.setAttribute("aria-expanded", "false");
    });
  }
  $("btnMenu").addEventListener("click", (e) => {
    e.stopPropagation();
    const m = $("menu");
    const bylo = m.classList.contains("otwarty");
    zamknijWszystkie();
    if (!bylo) { m.classList.add("otwarty"); $("btnMenu").setAttribute("aria-expanded", "true"); }
  });
  $("menu").querySelectorAll(".wybor-lista button").forEach((b) => {
    b.addEventListener("click", () => setTimeout(zamknijWszystkie, 0));
  });

  document.addEventListener("click", zamknijWszystkie);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") zamknijWszystkie(); });

  // ====================== start ======================

  zbudujPalete();

  if (!wczytajLokalnie()) {
    // przykład na start: trzy drągi w kłusie dla dużego konia
    const y = 10, x0 = 14, r = 1.35;
    for (let i = 0; i < 3; i++) {
      dodajCicho("drag", { x: x0 + i * r, y: y, kat: 90 });
    }
    dodajCicho("pacholek", { x: x0 - 4, y: y - 3, kat: 0 });
    dodajCicho("pacholek", { x: x0 - 4, y: y + 3, kat: 0 });
  }
  if (stan.pion === null || stan.pion === undefined) stan.pion = window.innerHeight > window.innerWidth * 1.15;
  if (stan.litery === undefined) stan.litery = true;
  odswiezPodpisLiter();
  odswiezNumeracje();
  $("btnSnap").classList.toggle("wlaczony", przyciaganie);
  $("btnSnap").innerHTML = (przyciaganie ? "Równe ustawianie ✓" : "Równe ustawianie")
    + `<span class="pod">sprzęt sam trafia na równe odległości — łatwiej ustawić drągi w rzędzie.`
    + ` Wyłącz, żeby stawiać dokładnie tam, gdzie palec.</span>`;
  $("wymiar").value = `${stan.dl}x${stan.sz}`;
  if (!$("wymiar").value) $("wymiar").value = "wlasny";
  ustawEtykieteGrup();
  const wyborWymiar = zbudujWybor("wymiar");
  const wyborKon = zbudujWybor("kon", {
    wielokrotny: true,
    pomijaj: ["mieszana"],
    zaznaczone: () => grupy(),
    przelacz: (klucz) => {
      const g = grupy().slice();
      const i = g.indexOf(klucz);
      if (i >= 0) {
        if (g.length === 1) return pokazPodpowiedz("Przynajmniej jedna wielkość musi zostać zaznaczona");
        g.splice(i, 1);
      } else {
        g.push(klucz);
      }
      ustawGrupy(g);
      pokazPodpowiedz(g.length > 1
        ? "Odległości liczone dla: " + grupy().map((k) => GRUPA_KROTKO[k]).join(" + ") + " — dotknij kolejnej, żeby ją dołożyć albo zdjąć"
        : KONIE[g[0]].grupa + " — dotknij kolejnej wielkości, żeby dołożyć ją do tego treningu");
    }
  });
  rysuj();
  odswiezPomiar();
