
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Koniownik — Edytor Placu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  :root {
    --chrome:      #241C16;
    --chrome-2:    #2F251C;
    --chrome-3:    #3C2F24;
    --line:        #4C3B2E;
    --ink:         #F3ECE3;
    --ink-soft:    #BCAB98;
    --ink-faint:   #8A7A66;

    --piasek:      #DCCDB2;
    --piasek-2:    #CDBB9B;
    --banda:       #6B5638;

    /* Paleta marki Koniownik — 60 / 30 / 8 / 2.
       Patyna niesie wszystko, co jest „nasze": logo, przyciski główne, tor przejazdu,
       zaznaczenie, linie wymiarowe. Owies pokazuje wyłącznie zgodę: werdykt „pasuje"
       i stan włączony. Ostrzeżenie i błąd zostają, bo mówią co innego niż marka. */
    --accent:      #269186;   /* patyna */
    --accent-jasny: #2FAFA1;  /* patyna pod palcem/kursorem */
    --accent-ink:  #05211E;
    --ostrzez:     #DE9A3C;
    --blad:        #D75E4C;
    --ok:          #AFC42B;   /* owies */
    --ok-ink:      #22280A;

    --drag-jasny:  #FBF7F0;
    --drag-ciemny: #C0503F;
    --pacholek:    #E4762F;
    --pacholek-2:  #B8571F;
    --pacholek-3:  #FBF4EC;
    --guma:        #33322F;
    --drewno:      #8A6E45;
    --krzyz:       #6E5A3C;
    --kontur:      #3A2A1C;
    --litera:      #FAFAF7;
    /* tor to patyna przyciemniona o 30% — na jasnym piasku czyta się mocniej,
       a zaznaczenie zostaje czystą patyną, więc różni się kolorem, nie grubością */
    --tor:         #1B665E;

    --f-ui:   "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --f-num:  "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body, svg, .paleta, .kontekst, header {
    -webkit-user-select: none; user-select: none;
  }
  input, select { -webkit-user-select: auto; user-select: auto; }

  body {
    margin: 0;
    background: var(--chrome);
    color: var(--ink);
    font-family: var(--f-ui);
    font-size: 15px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- pasek górny ---------- */

  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.5rem 0.7rem;
    background: var(--chrome-2);
    border-bottom: 1px solid var(--line);
  }

  .marka {
    font-weight: 800;
    font-size: 1.05rem;
    letter-spacing: -0.02em;
    margin-right: 0.2rem;
  }
  .marka span { color: var(--ink-faint); font-weight: 400; font-size: 0.82rem; margin-left: 0.5rem; letter-spacing: 0; }

  .dopchu { margin-left: auto; display: flex; align-items: center; gap: 0.35rem; }
  .wybor-lista.prawa { left: auto; right: 0; }
  .wybor-lista .kreska { height: 1px; background: var(--line); margin: 0.3rem 0.2rem; }
  /* Nagłówek nad grupą wyboru. Jeden guzik, który po kliknięciu zmienia napis,
     ukrywa to, że wybór w ogóle istnieje — widać tylko stan, nie możliwości. */
  .wybor-lista .naglowek {
    padding: 0.5rem 0.6rem 0.15rem;
    font-family: var(--f-num); font-size: 0.66rem; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  /* druga linijka w pozycji menu: nazwa nie zawsze wystarczy, żeby wiedzieć,
     co się włącza — a na telefonie nie ma dymka z podpowiedzią */
  .wybor-lista button .pod {
    display: block; flex: 1 0 100%; margin-top: 0;
    font-size: 0.72rem; color: var(--ink-faint); line-height: 1.4;
  }
  .wybor-lista button.wlaczony .pod { color: var(--ink-soft); font-weight: 400; }
  .wybor-lista button.grozny { color: var(--blad); }
  .wybor-lista button.wlaczony { color: var(--accent); font-weight: 600; }

  .paleta button.tryb .ikonka { color: var(--ink-soft); }
  .paleta button.tryb.on .ikonka,
  .paleta button.tryb.on .nazwa { color: var(--ok-ink); }

  .pomiar.schowany { display: none; }

  /* własny wybór — natywny <select> zostaje jako nośnik stanu, ukryty */
  select.schowany { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  .wybor { position: relative; flex: none; }
  .wybor > button {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.55rem;
    width: 100%;
    padding: 0.42rem 0.7rem;
    text-align: left;
    white-space: nowrap;
  }
  .wybor > button .strzalka { flex: none; opacity: 0.7; transition: transform 0.15s ease; }
  .wybor.otwarty > button { border-color: var(--accent); }
  .wybor.otwarty > button .strzalka { transform: rotate(180deg); }

  .wybor-lista {
    display: none;
    position: absolute;
    z-index: 40;
    top: calc(100% + 6px);
    left: 0;
    min-width: 100%;
    /* max-content, ale przycięte do ekranu: bez tego po zezwoleniu na łamanie
       nazw lista zwijała się do szerokości trzech liter */
    width: max-content;
    /* Na telefonie lista rozwijana rosła do szerokości najdłuższej pozycji (468 px
       na ekranie 390 px) i połowa napisów uciekała poza lewą krawędź. Nigdy więcej
       niż ekran; wysoka lista przewija się w środku, zamiast wychodzić poza niego. */
    max-width: min(calc(100vw - 0.8rem), 24rem);
    max-height: min(72vh, 34rem);
    overflow-y: auto;
    overscroll-behavior: contain;
    background: var(--chrome-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.3rem;
    box-shadow: 0 14px 32px rgba(12,8,5,0.5);
  }
  .wybor.otwarty .wybor-lista { display: block; }
  .wybor-lista button {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.15rem 0.9rem;
    width: 100%;
    background: transparent;
    border: none;
    border-radius: 7px;
    padding: 0.5rem 0.6rem;
    /* nazwa ma się złamać, a nie rozepchać listy poza ekran */
    white-space: normal;
    text-align: left;
    font-size: 0.85rem;
    min-height: 36px;
  }
  .wybor-lista button:hover { background: var(--chrome-3); }
  .wybor-lista button .ptaszek { width: 14px; flex: none; margin-left: auto; opacity: 0; color: var(--accent); }
  .wybor-lista button[aria-selected="true"] { color: var(--accent); font-weight: 600; }
  .wybor-lista button[aria-selected="true"] .ptaszek { opacity: 1; }
  button, select, input[type="number"] {
    font-family: var(--f-ui);
    font-size: 0.85rem;
    color: var(--ink);
    background: var(--chrome-3);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.42rem 0.7rem;
    cursor: pointer;
    min-height: 38px;
  }
  input[type="number"] { width: 4.4rem; font-family: var(--f-num); cursor: text; }
  /* Systemowe strzałki wyglądają jak z panelu sterowania Windows — zdejmujemy je
     i rysujemy własne, tą samą kreską co reszta ikon w aplikacji. */
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

  .liczba { display: inline-flex; align-items: stretch; flex: none; position: relative; }
  .liczba input[type="number"] { padding-right: 1.55rem; width: 100%; }
  .liczba .strzalki {
    position: absolute; right: 1px; top: 1px; bottom: 1px; width: 1.35rem;
    display: flex; flex-direction: column; border-radius: 0 7px 7px 0; overflow: hidden;
  }
  .liczba .strzalki button {
    flex: 1; min-height: 0; padding: 0; margin: 0;
    background: transparent; border: none; border-radius: 0;
    color: var(--ink-faint); display: flex; align-items: center; justify-content: center;
  }
  .liczba .strzalki button svg { display: block; }
  .liczba .strzalki button + button { border-top: 1px solid var(--line); }
  @media (hover: hover) {
    .liczba .strzalki button:hover { color: var(--accent); background: var(--chrome-2); }
  }
  .liczba .strzalki button:active { transform: none; background: var(--chrome-2); color: var(--accent); }
  .kontekst .liczba input[type="number"] { min-width: 5.2rem; }
  .kontekst .liczba .strzalki { border-left: 1px solid var(--line); }
  .wiersz .liczba { flex: 0 0 5rem; width: 5rem; }
  .wiersz .liczba input[type="number"] { flex: 1 1 auto; width: 100%; }

  button, select, input[type="number"], input[type="text"] {
    transition: border-color 0.13s ease, background-color 0.13s ease, color 0.13s ease;
  }
  /* Dotyk nie ma kursora, więc hover jest dla myszy — i tylko tam go pokazujemy.
     Na telefonie :hover potrafi „przykleić się" po dotknięciu i guzik zostaje
     podświetlony, choć palca dawno nie ma. */
  @media (hover: hover) {
    button:hover, select:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--chrome-2);
    }
    button.cichy:hover { background: var(--chrome-3); }
    /* czerwień znaczy „kasuję" — hover nie ma prawa jej zabrać */
    button.usun:hover, .kontekst button.usun:hover,
    .wybor-lista button.grozny:hover { color: var(--blad); border-color: var(--blad); }
    /* stan włączony (owies) zostaje włączony */
    button.on:hover, button.cichy.on:hover {
      background: var(--ok); border-color: var(--ok); color: var(--ok-ink);
    }
    .wybor-lista button:hover { background: var(--chrome-3); color: var(--accent); }
    .wybor-lista button.grozny:hover { background: var(--chrome-3); }
    .paleta button:hover { border-color: var(--accent); }
    .paleta button:hover .nazwa, .paleta button:hover .ikonka { color: var(--accent); }
    .okno button.wstaw:hover {
      background: var(--accent-jasny); border-color: var(--accent-jasny); color: var(--accent-ink);
    }
    button.mini.gwiazdka:hover { color: #E8C15C; border-color: #E8C15C; }
    button.chip:hover { border-color: var(--accent); color: var(--accent); }
  }
  button:active, select:active { transform: translateY(1px); }
  button:focus-visible, select:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  button.cichy { background: transparent; }

  /* stan włączony musi wygrać z .cichy — dlatego stoi po nim */
  button.on, button.cichy.on {
    background: var(--ok);
    border-color: var(--ok);
    color: var(--ok-ink);
    font-weight: 600;
  }
  button:disabled { opacity: 0.35; cursor: default; }

  button.ikona {
    padding: 0.42rem 0.6rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  button.ikona svg { display: block; }

  /* ---------- plac ---------- */

  main {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.9rem;
    background:
      radial-gradient(120% 100% at 50% 0%, #322619 0%, var(--chrome) 72%);
  }

  svg#plac {
    width: 100%;
    height: 100%;
    touch-action: none;
    display: block;
  }

  .elem { cursor: grab; }
  .elem:active { cursor: grabbing; }
  .elem.zaznaczony .zazn { display: block; }
  .zazn { display: none; }

  /* ---------- panel dolny ---------- */

  footer {
    flex: none;
    background: var(--chrome-2);
    border-top: 1px solid var(--line);
  }

  .pomiar {
    padding: 0.55rem 0.9rem;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 0.9rem;
    flex-wrap: wrap;
    min-height: 46px;
  }
  .pomiar .liczba {
    font-family: var(--f-num);
    font-size: 1.15rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .pomiar .opis { color: var(--ink-soft); font-size: 0.86rem; }
  .pomiar .werdykt {
    font-family: var(--f-num);
    font-size: 0.74rem;
    letter-spacing: 0.04em;
    padding: 0.22rem 0.55rem;
    border-radius: 6px;
  }
  /* Cztery stopnie, każdy innym kolorem — decyzja Luizy z 9 września.
     Owies: pasuje, nic nie trzeba robić. Patyna (drugi kolor marki): da się
     przejechać, ale trzeba pogonić albo wyhamować. Pomarańczowy: dystans
     niejednoznaczny. Czerwony: za blisko, czyli fizycznie się nie da — to jedyne
     miejsce poza „usuń", w którym czerwień jest na miejscu. */
  .werdykt.ok    { background: rgba(175,196,43,0.16); color: var(--ok); }
  .werdykt.blisko{ background: rgba(38,145,134,0.18); color: var(--accent); }
  .werdykt.zle   { background: rgba(222,154,60,0.18); color: var(--ostrzez); }
  .werdykt.stop  { background: rgba(215,94,76,0.18);  color: var(--blad); }
  .pomiar .konwencja { color: var(--ink-faint); font-size: 0.76rem; width: 100%; }

  .konie { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .konie .kon {
    display: flex; align-items: center; gap: 0.35rem;
    font-family: var(--f-num);
    font-size: 0.72rem;
    padding: 0.24rem 0.5rem;
    border-radius: 6px;
    border: 1px solid transparent;
  }
  .konie .kon.wybrany { border-color: var(--ink-faint); }
  .konie .kon .znak { font-size: 0.82rem; line-height: 1; }
  .kon.ok     { background: rgba(175,196,43,0.16); color: var(--ok); }
  .kon.blisko { background: rgba(38,145,134,0.18); color: var(--accent); }
  .kon.zle    { background: rgba(222,154,60,0.18); color: var(--ostrzez); }
  .kon.stop   { background: rgba(215,94,76,0.18);  color: var(--blad); }
  .pomiar.pusty .liczba { color: var(--ink-faint); font-weight: 400; font-size: 0.9rem; }

  .ostrzezenia {
    display: none;
    flex-direction: column;
    gap: 0.25rem;
    padding: 0.5rem 0.9rem;
    border-bottom: 1px solid var(--line);
    background: rgba(215,94,76,0.1);
  }
  .ostrzezenia.widoczne { display: flex; }
  .ostrzezenia .flaga {
    display: flex; align-items: center; gap: 0.5rem;
    font-size: 0.82rem; color: var(--blad);
    background: none; border: none; padding: 0; text-align: left;
    min-height: 0; cursor: pointer;
  }
  .ostrzezenia .flaga:hover { text-decoration: underline; }
  .ostrzezenia .flaga .znak { font-family: var(--f-num); flex: none; }

  .kontekst {
    display: none;
    align-items: center;
    gap: 0.45rem;
    padding: 0.5rem 0.9rem;
    border-bottom: 1px solid var(--line);
    background: var(--chrome-3);
    overflow-x: auto;
  }
  .kontekst.widoczny { display: flex; }
  .kontekst .co {
    font-family: var(--f-num);
    font-size: 0.68rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--accent);
    flex: none;
    margin-right: 0.3rem;
  }
  .kontekst button { flex: none; }
  .kontekst button.usun { color: var(--blad); }
  .kontekst button.glowny { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .kontekst button.glowny.on { color: var(--ok-ink); }
  .kontekst button.glowny:disabled { border-color: var(--line); color: var(--ink-faint); }
  .kontekst .pion { flex: none; width: 1px; align-self: stretch; background: var(--line); margin: 0 0.3rem; }
  .kontekst .co { margin-right: 0; }
  .kontekst input[type="number"] {
    font-family: var(--f-num); font-size: 0.85rem; color: var(--ink); text-align: center;
    background: var(--chrome-3); border: 1px solid var(--line);
    border-radius: 8px; padding: 0.3rem 0.4rem; min-height: 34px;
  }
  /* Podpis i pole to jedna rzecz — przy zawijaniu nie wolno ich rozerwać,
     bo „wys. cm" na końcu wiersza, a pole na początku następnego, nic nie znaczy. */
  .kontekst .para { display: inline-flex; align-items: center; gap: 0.3rem; flex: none; }
  /* Rzeczy, po które sięga się raz na kilka przejazdów. Na dużym ekranie stoją
     w pasku jak wszystko inne (display:contents udaje, że tej ramki nie ma),
     na telefonie chowają się pod „Więcej". */
  .kontekst .rzadko { display: contents; }
  /* Napis i strzałka muszą stać w jednej linii. Bez align-items strzałka rozciągała
     się na całą wysokość guzika i siadała nad tekstem — Luiza, 16 września:
     „strzałka za bardzo na górze, baton jakiś wykrzywiony". */
  .kontekst .wiecej {
    display: none;
    align-items: center; justify-content: center; gap: 0.34rem;
    white-space: nowrap; line-height: 1;
  }
  .kontekst .wiecej svg { flex: none; display: block; }
  /* Pasek na telefonie: 14 września miał 1165 px przy ekranie 390 px, więc połowa
     guzików była za krawędzią i nikt nie wiedział, że tam są. Teraz się zawija. */
  @media (max-width: 720px) {
    .kontekst {
      flex-wrap: wrap;
      overflow-x: visible;
      row-gap: 0.4rem;
      padding: 0.45rem 0.6rem;
    }
    .kontekst .pion { display: none; }
    .kontekst .co { flex: none; }
    .kontekst button { font-size: 0.82rem; padding-left: 0.6rem; padding-right: 0.6rem; }
    .kontekst .para input[type="number"] { width: 3.9rem !important; }
    .kontekst .rzadko { display: none; }
    .kontekst.rozwiniety .rzadko { display: flex; flex: 1 0 100%; flex-wrap: wrap; gap: 0.4rem; }
    .kontekst .wiecej { display: inline-flex; }
  }

  .paleta {
    display: flex;
    gap: 0.45rem;
    padding: 0.6rem 0.9rem 0.75rem;
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .paleta button {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.25rem;
    padding: 0.5rem 0.6rem;
    min-width: 62px;
  }
  .paleta button .ikonka { display: block; height: 20px; }
  .paleta button .nazwa { font-size: 0.66rem; letter-spacing: 0.02em; color: var(--ink-soft); }
  .paleta .rozdziel { flex: none; width: 1px; background: var(--line); margin: 0.2rem 0.35rem; }

  /* ---------- okno ---------- */

  .zaslona {
    position: fixed; inset: 0;
    background: rgba(18,13,9,0.86);
    display: none;
    /* okno trzyma się góry, a nie środka: na telefonie klawiatura zmienia wysokość
       ekranu i wyśrodkowane okno uciekało spod palca w trakcie dotknięcia */
    align-items: flex-start;
    justify-content: center;
    padding: clamp(1rem, 7vh, 4rem) 1.2rem 1.2rem;
    z-index: 50;
  }
  .zaslona.widoczna { display: flex; }
  .okno {
    background: var(--chrome-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.1rem;
    max-width: min(94vw, 900px);
    max-height: 92vh;
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
  }
  .okno.waskie { max-width: min(94vw, 460px); }
  /* okno z odległościami ma szeroką treść: legenda i wiersze z chipami łamały się
     na wąskim, przez co robiła się z tego ściana. Szerokość zdejmuje połowę wierszy. */
  .okno.szerokie { max-width: min(94vw, 720px); }
  .okno h2 { font-size: 1.05rem; margin: 0; font-weight: 600; }

  .wiersz {
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.7rem; padding: 0.4rem 0;
  }
  .wiersz + .wiersz { border-top: 1px solid var(--line); }
  /* na wąskim ekranie ściskało się to, co ma stałą szerokość: pole z liczbą robiło
     się węższe od pozostałych, a „w schemacie: 0" łamało się na trzy linijki */
  .wiersz .etykieta { font-size: 0.9rem; flex: 1 1 auto; min-width: 0; }
  .wiersz .drobne {
    color: var(--ink-faint); font-size: 0.76rem; font-family: var(--f-num);
    flex: 0 0 auto; white-space: nowrap;
  }
  .wiersz input[type="number"] { width: 5rem; flex: 0 0 5rem; text-align: center; }
  .wiersz input[type="text"] {
    flex: 1; min-width: 6rem;
    font-family: var(--f-ui); font-size: 0.85rem; color: var(--ink);

  .wiersz.przyklad { align-items: center; gap: 0.6rem; }

  .mini-obudowa { flex: none; display: flex; }
  .miniatura { display: block; border-radius: 3px; }

  .znaki { display: flex; flex-wrap: wrap; gap: 0.3rem; margin: 0.22rem 0; }
  .wiersz.przyklad .etykieta .drobne { display: block; }
  .znak {
    font-family: var(--f-num); font-size: 0.66rem;
    text-transform: uppercase; letter-spacing: 0.05em;
    padding: 0.08rem 0.4rem; border-radius: 999px;
    border: 1px solid currentColor; opacity: 0.9;
  }
  .znak.chod-step  { color: #7FB3D5; }
  .znak.chod-klus  { color: var(--accent); }
  .znak.chod-galop { color: #C98BD1; }
  .znak.chod-inny  { color: var(--ink-soft); }
  .znak.rodzaj-naziemne { color: var(--ink-soft); }
  .znak.rodzaj-skoki    { color: #E8A05C; }

  button.mini.gwiazdka {
    flex: none; min-width: 34px; padding: 0.3rem 0.45rem;
    font-size: 1rem; line-height: 1; color: var(--ink-faint);
  }
  button.mini.gwiazdka.on { color: #E8C15C; border-color: #E8C15C; }
  /* To jest JEDNA rzecz, którą się w tym oknie robi — więc wygląda jak guzik,
     a nie jak ramka. Wypełniona patyna, nasz kolor marki. */
  .okno a.wstaw {
    display: block; text-align: center; text-decoration: none;
    font-family: var(--f-ui); border: 1px solid var(--line); border-radius: 8px;
    padding: 0.42rem 0.7rem; cursor: pointer;
  }
  .okno button.wstaw, .okno a.wstaw {
    width: 100%; min-height: 44px; margin-top: 0.5rem;
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
    font-weight: 700; font-size: 0.95rem; letter-spacing: 0.01em;
  }

  .paleta button.moja { border-color: var(--accent); }
  .paleta button.moja .nazwa { color: var(--ink); max-width: 6.5rem; overflow: hidden; text-overflow: ellipsis; }
  .paleta button .licznik {
    font-family: var(--f-num);
    font-size: 0.6rem;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
  }
  .paleta button.brakuje { border-color: var(--blad); }
  .paleta button.brakuje .licznik { color: var(--blad); }
  .okno p { margin: 0; color: var(--ink-soft); font-size: 0.87rem; max-width: 58ch; }
  .okno img { max-width: 100%; border-radius: 8px; display: block; }

  .trasa {
    position: absolute;
    left: 0.6rem;
    top: 0.6rem;
    z-index: 5;
    background: rgba(47,37,28,0.9);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.32rem 0.6rem;
    min-height: 0;
    font-family: var(--f-num);
    font-size: 0.8rem;
    color: var(--ink);
    cursor: pointer;
  }
  .trasa:hover { border-color: var(--accent); }
  .trasa .co { color: var(--ink-faint); margin-right: 0.35rem; font-family: var(--f-ui); }
  .trasa .ile {
    color: var(--accent); margin-left: 0.55rem; font-family: var(--f-ui);
    font-weight: 600; padding-left: 0.55rem; border-left: 1px solid var(--line);
  }

  /* Odległości widoczne bez otwierania czegokolwiek — pasek pod placem.
     Dotknięcie otwiera pełną listę z werdyktami rozpisanymi słowami. */
  .pasek-odl {
    flex: none;
    display: flex;
    gap: 0.4rem;
    overflow-x: auto;
    padding: 0.4rem 0.6rem;
    background: var(--chrome-2);
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    /* delikatne wygaszenie przy prawej krawędzi zamiast paska przewijania */
    -webkit-mask-image: linear-gradient(to right, #000 94%, transparent 100%);
    mask-image: linear-gradient(to right, #000 94%, transparent 100%);
  }
  .pasek-odl::-webkit-scrollbar { display: none; }
  .pasek-odl .kafelek {
    flex: none;
    display: flex; flex-direction: column; gap: 0.12rem;
    padding: 0.28rem 0.5rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--chrome-3);
  }
  .pasek-odl .gora {
    font-family: var(--f-num); font-size: 0.78rem; color: var(--ink); white-space: nowrap;
  }
  .pasek-odl .gora .para { color: var(--ink-faint); margin-right: 0.3rem; }
  .pasek-odl .dol { display: flex; gap: 0.35rem; }
  .pasek-odl .kon { font-size: 0.68rem; white-space: nowrap; color: var(--ink-faint); }
  .pasek-odl .kon.ok { color: var(--ok); }
  .pasek-odl .kon.blisko { color: var(--accent); }
  .pasek-odl .kon.zle { color: var(--ostrzez); }
  .pasek-odl .kon.stop { color: var(--blad); }
  .pasek-odl .filtr {
    flex: none; align-self: center;
    padding: 0.3rem 0.55rem; border-radius: 8px;
    border: 1px solid var(--line); background: var(--chrome-3);
    color: var(--ink-soft); font-size: 0.72rem; white-space: nowrap;
  }
  .pasek-odl .filtr.on { border-color: var(--ostrzez); color: var(--ostrzez); }
  .pasek-odl .kafelek { cursor: pointer; }
  .pasek-odl .kafelek:hover { border-color: var(--accent); }

  /* Hierarchia: dane przejazdu na wierzchu, materiał pomocniczy w tle.
     Podstawa wyliczenia i legenda siedzą w jednym cichym panelu, mniejszym
     i bez kontrastu — czyta się je raz, a odległości ogląda za każdym razem. */
  /* Podstawa wyliczenia i oznaczenia w jednym cichym panelu — czyta się je raz,
     więc nie konkurują z danymi, ale są od razu widoczne. Okno jest szerokie,
     żeby te wiersze nie łamały się po trzy razy. */
  .odl-panel {
    background: var(--chrome-3); border: 1px solid var(--line); border-radius: 10px;
    padding: 0.8rem 0.9rem; margin: 0 0 1rem;
  }
  .odl-wstep { color: var(--ink-soft); font-size: 0.8rem; margin: 0; line-height: 1.55; }
  .odl-fule { margin: 0.4rem 0 0; font-family: var(--f-num); font-size: 0.8rem;
              color: var(--ink); line-height: 1.6; }
  .odl-tempo { color: var(--ink-faint); font-size: 0.76rem; margin: 0.45rem 0 0; line-height: 1.55; }
  .odl-kreska { height: 1px; background: var(--line); margin: 0.75rem 0; }
  .odl-panel .zmien {
    font-size: 0.76rem; color: var(--accent);
    background: none; border: none; padding: 0; cursor: pointer;
    text-decoration: underline; text-underline-offset: 0.15em;
  }
  /* rachunek pod odległością — ten sam, który instruktorka robi w głowie */
  .lista-odl .rachunek {
    /* .okno p ma max-width 58ch — rachunek ma się zmieścić w jednej linijce */
    flex: 1 0 100%; width: 100%; max-width: none; margin: 0.1rem 0 0;
    font-family: var(--f-num); font-size: 0.72rem; color: var(--ink-faint);
    line-height: 1.55;
  }
  .odl-naglowek { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.09em;
                  color: var(--ink-faint); font-family: var(--f-num); margin: 0 0 0.5rem; }
  .odl-tytul { font-size: 0.95rem; font-weight: 600; color: var(--ink); margin: 0 0 0.5rem; }
  .odl-legenda { font-size: 0.8rem; line-height: 1.6; color: var(--ink-soft); margin: 0; }
  /* własna klasa, bo globalne .znak to pastylka z obwódką z listy przykładów */
  .odl-legenda .zn { font-family: var(--f-num); font-weight: 700; }
  .odl-legenda div + div { margin-top: 0.45rem; }
  /* Przykład wiersza — pokazuje, jak się go czyta, zamiast to opisywać. */
  .odl-przyklad {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem;
    margin: 0.45rem 0 0.55rem; padding: 0.4rem 0.55rem;
    background: var(--chrome-3); border-radius: 10px;
  }
  .odl-przyklad .wiersz-przyk {
    flex: 1 0 100%; display: flex; gap: 0.5rem; align-items: baseline;
    font-family: var(--f-num); margin-bottom: 0.15rem;
  }
  .odl-przyklad .wiersz-przyk .para { color: var(--accent); font-weight: 700; }
  .odl-przyklad .wiersz-przyk .ile-m { color: var(--ink); }
  /* „Jak to liczymy?" — schowane pod znakiem zapytania, otwiera się dotknięciem */
  .odl-jak { margin-top: 0.7rem; }
  .odl-jak .jak-guzik {
    display: inline-flex; align-items: center; gap: 0.4rem;
    background: transparent; border: none; padding: 0.2rem 0;
    color: var(--accent); font-size: 0.82rem; font-weight: 600; min-height: 32px;
  }
  .odl-jak .znak-pytania {
    flex: none; width: 1.15rem; height: 1.15rem; border-radius: 50%;
    border: 1.5px solid var(--accent); display: inline-flex;
    align-items: center; justify-content: center;
    font-family: var(--f-num); font-size: 0.72rem; line-height: 1;
  }
  .odl-jak .jak-tresc { font-size: 0.8rem; line-height: 1.6; color: var(--ink-soft); }
  .odl-jak .jak-tresc p { margin: 0.4rem 0 0; max-width: none; }
  .odl-jak .jak-tresc .drobne { color: var(--ink-faint); font-size: 0.74rem; }
  /* na telefonie okna nie da się poszerzyć, więc panel schodzi o stopień */
  @media (max-width: 560px) {
    .odl-panel { padding: 0.65rem 0.7rem; }
    .odl-wstep, .odl-fule, .odl-legenda { font-size: 0.74rem; }
    .odl-tempo { font-size: 0.71rem; }
    .lista-odl .rachunek { font-size: 0.68rem; }
    .odl-legenda { line-height: 1.5; }
    .odl-legenda div + div { margin-top: 0.35rem; }
    .odl-kreska { margin: 0.6rem 0; }
  }
  .odl-popraw { display: flex; gap: 0.3rem; flex-wrap: wrap; align-items: center;
                width: 100%; margin-top: 0.3rem; }
  .odl-popraw .co { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em;
                    color: var(--ink-faint); font-family: var(--f-num); }

  .lista-odl { display: flex; flex-direction: column; gap: 0.15rem; }
  .lista-odl .rzad {
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    padding: 0.4rem 0.1rem; border-bottom: 1px solid var(--line);
  }
  .lista-odl .chipy { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-left: auto; }
  .lista-odl .rzad:last-child { border-bottom: none; }
  .lista-odl .rzad { padding: 0.62rem 0.1rem; }
  .lista-odl .para {
    font-family: var(--f-num); font-size: 0.72rem; color: var(--ink-faint);
    text-transform: uppercase; letter-spacing: 0.05em; flex: none;
  }
  .lista-odl .ile-m {
    font-family: var(--f-num); font-size: 1.02rem; font-weight: 600;
    color: var(--ink); white-space: nowrap;
  }
  .lista-odl .kon {
    font-size: 0.76rem; padding: 0.1rem 0.4rem; border-radius: 6px;
    border: 1px solid var(--line); white-space: nowrap;
  }
  .lista-odl .kon.ok { color: var(--ok); border-color: var(--ok); }
  .lista-odl .kon.blisko { color: var(--accent); border-color: var(--accent); }
  .lista-odl .kon.zle { color: var(--ostrzez); border-color: var(--ostrzez); }
  .lista-odl .kon.stop { color: var(--blad); border-color: var(--blad); }

  .pomiar .skad {
    color: var(--ink-faint);
    font-size: 0.72rem;
    text-transform: lowercase;
    letter-spacing: 0.02em;
  }

  .lupa {
    position: absolute;
    right: 0.6rem;
    top: 0.6rem;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    z-index: 5;
  }
  .lupa button {
    background: rgba(47,37,28,0.9);
    border-color: var(--line);
    min-height: 34px;
    padding: 0.3rem 0.45rem;
  }

  .podpowiedz {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, rgba(36,28,22,0.97) 60%, rgba(36,28,22,0));
    border-top: 1px solid var(--line);
    color: var(--ink-soft);
    font-size: 0.78rem;
    line-height: 1.35;
    padding: 0.5rem 0.9rem;
    pointer-events: none;
    text-align: center;
    opacity: 0;
    transition: opacity 0.18s ease;
  }

  @media (max-width: 760px) {
    header { gap: 0.3rem; padding: 0.4rem 0.5rem; }
    .marka { font-size: 0.95rem; margin-right: 0; }
    header .wybor > button { font-size: 0.76rem; padding: 0.34rem 0.5rem; gap: 0.4rem; min-height: 36px; }
    header button.ikona { min-height: 36px; padding: 0.34rem 0.45rem; }
    main { padding: 0.35rem; }
    .pomiar { padding: 0.45rem 0.6rem; gap: 0.45rem; }
    .paleta { padding: 0.45rem 0.6rem 0.55rem; gap: 0.35rem; }
    .paleta button { min-width: 56px; padding: 0.42rem 0.45rem; }
  }

  /* na wąskim ekranie ustępuje nazwa aplikacji, nigdy wybór placu i konia */
  @media (max-width: 400px) {
    .marka { display: none; }
  }

  @media (max-width: 360px) {
    header { gap: 0.25rem; padding: 0.4rem; }
    header .wybor > button { font-size: 0.72rem; padding: 0.3rem 0.45rem; gap: 0.3rem; }
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(function () {
  "use strict";

  // ====================== dane jeździeckie ======================

  // Długość fuli i zapas na lądowanie + odbicie (w metrach).
  const KONIE = {
    duzy: { nazwa: "koń duży", grupa: "Konie duże", dop: "dużego konia", wzrost: "powyżej 156 cm", fula: 3.66, zapas: 3.6 },
    maly: { nazwa: "koń mały", grupa: "Konie małe", dop: "małego konia", wzrost: "149–156 cm",     fula: 3.35, zapas: 3.3 },
    kuc:  { nazwa: "kuc",      grupa: "Kuce",       dop: "kuca",         wzrost: "do 148 cm",      fula: 2.98, zapas: 3.0 }
  };

  // Rozstaw drągów na ziemi — od środka do środka drąga.
  const DRAGI = {
    duzy:    { step: [0.80, 0.90], klus: [1.30, 1.40], galop: [3.00, 3.25] },
    maly:    { step: [0.75, 0.85], klus: [1.20, 1.30], galop: [2.80, 3.00] },
    kuc:  { step: [0.55, 0.80], klus: [0.95, 1.20], galop: [2.40, 2.80] }
  };

  // Ile koń potrzebuje na LĄDOWANIE po pierwszej przeszkodzie i ODBICIE przed drugą.
  // Nasze 3,60 / 3,30 / 3,00 to wartości orientacyjne — Luiza: „to wszystko zależy
  // od konia, od temperamentu, od tego jaki ma wykrok". Kto zna swojego konia,
  // wpisuje swoją liczbę w ustawieniach i cała aplikacja liczy z niej.
  function zapasKonia(k) {
    const z = stan.zapasy && stan.zapasy[k];
    return (typeof z === "number" && z > 0) ? z : KONIE[k].zapas;
  }
  function zapasWlasny(k) {
    const z = stan.zapasy && stan.zapasy[k];
    return (typeof z === "number" && z > 0 && Math.abs(z - KONIE[k].zapas) > 0.005);
  }

  // Na jednym treningu rzadko stoją same konie tej samej wielkości.
  const KOLEJNOSC_GRUP = ["duzy", "maly", "kuc"];
  const GRUPA_KROTKO = { duzy: "duże", maly: "małe", kuc: "kuce" };
  // Tak to nazywa Luiza w tekście, który podyktowała 17 września.
  const NAZWA_GRUPY = { duzy: "duży koń", maly: "mały koń", kuc: "kuc" };

  // Wybrane grupy, zawsze od największej. stan.kon zostaje tą największą.
  function grupy() {
    const g = Array.isArray(stan.grupy) && stan.grupy.length ? stan.grupy : [stan.kon];
    const czyste = KOLEJNOSC_GRUP.filter((k) => g.indexOf(k) >= 0);
    return czyste.length ? czyste : ["duzy"];
  }
  function opisGrup() {
    const g = grupy();
    return g.length === 1 ? KONIE[g[0]].nazwa : g.map((k) => GRUPA_KROTKO[k]).join(" + ");
  }
  function ustawGrupy(lista) {
    const g = KOLEJNOSC_GRUP.filter((k) => lista.indexOf(k) >= 0);
    stan.grupy = g.length ? g : ["duzy"];
    stan.kon = stan.grupy[0];
    ustawEtykieteGrup();
    zapiszLokalnie(); rysuj(); odswiezPomiar(); odswiezKontekst(); odswiezOstrzezenia();
  }
  function ustawEtykieteGrup() {
    const g = grupy();
    const sel = $("kon");
    if (g.length === 1) sel.value = g[0];
    else {
      const opcja = sel.querySelector('option[value="mieszana"]');
      if (opcja) opcja.textContent = "Mieszana · " + g.map((k) => GRUPA_KROTKO[k]).join(" + ");
      sel.value = "mieszana";
    }
    sel.dispatchEvent(new Event("zmiana-etykiety"));
  }

  // Głębokość przeszkody wzdłuż kierunku jazdy — do pomiaru "od tyłu do podstawy".
  const GLEBOKOSC = { stacjonata: 0.30, okser: 1.10, kawaletka: 0.30 };

  // ile drągów zjada dana przeszkoda — potrzebne do inwentarza
  const DRAGI_W = { drag: 1, kawaletka: 1, stacjonata: 1, okser: 2 };

  const TYPY = {
    drag:       { nazwa: "Drąg",       dlugosc: 3.0, naziemny: true },
    kawaletka:  { nazwa: "Kawaletka",  dlugosc: 3.0, naziemny: true },
    stacjonata: { nazwa: "Stacjonata", dlugosc: 3.0, naziemny: false },
    okser:      { nazwa: "Okser",      dlugosc: 3.0, naziemny: false },
    pacholek:   { nazwa: "Pachołek",   naziemny: true },
    opona:      { nazwa: "Opona",      naziemny: true },
    litera:     { nazwa: "Litera",     naziemny: true },
    zatrzymanie:{ nazwa: "Zatrzymanie", naziemny: true },
    // Start jest osobnym elementem placu, tak jak u konkurencji: stawiasz go,
    // obracasz w stronę jazdy i od niego biegnie przejazd. Nie jest przeszkodą —
    // nie dostaje numeru i nie liczy się do odległości.
    start:      { nazwa: "Start",      naziemny: true },
    inny:       { nazwa: "Inny",       naziemny: true }
  };

  // Litery ujeżdżeniowe — odległości od rogu wzdłuż długiego boku.
  const LITERY = {
    40: [[6,"K","F"], [20,"E","B"], [34,"H","M"]],
    60: [[6,"K","F"], [18,"V","P"], [30,"E","B"], [42,"S","R"], [54,"H","M"]]
  };

  // ====================== stan ======================

  let stan = {
    dl: 40, sz: 20, kon: "duzy", pion: null,
    elementy: [], tor: [], nast: 1
  };
  let przyciaganie = true;
  let ostryNarożnik = false;   // jak rysować kolejno stawiane punkty toru
  let nowyOdcinek = false;     // następny punkt zaczyna nowy, osobny odcinek toru
  let podzialka = false;       // linijka wokół placu — pomoc rysunkowa, nie element placu
  let historia = [];
  let zaznaczony = null;
  let trybMiarka = false;
  // Rysowanie toru ręką wypadło 14 września razem z całą klasą błędów, które z niego
  // wynikały. Zmienna zostaje wyłączona na stałe, żeby nie przepisywać przy okazji
  // kilkudziesięciu miejsc, które o nią pytają — te gałęzie są teraz nieosiągalne.
  const trybTor = false;
  // Start nie ma sensu na środku placu — tam zwykle już coś stoi i nowy element
  // ląduje na cudzej głowie. Zamiast tego czekamy, aż człowiek pokaże palcem,
  // gdzie zaczyna przejazd.
  let czekaNaPostawienie = null;
  // Numerowanie ręką: dotykasz po kolei tego, co koń robi. Numer siada na
  // przeszkodzie (e.nr) albo na figurze (pierwszy punkt: figNr) — wolta, pachołek
  // i zatrzymanie liczą się tak samo, bo na Hubertusie to są kolejne zadania.
  // Kafelek „Trasa" wypadł 15 września: przejazd układa się dziś ciągnięciem od
  // kropki do kropki, więc osobny tryb do dotykania po kolei nie miał już czego
  // robić. Zmienna zostaje wyłączona na stałe — gałęzie, które o nią pytają, są
  // nieosiągalne i pójdą razem z resztą reliktów.
  const trybNumerowania = false;
  let miarkaA = null, miarkaB = null;

  const $ = (id) => document.getElementById(id);
  const svg = $("plac");

  function klon(s) { return JSON.parse(JSON.stringify(s)); }
  function zapiszHistorie() { historia.push(klon(stan)); if (historia.length > 60) historia.shift(); }

  // Nazwa aplikacji zmieniła się z „Dosiad" na „Koniownik". Zapisy spod starych
  // kluczy przepisujemy przy pierwszym czytaniu, żeby plac, sprzęt, schematy
  // i ulubione nie zniknęły z telefonu. Do usunięcia dopiero wtedy, gdy będziemy
  // pewni, że nikt nie ma już starych zapisów w przeglądarce.
  function czytajKlucz(pelny) {
    try {
      const nowy = localStorage.getItem(pelny);
      if (nowy !== null) return nowy;
      const stary = localStorage.getItem(pelny.replace(/^koniownik-/, "dosiad-"));
      if (stary !== null) {
        try { localStorage.setItem(pelny, stary); } catch (e) {}
        return stary;
      }
    } catch (e) {}
    return null;
  }

  function zapiszLokalnie() {
    try { localStorage.setItem("koniownik-plac", JSON.stringify(stan)); } catch (e) {}
  }
  function wczytajLokalnie() {
    try {
      const s = czytajKlucz("koniownik-plac");
      if (!s) return false;
      const w = JSON.parse(s);
      if (w && Array.isArray(w.elementy)) {
        stan = w;
        stan.tor = stan.tor || [];
        // starsze zapisy miały kuca dużego i małego osobno — dziś to jedna grupa
        if (stan.kon === "kucDuzy" || stan.kon === "kucMaly") stan.kon = "kuc";
        if (!KONIE[stan.kon]) stan.kon = "duzy";
        if (Array.isArray(stan.grupy)) {
          stan.grupy = stan.grupy.map((k) => (k === "kucDuzy" || k === "kucMaly" ? "kuc" : k))
                                 .filter((k, i, a) => KONIE[k] && a.indexOf(k) === i);
        }
        if (!Array.isArray(stan.grupy) || !stan.grupy.length) stan.grupy = [stan.kon];
        // „pozaTrasa" to relikt po odręcznym torze: znaczyło „nie przyklejaj się
        // do narysowanej linii". W modelu z kolejnością o byciu w przejeździe mówi
        // numer, a ta druga, niewidoczna flaga tylko chowała kropki wpięcia —
        // i schemat robił się nie do naprawienia. Zdejmujemy ją razem z numerem.
        let leczone = stan.elementy.some((e) => e.pozaTrasa || e.ostryTor);
        stan.elementy.forEach((e) => { if (e.pozaTrasa) { delete e.pozaTrasa; delete e.nr; } });
        // „Łuk albo kąt" był ustawiany osobno na każdej przeszkodzie i schemat
        // wychodził pomieszany — Luiza: „skoro zaznaczone łuki, niech łuki będą
        // wszędzie". Od 15 września to jedno ustawienie całej trasy.
        if (stan.elementy.some((e) => e.ostryTor)) stan.ostreKaty = true;
        stan.elementy.forEach((e) => delete e.ostryTor);
        // Drugie przejście mieszkało przez dzień w `nr2`/`we2`; teraz przejść może
        // być więcej, więc wszystkie poza pierwszym siedzą w `powroty`.
        // Start bywał wpięty samym swoim istnieniem. W starych zapisach zachowujemy
        // to, co widać dziś: jeśli coś ma numer, start zostaje wpięty.
        const byłyNumery = stan.elementy.some((e) => e.nr);
        stan.elementy.forEach((e) => {
          if (e.typ === "start" && byłyNumery && e.wpiety === undefined) { e.wpiety = true; leczone = true; }
        });
        if (stan.elementy.some((e) => e.nr2)) leczone = true;
        stan.elementy.forEach((e) => {
          if (!e.nr2) { delete e.we2; return; }
          e.powroty = (e.powroty || []).concat([{ nr: e.nr2, we: e.we2 }]);
          delete e.nr2; delete e.we2;
        });
        // Wyleczony schemat od razu zapisujemy — inaczej stara flaga wracałaby
        // przy każdym otwarciu, aż do pierwszej zmiany na placu.
        if (leczone) zapiszLokalnie();
        sprzatnijWiazania();
        // schemat zapisany starszą wersją mógł mieć sprzęt zachodzący na bandę —
        // wsuwamy go na piasek od razu, żeby zasada obowiązywała też to, co już stoi
        wsunElementy();
        return true;
      }
    } catch (e) {}
    return false;
  }

  // ====================== rysowanie ======================

  const NS = "http://www.w3.org/2000/svg";
  function el(nazwa, atrybuty, rodzic) {
    const n = document.createElementNS(NS, nazwa);
    for (const k in atrybuty) if (atrybuty[k] !== undefined) n.setAttribute(k, atrybuty[k]);
    if (rodzic) rodzic.appendChild(n);
    return n;
  }

  // TURKUSOWA PLAKIETKA Z NUMEREM. Luiza, 22 września: „tło musi być responsywne
  // względem tekstu — tekst nie może wychodzić poza tło". Więc szerokość bierze
  // się ze ZMIERZONEJ szerokości napisu plus luz z obu stron, a nie ze stałej.
  // Wysokość zostaje stała. „1" siedzi w kółku, „10" w krótkiej pigułce,
  // „1·2·3·4" w długiej — i zawsze z marginesem.
  const PLAKIETKA_LUZ = 0.34;        // luz z lewej i z prawej, w metrach
  function szerPlakietki(napis, czcionka, wezel) {
    let w = 0;
    if (wezel) { try { w = wezel.getComputedTextLength() || 0; } catch (err) { w = 0; } }
    // Zanim wczyta się krój, pomiar bywa za mały — bierzemy większą z dwóch liczb.
    w = Math.max(w, String(napis).length * czcionka * 0.56);
    const wys = czcionka * 1.59;
    return Math.max(wys, w + PLAKIETKA_LUZ * 2);
  }
  // Sama szerokość, bez rysowania — do policzenia, jak daleko odsunąć plakietkę.
  function szerPlakietkiZGrubsza(napis, czcionka) {
    return szerPlakietki(napis, czcionka, null);
  }
  function plakietkaNumeru(napis, x, y, czcionka, rodzic) {
    const tekst = String(napis);
    const wys = czcionka * 1.59;
    const g2 = el("g", { class: "plakietka-numeru",
      transform: `translate(${okr(x)} ${okr(y)})` + (stan.pion ? " rotate(-90)" : "") }, rodzic);
    const tn = el("text", { x: 0, y: 0, "text-anchor": "middle", dy: "0.34em",
                 "font-size": czcionka, "font-family": "Bricolage Grotesque, sans-serif",
                 "font-weight": 700, fill: "#FFFFFF" }, g2);
    tn.textContent = tekst;
    const szer = szerPlakietki(tekst, czcionka, tn);
    const tlo = el("rect", { x: okr(-szer / 2), y: okr(-wys / 2), width: okr(szer),
                   height: okr(wys), rx: okr(wys / 2), fill: "var(--tor)" });
    g2.insertBefore(tlo, tn);
    return szer;
  }

  let MARGINES = 1.1; // metry wokół placu, na cyfry i cień

  let scena = null;
  let widok = { k: 1, dx: 0, dy: 0 };

  function rysuj() {
    svg.textContent = "";
    MARGINES = stan.litery ? (podzialka ? 3.6 : 2.45) : (podzialka ? 2.7 : 1.1);
    if (stan.litery === undefined) stan.litery = true;
    if (stan.kon === "kucDuzy" || stan.kon === "kucMaly") stan.kon = "kuc";
    if (!KONIE[stan.kon]) stan.kon = "duzy";
    const L = stan.dl, W = stan.sz;
    const widokG = el("g", { id: "widok",
      transform: `translate(${widok.dx} ${widok.dy}) scale(${widok.k})` }, svg);
    if (stan.pion) {
      svg.setAttribute("viewBox", `${-MARGINES} ${-MARGINES} ${W + 2*MARGINES} ${L + 2*MARGINES}`);
      scena = el("g", { transform: `translate(${W} 0) rotate(90)` }, widokG);
    } else {
      svg.setAttribute("viewBox", `${-MARGINES} ${-MARGINES} ${L + 2*MARGINES} ${W + 2*MARGINES}`);
      scena = el("g", {}, widokG);
    }

    // podłoże
    el("rect", { x: 0, y: 0, width: L, height: W, rx: 0.3,
                 fill: "var(--piasek)", stroke: "var(--banda)", "stroke-width": 0.28 }, scena);

    // faktura piasku — delikatne pasy
    const pasy = el("g", { opacity: 0.35 }, scena);
    for (let x = 2; x < L; x += 2) {
      el("line", { x1: x, y1: 0.15, x2: x, y2: W - 0.15,
                   stroke: "var(--piasek-2)", "stroke-width": 0.06 }, pasy);
    }

    // linia środkowa
    el("line", { x1: 0, y1: W/2, x2: L, y2: W/2,
                 stroke: "var(--piasek-2)", "stroke-width": 0.07,
                 "stroke-dasharray": "1 1", opacity: 0.8 }, scena);

    // podziałka co 5 m — pomoc rysunkowa, domyślnie wyłączona
    const skala = el("g", {}, scena);
    // gdy litery są włączone, liczby linijki idą za nie — inaczej „20" siada na literze E
    const yLinijki = stan.litery ? (stan.pion ? -2.75 : -2.5) : (stan.pion ? -0.95 : -0.6);
    for (let x = 5; podzialka && x < L; x += 5) {
      const t = el("text", { x: x, y: yLinijki, "text-anchor": "middle",
                   "font-family": "IBM Plex Mono, monospace", "font-size": 0.85,
                   fill: "var(--ink-faint)" }, skala);
      t.textContent = x;
      if (stan.pion) t.setAttribute("transform", `rotate(-90 ${x} ${yLinijki})`);
      el("line", { x1: x, y1: -0.2, x2: x, y2: 0.25,
                   stroke: "var(--ink-faint)", "stroke-width": 0.05 }, skala);
    }

    // litery ujeżdżeniowe — należą do placu, nie da się ich przesunąć ani zgubić
    if (stan.litery) {
      const uklad = LITERY[stan.dl];
      if (uklad) {
        const rysujLitere = (x, y, znak) => {
          // „dominant-baseline: central" bywa na telefonie ignorowane i napis wyjeżdża
          // w górę; renderer SVG w <img>, czyli w zapisywanym obrazku, jest jeszcze
          // surowszy. 0,34 em w dół liczy się wszędzie tak samo.
          const t = el("text", { x: x, y: y, "text-anchor": "middle",
                       dy: "0.34em", "font-size": 1.1,
                       "font-family": "Bricolage Grotesque, sans-serif", "font-weight": 700,
                       fill: "var(--ink-soft)" }, scena);
          t.textContent = znak;
          if (stan.pion) t.setAttribute("transform", `rotate(-90 ${x} ${y})`);
        };
        rysujLitere(-1.15, W / 2, "A");
        rysujLitere(L + 1.15, W / 2, "C");
        uklad.forEach(([odl, gora, dol]) => {
          rysujLitere(odl, -1.15, gora);
          rysujLitere(odl, W + 1.15, dol);
        });
      }
    }

    // ---- figury: kształty na placu, rysowane niezależnie od przejazdu ----
    const sciezki = [];
    const wTrasie = figuryWTrasie();
    const linia = (d, zazn, mocna) => sciezki.push(el("path", { class: "tor", d: d, fill: "none",
                   // zaznaczona linia rozjaśnia się do czystej patyny — ta sama
                   // kreska, inny odcień; grubość zostaje, bo skacząca kreska myliła
                   stroke: zazn ? "var(--accent)" : "var(--tor)",
                   "stroke-width": 0.13, "stroke-linecap": "round",
                   "stroke-linejoin": "round", "stroke-dasharray": "0.85 0.5",
                   opacity: zazn ? 1 : (mocna ? 0.9 : 0.45) }, scena));

    odcinkiToru(stan.tor).forEach((grupa) => {
      if (grupa.length < 2) return;
      // figura, przez którą prowadzi przejazd, jest rysowana razem z nim —
      // tutaj rysujemy tylko te, które stoją na placu poza kolejnością
      if (grupa[0].figId && wTrasie.has(grupa[0].figId)) return;
      const zazn = zaznaczonaFigura && grupa.some((t) => t.figId === zaznaczonaFigura);
      linia(sciezkaToru(grupa), zazn, false);
    });

    // ---- przejazd: linia wyliczona z kolejności, nie rysowana ręką ----
    const przejazd = torPrzejazdu();
    const kierunki = new Map();
    if (przejazd.length > 1) {
      linia(sciezkaToru(przejazd), false, true);

      // Z której strony koń przez to jedzie — bez tego schemat nie mówi, w którą
      // stronę się skacze, a to jest połowa informacji o przejeździe.
      // Pachołek nie dostaje strzałki (nie skacze się go), ale numer ma usiąść
      // po DRUGIEJ stronie niż linia — inaczej plakietka leży na trasie.
      // Liczy się PIERWSZE przejście: przy powrocie punktów jest kilka, a numer
      // ma jedno miejsce.
      przejazd.forEach((q) => {
        // Przy okrążaniu punktów jest trzy; o tym, gdzie leży LINIA względem
        // pachołka, mówi tylko ten boczny — on jeden niesie styczną.
        if (!q.omija || !q.bok || kierunki.has(q.omija)) return;
        kierunki.set(q.omija, { omija: true, x: q.x, y: q.y });
      });
      przejazd.forEach((q, i) => {
        if (!q.el) return;
        // Start rysuje własną strzałkę — druga, od przejazdu, robiła z niego
        // dziwaczny podwójny grot. Jedna strzałka, ta z kafelka.
        const e = znajdz(q.el);
        if (e && e.typ === "start") return;
        const a = przejazd[i - 1] || q, b = przejazd[i + 1] || q;
        kierunki.set(q.el, { kat: Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI,
                             przed: q.przed, za: q.za });
      });

      // Zastępczy znacznik startu — TYLKO gdy na placu nie stoi prawdziwy Start.
      // Dwa starty na jednym placu to gotowa pomyłka.
      if (!punktStartu()) {
        const p0 = przejazd[0], p1 = przejazd[1];
        const kat = Math.atan2(p1.y - p0.y, p1.x - p0.x);
        const gs = el("g", { transform: `translate(${okr(p0.x)} ${okr(p0.y)}) rotate(${okr(kat * 180 / Math.PI)})` }, scena);
        el("circle", { cx: -1.5, cy: 0, r: 0.32, fill: "var(--tor)", opacity: 0.55 }, gs);
        el("path", { d: "M -1.5 0 L -0.35 0", stroke: "var(--tor)", "stroke-width": 0.16,
                     "stroke-linecap": "round", opacity: 0.55 }, gs);
        el("path", { d: "M -0.75 -0.42 L -0.2 0 L -0.75 0.42", fill: "none", stroke: "var(--tor)",
                     "stroke-width": 0.16, "stroke-linecap": "round", "stroke-linejoin": "round",
                     opacity: 0.55 }, gs);
      }
    }
    // Krzyżyk na środku każdego odcinka — nożyczki do trasy. Luiza, 17 września:
    // „żeby obok tego kółka ustawić też małe iks, żeby można było tę trasę usunąć
    // pomiędzy na przykład drągami". Przecięcie nie kasuje przeszkód: robi z trasy
    // DWA ĆWICZENIA, każde liczone od 1.
    if (!kropkiSchowane && przejazd.length > 1) {
      srodkiOdcinkow(przejazd).forEach((c) => {
        const g2 = el("g", { class: "uchwyt ciecie", "data-ciecie": String(c.krok),
                             transform: `translate(${okr(c.x)} ${okr(c.y)})` }, scena);
        el("circle", { cx: 0, cy: 0, r: 0.42, fill: "var(--chrome-2)",
                       stroke: "var(--line)", "stroke-width": 0.06, opacity: 0.92 }, g2);
        el("path", { d: "M -0.17 -0.17 L 0.17 0.17 M 0.17 -0.17 L -0.17 0.17",
                     stroke: "var(--blad)", "stroke-width": 0.11,
                     "stroke-linecap": "round" }, g2);
      });
    }

    // Punkty na trasie — rączki, nie rysunek: na kartce dla jeźdźca ich nie ma.
    // Pokazujemy tylko te, które naprawdę leżą na jakiejś trasie.
    const saKroki = krokiTrasy().length > 0;
    if (!kropkiSchowane && saKroki) {
      punktyTrasy().forEach((q) => {
        const zazn = zaznaczonyPunkt === q.id;
        el("circle", { class: "uchwyt punkt-trasy", "data-punkt": String(q.id),
                       cx: q.x, cy: q.y, r: zazn ? 0.52 : 0.4,
                       fill: "var(--chrome-2)", stroke: "var(--accent)",
                       "stroke-width": zazn ? 0.15 : 0.1, opacity: 0.97 }, scena);
        el("circle", { class: "uchwyt", cx: q.x, cy: q.y, r: zazn ? 0.2 : 0.15,
                       fill: "var(--accent)" }, scena);
      });
    }

    // numer nadany figurze siada w jej środku — „wolta 5" ma być czytelne z daleka
    stan.tor.forEach((t) => {
      if (!t.figNr || !t.figId) return;
      const pkt = stan.tor.filter((q) => q.figId === t.figId);
      if (!pkt.length) return;
      const xs = pkt.map((q) => q.x), ys = pkt.map((q) => q.y);
      const cx = (Math.max.apply(null, xs) + Math.min.apply(null, xs)) / 2;
      const cy = (Math.max.apply(null, ys) + Math.min.apply(null, ys)) / 2;
      plakietkaNumeru(numerFiguryPokazywany(t), cx, cy, 0.86, scena);
    });

    if (trybTor || stan.tor.length) {
      stan.tor.forEach((p, i) => {
        const poczatek = i === 0 || p.przerwa;
        // punkty z gotowej figury są gęste — rysujemy je drobniej, żeby kółko zostało
        // kółkiem, a nie sznurem korali. Chwyta się je tak samo.
        const rr = p.fig ? 0.1 : 0.19;
        // class="uchwyt" — to są rączki do łapania figury, a nie rysunek. Na kartce
        // dla jeźdźca wolta wychodziła z nich jak sznur korali z kółkiem u dołu.
        if (p.ostry) {
          el("rect", { class: "uchwyt", x: p.x - rr, y: p.y - rr, width: rr * 2, height: rr * 2, rx: 0.04,
                       fill: "var(--tor)", opacity: poczatek ? 1 : (p.fig ? 0.55 : 0.75) }, scena);
        } else {
          el("circle", { class: "uchwyt", cx: p.x, cy: p.y, r: rr, fill: "var(--tor)",
                         opacity: poczatek ? 1 : (p.fig ? 0.55 : 0.75) }, scena);
        }
        if (poczatek) {
          // obwódka jest zarazem uchwytem całej linii, więc poza trybem Tor rysujemy ją
          // wyraźniej — inaczej nikt nie zgadnie, że da się za nią złapać
          el("circle", { class: "uchwyt", cx: p.x, cy: p.y, r: 0.44, fill: "none",
                         stroke: trybTor ? "var(--tor)" : "var(--accent)",
                         "stroke-width": trybTor ? 0.08 : 0.11,
                         opacity: trybTor ? 0.8 : 0.95 }, scena);
        }
        // W trybie Tor pokazujemy oba końce każdej figury — to jedyne miejsca,
        // w których da się z niej wyjechać, a bez obwódki trzeba by ich szukać.
        if (trybTor && p.figId && !p.zlaczenie && koniecFigury(i)) {
          const wybrany = kontynuacja && kontynuacja.indeks === i;
          el("circle", { class: "uchwyt", cx: p.x, cy: p.y, r: 0.4, fill: "none",
                         stroke: wybrany ? "var(--accent)" : "var(--tor)",
                         "stroke-width": wybrany ? 0.14 : 0.08,
                         "stroke-dasharray": wybrany ? "" : "0.24 0.18",
                         opacity: wybrany ? 1 : 0.75 }, scena);
        }
        if (p.zlaczenie) {
          // Wezel: pelna kropka w obwodce. Plusik czytal sie jak „kliknij, zeby polaczyc",
          // a to jest znak, ze juz jest polaczone — wiec wyglada jak supel, nie jak przycisk.
          const wybrany = (p === zaznaczoneZlaczenie);
          el("circle", { class: "uchwyt", cx: p.x, cy: p.y, r: wybrany ? 0.62 : 0.5, fill: "var(--chrome-2)",
                         stroke: "var(--accent)", "stroke-width": wybrany ? 0.16 : 0.1,
                         opacity: 0.98 }, scena);
          el("circle", { class: "uchwyt", cx: p.x, cy: p.y, r: wybrany ? 0.3 : 0.24,
                         fill: "var(--accent)" }, scena);
        }
      });
    }

    // uchwyt rozciągania przy zaznaczonej figurze
    if (!trybTor && !trybMiarka && zaznaczonaFigura) {
      const u = uchwytFigury(zaznaczonaFigura);
      if (u) {
        el("line", { x1: u.zaczep.x, y1: u.zaczep.y, x2: u.x, y2: u.y,
                     stroke: "var(--accent)", "stroke-width": 0.07,
                     "stroke-dasharray": "0.4 0.3", opacity: 0.75 }, scena);
        el("circle", { cx: u.x, cy: u.y, r: 0.55, fill: "var(--chrome-2)",
                       stroke: "var(--accent)", "stroke-width": 0.11 }, scena);
        el("circle", { cx: u.x, cy: u.y, r: 0.2, fill: "var(--accent)" }, scena);
        const podpis = el("text", {
          x: (u.zaczep.x + u.x) / 2, y: (u.zaczep.y + u.y) / 2 - 0.45,
          "text-anchor": "middle", "font-size": 0.85,
          "font-family": "var(--f-num)", fill: "var(--accent)"
        }, scena);
        podpis.textContent = fmtL(u.d) + " m";
      }
    }

    // Kolejność przeszkód wynika z tego, którędy prowadzi tor.
    // Numer to kolejność w przejeździe — nic już go nie zgaduje z przebiegu linii.
    stan.elementy.forEach((e) => rysujElement(e, numerPokazywany(e), kierunki.get(e.id)));
    odleglosciTrasy = policzOdleglosci(przejazdyDoOdleglosci());

    // ---- kropki wpięcia ----
    // Luiza, 15 września: „jest ok, ale zróbmy to bez klikania w «trasa»". Więc
    // kropki są na placu od razu. Miarka je chowa, bo tam się mierzy, a nie układa
    // przejazd; dotknięcie poza piaskiem chowa je na życzenie.
    if (!trybMiarka && !kropkiSchowane) {
      const uzyte = kropkiWTrasie();
      const cel = ciagnietaKropka ? ciagnietaKropka.cel : null;
      const klZ = ciagnietaKropka ? kluczKropki(ciagnietaKropka.od) : null;
      const klC = cel ? kluczKropki(cel) : null;
      wszystkieKropki().forEach((k) => {
        const kl = kluczKropki(k);
        // zielona = albo już nią jedzie trasa, albo właśnie chce się wpiąć
        const zielona = kl === klZ || kl === klC || uzyte.has(kl);
        el("circle", { class: "kropka" + (zielona ? " zielona" : ""),
                       "data-kropka": kl,
                       cx: k.x, cy: k.y, r: okr(promienKropki(zielona)),
                       fill: zielona ? "var(--ok)" : "var(--drag-jasny)",
                       stroke: zielona ? "var(--ok-ink)" : "var(--tor)",
                       "stroke-width": okr(Math.max(0.06, 1.4 * metrNaPiksel())),
                       opacity: zielona ? 1 : 0.85 }, scena);
      });
      if (ciagnietaKropka) {
        const q = cel || ciagnietaKropka.p;
        el("line", { class: "guma", x1: ciagnietaKropka.od.x, y1: ciagnietaKropka.od.y,
                     x2: q.x, y2: q.y, stroke: "var(--ok)", "stroke-width": 0.12,
                     "stroke-linecap": "round", "stroke-dasharray": "0.42 0.3" }, scena);
      }
    }

    // linia pomiaru
    if (miarkaA && miarkaB) {
      const a = znajdz(miarkaA), b = znajdz(miarkaB);
      if (a && b) {
        el("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y,
                     stroke: "var(--accent)", "stroke-width": 0.14,
                     "stroke-dasharray": "0.5 0.35", "stroke-linecap": "round" }, scena);
      }
    } else if (!trybMiarka && !trybTor) {
      // odległość do sąsiada liczy się sama — ale musi być widać, MIĘDZY CZYM jest mierzona
      const zazn = znajdz(zaznaczony);
      const sasiad = zazn ? sasiadWSzeregu(zazn) : null;
      // jeśli ta para ma już podpis z toru, nie dokładamy drugiego takiego samego
      if (sasiad && !oznaczonePary.has(kluczPary(zazn, sasiad))) {
        // Same metry. Werdykt („za krótko", „mały galop", „2 fule") stoi
        // w szczegółach odległości i pisanie go drugi raz na placu tylko zaśmieca
        // rysunek — plac ma pokazywać, GDZIE co stoi, a nie oceniać.
        rysujLinieWymiarowa(zazn, sasiad, `${fmt(odlegloscMiedzy(zazn, sasiad))} m`);
      }
    }

    odswiezDlugoscTrasy();
    odswiezPasekOdleglosci();
  }

  // Długość przejazdu w rogu ekranu — widoczna zawsze, gdy tor istnieje.
  let tylkoProblemy = false;

  function odswiezPasekOdleglosci() {
    const pasek = $("paskiOdleglosci");
    if (!pasek) return;
    if (!odleglosciTrasy.length) { pasek.hidden = true; pasek.textContent = ""; return; }
    pasek.hidden = false;

    const zle = odleglosciTrasy.filter((w) => w.oceny.some((o) => o.klasa !== "ok"));
    if (!zle.length) tylkoProblemy = false;
    const pokaz = tylkoProblemy ? zle : odleglosciTrasy;

    // przy długiej trasie łatwiej zacząć od tego, co nie gra
    const filtr = (odleglosciTrasy.length > 6 && zle.length)
      ? `<button type="button" class="filtr${tylkoProblemy ? " on" : ""}" data-filtr="1">` +
        (tylkoProblemy ? `wszystkie ${odleglosciTrasy.length}` : `tylko problemy ${zle.length}`) +
        `</button>`
      : "";

    const ileCw = ileCwiczen();
    pasek.innerHTML = filtr + pokaz.map((w) =>
      `<div class="kafelek">` +
        `<span class="gora"><span class="para">${ileCw > 1 ? "ćw." + (w.cw || 1) + " · " : ""}${w.skad || "—"}</span>${w.co}</span>` +
        `<span class="dol">` + w.oceny.map((oc) =>
          `<span class="kon ${oc.klasa}" title="${oc.nazwa || oc.grupa} — ${oc.pelny}">${oc.nazwa || oc.grupa}: ${oc.krotko}</span>`
        ).join("") + `</span>` +
      `</div>`
    ).join("");
  }

  function odswiezDlugoscTrasy() {
    const box = $("trasaDlugosc");
    if (!box) return;
    // Trasa istnieje, gdy ma co najmniej dwa kroki — punkty w stan.tor to dziś
    // tylko kształty figur i o przejeździe nie mówią nic.
    if (krokiTrasy().length < 2) { box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = `<span class="co">trasa</span>${Math.round(dlugoscTrasy())} m` +
      (odleglosciTrasy.length ? `<span class="ile">szczegóły →</span>` : "");
  }

  function rysujElement(e, numer, kierunek) {
    const t = TYPY[e.typ];
    const g = el("g", { class: "elem" + (zaznaczony === e.id ? " zaznaczony" : ""),
                        transform: `translate(${e.x} ${e.y}) rotate(${e.kat || 0})`,
                        "data-id": e.id }, scena);

    // obwódka zaznaczenia
    el("circle", { class: "zazn", cx: 0, cy: 0, r: 1.5, fill: "none",
                   stroke: "var(--accent)", "stroke-width": 0.12,
                   "stroke-dasharray": "0.4 0.3" }, g);

    // Uchwyt obrotu: mała gałka na krótkim ramieniu, a NIE duże koło. Duże koło
    // na tym placu znaczy woltę i dwa okrągłe kształty o różnych znaczeniach
    // byłyby gotową pomyłką.
    if (zaznaczony === e.id && !trybMiarka && !trybNumerowania) {
      const r = ramieObrotu(e);
      // Gałka idzie na ukos, a nie prosto w górę. Prosto w górę leżą dziś dwie
      // inne rzeczy: kropka wpięcia i sama linia przejazdu, która przez przeszkodę
      // przechodzi właśnie tą osią. Na ukos jest wolne miejsce.
      const rg = promienGalki();
      const gUchwyt = el("g", { class: "zazn", transform: "rotate(" + SKOS_GALKI + ")" }, g);
      el("line", { class: "zazn", x1: 0, y1: okr(-r + rg), x2: 0, y2: okr(-r),
                   stroke: "var(--accent)", "stroke-width": okr(rg * 0.26) }, gUchwyt);
      // jasna, jak kartka: ciemna plama na piasku wyglądała jak dziura
      el("circle", { class: "zazn uchwyt-obrot", cx: 0, cy: okr(-r), r: okr(rg),
                     fill: "var(--drag-jasny)", stroke: "var(--accent)",
                     "stroke-width": okr(rg * 0.17) }, gUchwyt);
      // Okrągła strzałka: łuk 300° i porządny grot. Poprzednia była sklejona
      // z dwóch ścieżek o złych promieniach i przy małym rozmiarze robiła się
      // kleksem — Luiza pokazała to na zrzucie.
      rysujStrzalkeObrotu(gUchwyt, 0, -r, rg * 0.55);
    }

    const dl = e.dlugosc || t.dlugosc || 1;

    if (e.typ === "drag") {
      pasyDraga(g, dl, 0.12);
    }
    else if (e.typ === "kawaletka") {
      pasyDraga(g, dl, 0.12);
      [-dl/2 + 0.15, dl/2 - 0.15].forEach((cx) => {
        el("path", { d: `M ${cx-0.3} -0.42 L ${cx+0.3} 0.42 M ${cx-0.3} 0.42 L ${cx+0.3} -0.42`,
                     stroke: "var(--krzyz)", "stroke-width": 0.12, "stroke-linecap": "round" }, g);
      });
    }
    else if (e.typ === "stacjonata") {
      pasyDraga(g, dl, 0.12);
      [-dl/2, dl/2 - 0.24].forEach((x) => {
        el("rect", { x: x, y: -0.34, width: 0.24, height: 0.68, rx: 0.06, fill: "var(--drewno)" }, g);
      });
    }
    else if (e.typ === "okser") {
      const roz = e.rozstaw || 1.0;
      [-roz/2, roz/2].forEach((dy) => pasyDraga(g, dl, 0.12, dy));
      [-dl/2, dl/2 - 0.24].forEach((x) => {
        el("rect", { x: x, y: -roz/2 - 0.22, width: 0.24, height: roz + 0.44, rx: 0.06, fill: "var(--drewno)" }, g);
      });
    }
    else if (e.typ === "pacholek") {
      // Pachołek jest OKRĄGŁY — z góry nie ma żadnej strony. Rysunek to piktogram
      // stożka widzianego z boku, więc ma stać prosto, równolegle do długiej
      // ściany, bez względu na obrót elementu i na to, czy plac leży w poziomie,
      // czy w pionie. Przy placu w pionie cała scena jest obrócona o 90°, więc
      // pachołki kładły się na bok (Luiza, 22 września). Kropki wokół niego leżą
      // co 90°, więc obrót niczego w nich nie zmienia.
      const gp = el("g", { transform: `rotate(${okr(-(e.kat || 0) - (stan.pion ? 90 : 0))})` }, g);
      el("path", { d: "M -0.5 0.44 L 0 -0.58 L 0.5 0.44 Z", fill: "var(--pacholek)",
                   stroke: "var(--kontur)", "stroke-width": 0.05, "stroke-linejoin": "round" }, gp);
      // odblaskowa opaska — trapez dopasowany do zbieżności stożka
      el("path", { d: "M -0.235 -0.1 L 0.235 -0.1 L 0.32 0.08 L -0.32 0.08 Z",
                   fill: "var(--pacholek-3)", opacity: 0.92 }, gp);
      el("rect", { x: -0.62, y: 0.38, width: 1.24, height: 0.22, rx: 0.08,
                   fill: "var(--pacholek-2)", stroke: "var(--kontur)", "stroke-width": 0.05 }, gp);
    }
    else if (e.typ === "opona") {
      el("circle", { cx: 0, cy: 0, r: 0.51, fill: "none", stroke: "var(--guma)", "stroke-width": 0.26 }, g);
      el("circle", { cx: 0, cy: 0, r: 0.645, fill: "none", stroke: "var(--kontur)", "stroke-width": 0.04, opacity: 0.5 }, g);
      el("circle", { cx: 0, cy: 0, r: 0.375, fill: "none", stroke: "var(--kontur)", "stroke-width": 0.04, opacity: 0.5 }, g);
    }
    else if (e.typ === "start") {
      // kropka, z której koń rusza, i strzałka w stronę jazdy — mała, bo start
      // nie jest przeszkodą i nie ma przeciągać na siebie uwagi
      el("circle", { cx: 0, cy: 0, r: 0.31, fill: "var(--tor)" }, g);
      el("path", { d: "M 0.31 0 L 1.1 0", stroke: "var(--tor)", "stroke-width": 0.13,
                   "stroke-linecap": "round" }, g);
      el("path", { d: "M 0.78 -0.33 L 1.24 0 L 0.78 0.33", fill: "none", stroke: "var(--tor)",
                   "stroke-width": 0.13, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
      // Napis stoi zawsze PO PRZECIWNEJ STRONIE grotu i zawsze rośnie od niego
      // w bok, nigdy na niego. Dotąd był na sztywno kotwiczony końcem, więc przy
      // strzałce w lewo rozciągał się z powrotem przez kropkę i grot — Luiza
      // pokazała to 16 września. Liczymy kierunek grotu NA EKRANIE (plac w pionie
      // jest rysowany obrócony o 90°) i z niego wybieramy stronę oraz kotwicę.
      const kEkr = (e.kat || 0) + (stan.pion ? 90 : 0);
      const radS = kEkr * Math.PI / 180;
      const zaGrotem = { x: -Math.cos(radS), y: -Math.sin(radS) };   // dokąd na ekranie
      const stoi = Math.abs(zaGrotem.x) < 0.35;   // grot prawie pionowo — napis nad/pod
      const odsun = stoi ? 0.95 : 0.62;
      const ts = el("text", { x: -odsun, y: 0, dy: "0.34em",
                   "text-anchor": stoi ? "middle" : (zaGrotem.x < 0 ? "end" : "start"),
                   "font-size": 0.72, "font-family": "IBM Plex Mono, monospace",
                   fill: "var(--tor)" }, g);
      ts.textContent = "Start";
      ts.setAttribute("transform", `rotate(${okr(-kEkr)} ${okr(-odsun)} 0)`);
    }
    else if (e.typ === "zatrzymanie") {
      // krzyzyk w kolorze toru: to znak na trasie, nie sprzet lezacy na piasku
      el("path", { d: "M -0.62 -0.62 L 0.62 0.62 M 0.62 -0.62 L -0.62 0.62",
                   stroke: "var(--tor)", "stroke-width": 0.17, "stroke-linecap": "round" }, g);
    }
    else if (e.typ === "litera") {
      el("rect", { x: -0.42, y: -0.42, width: 0.84, height: 0.84, rx: 0.12,
                   fill: "var(--litera)", stroke: "#00000033", "stroke-width": 0.03 }, g);
      // dominant-baseline bywa na telefonie ignorowane, a litera wyjeżdżała poza
      // kwadracik — przesunięcie o 0,34 em w dół działa wszędzie tak samo
      const tl = el("text", { x: 0, y: 0, dy: "0.34em", "text-anchor": "middle",
                   "font-size": 0.66,
                   "font-family": "Bricolage Grotesque, sans-serif", "font-weight": 700,
                   fill: "#2B211A" }, g);
      tl.textContent = e.litera || "?";
      if (stan.pion) tl.setAttribute("transform", "rotate(-90 0 0)");
    }
    else { // inny
      el("rect", { x: -0.4, y: -0.4, width: 0.8, height: 0.8, rx: 0.14,
                   fill: "none", stroke: "var(--drewno)", "stroke-width": 0.14,
                   "stroke-dasharray": "0.24 0.18" }, g);
      el("text", { x: 0, y: 0.2, "text-anchor": "middle", "font-size": 0.55,
                   "font-family": "Bricolage Grotesque, sans-serif", fill: "var(--drewno)" }, g).textContent = "?";
    }

    // wysokość przeszkody — instruktor potrzebuje jej na rzut oka
    if ((e.typ === "stacjonata" || e.typ === "okser") && e.wysokosc) {
      const gw = el("g", { transform: `rotate(${-(e.kat || 0)})` }, g);
      const ty = el("text", { x: 0, y: (e.dlugosc || t.dlugosc) / 2 + 1.05, "text-anchor": "middle",
                   "font-size": 0.62, "font-family": "IBM Plex Mono, monospace",
                   fill: "#4A3524" }, gw);
      ty.textContent = e.wysokosc + " cm";
      if (stan.pion) ty.setAttribute("transform", `rotate(-90 0 ${(e.dlugosc || t.dlugosc) / 2 + 1.05})`);
    }

    // numer przeszkody nadany przez tor
    if (numer) {
      // gn wraca do osi placu, żeby cyfra stała prosto niezależnie od obrotu przeszkody
      const gn = el("g", { transform: `rotate(${-(e.kat || 0)})` }, g);
      const przes = (e.dlugosc || t.dlugosc || 1) / 2 + 0.75;
      const rad = (e.kat || 0) * Math.PI / 180;
      let ux = Math.cos(rad), uy = Math.sin(rad);   // oś samej przeszkody

      const kier = kierunekNumeru(e);
      ux = kier.x; uy = kier.y;
      let odsuniecie = przes;
      if (kierunek && kierunek.omija) {
        // odwrotnie do strony, którą przechodzi linia
        const dx = e.x - kierunek.x, dy = e.y - kierunek.y;
        const dd = Math.hypot(dx, dy);
        if (dd > 1e-6) { ux = dx / dd; uy = dy / dd; }
        // Plakietka musi stać POZA linią mijania i poza kropkami, bo przy powrocie
        // pętla otacza pachołek z obu stron i „obok" przestaje istnieć.
        const plO = polElementu(e);
        // Przy okrążaniu linia biegnie po kropkach, czyli po całym kółku — numer
        // musi stanąć poza nim, a nie „obok", bo obok już nie ma.
        const rLinii = Math.max(plO.wzdluz, plO.wpoprzek)
                     + (ilePrzejsc(e) > 1 ? ODSTEP_KROPKI : LUZ_OMINIECIA);
        // Przy pełnym obejściu plakietka robi się długa („1·2·3·4") i połową swojej
        // szerokości wchodziła z powrotem na kółko. Odsuwamy o połowę plakietki.
        const pisze = String(numer);
        const polowa = szerPlakietkiZGrubsza(pisze, 0.78) / 2;
        odsuniecie = Math.max(przes, rLinii + polowa + 0.4);
      }

      let nx = ux * odsuniecie, ny = uy * odsuniecie;
      // gdyby wyszedł poza rysunek, kładziemy go przy drugim końcu
      const luz = MARGINES * 0.5;
      if (e.x + nx < -luz || e.x + nx > stan.dl + luz || e.y + ny < -luz || e.y + ny > stan.sz + luz) {
        nx = -nx; ny = -ny;
      }

      plakietkaNumeru(numer, nx, ny, 0.78, gn);
    }

    // Strzałka przejazdu — rysowana w osiach placu, nie w osiach przeszkody,
    // bo mówi o kierunku jazdy, a nie o tym, jak leży drąg.
    if (kierunek !== undefined && !kierunek.omija) {
      // Skok rysujemy tak, jak robi to konkurencja: GRUBĄ STRZAŁKĄ NA PRZESZKODZIE,
      // wzdłuż osi skoku. Kropkowana linia to droga między przeszkodami, strzałka
      // to sam skok — dzięki temu widać kierunek z drugiego końca stajni, a miejsce,
      // w którym krzywa przechodzi w prosty najazd, chowa się pod strzałką.
      const kat = (typeof kierunek === "object") ? kierunek.kat : kierunek;
      const gk = el("g", { transform: `rotate(${okr(kat - (e.kat || 0))})` }, g);
      const gp = polElementu(e).wpoprzek;
      // Strzałka nie może wyjść poza prosty odcinek najazdu — przy przeszkodach
      // stojących co trzy metry ten odcinek jest krótki.
      const dostepne = (typeof kierunek === "object") ? kierunek : {};
      const ogon = Math.min(gp + 0.82, (dostepne.przed || 99) - 0.12);
      const czub = Math.min(gp + 0.82, (dostepne.za || 99) - 0.12);
      const gruba = Math.max(0.2, Math.min(0.34, gp * 0.5 + 0.2));
      const grot = Math.min(0.62, czub * 0.62);
      el("path", { class: "grot-kierunku",
                   d: `M ${okr(-ogon)} 0 L ${okr(czub - grot * 0.55)} 0`,
                   fill: "none", stroke: "var(--tor)", "stroke-width": okr(gruba),
                   "stroke-linecap": "butt" }, gk);
      el("path", { class: "grot-kierunku",
                   d: `M ${okr(czub - grot)} ${okr(-grot * 0.78)} L ${okr(czub)} 0`
                    + ` L ${okr(czub - grot)} ${okr(grot * 0.78)} Z`,
                   fill: "var(--tor)", stroke: "var(--tor)",
                   "stroke-width": okr(gruba * 0.35), "stroke-linejoin": "round" }, gk);
    }

    // znacznik pomiaru
    if (miarkaA === e.id || miarkaB === e.id) {
      el("circle", { cx: 0, cy: 0, r: 0.75, fill: "none",
                     stroke: "var(--accent)", "stroke-width": 0.14 }, g);
    }
  }

  // Okrągła strzałka wpisana w gałkę obrotu: łuk od godziny trzeciej, 300°
  // zgodnie z ruchem wskazówek, zakończony grotem. Rysowana z jednego promienia,
  // żeby w każdym rozmiarze wyglądała tak samo.
  function rysujStrzalkeObrotu(rodzic, cx, cy, R) {
    const koniec = -Math.PI / 3;                       // 300° po łuku od (cx+R, cy)
    const x1 = cx + R * Math.cos(koniec), y1 = cy + R * Math.sin(koniec);
    el("path", { class: "zazn",
                 d: `M ${okr(cx + R)} ${okr(cy)} A ${okr(R)} ${okr(R)} 0 1 1 ${okr(x1)} ${okr(y1)}`,
                 fill: "none", stroke: "var(--accent)", "stroke-width": okr(R * 0.32),
                 "stroke-linecap": "round" }, rodzic);
    // styczna w punkcie końcowym, czyli tam, gdzie strzałka „jedzie"
    const tx = -Math.sin(koniec), ty = Math.cos(koniec);
    const nx = -ty, ny = tx;
    const gr = R * 0.8;
    const pkt = [
      [x1 + tx * gr * 0.78, y1 + ty * gr * 0.78],
      [x1 - tx * gr * 0.42 + nx * gr * 0.68, y1 - ty * gr * 0.42 + ny * gr * 0.68],
      [x1 - tx * gr * 0.42 - nx * gr * 0.68, y1 - ty * gr * 0.42 - ny * gr * 0.68]
    ];
    el("path", { class: "zazn",
                 d: `M ${okr(pkt[0][0])} ${okr(pkt[0][1])} L ${okr(pkt[1][0])} ${okr(pkt[1][1])} L ${okr(pkt[2][0])} ${okr(pkt[2][1])} Z`,
                 fill: "var(--accent)", stroke: "var(--accent)",
                 "stroke-width": okr(R * 0.08), "stroke-linejoin": "round" }, rodzic);
  }

  // Po której stronie przeszkody siada jej numer. Zawsze ten sam koniec:
  // „do góry", a dla przeszkód leżących wzdłuż placu — w lewo. Dzięki temu cały
  // szereg ma numery po jednej stronie i obrót o 180° niczego nie przestawia.
  function kierunekNumeru(e) {
    const rad = (e.kat || 0) * Math.PI / 180;
    let x = Math.cos(rad), y = Math.sin(rad);
    if (y > 0.001 || (Math.abs(y) <= 0.001 && x > 0)) { x = -x; y = -y; }
    return { x: x, y: y };
  }

  // Podpis w owalnej plakietce — ten sam kształt na torze i przy linii wymiarowej.
  // Podpisy trzymają stałą wielkość na ekranie: przy powiększeniu nie puchną,
  // przy oddaleniu nie robią się nieczytelne. Stąd skalowanie przez 1/k.
  function wymiaryPlakietki(tekst, czcionka) {
    const sk = 1 / (widok.k || 1);
    return { szer: (tekst.length * czcionka * 0.58 + 0.5) * sk, wys: czcionka * 1.6 * sk };
  }

  function plakietka(tekst, x, y, czcionka) {
    const sk = 1 / (widok.k || 1);
    const g = el("g", { class: "podpis-odleglosci",
      transform: `translate(${okr(x)} ${okr(y)})` + (stan.pion ? " rotate(-90)" : "") +
                 ` scale(${okr(sk)})` }, scena);
    const szer = tekst.length * czcionka * 0.58 + 0.5;
    const wys = czcionka * 1.6;
    el("rect", { x: -szer / 2, y: -wys / 2, width: szer, height: wys, rx: wys / 2,
                 fill: "var(--chrome-2)", stroke: "var(--line)", "stroke-width": 0.04,
                 opacity: 0.94 }, g);
    el("text", { x: 0, y: 0, "text-anchor": "middle", dy: "0.34em",
                 "font-size": czcionka, "font-family": "IBM Plex Mono, monospace",
                 fill: "var(--ink)" }, g).textContent = tekst;
    return { szer: szer * sk, wys: wys * sk };
  }

  // Krótko: co ten rozstaw znaczy dla wybranych wielkości — chód albo liczba fuli.
  function opisRozstawu(d, a, b) {
    const gr = grupy();
    const naziemne = TYPY[a.typ].naziemny && TYPY[b.typ].naziemny;
    const naziemneDragi = naziemne
      && (a.typ === "drag" || a.typ === "kawaletka")
      && (b.typ === "drag" || b.typ === "kawaletka");

    // Dla każdej wybranej wielkości: albo nazwa chodu (gdy rozstaw mieści się
    // w widełkach stępa, kłusa czy galopu), albo liczba fuli — nigdy sam werdykt,
    // bo „2 długie albo 3 krótkie" nie mówi, ile tych fuli właściwie jest.
    const opisy = gr.map((g) => {
      const k = KONIE[g];
      if (naziemneDragi) {
        const chod = najblizszyChod(d, DRAGI[g]);
        if (chod) return { tekst: ocen(d, g, true).tekst, krotko: ocen(d, g, true).tekst };
      }
      const prog = naziemne ? 1.35 : 0.6;
      const f = naziemne ? d / k.fula : (d - k.zapas) / k.fula;
      if (f < prog) return null;
      const n = Math.round(f);
      return { tekst: `${n} ${odmianaFuli(n)}`, krotko: String(n) };
    });

    if (opisy.some((t) => !t)) return "";
    // Przy kilku wybranych wielkościach ZAWSZE wypisujemy każdą osobno, nawet gdy
    // wychodzi tyle samo — inaczej nie wiadomo, czyja jest ta liczba.
    if (gr.length === 1) return opisy[0].tekst;
    return gr.map((g, i) => `${GRUPA_KROTKO[g]} ${opisy[i].krotko}`).join(" · ");
  }

  // „cztery drągi", „trzy stacjonaty" — tak, jak instruktor o tym mówi
  const MNOGA = {
    drag: ["drągi", "drągów"], kawaletka: ["kawaletki", "kawaletek"],
    stacjonata: ["stacjonaty", "stacjonat"], okser: ["oksery", "okserów"],
    pacholek: ["pachołki", "pachołków"], opona: ["opony", "opon"]
  };
  function mnoga(typ, n) {
    const para = MNOGA[typ] || ["elementy", "elementów"];
    const j = n % 10, dd = n % 100;
    return (j >= 2 && j <= 4 && !(dd >= 12 && dd <= 14)) ? para[0] : para[1];
  }

  // Linia wymiarowa jak na rysunku technicznym — odsunięta od elementów, z kreskami
  // na końcach, żeby było widać dokładnie MIĘDZY CZYM liczona jest odległość.
  function rysujLinieWymiarowa(a, b, tekst, gdzie) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const dl = Math.hypot(dx, dy) || 1;
    let px = -dy / dl, py = dx / dl;
    let OD = 1.9;
    if (gdzie) { px = gdzie.px; py = gdzie.py; OD = gdzie.odsun; }
    else if (a.y + py * OD < 0.5 || a.y + py * OD > stan.sz - 0.5 ||
             b.y + py * OD < 0.5 || b.y + py * OD > stan.sz - 0.5) { px = -px; py = -py; }

    const ax = a.x + px * OD, ay = a.y + py * OD;
    const bx = b.x + px * OD, by = b.y + py * OD;
    const kreska = (x, y) => el("line", {
      x1: x - px * 0.3, y1: y - py * 0.3, x2: x + px * 0.3, y2: y + py * 0.3,
      stroke: "var(--accent)", "stroke-width": 0.1, "stroke-linecap": "round" }, scena);

    // cienkie odnośniki od elementów do linii wymiarowej
    [[a, ax, ay], [b, bx, by]].forEach(([e, x, y]) => {
      el("line", { x1: e.x, y1: e.y, x2: x, y2: y, stroke: "var(--accent)",
                   "stroke-width": 0.05, opacity: 0.4 }, scena);
    });
    el("line", { x1: ax, y1: ay, x2: bx, y2: by, stroke: "var(--accent)",
                 "stroke-width": 0.1, "stroke-linecap": "round" }, scena);
    kreska(ax, ay); kreska(bx, by);
    if (tekst) {
      const czcionka = tekst.length <= 16 ? 0.6 : (tekst.length <= 26 ? 0.52 : 0.46);
      plakietka(tekst, (ax + bx) / 2 + px * (czcionka * 1.1),
                       (ay + by) / 2 + py * (czcionka * 1.1), czcionka);
    }
    return { ax: ax, ay: ay, bx: bx, by: by, px: px, py: py };
  }

  // Odległość w konwencji jeździeckiej: drągi od środka do środka,
  // przeszkody od tyłu pierwszej do podstawy następnej.
  function odlegloscMiedzy(a, b) {
    const srodki = Math.hypot(b.x - a.x, b.y - a.y);
