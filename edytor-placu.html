    const naziemne = TYPY[a.typ].naziemny && TYPY[b.typ].naziemny;
    return naziemne ? srodki : srodki - glebokosc(a) / 2 - glebokosc(b) / 2;
  }

  function znajdz(id) { return stan.elementy.find((e) => e.id === id); }

  // Łączna długość narysowanej trasy — ile koń realnie przejedzie.
  // Długość PRZEJAZDU, a nie sumy wszystkiego, co narysowane: figura stojąca obok
  // trasy nie jest drogą, którą koń przejedzie.
  function dlugoscTrasy() {
    const pkt = torPrzejazdu();
    if (pkt.length < 2) return 0;
    const tymcz = el("path", { d: sciezkaToru(pkt), fill: "none", stroke: "none" }, scena);
    let dl = 0;
    try { dl = tymcz.getTotalLength(); } catch (e) {}
    tymcz.remove();
    return dl;
  }

  function glebokosc(e) {
    if (e.typ === "okser") return (e.rozstaw || 1.0) + 0.1;
    return GLEBOKOSC[e.typ] || 0;
  }

  // Malowany drąg — biało-czerwone pasy, żeby był widoczny na piasku.
  function pasyDraga(g, dl, gr, dy) {
    const y = (dy || 0) - gr;
    const h = gr * 2;
    el("rect", { x: -dl/2, y: y, width: dl, height: h, rx: gr,
                 fill: "var(--drag-jasny)", stroke: "var(--kontur)", "stroke-width": 0.055 }, g);
    el("rect", { x: -dl/2, y: y, width: dl*0.28, height: h, rx: gr, fill: "var(--drag-ciemny)" }, g);
    el("rect", { x: dl/2 - dl*0.28, y: y, width: dl*0.28, height: h, rx: gr, fill: "var(--drag-ciemny)" }, g);
    el("rect", { x: -dl*0.08, y: y, width: dl*0.16, height: h, fill: "var(--drag-ciemny)" }, g);
  }

  // Ile miejsca element naprawdę zajmuje, licząc od swojego środka: wzdłuż własnej
  // osi i w poprzek niej. Bez tego drąg trzymany za środek kładł się połową na bandzie.
  function polElementu(e) {
    const t = TYPY[e.typ] || {};
    const dl = (e.dlugosc || t.dlugosc || 0) / 2 + 0.03;
    switch (e.typ) {
      case "drag":        return { wzdluz: dl,   wpoprzek: 0.16 };
      case "kawaletka":   return { wzdluz: dl,   wpoprzek: 0.49 };
      case "stacjonata":  return { wzdluz: dl,   wpoprzek: 0.38 };
      case "okser":       return { wzdluz: dl,   wpoprzek: (e.rozstaw || 1.0) / 2 + 0.25 };
      case "pacholek":    return { wzdluz: 0.65, wpoprzek: 0.63 };
      case "opona":       return { wzdluz: 0.67, wpoprzek: 0.67 };
      case "zatrzymanie": return { wzdluz: 0.71, wpoprzek: 0.71 };
      case "litera":      return { wzdluz: 0.44, wpoprzek: 0.44 };
      default:            return { wzdluz: 0.48, wpoprzek: 0.48 };
    }
  }

  // Ten sam zasięg, ale w osiach placu — obrócony drąg zajmuje co innego wzdłuż,
  // a co innego w poprzek.
  function zasiegElementu(e) {
    const pl = polElementu(e);
    const r = (e.kat || 0) * Math.PI / 180;
    const c = Math.abs(Math.cos(r)), sn = Math.abs(Math.sin(r));
    return { x: pl.wzdluz * c + pl.wpoprzek * sn, y: pl.wzdluz * sn + pl.wpoprzek * c };
  }

  // Granice środka elementu: cały sprzęt ma się mieścić na piasku, przed bandą.
  function granicaElementu(e) {
    const z = zasiegElementu(e);
    const g = { minX: z.x, maksX: stan.dl - z.x, minY: z.y, maksY: stan.sz - z.y };
    // dłuższy niż plac — nie ma jak go zmieścić, więc kładziemy na osi
    if (g.minX > g.maksX) g.minX = g.maksX = stan.dl / 2;
    if (g.minY > g.maksY) g.minY = g.maksY = stan.sz / 2;
    return g;
  }

  // Wsuwa element z powrotem na piasek — po obrocie, po zmianie długości i po
  // zmianie rozmiaru placu, bo każde z nich potrafi wypchnąć go na bandę.
  function wsunElement(e) {
    const g = granicaElementu(e);
    e.x = okr(Math.min(g.maksX, Math.max(g.minX, e.x)));
    e.y = okr(Math.min(g.maksY, Math.max(g.minY, e.y)));
  }

  function wsunElementy() { stan.elementy.forEach(wsunElement); }

  // Jak blisko musi przechodzić linia, żeby przeszkoda liczyła się do przejazdu.
  // Cztery metry to była szerokość pół placu: drąg stojący zupełnie obok wolty
  // dostawał numer i nie było wiadomo, skąd się wziął. Mierzymy do kształtu
  // przeszkody, nie do jej środka, więc trzymetrowy drąg łapie się na całej długości.
  const ZASIEG_TORU = 0.9;
  // przez te elementy koń przechodzi — one wyznaczają kolejność i odległości
  const NA_TRASIE = ["drag", "kawaletka", "stacjonata", "okser"];
  // Relikt po numerowaniu z przebiegu linii (numeryZToru). Dziś numer bierze się
  // wyłącznie z e.nr, więc ta zmienna nie przełącza już niczego — a pozycja w menu,
  // która ją przełączała, wypadła 16 września razem z „Ostre kąty na trasie".
  const numeryWlaczone = true;

  // ====================== TRASA ======================
  // Zmiana z 14 września, po obejrzeniu, jak to robi konkurencja.
  //
  // DAWNIEJ: trasa była odręcznym rysunkiem, a przeszkody musiały się do niego
  // przykleić. Stąd brały się wszystkie trzy tygodnie walki — „wpięło się czy nie"
  // zależało od tego, czy palec trafił w linię z dokładnością do 90 cm.
  //
  // TERAZ: trasa to KOLEJNOŚĆ rzeczy, przez które koń jedzie, a linia jest jej
  // skutkiem — wyliczana przy każdym rysowaniu z aktualnych pozycji. Przeszkoda
  // nie może „wypaść z toru", bo nie ma czego wpinać. Przesunięcie przeszkody
  // przesuwa linię, bo linia to nie jest osobny byt.
  //
  // Rozstawienie ≠ trasa: postawienie przeszkody NIE dopisuje jej do przejazdu.
  // Plac rozstawiasz, kiedy chcesz, a kolejność układasz osobno, w trybie „Trasa".
  //
  // stan.tor trzyma już tylko GEOMETRIĘ FIGUR (wolta, półwolta, serpentyna,
  // ósemka) — to są kształty, nie przejazd. Kolejność siedzi w e.nr i t.figNr.

  // Punkty przejazdu w kolejności: przeszkoda daje jeden punkt, figura cały swój
  // przebieg, żeby linia naprawdę przez nią przechodziła, a nie ucinała rogi.
  // Ile prostego najazdu przed przeszkodą i prostego lądowania za nią. Metr, jaki
  // dawała kropka wpięcia, to za mało: krzywa nie miała gdzie się wyprostować
  // i przy przeszkodzie robił się ostry dziób. Koń i tak najeżdża prosto.
  const BIEG_PRZEJAZDU = 2.4;

  // Kierunek jazdy w przeszkodę i z niej — jednostkowe wektory. Przez drąg jedzie
  // się na wylot, więc wjazd i wyjazd są tym samym kierunkiem; pachołek można
  // minąć skręcając, więc tam liczą się obie kropki osobno.
  function osPrzejazdu(e, weNr) {
    const kr = kropkiElementu(e);
    const we = weNr === undefined ? e.we : weNr;
    if (we === undefined || !kr[we]) return null;
    const jed = (dx, dy) => { const d = Math.hypot(dx, dy) || 1; return { x: dx / d, y: dy / d }; };
    const wjazd = jed(e.x - kr[we].x, e.y - kr[we].y);
    let wyjazd = wjazd;
    if (!naWylot(e) && e.wy !== undefined && kr[e.wy]) {
      wyjazd = jed(kr[e.wy].x - e.x, kr[e.wy].y - e.y);
    }
    const sx = wjazd.x + wyjazd.x, sy = wjazd.y + wyjazd.y;
    return { we: wjazd, wy: wyjazd, srodek: jed(sx, sy) };
  }

  function torPrzejazdu() {
    const kroki = krokiTrasy();
    // Środek każdego kroku — najazd nie może sięgnąć dalej niż w pół drogi do
    // sąsiada, bo w szeregu co trzy metry wyszedłby zza poprzedniej przeszkody.
    const kotwice = kroki.map((k) => {
      if (k.punktT) return { x: k.punktT.x, y: k.punktT.y };
      if (k.el) return { x: k.el.x, y: k.el.y };
      const b = punktyFiguryZTor(k.figId);
      return b.length ? { x: b[0].x, y: b[0].y } : null;
    });
    const doSasiada = (j, o) => {
      const a = kotwice[j], b = kotwice[j + o];
      return (a && b) ? Math.hypot(a.x - b.x, a.y - b.y) : Infinity;
    };
    const pkt = [];
    const doKroku = (k, j) => {
      if (k.punktT) {
        // wolny punkt: koń tędy przejeżdża, nic tu nie stoi
        pkt.push({ x: k.punktT.x, y: k.punktT.y, punktT: k.punktT.id,
                   moc: k.punktT.moc || 1 });
        return;
      }
      if (k.el) {
        if (k.el.typ === "start") {
          // Start ma własną strzałkę i ona jest początkiem przejazdu. Poprowadzenie
          // linii jeszcze przez jego środek dokładało drugą kreskę pod grotem —
          // Luiza pokazała to na zrzucie 15 września. Linia wychodzi z kropki
          // startu dokładnie wzdłuż strzałki.
          const wy = wyjscieElementu(k.el);
          if (wy) {
            const rad = (k.el.kat || 0) * Math.PI / 180;
            pkt.push({ x: wy.x, y: wy.y, el: k.el.id,
                       styczna: { x: Math.cos(rad), y: Math.sin(rad) } });
          }
          return;
        }
        // która strona: krok niesie swoją kropkę
        const weTego = (k.we !== undefined) ? k.we : k.el.we;
        // SLALOM I MIJANIE — wprost z punktów kontrolnych, w kolejności trasy.
        //
        // Luiza, 22 września: „slalom NIE może być generowany jako pętle wokół
        // stożków. Nie wolno domykać okręgów wokół żadnej przeszkody. Punkty są
        // źródłem prawdy: łącz punkty po kolei, wygładzaj łamaną, nie dodawaj
        // dodatkowych punktów pętli, nie domykaj żadnego odcinka. Stożki są
        // tylko odniesieniem wzrokowym."
        //
        // Więc: JEDEN punkt na jedno minięcie, dokładnie tam, gdzie leży kropka
        // wskazana ręką. Żadnego obchodzenia, żadnego dokładania punktów, żadnej
        // stycznej narzuconej z okręgu. Kształt bierze się z kolejności kropek:
        // raz z jednej strony, raz z drugiej, a między stożkami linia wraca
        // środkiem i robi się ósemka.
        if (omijany(k.el)) {
          const kanciastoO = !!stan.ostreKaty;
          const kr = kropkiElementu(k.el);
          const q = (weTego !== undefined) ? kr[weTego] : null;
          if (q) {
            const nowy = { x: okr(q.x), y: okr(q.y), omija: k.el.id, bok: true,
                           ostry: kanciastoO || undefined,
                           // pachołek, który ten punkt mija — krzywa nie ma prawa
                           // wejść bliżej niż ta kropka
                           os: { x: k.el.x, y: k.el.y,
                                 r: Math.hypot(q.x - k.el.x, q.y - k.el.y) } };
            // Jedyny wyjątek od „łącz punkty po kolei": kolejne kropki TEGO SAMEGO
            // pachołka. Prosta szłaby przez jego środek, więc te odcinki rysujemy
            // półłukami po zewnętrznej — układa je `ulozLuki`, całym ciągiem naraz
            // i w jednym kierunku obiegu.
            const ost = pkt[pkt.length - 1];
            const bedzieLuk = !kanciastoO && ost && ost.omija === k.el.id
                              && Math.hypot(ost.x - nowy.x, ost.y - nowy.y) > 0.2;
            // ZAWRÓT W JEDNYM PUNKCIE. Koń przyjeżdża i odjeżdża tą samą stroną,
            // a na tym pachołku jest tylko jedna kropka — nie ma więc czego łączyć
            // półłukiem. Krzywa wygładzana z sąsiadów robiła w tym miejscu pętlę
            // i wchodziła na pachołek (0,48 m od środka). Zamiast wymyślać objazd,
            // którego nikt nie zamówił, zawracamy OSTRYM KĄTEM: linia dojeżdża do
            // kropki i wraca. Chcesz okrągły zawrót — połącz drugą kropkę tego
            // pachołka, a wtedy wchodzi półłuk.
            const nastTenSam = kroki[j + 1] && kroki[j + 1].el === k.el;
            if (!bedzieLuk && !nastTenSam) {
              const A = pkt[pkt.length - 1] || null, B = kotwice[j + 1] || null;
              if (A && B) {
                const du = Math.hypot(A.x - nowy.x, A.y - nowy.y);
                const dv = Math.hypot(B.x - nowy.x, B.y - nowy.y);
                if (du > 0.4 && dv > 0.4
                    && ((A.x - nowy.x) * (B.x - nowy.x) + (A.y - nowy.y) * (B.y - nowy.y))
                       / (du * dv) > 0.5) {
                  nowy.ostry = true;
                }
              }
            }
            pkt.push(nowy);
          } else {
            // nikt nie wskazał kropki — mijamy prostopadle do jazdy, po starym
            const om = osOminiecia(k.el, kotwice[j - 1] || null, kotwice[j + 1] || null, undefined);
            pkt.push({ x: om.x, y: om.y, omija: k.el.id, styczna: om.styczna, bok: true,
                       ostry: kanciastoO || undefined });
          }
          return;
        }
        const os = osPrzejazdu(k.el, weTego);
        const kanciasto = !!stan.ostreKaty;
        if (!os) {
          pkt.push({ x: k.el.x, y: k.el.y, el: k.el.id, ostry: kanciasto || undefined });
          return;
        }
        const bWe = Math.max(0.9, Math.min(BIEG_PRZEJAZDU, 0.38 * doSasiada(j, -1)));
        const bWy = Math.max(0.9, Math.min(BIEG_PRZEJAZDU, 0.38 * doSasiada(j, 1)));
        // Najazd zostaje także przy kątach: koń i tak wchodzi w przeszkodę prosto,
        // a łamie się dopiero na wyjściu z najazdu. To jest ten ostry zawrót.
        pkt.push({ x: okr(k.el.x - os.we.x * bWe), y: okr(k.el.y - os.we.y * bWe),
                   pom: k.el.id, styczna: os.we, ostry: kanciasto || undefined });
        pkt.push({ x: k.el.x, y: k.el.y, el: k.el.id, styczna: os.srodek,
                   przed: bWe, za: bWy });
        pkt.push({ x: okr(k.el.x + os.wy.x * bWy), y: okr(k.el.y + os.wy.y * bWy),
                   pom: k.el.id, styczna: os.wy, ostry: kanciasto || undefined });
      } else if (k.figId) {
        let bieg = stan.tor.filter((t) => t.figId === k.figId);
        // Wolta jest kołem: zaczyna się i kończy w tym samym miejscu, więc wolno ją
        // obrócić tak, żeby koń wjeżdżał w nią od strony, z której nadjeżdża.
        // Bez tego linia przecinała koło na pół, żeby dotrzeć do jego zaczepu.
        const zamknieta = figuraZamknieta(bieg);
        const skad = pkt.length ? pkt[pkt.length - 1] : null;
        const dokad = kotwice[j + 1] || null;
        const wskazane = k.punkt ? k.punkt.figWe : undefined;
        if (zamknieta && (skad || wskazane !== undefined)) {
          const obwod = bieg.slice(0, -1);
          let naj = 0;
          if (wskazane !== undefined && obwod[wskazane]) {
            naj = wskazane;            // człowiek wskazał kropkę — to jest wjazd
          } else {
            // Pełna wolta wraca tam, skąd wyszła, więc wjazd i wyjazd to JEDEN punkt.
            // Wybieramy go tak, żeby suma drogi „skądś do wolty" i „z wolty dokądś"
            // była najkrótsza — inaczej linia potrafiła przeciąć koło na pół, żeby
            // dojść do punktu po drugiej stronie.
            let najD = Infinity;
            obwod.forEach((t, i) => {
              const d = (skad ? Math.hypot(t.x - skad.x, t.y - skad.y) : 0)
                      + (dokad ? Math.hypot(t.x - dokad.x, t.y - dokad.y) : 0);
              if (d < najD) { najD = d; naj = i; }
            });
          }
          bieg = obwod.slice(naj).concat(obwod.slice(0, naj));
          bieg.push(bieg[0]);   // domykamy koło w nowym miejscu
        } else if (!zamknieta && wskazane === 1) {
          bieg = bieg.slice().reverse();   // wjazd od drugiego końca półwolty
        }
        // KOPIE, nie oryginały: znaczniki przejazdu (krok, przerwa) nie mają prawa
        // wylądować w `stan.tor` i pojechać do zapisu.
        bieg.forEach((t) => pkt.push(Object.assign({}, t)));
      }
    };
    kroki.forEach((k, j) => {
      const od = pkt.length;
      doKroku(k, j);
      for (let q = od; q < pkt.length; q++) pkt[q].krok = j;
      if (k.nowe && pkt[od]) pkt[od].nowe = true;
    });
    // Półłuki wokół pachołków dopiero teraz — jeden pachołek, jeden kierunek obiegu.
    if (!stan.ostreKaty) ulozLuki(pkt);
    return pkt;
  }

  function punktStartu() { return stan.elementy.find((e) => e.typ === "start") || null; }

  // Przeszkoda mijana DWA RAZY. Luiza, 16 września, z rysunkiem w ręku: „bardzo
  // często wraca się po tych slalomach, więc to nie może nam się rozjeżdżać".
  // W górę mija się pachołek jedną stroną, z powrotem drugą — i dopiero te dwa
  // przejścia razem robią pętlę wokół niego, czyli slalom z jej rysunku.
  //
  // Przejść może być WIĘCEJ NIŻ DWA. Luiza, 17 września: „przy pachołkach
  // i oponach daj opcję, żeby każdą kropkę można było połączyć z każdą — z tej
  // zielonej kropki nie mogę połączyć się z tą nad nią po lewej, a powinna być
  // taka opcja". Czyli: obchodzi się pachołek kropka po kropce, ile razy trzeba.
  //
  // Pierwsze przejście siedzi tam, gdzie od zawsze (`e.nr` / `e.we`) — czyta to
  // pół aplikacji. Każde następne dokłada się do `e.powroty`. Kropka może być
  // użyta raz: cztery kropki to najwyżej cztery przejścia, czyli pełne kółko.
  function przejsciaElementu(e) {
    const out = [];
    // `zrodlo` to obiekt, w którym naprawdę siedzą pola tego przejścia — element
    // albo wpis w `powroty`. Dzięki temu znaczniki (np. „nowe ćwiczenie") czyta
    // się i pisze bez liczenia indeksów, które zmieniają się przy porządkowaniu.
    if (e.nr) out.push({ nr: e.nr, we: e.we, ktore: 0, zrodlo: e });
    (e.powroty || []).forEach((p, i) => {
      if (p && p.nr) out.push({ nr: p.nr, we: p.we, ktore: i + 1, zrodlo: p });
    });
    out.sort((a, b) => a.nr - b.nr);
    return out;
  }
  function ilePrzejsc(e) { return przejsciaElementu(e).length; }
  function kropkaZajeta(e, i) { return przejsciaElementu(e).some((p) => p.we === i); }
  function numerPrzyKropce(e, i) {
    const p = przejsciaElementu(e).find((q) => q.we === i);
    return p ? p.nr : 0;
  }
  // Które przejście „należy" do tej kropki. Przy drągu kropki są dwie i obie
  // opisują to samo przejście: wjazd i wyjazd na wylot.
  function przejscieNaKropce(e, i) {
    if (!e || i === undefined) return null;
    return przejsciaElementu(e).find((p) =>
      p.we === i || (naWylot(e) && p.we === 1 - i)) || null;
  }
  // Zdejmuje JEDNO wskazane przejście — nie ostatnie, tylko to.
  function zdejmijPrzejscie(e, nr) {
    if (e.nr === nr) { delete e.nr; delete e.we; }
    e.powroty = (e.powroty || []).filter((p) => !(p && p.nr === nr));
    porzadkujPrzejscia(e);
    if (!ilePrzejsc(e)) { delete e.we; delete e.wy; delete e.numer; }
    zwolnijNumer(nr);
    return nr;
  }
  function dodajPrzejscie(e, nr, we) {
    if (!e.powroty) e.powroty = [];
    e.powroty.push({ nr: nr, we: we });
    porzadkujPrzejscia(e);
  }
  // Pierwsze przejście ma być zawsze tym o najmniejszym numerze — inaczej
  // „e.nr" przestałoby znaczyć „kiedy koń tu pierwszy raz jest".
  function porzadkujPrzejscia(e) {
    const lista = przejsciaElementu(e);
    if (!lista.length) { delete e.nr; delete e.we; delete e.powroty; return; }
    e.nr = lista[0].nr;
    if (lista[0].we === undefined) delete e.we; else e.we = lista[0].we;
    if (lista[0].zrodlo && lista[0].zrodlo.nowe) e.nowe = true; else delete e.nowe;
    const reszta = lista.slice(1).map((p) => {
      const w = { nr: p.nr, we: p.we };
      if (p.zrodlo && p.zrodlo.nowe) w.nowe = true;
      return w;
    });
    if (reszta.length) e.powroty = reszta; else delete e.powroty;
  }

  // ---- PUNKT NA TRASIE ----
  // Luiza, 17 września, filmem z parkour.design: tam każdy punkt trasy da się
  // złapać i wygiąć („Punkt na trasie · Moc wygięcia łuku · Usuń"). U nas linia
  // brała się wyłącznie z kolejności przeszkód, więc kiedy wychodziła brzydko,
  // nie było za co złapać. Wolny punkt to krok przejazdu bez sprzętu: koń tędy
  // jedzie, nic tu nie stoi.
  function punktyTrasy() { return stan.punkty || (stan.punkty = []); }
  function punktTrasy(id) { return punktyTrasy().find((q) => q.id === id) || null; }
  function usunPunktTrasy(q) {
    stan.punkty = punktyTrasy().filter((x) => x !== q);
    zwolnijNumer(q.nr);
  }
  // Które przecięcie jest pod palcem. Liczymy z tej samej krzywej, którą widać.
  function cieciePod(p) {
    if (kropkiSchowane) return null;
    const pkt = torPrzejazdu();
    if (pkt.length < 2) return null;
    // Mniejszy zasięg niż kropka: krzyżyk leży na linii, a linia biegnie tuż obok
    // sprzętu. Za duży promień zjadał naciśnięcia, które miały trafić w kropkę.
    let naj = null, najD = Math.max(0.42, 15 * metrNaPiksel());
    srodkiOdcinkow(pkt).forEach((c) => {
      const d = Math.hypot(c.x - p.x, c.y - p.y);
      if (d < najD) { najD = d; naj = c; }
    });
    return naj;
  }

  // Najbliższy punkt NA NARYSOWANEJ krzywej — tym samym wzorem, którym ją rysujemy.
  // Zwraca też krok, PRZED którym trzeba wstawić punkt, gdyby ktoś chciał ją tu wygiąć.
  function punktNaTrasie(p) {
    if (kropkiSchowane) return null;
    const pkt = torPrzejazdu();
    if (pkt.length < 2) return null;
    const T = stycznePunktow(pkt);
    let naj = null, najD = Math.max(0.55, 16 * metrNaPiksel());
    for (let i = 0; i < pkt.length - 1; i++) {
      const p1 = pkt[i], p2 = pkt[i + 1];
      if (p2.nowe) continue;
      if (p2.krok === undefined || p2.krok === 0) continue;
      const L = (!p1.ostry && !p2.ostry && p2.luk) ? p2.luk : null;
      const u = (p1.ostry || p2.ostry || L) ? null : uchwytyOdcinka(pkt, T, i);
      let a1 = 0, rozpL = 0;
      if (L) {
        a1 = Math.atan2(p1.y - L.cy, p1.x - L.cx);
        const a2 = Math.atan2(p2.y - L.cy, p2.x - L.cx);
        const dwaPi = Math.PI * 2, norm = (x) => ((x % dwaPi) + dwaPi) % dwaPi;
        rozpL = (L.sweep ? norm(a2 - a1) : -norm(a1 - a2));
      }
      for (let sN = 0; sN <= 12; sN++) {
        const t = sN / 12, m = 1 - t;
        const x = L ? (L.cx + L.r * Math.cos(a1 + rozpL * t))
                : u ? (m*m*m*p1.x + 3*m*m*t*u.c1.x + 3*m*t*t*u.c2.x + t*t*t*p2.x)
                    : (p1.x + (p2.x - p1.x) * t);
        const y = L ? (L.cy + L.r * Math.sin(a1 + rozpL * t))
                : u ? (m*m*m*p1.y + 3*m*m*t*u.c1.y + 3*m*t*t*u.c2.y + t*t*t*p2.y)
                    : (p1.y + (p2.y - p1.y) * t);
        const d = Math.hypot(x - p.x, y - p.y);
        if (d < najD) { najD = d; naj = { x: okr(x), y: okr(y), krok: p2.krok }; }
      }
    }
    return naj;
  }

  // Wstawia wolny punkt PRZED wskazanym krokiem — czyli w sam środek tego odcinka,
  // za który ktoś właśnie pociągnął.
  function wstawPunktNaTrasie(krokIdx, p) {
    const kroki = krokiTrasy();
    const k = kroki[krokIdx];
    if (!k || k.start) return null;
    const nrB = k.nr;
    zrobMiejsceOd(nrB);
    const id = stan.nast++;
    punktyTrasy().push({ id: id, nr: nrB, x: okr(p.x), y: okr(p.y), moc: 1 });
    return { id: id, nr: nrB };
  }

  function przetnijTrase(krokIdx) {
    const kroki = krokiTrasy();
    const k = kroki[krokIdx];
    if (!k || k.start) return false;
    zapiszHistorie();
    ustawNowe(k, true);
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
    odswiezLiczniki(); odswiezOstrzezenia();
    pokazPodpowiedz(`Trasa przecięta — to, co dalej, jest teraz ćwiczeniem ${k.cw + 1}`
      + " i liczy się od 1 · cofniesz strzałką w nagłówku");
    return true;
  }

  function punktTrasyPod(p) {
    let naj = null, najD = Math.max(0.6, 22 * metrNaPiksel());
    punktyTrasy().forEach((q) => {
      const d = Math.hypot(q.x - p.x, q.y - p.y);
      if (d < najD) { najD = d; naj = q; }
    });
    return naj;
  }

  // ĆWICZENIA. Luiza, 17 września: „mam 3 opony, dodałam 2 przeszkody i chciałam
  // połączyć TYLKO te dwie przeszkody, a automatycznie połączyło mnie z oponami".
  // Bo trasa była jedną kolejką od 1 do końca. Na treningu tak nie jest: najpierw
  // rozgrzewka na slalomie, potem zadanie na przeszkodach — dwa osobne ćwiczenia,
  // każde liczone od 1. Tak samo robi konkurencja („Sekcja 1", „Sekcja 2").
  //
  // Nie ruszamy globalnej kolejności: krok może tylko nieść znacznik `nowe`, czyli
  // „tu zaczyna się następne ćwiczenie". Numer na rysunku liczy się od początku
  // ćwiczenia, a przecięcie odcinka jest odwracalne jednym cofnięciem.
  function znacznikNowe(k) {
    if (k.punktT) return !!k.punktT.nowe;
    if (k.punkt) return !!k.punkt.figNowe;
    return !!(k.zrodlo && k.zrodlo.nowe);
  }
  function ustawNowe(k, wl) {
    if (k.punktT) { if (wl) k.punktT.nowe = true; else delete k.punktT.nowe; return; }
    if (k.punkt) { if (wl) k.punkt.figNowe = true; else delete k.punkt.figNowe; return; }
    if (!k.zrodlo) return;
    if (wl) k.zrodlo.nowe = true; else delete k.zrodlo.nowe;
  }

  // Kolejność przejazdu: start (jeśli stoi), potem wszystko z numerem, od 1 w górę.
  function krokiTrasy() {
    const kroki = [];
    punktyTrasy().forEach((q) => { if (q.nr) kroki.push({ nr: q.nr, punktT: q }); });
    stan.elementy.forEach((e) => {
      if (e.typ === "start") return;
      przejsciaElementu(e).forEach((p, i) => {
        kroki.push({ nr: p.nr, el: e, we: p.we, drugi: i > 0, ktore: p.ktore, zrodlo: p.zrodlo });
      });
    });
    stan.tor.forEach((t) => { if (t.figNr && t.figId) kroki.push({ nr: t.figNr, figId: t.figId, punkt: t }); });
    // Wolny punkt to punkt NA trasie — sam z siebie trasą nie jest. Gdy zniknie
    // wszystko, przez co koń jedzie, zostawała po nich linia ze strzałką
    // i krzyżykiem, choć na placu nie było już nic (Luiza, 22 września).
    if (!kroki.some((k) => k.el || k.figId)) return [];
    kroki.sort((a, b) => a.nr - b.nr);
    const st = punktStartu();
    // Start nie ma numeru — jest tym, od czego się liczy, a nie pierwszą przeszkodą.
    // Ale WCHODZI DO TRASY DOPIERO WTEDY, gdy sama go wepniesz. Luiza, 17 września:
    // „jak kładę start, to łączy mi się automatycznie z jakimś elementem na placu;
    // nie ma tak być". Wcześniej sam fakt postawienia startu przy gotowej trasie
    // dorysowywał linię do przeszkody numer 1.
    if (st && st.wpiety && kroki.length) kroki.unshift({ nr: 0, el: st, start: true });
    // ćwiczenie i numer W RAMACH ćwiczenia
    let cw = 1, lok = 0, bylJuzKrok = false;
    kroki.forEach((k) => {
      if (k.start) { k.cw = 1; k.lok = 0; return; }
      // przecięcie PRZED pierwszym krokiem nic nie znaczy — nie byłoby czego odciąć
      if (znacznikNowe(k) && bylJuzKrok) { cw++; lok = 0; k.nowe = true; }
      bylJuzKrok = true;
      lok++;
      k.cw = cw; k.lok = lok;
    });
    return kroki;
  }
  function ileCwiczen() {
    const kr = krokiTrasy();
    return kr.length ? Math.max.apply(null, kr.map((k) => k.cw || 1)) : 0;
  }

  // Odległości liczymy MIĘDZY KOLEJNYMI PRZESZKODAMI. Figura wstawiona w środek
  // przejazdu przerywa liczenie: między drągiem a woltą nie ma „liczby fuli",
  // bo koń jedzie po łuku, a nie po prostej.
  function przejazdyDoOdleglosci() {
    const kroki = krokiTrasy();
    const out = [];
    let poPrzerwie = true;
    kroki.forEach((k) => {
      if (k.start) { poPrzerwie = true; return; }  // od startu do pierwszej przeszkody nie liczymy fuli
      if (k.nowe) poPrzerwie = true;               // nowe ćwiczenie zaczyna liczenie od nowa
      if (k.punktT) return;                        // wolny punkt tylko wygina linię
      if (!k.el) { poPrzerwie = true; return; }    // figura rozcina szereg
      out.push({ e: k.el, nr: k.nr, przerwij: poPrzerwie });
      poPrzerwie = false;
    });
    return out;
  }

  function figuryWTrasie() {
    const zbior = new Set();
    stan.tor.forEach((t) => { if (t.figNr && t.figId) zbior.add(t.figId); });
    return zbior;
  }

  // ====================== KROPKI WPIĘCIA ======================
  // Luiza, 14 września, po ponownym obejrzeniu konkurencji: „zrób takie kropki
  // dosłownie, że każda przeszkoda ma mieć kropkę z dwóch stron, volta też,
  // i że my możemy połączyć się do tej kropki, i wiadomo, że to przechodzi
  // przez sam środek przeszkody".
  //
  // Kropka to miejsce, którym trasa WCHODZI w element i którym z niego WYCHODZI.
  // Przeszkodę skacze się prostopadle do drąga i przez jego środek, więc kropki
  // stoją po dwóch jego stronach, a wybór kropki mówi tylko, z której strony koń
  // nadjeżdża. Ciągniesz od kropki do kropki — to jest cała obsługa trasy.
  const ZASIEG_KROPKI = 1.0;    // jak blisko musi być palec, żeby kropka złapała
  const ODSTEP_KROPKI = 1.1;    // ile kropka odstaje od kształtu elementu
  // O ile gałka obrotu jest przekręcona względem „góry" przeszkody. Prosto w górę
  // stoją kropka wpięcia i linia przejazdu — gałka schodzi im z drogi na ukos.
  const SKOS_GALKI = -42;

  // Ile metrów przypada na piksel ekranu. Kropka „trzydzieści centymetrów" ma na
  // telefonie trzy piksele, bo 40 m placu mieści się tam w 370 px — a pod palec
  // trzeba dać tyle samo miejsca co na komputerze. Dlatego wszystko, co się
  // chwyta, liczymy w pikselach i dopiero przeliczamy na metry.
  function metrNaPiksel() {
    const szer = (svg && svg.clientWidth) || 900;
    const wMetrach = (stan.pion ? stan.sz : stan.dl) + 2 * MARGINES;
    return wMetrach / szer / (widok.k || 1);
  }
  function promienKropki(zielona) { return Math.max(zielona ? 0.3 : 0.24, (zielona ? 7.5 : 6) * metrNaPiksel()); }
  function chwytKropki() { return Math.max(ZASIEG_KROPKI, 20 * metrNaPiksel()); }

  function obrocLok(e, x, y) {
    const r = (e.kat || 0) * Math.PI / 180;
    const c = Math.cos(r), sn = Math.sin(r);
    return { x: okr(e.x + x * c - y * sn), y: okr(e.y + x * sn + y * c) };
  }

  // Przez drąg przechodzi się na wylot: wjazd jedną stroną znaczy wyjazd drugą.
  function naWylot(e) { return NA_TRASIE.indexOf(e.typ) >= 0; }

  // Pachołka i opony NIE przejeżdża się przez środek — mija się je bokiem.
  // Luiza, 16 września: „slalom to sama nazwa mówi, a u nas przez pachołek można
  // przejść". Kropka mówi, z której strony koń go mija; linia robi wokół niego łuk.
  const OMIJANE = ["pacholek", "opona"];
  const LUZ_OMINIECIA = 0.8;   // metry między krawędzią pachołka a linią jazdy
  function omijany(e) { return OMIJANE.indexOf(e.typ) >= 0; }

  // Punkt, przez który naprawdę przejeżdża koń mijający ten pachołek, i styczna
  // w tym punkcie. Odsuwamy się PROSTOPADLE DO JAZDY, a nie w stronę samej kropki:
  // gdyby punkt wypadł dokładnie na wprost, linia robiłaby hak zamiast łuku.
  // PÓŁŁUK ZAWRACAJĄCY. Luiza, 22 września: „jeśli dwa kolejne punkty należą do
  // tego samego pachołka, nie łącz ich prostą przez środek — połącz je jednym
  // półłukiem po zewnętrznej stronie". Obie kropki leżą na tym samym okręgu
  // wokół pachołka, więc łuk o promieniu tego okręgu przechodzi przez nie
  // dokładnie. Wybieramy tę stronę, która jest dalej od ruchu: od punktu, z
  // którego koń przyjeżdża, i od tego, do którego odjeżdża.
  //
  // To NIE jest pętla ani objazd: to jeden odcinek ścieżki, fragment łuku,
  // narysowany poleceniem „A" — nic się nie domyka i nie dochodzi żaden punkt.
  // Wszystkie kolejne kropki JEDNEGO pachołka układamy naraz i w JEDNYM kierunku
  // obiegu. Liczone osobno, para po parze, drugi łuk potrafił zawrócić po śladzie
  // pierwszego — i trasa wyglądała, jakby się rozjeżdżała (Luiza, 22 września).
  // Kierunek wybieramy ten, który daje krótszą drogę po całym ciągu; przy remisie
  // (dwie kropki naprzeciw siebie) decyduje to, co dalej od ruchu, czyli objazd
  // po zewnętrznej.
  function ulozLukiCiagu(pkt, a, b2) {
    const os = pkt[a].os;
    if (!os || os.r < 0.2) return;
    const dwaPi = Math.PI * 2;
    const norm = (x) => ((x % dwaPi) + dwaPi) % dwaPi;
    const kat = [];
    for (let i = a; i <= b2; i++) {
      if (!pkt[i].os || Math.abs(Math.hypot(pkt[i].x - os.x, pkt[i].y - os.y) - os.r) > 0.05) return;
      kat.push(Math.atan2(pkt[i].y - os.y, pkt[i].x - os.x));
    }
    const drogi = [1, 0].map((sw) => {
      let suma = 0;
      const rozp = [];
      for (let i = 1; i < kat.length; i++) {
        const r = sw ? norm(kat[i] - kat[i - 1]) : norm(kat[i - 1] - kat[i]);
        rozp.push(r); suma += r;
      }
      return { sw: sw, suma: suma, rozp: rozp };
    });
    // NAJPIERW: nie zawracać konia w miejscu. Styczna pierwszej kropki obsługuje
    // i dojazd, i pierwszy łuk — jeśli łuk odchodzi w przeciwną stronę niż koń
    // przyjechał, krzywa dojazdu robi hak za przeszkodę. To samo na wyjeździe.
    // Dopiero przy remisie decyduje krótsza droga, a potem objazd po zewnętrznej.
    const styczna = (i, sw) => {
      const rx = pkt[i].x - os.x, ry = pkt[i].y - os.y, d = Math.hypot(rx, ry) || 1;
      return sw ? { x: -ry / d, y: rx / d } : { x: ry / d, y: -rx / d };
    };
    const kierunekDo = (i1, i2) => {
      const q1 = pkt[i1], q2 = pkt[i2];
      if (!q1 || !q2) return null;
      const dx = q2.x - q1.x, dy = q2.y - q1.y, d = Math.hypot(dx, dy);
      return d > 0.3 ? { x: dx / d, y: dy / d } : null;
    };
    const wjazd = kierunekDo(a - 1, a);
    const wyjazd = kierunekDo(b2, b2 + 1);
    const ciaglosc = (sw) => {
      let w = 0;
      if (wjazd) { const t = styczna(a, sw); w += wjazd.x * t.x + wjazd.y * t.y; }
      if (wyjazd) { const t = styczna(b2, sw); w += t.x * wyjazd.x + t.y * wyjazd.y; }
      return w;
    };
    const c1 = ciaglosc(1), c0 = ciaglosc(0);
    let wyb;
    if (Math.abs(c1 - c0) > 1e-6) {
      wyb = c1 > c0 ? drogi[0] : drogi[1];
    } else if (Math.abs(drogi[0].suma - drogi[1].suma) > 1e-6) {
      wyb = drogi[0].suma < drogi[1].suma ? drogi[0] : drogi[1];
    } else {
      // remis: objeżdżamy PO ZEWNĘTRZNEJ, czyli dalej od tego, skąd koń
      // przyjechał i dokąd jedzie dalej
      const skad = pkt[a - 1] || null, dokad = pkt[b2 + 1] || null;
      const ocena = (d) => {
        let dal = Infinity;
        let kk = kat[0];
        d.rozp.forEach((r) => {
          const aM = d.sw ? kk + r / 2 : kk - r / 2;
          const M = { x: os.x + os.r * Math.cos(aM), y: os.y + os.r * Math.sin(aM) };
          if (skad) dal = Math.min(dal, Math.hypot(M.x - skad.x, M.y - skad.y));
          if (dokad) dal = Math.min(dal, Math.hypot(M.x - dokad.x, M.y - dokad.y));
          kk = d.sw ? kk + r : kk - r;
        });
        return dal === Infinity ? 0 : dal;
      };
      wyb = ocena(drogi[0]) >= ocena(drogi[1]) ? drogi[0] : drogi[1];
    }
    for (let i = a; i <= b2; i++) pkt[i].styczna = styczna(i, wyb.sw);
    for (let i = a + 1; i <= b2; i++) {
      pkt[i].luk = { r: okr(os.r), sweep: wyb.sw, duzy: wyb.rozp[i - a - 1] > Math.PI ? 1 : 0,
                     cx: os.x, cy: os.y };
    }
  }

  // Znajduje ciągi kolejnych punktów należących do tego samego pachołka.
  function ulozLuki(pkt) {
    let i = 0;
    while (i < pkt.length) {
      if (pkt[i].omija === undefined || pkt[i].ostry) { i++; continue; }
      let b2 = i;
      while (b2 + 1 < pkt.length && pkt[b2 + 1].omija === pkt[i].omija
             && !pkt[b2 + 1].ostry
             && Math.hypot(pkt[b2 + 1].x - pkt[b2].x, pkt[b2 + 1].y - pkt[b2].y) > 0.2) b2++;
      if (b2 > i) ulozLukiCiagu(pkt, i, b2);
      i = b2 + 1;
    }
  }

  function osOminiecia(e, skad, dokad, weNr) {
    let kx = 0, ky = 0;
    if (skad && dokad) { kx = dokad.x - skad.x; ky = dokad.y - skad.y; }
    if (Math.hypot(kx, ky) < 0.3) {
      if (skad) { kx = e.x - skad.x; ky = e.y - skad.y; }
      else if (dokad) { kx = dokad.x - e.x; ky = dokad.y - e.y; }
    }
    const dk = Math.hypot(kx, ky);
    const jazda = dk > 1e-6 ? { x: kx / dk, y: ky / dk } : { x: 1, y: 0 };
    let px = -jazda.y, py = jazda.x;          // lewa strona jazdy
    const kr = kropkiElementu(e);
    const we = weNr === undefined ? e.we : weNr;
    if (we !== undefined && kr[we]) {
      // kropka wskazana ręką decyduje, czy mijamy z lewej, czy z prawej
      if ((kr[we].x - e.x) * px + (kr[we].y - e.y) * py < 0) { px = -px; py = -py; }
    }
    const pl = polElementu(e);
    const r = Math.max(pl.wzdluz, pl.wpoprzek) + LUZ_OMINIECIA;
    return { x: okr(e.x + px * r), y: okr(e.y + py * r), styczna: jazda };
  }

  function kropkiElementu(e) {
    if (e.typ === "start") {
      // jedna kropka, tuż za grotem strzałki — ze startu tylko się wyjeżdża
      const q = obrocLok(e, 1.62, 0);
      return [{ x: q.x, y: q.y, el: e.id, i: 0 }];
    }
    const pl = polElementu(e);
    if (naWylot(e)) {
      const d = pl.wpoprzek + ODSTEP_KROPKI;
      return [obrocLok(e, 0, -d), obrocLok(e, 0, d)]
        .map((q, i) => ({ x: q.x, y: q.y, el: e.id, i: i }));
    }
    // pachołek, opona, litera, zatrzymanie: mija się je z każdej strony
    const d = Math.max(pl.wzdluz, pl.wpoprzek) + ODSTEP_KROPKI;
    return [[0, -d], [d, 0], [0, d], [-d, 0]].map((xy, i) => {
      const q = obrocLok(e, xy[0], xy[1]);
      return { x: q.x, y: q.y, el: e.id, i: i };
    });
  }

  function wejscieElementu(e) {
    if (e.typ === "start" || e.we === undefined) return null;
    return kropkiElementu(e)[e.we] || null;
  }
  function wyjscieElementu(e) {
    const kr = kropkiElementu(e);
    if (e.typ === "start") return kr[0];
    if (naWylot(e)) return e.we === undefined ? null : (kr[1 - e.we] || null);
    return e.wy === undefined ? null : (kr[e.wy] || null);
  }

  function figuraZamknieta(bieg) {
    return bieg.length > 2 &&
      Math.hypot(bieg[0].x - bieg[bieg.length - 1].x, bieg[0].y - bieg[bieg.length - 1].y) < 0.05;
  }

  // Koło ma cztery kropki, figura otwarta — swoje dwa końce. Kropki leżą TUŻ OBOK
  // linii figury, a nie na niej: sama linia jest uchwytem do przesuwania całej
  // wolty i kropka postawiona na niej odbierałaby jej to dotknięcie. Wjazd i tak
  // liczy się do prawdziwego punktu na obwodzie — kropka to tylko rączka.
  function kropkiFigury(figId) {
    const bieg = punktyFiguryZTor(figId);
    if (bieg.length < 2) return [];
    if (!figuraZamknieta(bieg)) {
      // końce półwolty i serpentyny: kropka wysunięta w przedłużeniu figury
      return [[bieg[0], bieg[1]], [bieg[bieg.length - 1], bieg[bieg.length - 2]]]
        .map((para, i) => {
          const dx = para[0].x - para[1].x, dy = para[0].y - para[1].y;
          const d = Math.hypot(dx, dy) || 1;
          return { x: okr(para[0].x + dx / d * ODSTEP_KROPKI),
                   y: okr(para[0].y + dy / d * ODSTEP_KROPKI),
                   fig: figId, i: i, zamkn: false };
        });
    }
    const obwod = bieg.slice(0, -1);
    const xs = obwod.map((t) => t.x), ys = obwod.map((t) => t.y);
    const cx = (Math.max.apply(null, xs) + Math.min.apply(null, xs)) / 2;
    const cy = (Math.max.apply(null, ys) + Math.min.apply(null, ys)) / 2;
    const out = [];
    for (let n = 0; n < 4; n++) {
      const j = Math.round(obwod.length * n / 4) % obwod.length;
      const dx = obwod[j].x - cx, dy = obwod[j].y - cy;
      const d = Math.hypot(dx, dy) || 1;
      out.push({ x: okr(obwod[j].x + dx / d * ODSTEP_KROPKI),
                 y: okr(obwod[j].y + dy / d * ODSTEP_KROPKI),
                 fig: figId, i: n, zamkn: true, obw: j });
    }
    return out;
  }

  function kluczKropki(k) {
    return k.el !== undefined ? "e" + k.el + ":" + k.i : "f" + k.fig + ":" + k.i;
  }

  function wszystkieKropki() {
    const out = [];
    stan.elementy.forEach((e) => { kropkiElementu(e).forEach((k) => out.push(k)); });
    const zrobione = new Set();
    stan.tor.forEach((t) => {
      if (!t.figId || zrobione.has(t.figId)) return;
      zrobione.add(t.figId);
      kropkiFigury(t.figId).forEach((k) => out.push(k));
    });
    return out;
  }

  // Na placu kropka wygrywa tylko wtedy, gdy palec jest naprawdę bliżej niej niż
  // linii figury i niż kształtu jakiejkolwiek przeszkody. Bez tego kropka odbierała
  // wolcie dotknięcie jej własnej linii — a właśnie za tę linię przesuwa się całą
  // figurę. Zasięg chwytu kropki jest duży (palec, nie kursor), więc samo „w zasięgu"
  // nie może wystarczyć.
  function kropkaBlizejNizReszta(p, k) {
    const dK = Math.hypot(k.x - p.x, k.y - p.y);
    const f = figuraPod(p);
    if (f && f.d < dK) return false;
    for (let i = 0; i < stan.elementy.length; i++) {
      if (odlegloscOd(stan.elementy[i], p) < dK) return false;
    }
    return true;
  }

  function kropkaPod(p, zasieg) {
    let naj = null, najD = zasieg || chwytKropki();
    wszystkieKropki().forEach((k) => {
      const d = Math.hypot(k.x - p.x, k.y - p.y);
      if (d < najD) { najD = d; naj = k; }
    });
    return naj;
  }

  // Kropki, przez które przejazd naprawdę idzie — te świecą na zielono.
  // Zielona kropka znaczy „tędy jedzie koń" — czyli tędy biegnie NARYSOWANA
  // linia. Po przecięciu trasy potrafi zostać ćwiczenie złożone z jednego
  // punktu; z jednego punktu nie da się narysować żadnej linii, więc jego
  // kropka nie ma prawa świecić. Luiza, 22 września: „pomimo usuniętej trasy
  // kropka nadal jest na zielono, a powinna być na biało".
  function kropkiWTrasie() {
    const zb = new Set();
    const kroki = krokiTrasy();
    const ile = {};
    kroki.forEach((k) => { ile[k.cw] = (ile[k.cw] || 0) + 1; });

    // które przejścia i figury mają pod sobą prawdziwy odcinek
    const zywe = new Map();          // id elementu → zbiór numerów przejść
    const zyweFig = new Set();
    let startZywy = false;
    kroki.forEach((k) => {
      if ((ile[k.cw] || 0) < 2) return;
      if (k.start) { startZywy = true; return; }
      if (k.el) {
        if (!zywe.has(k.el.id)) zywe.set(k.el.id, new Set());
        zywe.get(k.el.id).add(k.nr);
        return;
      }
      if (k.figId) zyweFig.add(k.figId);
    });

    stan.elementy.forEach((e) => {
      if (e.typ === "start") { if (e.wpiety && startZywy) zb.add("e" + e.id + ":0"); return; }
      const moje = zywe.get(e.id);
      if (!moje || !moje.size) return;
      const krE = kropkiElementu(e);
      przejsciaElementu(e).forEach((p) => {
        if (!moje.has(p.nr)) return;
        if (p.we !== undefined && krE[p.we]) zb.add(kluczKropki(krE[p.we]));
      });
      // drąg i okser jedzie się na wylot: druga kropka to wyjazd z tego samego przejścia
      if (moje.has(e.nr)) {
        const we = wejscieElementu(e), wy = wyjscieElementu(e);
        if (we) zb.add(kluczKropki(we));
        if (wy) zb.add(kluczKropki(wy));
      }
    });
    stan.tor.forEach((t) => {
      if (!t.figNr || !t.figId || t.figWe === undefined) return;
      if (!zyweFig.has(t.figId)) return;
      kropkiFigury(t.figId).forEach((k) => {
        if (k.zamkn ? k.obw === t.figWe : k.i === t.figWe) zb.add(kluczKropki(k));
      });
    });
    return zb;
  }

  // ---- łączenie kropek: „B jedzie zaraz po A" ----
  function krokKropki(k) {
    if (k.el !== undefined) { const e = znajdz(k.el); return e ? { el: e } : null; }
    const t = pierwszyPunktFigury(k.fig);
    return t ? { punkt: t } : null;
  }
  function numerKroku(c) { return c.el ? c.el.nr : c.punkt.figNr; }
  function ustawNumerKroku(c, n) { if (c.el) c.el.nr = n; else c.punkt.figNr = n; }
  function opisKroku(c) {
    if (c.el) return TYPY[c.el.typ].nazwa;
    return c.punkt.figOsemka ? "Koło ósemki"
         : (c.punkt.figTyp ? FIGURY[c.punkt.figTyp].nazwa : "Figura");
  }
  function nastepnyWolnyNumer() {
    let maks = 0;
    stan.elementy.forEach((e) => {
      przejsciaElementu(e).forEach((p) => { if (p.nr > maks) maks = p.nr; });
    });
    punktyTrasy().forEach((q) => { if (q.nr > maks) maks = q.nr; });
    stan.tor.forEach((t) => { if (t.figNr > maks) maks = t.figNr; });
    return maks + 1;
  }
  // Wyjęcie JEDNEGO miejsca z kolejności — reszta zjeżdża o jeden.
  function zwolnijNumer(stary) {
    if (!stary) return;
    stan.elementy.forEach((e) => {
      if (e.nr && e.nr > stary) e.nr--;
      (e.powroty || []).forEach((p) => { if (p && p.nr && p.nr > stary) p.nr--; });
    });
    punktyTrasy().forEach((q) => { if (q.nr && q.nr > stary) q.nr--; });
    stan.tor.forEach((t) => { if (t.figNr && t.figNr > stary) t.figNr--; });
  }
  function wyjmijZKolejnosci(c) {
    const stary = numerKroku(c);
    if (!stary) return;
    if (c.el) {
      // zdejmujemy CAŁY wpis: wszystkie przejścia tego elementu
      const nry = przejsciaElementu(c.el).map((p) => p.nr).sort((a, b) => b - a);
      delete c.el.nr; delete c.el.we; delete c.el.powroty;
      nry.forEach((n) => zwolnijNumer(n));   // od największego, żeby numery nie uciekały
    } else {
      delete c.punkt.figNr;
      zwolnijNumer(stary);
    }
  }
  function zrobMiejsceOd(n) {
    stan.elementy.forEach((e) => {
      if (e.nr && e.nr >= n) e.nr++;
      (e.powroty || []).forEach((p) => { if (p && p.nr && p.nr >= n) p.nr++; });
    });
    punktyTrasy().forEach((q) => { if (q.nr && q.nr >= n) q.nr++; });
    stan.tor.forEach((t) => { if (t.figNr && t.figNr >= n) t.figNr++; });
  }

  // Numerowanie dotknięciem — droga na skróty obok ciągnięcia od kropki do kropki.
  function numerujPod(p0) {
    const cel = doNumeracjiPod(p0);
    if (cel && cel.el && cel.el.typ === "start") {
      // Start jest początkiem z definicji — numeru nie dostaje, bo nie jest
      // przeszkodą. Dawniej dostawał i nic się nie działo, co wyglądało na awarię.
      pokazPodpowiedz(krokiTrasy().length
        ? "Start jest zawsze pierwszy — trasa już od niego biegnie"
        : "Start jest zawsze pierwszy — teraz pociągnij od jego kropki do przeszkody");
      return;
    }
    if (!cel) {
      pokazPodpowiedz(punktStartu()
        ? "Ciągnij od kropki do kropki, tak jak koń jedzie · samo dotknięcie też numeruje"
        : "Ciągnij od kropki do kropki · start postawisz kafelkiem „Start\u201d");
      return;
    }
    const mial = cel.el ? cel.el.nr : cel.punkt.figNr;
    if (mial) {
      zdejmijNumer(cel);
      pokazPodpowiedz(`${cel.opis}: numer ${mial} zdjęty — reszta przesunięta`);
    } else {
      const pierwszy = !saReczneNumery();
      const nr = nadajNumer(cel);
      pokazPodpowiedz(pierwszy
        ? (punktStartu()
            ? `${cel.opis} to pierwsza przeszkoda po starcie · dotykaj dalej po kolei`
            : `${cel.opis} to początek przejazdu · dotykaj dalej po kolei`)
        : `${cel.opis} to ${nr} · dotykaj dalej po kolei`);
    }
    rysuj(); zapiszLokalnie(); odswiezKontekst(); odswiezLiczniki(); odswiezOstrzezenia();
  }

  // Ciągnięcie dokłada przejazd, dotknięcie go zdejmuje. Zielona kropka znaczy
  // „tędy koń jedzie", więc dotknięcie jej zdejmuje DOKŁADNIE ten przejazd, a nie
  // całą przeszkodę — Luiza, 17 września, pytając wprost: „jak usunąć tylko
  // kawałek trasy?". Bez tego jeden zły ruch kasowało się razem z całą trasą.
  function zdejmijKropke(k) {
    if (!k || k.el === undefined) return false;
    const e = znajdz(k.el);
    if (!e || e.typ === "start") return false;
    const p = przejscieNaKropce(e, k.i);
    if (!p) return false;
    zapiszHistorie();
    zdejmijPrzejscie(e, p.nr);
    const zostalo = ilePrzejsc(e);
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
    odswiezLiczniki(); odswiezOstrzezenia();
    pokazPodpowiedz(zostalo
      ? `${TYPY[e.typ].nazwa}: przejazd ${p.nr} zdjęty — reszta trasy zjechała o jeden`
      : `${TYPY[e.typ].nazwa} zdjęty z trasy — sprzęt został na placu`);
    return true;
  }

  const RAZ = { 2: "drugi ", 3: "trzeci ", 4: "czwarty " };

  function naPiasku(p) {
    return p && p.x > -0.2 && p.y > -0.2 && p.x < stan.dl + 0.2 && p.y < stan.sz + 0.2;
  }

  // Puszczenie tuż przy jakiejkolwiek kropce znaczy „celowałam w nią i chybiłam",
  // a nie „chcę tu punkt trasy" — także wtedy, gdy ta kropka nie była dozwolonym
  // celem (np. druga kropka tego samego drąga).
  function kropkaBlisko(p) {
    const r = chwytKropki();
    return wszystkieKropki().some((k) => Math.hypot(k.x - p.x, k.y - p.y) < r);
  }

  // Wolny punkt wpina się ZARAZ ZA tym, od czego ciągniemy — reszta trasy zjeżdża
  // o jeden, tak samo jak przy dokładaniu przeszkody.
  function dodajPunktTrasy(odKropka, p) {
    const ka = krokKropki(odKropka);
    if (!ka) return null;
    zapiszHistorie();
    const start = !!(ka.el && ka.el.typ === "start");
    let nrA = 0;
    if (!start && ka.el) nrA = numerPrzyKropce(ka.el, odKropka.i) || ka.el.nr;
    else if (!start) nrA = numerKroku(ka);
    if (!start && !nrA) { nrA = nastepnyWolnyNumer(); ustawNumerKroku(ka, nrA); }
    const nrB = nrA + 1;
    zrobMiejsceOd(nrB);
    if (ka.el && !start) {
      if (naWylot(ka.el)) ka.el.we = 1 - odKropka.i;
      else if (omijany(ka.el)) { if (ilePrzejsc(ka.el) <= 1) ka.el.we = odKropka.i; }
      else ka.el.wy = odKropka.i;
    }
    if (ka.punkt) ka.punkt.figWe = odKropka.zamkn ? odKropka.obw : (1 - odKropka.i);
    const id = stan.nast++;
    punktyTrasy().push({ id: id, nr: nrB, x: okr(p.x), y: okr(p.y), moc: 1 });
    return { nr: nrB, id: id };
  }

  function polaczKropki(a, b) {
    const ka = krokKropki(a), kb = krokKropki(b);
    if (!ka || !kb) return null;
    // Kropka do kropki W OBRĘBIE TEGO SAMEGO pachołka — tak obchodzi się go
    // dookoła. Przy drągu to nie ma sensu: przez drąg przeskakuje się na wylot.
    const tenSam = !!(ka.el && kb.el && ka.el === kb.el);
    if (tenSam && !omijany(ka.el)) return null;
    if (tenSam && !ka.el.nr) {
      return { blad: "Najpierw wpnij ten pachołek w trasę, potem obchodź go kropkami" };
    }
    if (ka.punkt && kb.punkt && ka.punkt === kb.punkt) return null;

    // SKLEJANIE PRZECIĘTEJ TRASY. Kropka, którą koń już jedzie, normalnie jest
    // zajęta — ale jeśli zaczyna się od niej NOWE ĆWICZENIE, to doprowadzenie do
    // niej linii znaczy jedno: „to ma znów być jedna trasa". Luiza, 22 września:
    // „klikam, ale linia się nie tworzy" — ciągnęła dokładnie tam i dostawała
    // komunikat o zajętej kropce, a przerwa zostawała.
    if (kb.el && !tenSam) {
      const pz = przejscieNaKropce(kb.el, b.i);
      if (pz && pz.zrodlo && pz.zrodlo.nowe) {
        zapiszHistorie();
        delete pz.zrodlo.nowe;
        return { sklejone: true, nr: pz.nr, opis: opisKroku(kb), skad: opisKroku(ka) };
      }
    }

    if (kb.el && omijany(kb.el) && kropkaZajeta(kb.el, b.i)) {
      return { blad: "Tą kropką koń już tędy jedzie — złap inną wokół tego pachołka" };
    }
    if (kb.el && ilePrzejsc(kb.el) >= kropkiElementu(kb.el).length) {
      return { blad: `${TYPY[kb.el.typ].nazwa} jest już objechany ze wszystkich stron` };
    }
    if (kb.el && kb.el.typ === "start") {
      return { blad: "Start jest zawsze pierwszy — ciągnij OD niego, a nie do niego" };
    }
    zapiszHistorie();
    const start = !!(ka.el && ka.el.typ === "start");

    // POWRÓT. Jeśli cel już stoi na trasie, to ciągnięcie do niego znaczy „koń
    // mija go jeszcze raz", a nie „przestaw go w kolejce". Tak się jeździ slalom
    // tam i z powrotem, tak wraca się na przeszkodę w parkurze i tak obchodzi się
    // pachołek dookoła.
    const powrot = !!(kb.el && ilePrzejsc(kb.el));
    if (!powrot && !kb.el) wyjmijZKolejnosci(kb);

    // Z której kropki ciągniemy, z tej liczymy numer: przy przeszkodzie mijanej
    // kilka razy kropka mówi, KTÓRE przejście kontynuujemy.
    let nrA = 0;
    if (!start && ka.el) {
      nrA = numerPrzyKropce(ka.el, a.i) || ka.el.nr;
    } else if (!start) {
      nrA = numerKroku(ka);
    }
    // UWAGA: start ma numer 0, a 0 jest falsy — bez `!start` dostawałby numer 1
    // i stawał się pierwszą przeszkodą własnego przejazdu.
    if (!start && !nrA) { nrA = nastepnyWolnyNumer(); ustawNumerKroku(ka, nrA); }
    const nrB = nrA + 1;
    zrobMiejsceOd(nrB);

    if (start) {
      ka.el.wpiety = true;             // dopiero to wpina start w trasę
      // Strzałka startu mówi, W KTÓRĄ STRONĘ koń rusza. Jeśli zostaje wycelowana
      // gdzie indziej niż biegnie trasa, linia wychodzi z kropki startu w stronę
      // grotu i dopiero zawraca — obok strzałki robi się druga kreska. Luiza,
      // 22 września: „dołączyłam start do kropki i stworzyła mi się linia
      // dodatkowa". Połączenie jest deklaracją kierunku, więc grot się do niego
      // ustawia. Potem można go obrócić gałką, jeśli koń ma ruszyć inaczej.
      const celP = kb.el ? (kropkiElementu(kb.el)[b.i] || kb.el) : (kb.punkt || null);
      if (celP) {
        const dx = celP.x - ka.el.x, dy = celP.y - ka.el.y;
        if (Math.hypot(dx, dy) > 0.5) {
          ka.el.kat = Math.round(Math.atan2(dy, dx) * 180 / Math.PI);
        }
      }
    }
    // z której strony koń wychodzi i z której wchodzi
    if (ka.el && !start) {
      if (naWylot(ka.el)) ka.el.we = 1 - a.i;   // wyszedł tą kropką, więc wszedł drugą
      else if (omijany(ka.el)) { if (ilePrzejsc(ka.el) <= 1) ka.el.we = a.i; }
      else ka.el.wy = a.i;
    }
    if (ka.punkt) ka.punkt.figWe = a.zamkn ? a.obw : (1 - a.i);
    if (kb.el) {
      delete kb.el.pozaTrasa;   // relikt po odręcznym torze; wpięcie go kasuje
      if (powrot) dodajPrzejscie(kb.el, nrB, b.i);
      else {
        kb.el.nr = nrB;
        kb.el.we = b.i;
        if (!naWylot(kb.el)) delete kb.el.wy;
      }
    } else {
      ustawNumerKroku(kb, nrB);
    }
    if (kb.punkt) kb.punkt.figWe = b.zamkn ? b.obw : b.i;
    // PRZECIĘCIE ZDEJMUJEMY SAMI. Luiza, 22 września: „klikam, ale linia się nie
    // tworzy". Element, przy którym wcześniej przecięła trasę, nosił znacznik
    // „tu zaczyna się nowe ćwiczenie". Połączenie go ręką ustawiało numer, ale
    // znacznik zostawał — więc przejazd dalej rozpadał się na kawałki i linia
    // między nimi się nie rysowała. Ciągnięcie od kropki do kropki znaczy
    // „te dwie rzeczy koń robi jedna po drugiej", więc przerwa musi zniknąć.
    zdejmijPrzerwe(kb, nrB);
    return { nr: nrB, opis: opisKroku(kb), skad: opisKroku(ka), zeStartu: start,
             powrot: powrot, ile: kb.el ? ilePrzejsc(kb.el) : 1 };
  }

  // Zdejmuje znacznik „nowe ćwiczenie" z tego, do czego właśnie doprowadziliśmy
  // linię. Znacznik siedzi w różnych miejscach zależnie od tego, co to za krok.
  function zdejmijPrzerwe(kb, nrB) {
    if (kb.el) {
      const p = przejsciaElementu(kb.el).find((q) => q.nr === nrB);
      if (p && p.zrodlo) delete p.zrodlo.nowe;
      return;
    }
    if (kb.punktT) { delete kb.punktT.nowe; return; }
    if (kb.punkt) { delete kb.punkt.figNowe; }
  }

  // ---- numerowanie ręką ----
  // Na Hubertusie kolejność to nie jest kolejność przeszkód: „3 przeszkoda,
  // 4 przeniesienie pachołka, 5 wolta". Dlatego numer może dostać KAŻDY element
  // i każda figura, a kolejność układa ręka, nie przebieg linii.
  function pierwszyPunktFigury(figId) {
    const idx = indeksyFigury(figId);
    return idx.length ? stan.tor[idx[0]] : null;
  }

  // Wszystkie ręcznie nadane numery, po kolei.
  function reczneNumery() {
    const out = [];
    stan.elementy.forEach((e) => {
      if (e.nr) out.push({ nr: e.nr, zdejmij: () => delete e.nr });
      (e.powroty || []).forEach((p) => {
        if (p && p.nr) out.push({ nr: p.nr, zdejmij: () => {
          e.powroty = (e.powroty || []).filter((q) => q !== p);
          porzadkujPrzejscia(e);
        } });
      });
    });
    stan.tor.forEach((t) => { if (t.figNr) out.push({ nr: t.figNr, zdejmij: () => delete t.figNr }); });
    return out.sort((a, b) => a.nr - b.nr);
  }
  function saReczneNumery() {
    return stan.elementy.some((e) => ilePrzejsc(e)) || punktyTrasy().length
        || stan.tor.some((t) => t.figNr);
  }

  function nadajNumer(cel) {
    const lista = reczneNumery();
    const nastepny = lista.length ? Math.max.apply(null, lista.map((w) => w.nr)) + 1 : 1;
    zapiszHistorie();
    if (cel.el) cel.el.nr = nastepny;
    else cel.punkt.figNr = nastepny;
    return nastepny;
  }

  // Zdejmuje JEDNO przejście: najpierw powrót, a dopiero potem pierwsze.
  // Inaczej „Wyjmij z trasy" przy przeszkodzie mijanej dwa razy kasowałoby oba
  // naraz i nie dałoby się cofnąć samego powrotu.
  function zdejmijNumer(cel) {
    zapiszHistorie();
    if (cel.el && ilePrzejsc(cel.el) > 1) {
      const lista = przejsciaElementu(cel.el);
      const ost = lista[lista.length - 1];
      cel.el.powroty = (cel.el.powroty || []).filter((p) => !(p && p.nr === ost.nr));
      if (cel.el.nr === ost.nr) { delete cel.el.nr; delete cel.el.we; }
      porzadkujPrzejscia(cel.el);
      zwolnijNumer(ost.nr);
      return ost.nr;
    }
    const stary = cel.el ? cel.el.nr : cel.punkt.figNr;
    if (cel.el) { delete cel.el.nr; delete cel.el.we; delete cel.el.wy; delete cel.el.numer; }
    else { delete cel.punkt.figNr; delete cel.punkt.figWe; delete cel.punkt.figNumer; }
    zwolnijNumer(stary);
    return stary;
  }

  // ---- numeracja: z trasy albo własna ----
  // Luiza, 16 września: „mamy dać wybór naszemu odbiorcy, czy numeracja ma być
  // automatyczna, to znaczy równoznaczna z tym, co ustawimy jako pierwsze na
  // planszy, czy będzie robić sobie tę numerację indywidualnie".
  //
  // KOLEJNOŚĆ JAZDY to zawsze e.nr / t.figNr i nikt jej nie rusza — inaczej wpisanie
  // numeru przestawiałoby przejazd. Własny numer to osobna rzecz: e.numer / t.figNumer,
  // czyli to, co widać na rysunku. Dzięki temu „przeszkoda 7, a jedzie się ją trzecią"
  // jest do zapisania, a trasa dalej wie, którędy biegnie.
  function wlasnaNumeracja() { return stan.numeracja === "wlasna"; }
  // Przy numeracji własnej rysunek jest PUSTY, dopóki człowiek nie wpisze numeru.
  // Luiza, 16 września: „skoro jest to własne, no to te cyfry powinny zniknąć" —
  // i ma rację: gdyby pod spodem dalej świeciły numery z trasy, wybór nic by nie
  // zmieniał i wyglądałby na zepsuty.
  function numerPokazywany(e) {
    if (!e.nr) return e.nr;
    if (wlasnaNumeracja()) return e.numer || "";
    const lok = krokiTrasy().filter((k) => k.el === e && !k.start).map((k) => k.lok);
    if (!lok.length) return e.nr;
    return lok.length > 1 ? lok.join("\u00b7") : lok[0];
  }
  function numerFiguryPokazywany(t) {
    if (!t.figNr) return t.figNr;
    if (wlasnaNumeracja()) return t.figNumer || "";
    const k = krokiTrasy().find((q) => q.punkt === t);
    return k ? k.lok : t.figNr;
  }

  function ustawNumeracje(jaka) {
    if ((stan.numeracja === "wlasna" ? "wlasna" : "auto") === jaka) {
      return pokazPodpowiedz(jaka === "wlasna"
        ? "Numeracja własna jest już włączona"
        : "Numeracja automatyczna jest już włączona");
    }
    zapiszHistorie();
    stan.numeracja = jaka;
    odswiezNumeracje();
    rysuj(); zapiszLokalnie(); odswiezKontekst(); odswiezLiczniki();
    pokazPodpowiedz(jaka === "wlasna"
      ? "Numeracja własna — rysunek jest bez numerów, dopóki ich nie wpiszesz · zaznacz przeszkodę i wpisz numer w pasku"
      : "Numeracja automatyczna — numery idą po kolei z trasy");
  }

  // Obie możliwości stoją w menu obok siebie, a ptaszek mówi, która jest włączona.
  // Wcześniej był jeden guzik zmieniający napis: kto nie wiedział, że są dwie
  // opcje, ten widział tylko stan i nie miał skąd wiedzieć, że da się go zmienić.
  function odswiezNumeracje() {
    const wlasna = wlasnaNumeracja();
    const opisz = (id, tytul, pod, on) => {
      const b = $(id);
      if (!b) return;
      b.innerHTML = tytul + (on ? " ✓" : "") + `<span class="pod">${pod}</span>`;
      b.classList.toggle("wlaczony", on);
      b.setAttribute("aria-checked", on ? "true" : "false");
    };
    opisz("btnNumAuto", "Automatyczna",
          "numer bierze się z kolejności na trasie — pierwsza przeszkoda to 1", !wlasna);
    opisz("btnNumWlasna", "Własna",
          "rysunek zostaje bez numerów, dopóki sama ich nie wpiszesz przy zaznaczonej przeszkodzie", wlasna);
  }

  // Jedno ustawienie na całą trasę: albo wszędzie łuki, albo wszędzie kąty.
  function przelaczKatyTrasy() {
    zapiszHistorie();
    stan.ostreKaty = !stan.ostreKaty;
    rysuj(); zapiszLokalnie(); odswiezKontekst();
    pokazPodpowiedz(stan.ostreKaty
      ? "Cała trasa na ostre kąty — koń zawraca w miejscu, nie po łuku"
      : "Cała trasa po łukach — tak, jak koń naprawdę jedzie");
  }

  function wyczyscNumery() {
    if (!saReczneNumery()) return pokazPodpowiedz("Nie ma ręcznych numerów do zdjęcia");
    zapiszHistorie();
    stan.elementy.forEach((e) => {
      delete e.nr; delete e.powroty; delete e.we; delete e.wy; delete e.numer;
      delete e.nowe; delete e.wpiety;
    });
    stan.punkty = [];   // wolne punkty bez trasy nie mają czego trzymać
    stan.tor.forEach((t) => { delete t.figNr; delete t.figWe; delete t.figNumer; });
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
    odswiezLiczniki(); odswiezOstrzezenia();
    pokazPodpowiedz("Numery zdjęte — wróciła kolejność z trasy");
  }

  // Co siedzi pod palcem w trybie numerowania: element albo figura.
  function doNumeracjiPod(p) {
    const e = trafiony(p);
    if (e) return { el: e, opis: TYPY[e.typ].nazwa };
    const f = figuraPod(p);
    if (f) {
      const pkt = pierwszyPunktFigury(f.figId);
      if (pkt) return { punkt: pkt,
        opis: pkt.figOsemka ? "Koło ósemki" : (pkt.figTyp ? FIGURY[pkt.figTyp].nazwa : "Figura") };
    }
    return null;
  }

  // Numeruje przeszkody w kolejności, w jakiej mija je tor.
  function numeryZToru(sciezki) {
    const numery = new Map();
    const przeszkody = stan.elementy.filter(przejezdzalny);
    if (!sciezki.length || !przeszkody.length) return { numery, lista: [] };

    // próbkujemy tor co ~25 cm i zapamiętujemy przebytą drogę
    const probki = [];
    let przebyte = 0;
    sciezki.forEach((sc) => {
      let dl = 0;
      try { dl = sc.getTotalLength(); } catch (err) { return; }
      const krok = Math.max(1, Math.round(dl / 0.25));
      for (let i = 0; i <= krok; i++) {
        const q = sc.getPointAtLength(dl * i / krok);
        probki.push({ x: q.x, y: q.y, s: przebyte + dl * i / krok });
      }
      przebyte += dl + 1000; // odstęp między odcinkami, żeby się nie przeplatały
    });
    if (!probki.length) return { numery, lista: [] };

    const trafione = [];
    przeszkody.forEach((e) => {
      // przeszkoda z własnym punktem toru jest częścią przejazdu z definicji —
      // ktoś ją tam świadomie wpiął, więc numer należy jej się niezależnie od miary
      const wpieta = !!e.naFig || stan.tor.some((t) => t.el === e.id);
      // Ósemka, wolta na drągu, powrót tą samą linią — tor potrafi minąć tę samą
      // przeszkodę dwa razy i wtedy to są DWA skoki: dwa numery i dwie odległości.
      // Szukamy więc wszystkich zbliżeń, a nie jednego najbliższego punktu.
      const przejscia = [];
      let otwarte = null, ostatnie = 0;
      for (let i = 0; i < probki.length; i++) {
        const q = probki[i], d = odlegloscOd(e, q);
        if (d < ZASIEG_TORU) {
          if (otwarte && q.s - ostatnie < 3) {
            if (d < otwarte.d) { otwarte.d = d; otwarte.s = q.s; }
          } else {
            otwarte = { d: d, s: q.s };
            przejscia.push(otwarte);
          }
          ostatnie = q.s;
        } else otwarte = null;
      }
      if (!przejscia.length && wpieta) {
        let naj = null, najD = Infinity;
        probki.forEach((q) => {
          const d = odlegloscOd(e, q);
          if (d < najD) { najD = d; naj = q.s; }
        });
        if (naj !== null) przejscia.push({ d: najD, s: naj });
      }
      przejscia.forEach((pr) => trafione.push({ e: e, s: pr.s }));
    });

    trafione.sort((a, b) => a.s - b.s);
    trafione.forEach((t, i) => { t.nr = i + 1; });
    // Ręka jest ważniejsza: jeśli cokolwiek ponumerowano samodzielnie, to ta
    // kolejność jest prawdziwa i automat się nie wtrąca. Inaczej na jednym placu
    // stałyby dwie sprzeczne numeracje.
    if (numeryWlaczone && !saReczneNumery()) {
      // przeszkoda mijana dwa razy nosi oba numery: „3·7"
      const wg = new Map();
      trafione.forEach((t) => {
        if (!wg.has(t.e.id)) wg.set(t.e.id, []);
        wg.get(t.e.id).push(t.nr);
      });
      wg.forEach((nry, id) => numery.set(id, nry.join("\u00b7")));
    }
    // ręcznie wpisany numer ma pierwszeństwo przed kolejnością z trasy
    stan.elementy.forEach((e) => { if (e.nr) numery.set(e.id, e.nr); });
    return { numery, lista: trafione.map((t) => t.e), przejazdy: trafione };
  }

  // Podpisuje odległości między kolejnymi przeszkodami na trasie.
  // Dwie sąsiednie przerwy uznajemy za „ten sam szereg", gdy mają praktycznie równą
  // długość i biegną w tę samą stronę.
  function rowneOdstepy(p, q) {
    if (Math.abs(p.d - q.d) > 0.06) return false;
    const dp = Math.hypot(p.kx, p.ky) || 1, dq = Math.hypot(q.kx, q.ky) || 1;
    return (p.kx * q.kx + p.ky * q.ky) / (dp * dq) > 0.985;
  }

  // Pary, które dostały już podpis z toru — żeby zaznaczenie drąga nie dokładało drugiego
  // takiego samego.
  let oznaczonePary = new Set();
  let odleglosciTrasy = [];   // wiersze do listy odległości i na kartkę
  const kluczPary = (a, b) => (a.id < b.id ? a.id + "-" + b.id : b.id + "-" + a.id);

  // „2→3 · " — jeśli obie przeszkody mają numery. Bez numerów podpis zostaje sam.
  function numerPary(numery, a, b) {
    if (!numery) return "";
    const na = numery.get(a.id), nb = numery.get(b.id);
    return (na && nb) ? `${na}→${nb} · ` : "";
  }

  // Odległości NIE są rysowane na placu — plac zostaje rysunkiem. Tutaj tylko je
  // liczymy; pokazuje je lista pod paskiem „trasa" i tabelka pod planem na kartce.
  function policzOdleglosci(przejazdy) {
    oznaczonePary = new Set();
    const wiersze = [];

    // Liczymy po PRZEJAZDACH, nie po przeszkodach: ta sama przeszkoda mijana dwa
    // razy stoi w liście dwa razy i obie odległości wokół niej mają być policzone.
    const przerwy = [];
    for (let i = 0; i < przejazdy.length - 1; i++) {
      const a = przejazdy[i].e, b = przejazdy[i + 1].e;
      if (a === b) continue;   // dwa numery tej samej rzeczy pod rząd — nie ma między nimi odstępu
      if (przejazdy[i + 1].przerwij) continue;   // między nimi stoi figura
      przerwy.push({ a: a, b: b, na: przejazdy[i].nr, nb: przejazdy[i + 1].nr,
                     poz: i, d: odlegloscMiedzy(a, b),
                     srodki: Math.hypot(b.x - a.x, b.y - a.y),
                     kx: (b.x - a.x), ky: (b.y - a.y) });
    }

    // Szereg równych odstępów to jeden wiersz — tak, jak się o tym mówi:
    // „cztery drągi co 1,35", a nie trzy razy „1,35 m".
    const wKlamrze = new Set();
    const klamry = [];
    for (let i = 0; i < przerwy.length; i++) {
      if (wKlamrze.has(i)) continue;
      let j = i;
      // sąsiednie przerwy w szeregu muszą się stykać — po powrocie trasy na tę samą
      // przeszkodę w liście jest przeskok i klamra nie ma prawa go przeskoczyć
      while (j + 1 < przerwy.length && przerwy[j].b === przerwy[j + 1].a
             && rowneOdstepy(przerwy[j], przerwy[j + 1])) j++;
      if (j === i) continue;
      for (let k = i; k <= j; k++) { wKlamrze.add(k); oznaczonePary.add(kluczPary(przerwy[k].a, przerwy[k].b)); }
      const pierwszy = przerwy[i].a, ostatni = przerwy[j].b;
      const ile = j - i + 2;
      const jedenTyp = przerwy.slice(i, j + 1).every((p) => p.a.typ === pierwszy.typ) &&
                       ostatni.typ === pierwszy.typ;
      klamry.push({ od: i, a: pierwszy, b: ostatni, d: przerwy[i].d, para: przerwy[i].b,
                    na: przerwy[i].na, nb: przerwy[j].nb,
                    ile: ile, rzecz: jedenTyp ? mnoga(pierwszy.typ, ile) : mnoga("inny", ile) });
    }

    for (let i = 0; i < przerwy.length; i++) {
      const klamra = klamry.find((k) => k.od === i);
      if (klamra) {
        wiersze.push(zbudujWiersz(klamra.a, klamra.b, klamra.na, klamra.nb, klamra.d,
          `${klamra.ile} ${klamra.rzecz} co ${fmt(klamra.d)} m`, klamra.para, null));
        continue;
      }
      if (wKlamrze.has(i)) continue;
      const p = przerwy[i];
      if (p.srodki > 40) continue;
      oznaczonePary.add(kluczPary(p.a, p.b));
      // ogon = co stoi za drugą przeszkodą; przy poprawianiu jedzie razem z nią,
      // żeby naprawa jednej odległości nie zepsuła następnej. Każdą przeszkodę
      // bierzemy raz, choćby trasa mijała ją później jeszcze raz.
      const ogon = [], juz = new Set([p.a.id, p.b.id]);
      for (let k = p.poz + 2; k < przejazdy.length; k++) {
        const e = przejazdy[k].e;
        if (juz.has(e.id)) continue;
        juz.add(e.id); ogon.push(e);
      }
      wiersze.push(zbudujWiersz(p.a, p.b, p.na, p.nb, p.d, `${fmt(p.d)} m`, p.b, ogon));
    }
    return wiersze;
  }

  // Najbliższa odległość, która wychodzi na pełną liczbę fuli wszystkim wybranym
  // wielkościom. Przy mieszanej grupie to zawsze kompromis — bierzemy średnią.
  function najlepszaOdleglosc(a, b) {
    const gr = grupy();
    const naziemne = TYPY[a.typ].naziemny && TYPY[b.typ].naziemny;
    const naziemneDragi = naziemne
      && (a.typ === "drag" || a.typ === "kawaletka")
      && (b.typ === "drag" || b.typ === "kawaletka");
    const teraz = odlegloscMiedzy(a, b);
    const idealna = (g, n) => naziemne ? n * KONIE[g].fula : zapasKonia(g) + n * KONIE[g].fula;

    // Nie bierzemy samej średniej — ona przy różnych wielkościach nie trafia w nikogo.
    // Zbieramy kandydatów: ideał każdej grupy, środek ich wspólnego okna i średnią.
    const kandydaci = [];
    for (let n = 1; n <= 8; n++) {
      const ideały = gr.map((g) => idealna(g, n));
      ideały.forEach((v) => kandydaci.push({ v: v, n: n }));
      const lo = Math.max.apply(null, ideały.map((v) => v - LUZ_OK));
      const hi = Math.min.apply(null, ideały.map((v) => v + LUZ_OK));
      if (lo <= hi) kandydaci.push({ v: (lo + hi) / 2, n: n });   // zielone dla wszystkich
      kandydaci.push({ v: ideały.reduce((x, y) => x + y, 0) / ideały.length, n: n });
    }

    // Najlepszy kandydat dla każdej liczby fuli osobno — bo przy mieszanej grupie
    // często NIE DA SIĘ zrobić zielonego przy zachowaniu liczby fuli, a wtedy
    // instruktorka ma wybrać sama, nie aplikacja.
    const najlepszeDlaN = new Map();
    kandydaci.forEach((k) => {
      const oceny = gr.map((g) => ocen(k.v, g, naziemneDragi));
      const kara = oceny.filter((oc) => oc.klasa === "stop").length * 200 +
                   oceny.filter((oc) => oc.klasa === "zle").length * 60 +
                   oceny.filter((oc) => oc.klasa === "blisko").length * 8 +
                   Math.abs(k.v - teraz) * 2;
      const stary = najlepszeDlaN.get(k.n);
      if (!stary || kara < stary.kara) najlepszeDlaN.set(k.n, { cel: k.v, kara: kara, n: k.n, oceny: oceny });
    });

    const nTeraz = Math.max(1, Math.round(naziemne
      ? teraz / KONIE[gr[0]].fula
      : (teraz - zapasKonia(gr[0])) / KONIE[gr[0]].fula));

    return [...najlepszeDlaN.values()]
      .filter((p) => Math.abs(p.n - nTeraz) <= 1 && p.cel > 1)
      .sort((x, y) => {
        const zielX = x.oceny.filter((oc) => oc.klasa === "ok").length;
        const zielY = y.oceny.filter((oc) => oc.klasa === "ok").length;
        if (zielX !== zielY) return zielY - zielX;
        return Math.abs(x.cel - teraz) - Math.abs(y.cel - teraz);
      })
      .slice(0, 3);
  }

  function poprawOdleglosc(w, cel) {
    if (!cel) return;
    const naziemne = TYPY[w.a.typ].naziemny && TYPY[w.b.typ].naziemny;
    const srodkiCel = naziemne ? cel.cel : cel.cel + glebokosc(w.a) / 2 + glebokosc(w.b) / 2;
    const dx = w.b.x - w.a.x, dy = w.b.y - w.a.y;
    const dl = Math.hypot(dx, dy) || 1;
    const przesun = { x: (dx / dl) * srodkiCel - dx, y: (dy / dl) * srodkiCel - dy };

    const ruszane = [w.b].concat(w.ogon || []);
    const pozaPlacem = ruszane.some((e) =>
      e.x + przesun.x < 0.4 || e.x + przesun.x > stan.dl - 0.4 ||
      e.y + przesun.y < 0.4 || e.y + przesun.y > stan.sz - 0.4);
    if (pozaPlacem) return pokazPodpowiedz("Po poprawce przeszkody wyszłyby poza plac — przesuń najpierw początek");

    zapiszHistorie();
    // najpierw wszystkie przeszkody łapią swoje punkty toru, potem ruszane jadą razem
    zakotwiczWszystkie();
    const przed = ruszane.map((e) => ({ id: e.id, x: e.x, y: e.y }));
    ruszane.forEach((e) => { e.x = okr(e.x + przesun.x); e.y = okr(e.y + przesun.y); });
    przesunTorZaElementami(przed);
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
    odswiezLiczniki(); odswiezOstrzezenia();
    $("zaslonaOkno").classList.remove("widoczna");
    pokazPodpowiedz(`Ustawione na ${fmt(cel.cel)} m — ${cel.n} ${odmianaFuli(cel.n)}` +
      ((w.ogon && w.ogon.length) ? `; reszta trasy przesunięta razem` : ""));
  }

  function zbudujWiersz(a, b, na0, nb0, d, co, para, ogon) {
    const naziemne = TYPY[a.typ].naziemny && TYPY[para.typ].naziemny;
    const naziemneDragi = naziemne
      && (a.typ === "drag" || a.typ === "kawaletka")
      && (para.typ === "drag" || para.typ === "kawaletka");
    // w tabeli stoją te numery, które jeździec widzi na rysunku — także wtedy,
    // gdy przy numeracji własnej jeszcze ich nie ma
    const na = numerPokazywany(a) || (wlasnaNumeracja() ? "" : na0);
    const nb = numerPokazywany(b) || (wlasnaNumeracja() ? "" : nb0);
    // Pachołka się nie skacze, tylko mija — między dwoma pachołkami nie ma
    // lądowania ani odbicia, więc „za blisko dla dużych" przy slalomie co 4 m
    // było po prostu nieprawdą. Odstęp pokazujemy, wyroku o fulach nie wydajemy.
    const krokA = krokiTrasy().find((q) => q.el === a && !q.start);
    const cwA = krokA ? krokA.cw : 1;
    if (omijany(a) || omijany(para)) {
      return { skad: (na && nb) ? `${na}→${nb}` : "", co: co, d: d, cw: cwA,
               a: a, b: b, ogon: ogon, naziemne: true, slalom: true, oceny: [] };
    }
    return {
      skad: (na && nb) ? `${na}→${nb}` : "",
      co: co,
      d: d,
      cw: cwA,
      a: a, b: b, ogon: ogon,
      naziemne: naziemne,
      oceny: grupy().map((g) => {
        const oc = ocen(d, g, naziemneDragi);
        return { grupa: GRUPA_KROTKO[g], nazwa: NAZWA_GRUPY[g], klasa: oc.klasa,
                 krotko: oc.krotki || oc.tekst, pelny: oc.tekst,
                 // rachunek do sprawdzenia w głowie — tylko przy skokach, bo drągi
                 // na ziemi nie mają ani lądowania, ani odbicia
                 fula: KONIE[g].fula, n: oc.n, zapas: oc.zapas };
      })
    };
  }

  // Krzywa przechodzi DOKŁADNIE przez każdy postawiony punkt (Catmull-Rom).
  // Punkt oznaczony jako "ostry" łamie krzywą — odcinki przy nim są proste.
  // Dzieli tor na odcinki — punkt z "przerwa" zaczyna nowy.
  function odcinkiToru(pkt) {
    const grupy = [];
    pkt.forEach((t, i) => {
      if (i === 0 || t.przerwa) grupy.push([t]);
      else grupy[grupy.length - 1].push(t);
    });
    return grupy;
  }

  function sciezkaToru(pkt) {
    if (pkt.length < 2) return "";

    // Styczną liczymy RAZ NA PUNKT (w `stycznePunktow`), nie osobno dla każdego
    // odcinka — dzięki temu oba odcinki schodzące się w punkcie wychodzą z niego
    // w tę samą stronę i nie ma załamania.
    const T = stycznePunktow(pkt);

    let d = `M ${okr(pkt[0].x)} ${okr(pkt[0].y)}`;
    for (let i = 0; i < pkt.length - 1; i++) {
      const p1 = pkt[i], p2 = pkt[i + 1];
      if (p2.nowe) { d += ` M ${okr(p2.x)} ${okr(p2.y)}`; continue; }   // koniec ćwiczenia
      if (p1.ostry || p2.ostry) {
        d += ` L ${okr(p2.x)} ${okr(p2.y)}`;
        continue;
      }
      if (p2.luk) {
        // zawrót po zewnętrznej stronie pachołka — fragment łuku, nie koło
        d += ` A ${p2.luk.r} ${p2.luk.r} 0 ${p2.luk.duzy} ${p2.luk.sweep}`
           + ` ${okr(p2.x)} ${okr(p2.y)}`;
        continue;
      }
      const uch = uchwytyOdcinka(pkt, T, i);
      d += ` C ${okr(uch.c1.x)} ${okr(uch.c1.y)} ${okr(uch.c2.x)} ${okr(uch.c2.y)} ${okr(p2.x)} ${okr(p2.y)}`;
    }
    return d;
  }

  // Uchwyty Béziera jednego odcinka — wyliczane w jednym miejscu, żeby ścieżka
  // i krzyżyki do cięcia mówiły dokładnie o tej samej krzywej.
  function uchwytyOdcinka(pkt, T, i) {
    const p1 = pkt[i], p2 = pkt[i + 1];
    const cieciwa = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    const k = cieciwa * ((p1.okrag && p2.okrag) ? 0.3905 : 1 / 3);
    const k1 = k * (p1.moc || 1), k2 = k * (p2.moc || 1);
    return { c1: { x: p1.x + T[i].x * k1, y: p1.y + T[i].y * k1 },
             c2: { x: p2.x - T[i + 1].x * k2, y: p2.y - T[i + 1].y * k2 } };
  }

  // Środek każdego odcinka MIĘDZY krokami — tam siada krzyżyk do przecięcia trasy.
  function srodkiOdcinkow(pkt) {
    if (pkt.length < 2) return [];
    const T = stycznePunktow(pkt);
    const out = [];
    for (let i = 0; i < pkt.length - 1; i++) {
      const p1 = pkt[i], p2 = pkt[i + 1];
      if (p2.nowe) continue;                                   // już przecięte
      if (p1.krok === undefined || p2.krok === undefined) continue;
      if (p1.krok === p2.krok) continue;                       // wnętrze jednego kroku
      if (p1.krok === 0) continue;                             // przed pierwszym nie ma czego ciąć
      if (p1.ostry || p2.ostry) {
        out.push({ x: okr((p1.x + p2.x) / 2), y: okr((p1.y + p2.y) / 2), krok: p2.krok });
        continue;
      }
      if (p2.luk) {
        // Środek półłuku potrafi wypaść dokładnie na kropce — a kropka łapie
        // dotknięcie pierwsza, więc krzyżyka nie dało się nacisnąć (Luiza,
        // 22 września: „dodaj opcję usunięcia na takich małych kawałkach").
        // Szukamy więc na łuku miejsca najdalszego od wszystkich kropek
        // tego pachołka.
        const kropkiE = (p2.omija !== undefined && znajdz(p2.omija))
          ? kropkiElementu(znajdz(p2.omija)) : [];
        let naj = null, najD = -1;
        [0.5, 0.35, 0.65, 0.25, 0.75, 0.15, 0.85].forEach((u) => {
          const q = srodekLuku(p1, p2, u);
          let d = Infinity;
          kropkiE.forEach((kk) => { d = Math.min(d, Math.hypot(kk.x - q.x, kk.y - q.y)); });
          if (d === Infinity) d = 99;
          if (d > najD) { najD = d; naj = q; }
          });
        const sr = naj || srodekLuku(p1, p2, 0.5);
        out.push({ x: sr.x, y: sr.y, krok: p2.krok });
        continue;
      }
      const u = uchwytyOdcinka(pkt, T, i);
      out.push({ x: okr((p1.x + 3 * u.c1.x + 3 * u.c2.x + p2.x) / 8),
                 y: okr((p1.y + 3 * u.c1.y + 3 * u.c2.y + p2.y) / 8),
                 krok: p2.krok });
    }
    return out;
  }

  // Punkt na narysowanym półłuku — `gdzie` to ułamek drogi od pierwszej kropki
  // do drugiej (domyślnie połowa). Tam siada krzyżyk do przecięcia trasy.
  function srodekLuku(p1, p2, gdzie) {
    const L = p2.luk;
    const u = (gdzie === undefined) ? 0.5 : gdzie;
    const a1 = Math.atan2(p1.y - L.cy, p1.x - L.cx);
    const a2 = Math.atan2(p2.y - L.cy, p2.x - L.cx);
    const dwaPi = Math.PI * 2;
    const norm = (x) => ((x % dwaPi) + dwaPi) % dwaPi;
    const rozp = L.sweep ? norm(a2 - a1) : norm(a1 - a2);
    const aM = L.sweep ? a1 + rozp * u : a1 - rozp * u;
    return { x: okr(L.cx + L.r * Math.cos(aM)), y: okr(L.cy + L.r * Math.sin(aM)) };
  }

  function stycznePunktow(pkt) {
    const odFig = new Array(pkt.length), doFig = new Array(pkt.length);
    for (let i = 0; i < pkt.length; i++) {
      if (!pkt[i].figId) continue;
      odFig[i] = (i > 0 && pkt[i - 1].figId === pkt[i].figId) ? odFig[i - 1] : i;
    }
    for (let i = pkt.length - 1; i >= 0; i--) {
      if (!pkt[i].figId) continue;
      doFig[i] = (i < pkt.length - 1 && pkt[i + 1].figId === pkt[i].figId) ? doFig[i + 1] : i;
    }
    const T = new Array(pkt.length);
    for (let i = 0; i < pkt.length; i++) {
      const q = pkt[i];
      if (q.styczna) { T[i] = q.styczna; continue; }
      let przed = pkt[i - 1], po = pkt[i + 1];
      if (q.figId) {
        // sąsiad spoza figury potrafi ją rozciągnąć — dojazd doczepiony do wolty
        // robił z koła jajko. Figura bierze sąsiadów wyłącznie z siebie.
        const a = odFig[i], b = doFig[i];
        const zamknieta = b > a + 1
          && Math.hypot(pkt[a].x - pkt[b].x, pkt[a].y - pkt[b].y) < 0.05;
        if (!przed || przed.figId !== q.figId) przed = zamknieta ? pkt[b - 1] : null;
        if (!po || po.figId !== q.figId) po = zamknieta ? pkt[a + 1] : null;
      }
      if (przed && przed.ostry) przed = null;
      if (po && po.ostry) po = null;
      // za przerwą nie ma się na czym opierać — poprzednie ćwiczenie to inna linia
      if (q.nowe) przed = null;
      if (po && po.nowe) po = null;
      const a = przed || q, b2 = po || q;
      const vx = b2.x - a.x, vy = b2.y - a.y;
      const dl = Math.hypot(vx, vy);
      T[i] = dl > 1e-6 ? { x: vx / dl, y: vy / dl } : { x: 0, y: 0 };
    }
    return T;
  }

  function okr(v) { return Math.round(v * 1000) / 1000; }

  // ====================== interakcja ======================

  function naSvg(ev) {
    const pt = svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    const m = svg.getScreenCTM();
    if (!m) return { x: 0, y: 0 };
    const p = pt.matrixTransform(m.inverse());
    return { x: p.x, y: p.y };
  }

  // ---- powiększanie: szczypanie dwoma palcami i kółko myszy ----
  const MIN_K = 0.7, MAX_K = 8;

  function ustawWidok(k, dx, dy) {
    widok.k = Math.min(MAX_K, Math.max(MIN_K, k));
    widok.dx = dx; widok.dy = dy;
    rysuj();
    $("btnResetWidoku").hidden = Math.abs(widok.k - 1) < 0.01 && !widok.dx && !widok.dy;
  }

  function zoomWokol(punkt, mnoznik) {
    const k1 = Math.min(MAX_K, Math.max(MIN_K, widok.k * mnoznik));
    const ux = (punkt.x - widok.dx) / widok.k;
