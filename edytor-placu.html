    const uy = (punkt.y - widok.dy) / widok.k;
    ustawWidok(k1, punkt.x - k1 * ux, punkt.y - k1 * uy);
  }

  const palce = new Map();
  let szczypanie = null;

  svg.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    zoomWokol(naSvg(ev), Math.exp(-ev.deltaY * 0.0015));
  }, { passive: false });

  function naMetry(ev) {
    const pt = svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    const m = (scena || svg).getScreenCTM();
    if (!m) return { x: 0, y: 0 };
    const p = pt.matrixTransform(m.inverse());
    return { x: p.x, y: p.y };
  }

  let ciagniety = null, ciagnietyPunkt = null, offset = { x: 0, y: 0 }, ruszyl = false;
  let ciagnietyObrot = null;   // { e, kat0 } — kręcenie przeszkody za gałkę
  let ciagnietaKropka = null;  // { od, p, cel } — ciągnięcie trasy od kropki do kropki
  // Kropki wpięcia to przybornik. Dotknięcie poza piaskiem odkłada go: plac zostaje
  // samym rysunkiem, a dotknięcie placu przywraca kropki z powrotem.
  let kropkiSchowane = false;
  let przesuwanieWidoku = null;   // ciągnięcie po pustym piasku przy powiększeniu
  let torPrzyElemencie = null;    // punkty toru związane z przeciąganą przeszkodą
  let grupaFigury = null;        // punkty jednej figury, gdy ciągniemy ją w całości
  let kontynuacja = null;        // { indeks, przed } — od którego końca dorysowujemy tor
  let stanPrzedRuchem = null;

  // ---- wiązanie toru z przeszkodami ----
  // Punkt toru postawiony na przeszkodzie zapamiętuje jej id i od tej pory jedzie
  // dokładnie z nią — z nią jedną. Wcześniej tor trzymał się przeszkód po samej
  // odległości: punkt dalej niż 4 m nie jechał wcale, a punkty sąsiednich przeszkód
  // jechały razem z ruszaną. Przy trzech drągach obok siebie przesunięcie jednego
  // ściągało trasę z dwóch pozostałych.

  const PRZYWIAZANIE = 1.2;   // tak blisko trzeba postawić punkt, żeby przykleił się do przeszkody
  const PRZYLEGANIE = 0.9;    // tak blisko musi przechodzić krzywa, żeby sama zakotwiczyła się w przeszkodzie
  const BLISKI_PUNKT = 0.35;  // istniejący punkt tak blisko przeszkody można wykorzystać zamiast dokładać nowy

  // Czy koń przez to przejeżdża. Rodzaj to za mało: drąg albo kawaletka bywa
  // rozstawiona obok trasy — do następnego ćwiczenia, na zapas, jako ograniczenie.
  // Wtedy nie ma numeru, nie liczy się do odległości i nie ciągnie za sobą linii.
  function przejezdzalny(e) { return NA_TRASIE.indexOf(e.typ) >= 0; }

  // Rodzaj sprzętu, przez który da się przejechać — niezależnie od tego, czy akurat
  // jest wpięty w trasę. Po tym poznajemy, komu w ogóle pokazać przełącznik.
  function moglbyByc(e) { return NA_TRASIE.indexOf(e.typ) >= 0; }

  // W opisach figur „10 m" czyta się lepiej niż „10,00 m"; przy odległościach
  // między drągami dwa miejsca po przecinku zostają, bo tam mają znaczenie.
  function fmtL(v) { return (Math.round(v * 100) % 100 === 0) ? String(Math.round(v)) : fmt(v); }

  // Najbliższa przeszkoda, przez którą koń przejeżdża. Pachołek i litera stoją obok
  // trasy i nie mają prawa jej ciągnąć.
  function przeszkodaPod(p) {
    let naj = null, najD = PRZYWIAZANIE;
    stan.elementy.forEach((e) => {
      if (!przejezdzalny(e)) return;
      const d = odlegloscOd(e, p);
      if (d < najD) { najD = d; naj = e; }
    });
    return naj;
  }

  // Zakłada albo zdejmuje wiązanie — po każdym postawieniu i przeciągnięciu punktu toru.
  function zwiazPunkt(t) {
    const e = przeszkodaPod(t);
    if (e) t.el = e.id; else delete t.el;
  }

  function maPunktToru(id) { return stan.tor.some((t) => t.el === id); }

  // Wypina przeszkodę z przejazdu albo wpina ją z powrotem. Przy wypinaniu zdejmujemy
  // samo wiązanie, a punktów toru nie ruszamy — linia zostaje dokładnie tam, gdzie
  // ją narysowała ręka, tylko przestaje trzymać się tej przeszkody.
  function przelaczNaTrasie(e) {
    zapiszHistorie();
    if (e.pozaTrasa) {
      delete e.pozaTrasa;
      zakotwiczWTorze(e);
      // stała za daleko, żeby kotwica ją złapała — dosuwamy na najbliższą linię,
      // bo „Wepnij w trasę" ma wpiąć, a nie tylko zdjąć etykietkę
      if (!trzymaSieTrasy(e)) {
        const m = najblizszaKrzywa(e, POLACZ_ZASIEG);
        if (m) {
          const a = stan.tor[m.po], b = stan.tor[m.po + 1];
          if (a && b && a.figId && b.figId && a.figId === b.figId) wepnijWFigure(e, a.figId, m.po, m.t);
          else { e.x = okr(m.p.x); e.y = okr(m.p.y); wsunElement(e); zakotwiczWTorze(e); }
        }
      }
      pokazPodpowiedz(`${TYPY[e.typ].nazwa} wpięta w trasę — dostaje numer i jedzie razem z linią`);
    } else {
      e.pozaTrasa = true;
      delete e.naFig;
      // wyjmujemy punkty, które edytor dołożył sam przy wpinaniu; z pozostałych
      // zdejmujemy tylko wiązanie, bo je postawiła ręka i mają zostać na miejscu
      const doWyjecia = [];
      stan.tor.forEach((t, i) => {
        if (t.el !== e.id) return;
        if (t.auto) doWyjecia.push(i); else delete t.el;
      });
      if (doWyjecia.length) usunPunktyToru(doWyjecia);
      pokazPodpowiedz(`${TYPY[e.typ].nazwa} oddzielona od trasy — bez numeru, linia jej nie pilnuje`);
    }
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
    odswiezLiczniki(); odswiezOstrzezenia();
  }

  function beziera(a, b, c, d, t) {
    const u = 1 - t;
    return {
      x: u*u*u*a.x + 3*u*u*t*b.x + 3*u*t*t*c.x + t*t*t*d.x,
      y: u*u*u*a.y + 3*u*u*t*b.y + 3*u*t*t*c.y + t*t*t*d.y
    };
  }

  // Punkt krzywej na odcinku i danej grupy punktów, dla t od 0 do 1 —
  // ta sama matematyka, którą rysuje sciezkaToru.
  function punktNaOdcinku(pkt, i, t) {
    const p1 = pkt[i], p2 = pkt[i + 1];
    if (p1.ostry || p2.ostry) {
      return { x: p1.x + (p2.x - p1.x) * t, y: p1.y + (p2.y - p1.y) * t };
    }
    const p0 = (pkt[i - 1] && !pkt[i - 1].ostry) ? pkt[i - 1] : p1;
    const p3 = (pkt[i + 2] && !pkt[i + 2].ostry) ? pkt[i + 2] : p2;
    const c1 = { x: p1.x + (p2.x - p0.x) / 6, y: p1.y + (p2.y - p0.y) / 6 };
    const c2 = { x: p2.x - (p3.x - p1.x) / 6, y: p2.y - (p3.y - p1.y) / 6 };
    return beziera(p1, c1, c2, p2, t);
  }

  // Najbliższe zbliżenie krzywej do przeszkody na JEDNYM odcinku Beziera.
  function najblizejNaOdcinku(pkt, i, e) {
    const wPunkcie = (t) => punktNaOdcinku(pkt, i, t);
    // Celujemy w środek przeszkody, nie w jej kształt: drąg ma trzy metry długości,
    // więc „najbliżej drąga" jest prawdziwe na całej jego długości i kotwica
    // lądowała gdzie popadnie. Do środka minimum jest jedno.
    // Zgrubnie po całym odcinku, potem trzy razy zawężamy.
    const doSrodka = (t) => { const q = wPunkcie(t); return Math.hypot(q.x - e.x, q.y - e.y); };
    let nt = 0, nd = Infinity;
    for (let k = 0; k <= 32; k++) {
      const t = k / 32, d = doSrodka(t);
      if (d < nd) { nd = d; nt = t; }
    }
    let szer = 1 / 32;
    for (let r = 0; r < 3; r++) {
      for (let k = -4; k <= 4; k++) {
        const t = Math.max(0, Math.min(1, nt + k * szer / 4));
        const d = doSrodka(t);
        if (d < nd) { nd = d; nt = t; }
      }
      szer /= 4;
    }
    const q = wPunkcie(nt);
    const przed = wPunkcie(Math.max(0, nt - 0.002)), po = wPunkcie(Math.min(1, nt + 0.002));
    // o tym, czy krzywa w ogóle przez nią przechodzi, decyduje odległość od kształtu
    return { d: odlegloscOd(e, q), p: q, t: nt,
             kat: Math.atan2(po.y - przed.y, po.x - przed.x) * 180 / Math.PI };
  }

  // Wszystkie miejsca, w których tor podchodzi pod przeszkodę bliżej niż PRZYLEGANIE.
  // Ósemka mija ten sam drąg dwa razy i każde przejście potrzebuje własnej kotwicy —
  // sąsiadujące odcinki tego samego zbliżenia scalamy w jedno, żeby nie robić ich kilku.
  function mijaniaToru(e) {
    const wyniki = [];
    let baza = 0;
    odcinkiToru(stan.tor).forEach((pkt) => {
      let poprzednieBlisko = false;
      for (let i = 0; i < pkt.length - 1; i++) {
        const m = najblizejNaOdcinku(pkt, i, e);
        if (m.d > PRZYLEGANIE) { poprzednieBlisko = false; continue; }
        const trafienie = { d: m.d, p: m.p, po: baza + i, t: m.t, grupa: pkt, i: i };
        if (poprzednieBlisko && m.d < wyniki[wyniki.length - 1].d) wyniki[wyniki.length - 1] = trafienie;
        else if (!poprzednieBlisko) wyniki.push(trafienie);
        poprzednieBlisko = true;
      }
      baza += pkt.length;
    });
    return wyniki;
  }

  // Punkt i kierunek jazdy na linii figury — ta sama matematyka, którą rysuje
  // sciezkaToru, tylko liczona dla samej figury: sąsiedzi wyłącznie z niej,
  // a figura zamknięta (wolta) zawija się na swój drugi koniec.
  function naFigurze(pktFig, i, t) {
    const n = pktFig.length;
    const p1 = pktFig[i], p2 = pktFig[i + 1];
    if (!p1 || !p2) return null;
    if (p1.ostry || p2.ostry) {
      return { x: p1.x + (p2.x - p1.x) * t, y: p1.y + (p2.y - p1.y) * t,
               kat: Math.atan2(p2.y - p1.y, p2.x - p1.x) };
    }
    const zamknieta = n > 2 && Math.hypot(pktFig[0].x - pktFig[n - 1].x,
                                          pktFig[0].y - pktFig[n - 1].y) < 0.05;
    let sPrzed = pktFig[i - 1], sPo = pktFig[i + 2];
    if (!sPrzed) sPrzed = zamknieta ? pktFig[n - 2] : null;
    if (!sPo) sPo = zamknieta ? pktFig[1] : null;
    const p0 = (sPrzed && !sPrzed.ostry) ? sPrzed : p1;
    const p3 = (sPo && !sPo.ostry) ? sPo : p2;
    const c1 = { x: p1.x + (p2.x - p0.x) / 6, y: p1.y + (p2.y - p0.y) / 6 };
    const c2 = { x: p2.x - (p3.x - p1.x) / 6, y: p2.y - (p3.y - p1.y) / 6 };
    const q = beziera(p1, c1, c2, p2, t);
    const a = beziera(p1, c1, c2, p2, Math.max(0, t - 0.002));
    const b = beziera(p1, c1, c2, p2, Math.min(1, t + 0.002));
    return { x: q.x, y: q.y, kat: Math.atan2(b.y - a.y, b.x - a.x) };
  }

  // Przeszkoda postawiona NA linii figury nie dostaje punktu toru — punkt w środku
  // wolty zrobiłby z koła jajko. Zamiast tego zapamiętujemy, w którym miejscu
  // figury stoi (odcinek + t), i to ona jeździ za figurą. Kąt trzymamy względem
  // kierunku jazdy, żeby po obrocie figury drąg dalej leżał w poprzek trasy.
  function wepnijWFigure(e, figId, poGlobalny, t) {
    const idx = indeksyFigury(figId);
    if (!idx.length) return false;
    const i = poGlobalny - idx[0];
    const pkt = punktyFiguryZTor(figId);
    if (i < 0 || i >= pkt.length - 1) return false;
    const q = naFigurze(pkt, i, t);
    if (!q) return false;
    // Przeszkoda, którą wpinamy w trasę, staje W POPRZEK niej — przez to się
    // przejeżdża. Kąt trzymamy WZGLĘDEM kierunku jazdy, więc po obrocie figury
    // dalej leży w poprzek; obrócenie jej ręką zmienia dkat i ta zmiana zostaje.
    e.naFig = { fig: figId, i: i, t: Math.round(t * 1000) / 1000, dkat: 90 };
    e.x = okr(q.x); e.y = okr(q.y);
    e.kat = Math.round((((q.kat * 180 / Math.PI + 90) % 360) + 360) % 360 * 10) / 10;
    wsunElement(e);
    return true;
  }

  // Po każdym ruchu, obrocie i przebudowie figury: wpięte w nią przeszkody
  // wracają na swoje miejsce na linii.
  function odswiezWpiete() {
    stan.elementy.forEach((e) => {
      const w = e.naFig;
      if (!w) return;
      const pkt = punktyFiguryZTor(w.fig);
      if (pkt.length < 2 || w.i < 0 || w.i >= pkt.length - 1) { delete e.naFig; return; }
      const q = naFigurze(pkt, w.i, w.t);
      if (!q) return;
      e.x = okr(q.x); e.y = okr(q.y);
      e.kat = Math.round((((q.kat * 180 / Math.PI + (w.dkat || 0)) % 360) + 360) % 360 * 10) / 10;
      wsunElement(e);
    });
  }

  // Gdzie narysowana krzywa najbliżej mija dany element. Próbkujemy dokładnie tę samą
  // krzywą, którą rysuje sciezkaToru — inaczej kotwica lądowałaby obok linii.
  function mijanieToru(e) {
    let naj = null, baza = 0;
    odcinkiToru(stan.tor).forEach((pkt) => {
      for (let i = 0; i < pkt.length - 1; i++) {
        const m = najblizejNaOdcinku(pkt, i, e);
        if (!naj || m.d < naj.d) naj = { d: m.d, p: m.p, po: baza + i, t: m.t, kat: m.kat, grupa: pkt, i: i };
      }
      baza += pkt.length;
    });
    return naj;
  }

  // Trasa albo figura na wyciągnięcie ręki. Kotwiczenie samo z siebie działa dopiero
  // od PRZYLEGANIE (0,9 m) — celowo, bo inaczej wpinałoby wszystko, co stoi obok.
  // Ale kiedy człowiek SAM mówi „połącz", wolno szukać dużo szerzej.
  const POLACZ_ZASIEG = 4;
  function najblizszaKrzywa(e, zasieg) {
    let naj = null, baza = 0;
    odcinkiToru(stan.tor).forEach((pkt) => {
      for (let i = 0; i < pkt.length - 1; i++) {
        const m = najblizejNaOdcinku(pkt, i, e);
        if (m.d > zasieg) continue;
        if (!naj || m.d < naj.d) naj = { d: m.d, p: m.p, po: baza + i, t: m.t, kat: m.kat, grupa: pkt, i: i };
      }
      baza += pkt.length;
    });
    return naj;
  }

  // Czy ta przeszkoda naprawdę trzyma się trasy — punktem toru albo wpięciem w figurę.
  function trzymaSieTrasy(e) { return !!e.naFig || maPunktToru(e.id); }

  // Jak nazwać to, z czym łączymy — „woltą", „ósemką", „trasą".
  function nazwaCelu(m) {
    const a = stan.tor[m.po], b = stan.tor[m.po + 1];
    if (a && b && a.figId && b.figId && a.figId === b.figId) {
      if (a.figOsemka || (stan.tor[indeksyFigury(a.figId)[0]] || {}).figOsemka) return "ósemką";
      const typ = (stan.tor[indeksyFigury(a.figId)[0]] || {}).figTyp;
      if (typ === "wolta") return "woltą";
      if (typ === "polwolta") return "półwoltą";
      if (typ === "serpentyna") return "serpentyną";
      return "figurą";
    }
    return "trasą";
  }

  // „Połącz" robi to, czego nie zrobiło samo upuszczenie: dosuwa przeszkodę na linię
  // i wiąże ją z nią. Bez tego trzeba było trafić w linię co do dziesięciu centymetrów.
  function polaczZTrasa(e) {
    const m = najblizszaKrzywa(e, POLACZ_ZASIEG);
    if (!m) return pokazPodpowiedz("Nie ma w pobliżu trasy ani figury — przeciągnij ją bliżej");
    const gdzie = nazwaCelu(m);
    zapiszHistorie();
    delete e.pozaTrasa;
    const a = stan.tor[m.po], b = stan.tor[m.po + 1];
    if (a && b && a.figId && b.figId && a.figId === b.figId) {
      wepnijWFigure(e, a.figId, m.po, m.t);
    } else {
      // na zwykłej linii wiąże punkt toru — dosuwamy przeszkodę i resztę robi kotwica
      e.x = okr(m.p.x); e.y = okr(m.p.y);
      if (m.kat !== undefined) e.kat = Math.round((((m.kat + 90) % 360) + 360) % 360 * 10) / 10;
      wsunElement(e);
      zakotwiczWTorze(e);
    }
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
    odswiezLiczniki(); odswiezOstrzezenia();
    pokazPodpowiedz(`${TYPY[e.typ].nazwa} połączona z ${gdzie} — pojedzie razem z nią`);
  }

  // Krzywa przechodzi przez przeszkodę, ale nie ma tam punktu toru — dokładamy go,
  // żeby trasa miała się czego trzymać przy przesuwaniu.
  function zakotwiczWTorze(e) {
    if (!przejezdzalny(e) || e.swiezy || stan.tor.length < 2) return;
    // Każde przejście dostaje własną kotwicę. Od końca, żeby wstawiony punkt
    // nie przesuwał indeksów przejść, których jeszcze nie obsłużyliśmy.
    mijaniaToru(e).sort((x, y) => y.po - x.po).forEach((m) => zakotwiczPrzejscie(e, m));
  }

  function zakotwiczPrzejscie(e, m) {
    // Jeśli któryś z sąsiednich punktów i tak leży już na tej przeszkodzie, bierzemy
    // jego zamiast dokładać nowy — mniej punktów, mniej ruszania krzywej.
    // Punkt stojący dalej się nie nadaje: zachowałby swój odstęp i po przesunięciu
    // trasa mijałaby przeszkodę bokiem, czyli dokładnie to, co naprawiamy.
    const a = stan.tor[m.po], b = stan.tor[m.po + 1];
    if (!a || !b) return;
    // to przejście już ma swoją kotwicę — drugi raz jej nie dokładamy
    if (a.el === e.id || b.el === e.id) return;
    // wnętrze gotowej figury: punktu tam nie dokładamy (zrobiłby z koła jajko),
    // ale przeszkodę wpinamy w samą figurę — pojedzie z nią i liczy się do przejazdu
    if (a.figId && b.figId && a.figId === b.figId) {
      if (e.naFig && e.naFig.fig === a.figId) return;
      wepnijWFigure(e, a.figId, m.po, m.t);
      return;
    }
    const kandydaci = [a, b].filter((t) => t.el === undefined && !t.figId && odlegloscOd(e, t) < BLISKI_PUNKT);
    kandydaci.sort((x, y) => odlegloscOd(e, x) - odlegloscOd(e, y));
    if (kandydaci.length) { kandydaci[0].el = e.id; return; }

    // Zostaje dołożenie punktu. Leży dokładnie na linii i — zmierzone 9 września
    // (pomiar2.mjs) — krzywa po zakotwiczeniu odchyla się o 0,000 m, a mija drąg
    // o 0,006 m. Widoczny czasem „przesuw" to nie kotwica, tylko przyciąganie co
    // 25 cm: drąg staje pół metra obok krzywej, a kotwica ląduje na krzywej.
    // Próbowane i odrzucone: przesuwanie wstawionego punktu (leży tam, gdzie ma leżeć,
    // każdy ruch tylko pogarsza) i podpory po bokach (krótkie odcinki szarpią mocniej
    // niż to, co naprawiały).
    // „auto" znaczy: ten punkt dołożył edytor, nie ręka. Przy oddzielaniu wyjmujemy
    // tylko takie — punktów postawionych świadomie nie ruszamy.
    stan.tor.splice(m.po + 1, 0, { x: okr(m.p.x), y: okr(m.p.y), el: e.id, auto: true });
  }

  // Zanim cokolwiek ruszymy: każda przeszkoda, przez którą krzywa przechodzi, dostaje
  // swój punkt toru. Dzięki temu przesunięcie jednej nie ściąga trasy z pozostałych —
  // reszta ma się czego trzymać i zostaje na miejscu.
  function zakotwiczWszystkie() {
    stan.elementy.forEach((e) => zakotwiczWTorze(e));
  }

  // Przesuwa punkty toru razem z przeszkodami, z którymi są związane.
  // „przed" to pozycje elementów sprzed ruchu.
  function przesunTorZaElementami(przed) {
    przed.forEach((p) => {
      const e = znajdz(p.id);
      if (!e) return;
      const dx = e.x - p.x, dy = e.y - p.y;
      if (!dx && !dy) return;
      stan.tor.forEach((t) => {
        if (t.el !== p.id) return;
        t.x = okr(Math.min(stan.dl, Math.max(0, t.x + dx)));
        t.y = okr(Math.min(stan.sz, Math.max(0, t.y + dy)));
      });
    });
  }

  // ====================== gotowe figury na torze ======================
  // Wolty i serpentyny rysuje się palcem fatalnie — kółko wychodzi jajkiem, a przy
  // wysyłaniu schematu podopiecznemu to widać. Dlatego wstawiamy je liczone.
  // Figura wchodzi w dotknięty punkt trasy i jest zwykłymi punktami toru: wszystko
  // da się potem złapać i poprawić.

  const FIGURY = {
    // „biernik" to forma z guzika: wstaw woltę, nie „wstaw wolta"
    wolta:      { nazwa: "Wolta",      biernik: "woltę",      opis: "koło o zadanej średnicy" },
    polwolta:   { nazwa: "Półwolta",   biernik: "półwoltę",   opis: "półkole, potem skośnie z powrotem" },
    serpentyna: { nazwa: "Serpentyna", biernik: "serpentynę", opis: "łuki na przemian w obie strony" },
    // Ósemka nie jest osobnym typem punktu toru — wstawia DWIE wolty. Patrz postawOsemke.
    osemka:     { nazwa: "Ósemka",     biernik: "ósemkę",     opis: "dwa koła stykające się w jednym punkcie" }
  };

  // Wyjmuje z toru wskazane punkty i sprząta po nich przerwy. Figur nie ruszamy
  // nigdy — wolta nie jest „ostatnim punktem", tylko gotowym kształtem, który
  // usuwa się w całości, dotknięciem i przyciskiem Usuń.
  function usunPunktyToru(indeksy) {
    const zbior = indeksy.slice().sort((a, b) => a - b);
    for (let k = zbior.length - 1; k >= 0; k--) {
      const i = zbior[k];
      const byla = stan.tor[i].przerwa;
      stan.tor.splice(i, 1);
      const nast = stan.tor[i];
      // punkt, który zostaje po skasowanym początku linii, sam ją teraz zaczyna
      if (byla && nast && !nast.przerwa && !nast.zlaczenie) nast.przerwa = true;
      if (kontynuacja) {
        if (kontynuacja.indeks === i) kontynuacja = null;
        else if (kontynuacja.indeks > i) kontynuacja.indeks--;
      }
    }
    if (stan.tor.length) delete stan.tor[0].przerwa;
    zaznaczonyOdcinek = null;
    zaznaczoneZlaczenie = null;
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
    odswiezLiczniki(); odswiezOstrzezenia();
  }

  function indeksyNarysowane() {
    const idx = [];
    stan.tor.forEach((t, i) => { if (!t.figId) idx.push(i); });
    return idx;
  }

  // Cofnięcie ostatniego postawionego punktu. Szuka od końca punktu spoza figury,
  // bo inaczej „Cofnij punkt" zjadało woltę kreska po kresce.
  function cofnijPunktToru() {
    let i = -1;
    for (let k = stan.tor.length - 1; k >= 0; k--) if (!stan.tor[k].figId) { i = k; break; }
    if (i < 0) {
      return pokazPodpowiedz(stan.tor.length
        ? "Nie ma czego cofać — na placu są same figury; te usuwa się dotknięciem i przyciskiem Usuń"
        : "Tor jest pusty");
    }
    zapiszHistorie();
    usunPunktyToru([i]);
    pokazPodpowiedz("Ostatni punkt cofnięty");
  }

  // Usuwa ostatnią narysowaną linię — same postawione punkty, bez figur, które
  // po drodze stoją. To jest „usuń kawałek toru", nie „usuń wszystko".
  function usunOstatniaLinie() {
    const grupy = odcinkiToru(stan.tor);
    let cel = null;
    for (let i = grupy.length - 1; i >= 0; i--) {
      if (grupy[i].some((t) => !t.figId)) { cel = grupy[i]; break; }
    }
    if (!cel) {
      return pokazPodpowiedz(stan.tor.length
        ? "Nie ma narysowanej linii — na placu są same figury"
        : "Tor jest pusty");
    }
    zapiszHistorie();
    const idx = [];
    cel.forEach((t) => { if (!t.figId) idx.push(stan.tor.indexOf(t)); });
    usunPunktyToru(idx);
    pokazPodpowiedz(stan.tor.some((t) => t.figId)
      ? "Ostatnia narysowana linia usunięta · figury zostały"
      : "Ostatnia narysowana linia usunięta");
  }

  // Usuwa cały narysowany tor. Figury zostają — są elementem ustawienia placu,
  // tak jak drągi, a nie kreską, którą się przy okazji rysowało.
  function usunNarysowanyTor() {
    const idx = indeksyNarysowane();
    if (!idx.length) {
      return pokazPodpowiedz(stan.tor.length
        ? "Nie ma narysowanego toru — na placu są same figury"
        : "Tor jest pusty");
    }
    zapiszHistorie();
    usunPunktyToru(idx);
    // po wyjęciu linii każda figura stoi znowu osobno: złączenia prowadziły
    // przez skasowane odcinki, więc nie ma czego trzymać razem
    stan.tor.forEach((t, i) => {
      const poprz = stan.tor[i - 1];
      delete t.zlaczenie;
      if (i === 0) delete t.przerwa;
      else if (!poprz || poprz.figId !== t.figId) t.przerwa = true;
      else delete t.przerwa;
    });
    kontynuacja = null;
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
    odswiezLiczniki(); odswiezOstrzezenia();
    pokazPodpowiedz(stan.tor.length
      ? "Narysowany tor usunięty · figury zostały na placu"
      : "Tor usunięty");
  }

  // Czy punkt o tym indeksie jest pierwszym albo ostatnim punktem swojej figury.
  function koniecFigury(i) {
    const t = stan.tor[i];
    if (!t || !t.figId) return false;
    const przed = stan.tor[i - 1], po = stan.tor[i + 1];
    return !przed || przed.figId !== t.figId || !po || po.figId !== t.figId;
  }

  // Kierunek jazdy w punkcie toru. Liczymy z sąsiadów w tym samym odcinku.
  function stycznaToru(idx) {
    const t = stan.tor[idx];
    const poprz = (idx > 0 && !t.przerwa) ? stan.tor[idx - 1] : null;
    const nast = (idx + 1 < stan.tor.length && !stan.tor[idx + 1].przerwa) ? stan.tor[idx + 1] : null;
    let dx, dy;
    if (poprz && nast) { dx = nast.x - poprz.x; dy = nast.y - poprz.y; }
    else if (nast) { dx = nast.x - t.x; dy = nast.y - t.y; }
    else if (poprz) { dx = t.x - poprz.x; dy = t.y - poprz.y; }
    else { dx = 1; dy = 0; }
    const d = Math.hypot(dx, dy) || 1;
    return { x: dx / d, y: dy / d };
  }

  // W którą stronę od linii ma iść figura: w tę, w której jest więcej placu.
  function stronaFigury(p, t, zasieg) {
    const luz = (n) => {
      const q = { x: p.x + n.x * zasieg, y: p.y + n.y * zasieg };
      return Math.min(q.x, stan.dl - q.x, q.y, stan.sz - q.y);
    };
    const a = { x: -t.y, y: t.x }, b = { x: t.y, y: -t.x };
    return luz(a) >= luz(b) ? a : b;
  }

  function obrocWokol(c, u, kat) {
    const cs = Math.cos(kat), sn = Math.sin(kat);
    return { x: c.x + u.x * cs - u.y * sn, y: c.y + u.x * sn + u.y * cs };
  }

  // Punkty łuku wokół środka c, od wektora u, o kąt zamiatania (ze znakiem).
  function lukPunkty(c, u, zamiatanie, ile) {
    const out = [];
    for (let k = 1; k <= ile; k++) out.push(obrocWokol(c, u, zamiatanie * k / ile));
    return out;
  }

  // Zwrot obiegu: taki, żeby ruszyć z punktu zgodnie z kierunkiem jazdy.
  function zwrotObiegu(n, t) { return ((n.y * t.x - n.x * t.y) >= 0) ? 1 : -1; }

  // Najmniejsza figura. Trzy metry to była wolta, którą da się przejechać; metr to
  // „narysuj sobie kółko" — znak na placu, miejsce do zatrzymania, obwódka wokół
  // przeszkody. Skoro plac ma być kartką, nie ma powodu tego zabraniać.
  const MIN_FIG = 1;

  // Buduje punkty figury zaczepionej w p, jadącej w kierunku t.
  function normalnaFigury(typ, p, t, srednica) {
    return stronaFigury(p, t, typ === "serpentyna" ? srednica / 2 : srednica);
  }

  // Koń jedzie po śladzie odsuniętym od bandy — nie ociera się o płot. Powiększana
  // figura zatrzymuje się więc pół metra przed ścianą, a nie na niej. Figury, które
  // z definicji sięgają ścian (serpentyna od ściany do ściany, wolta wpisana w plac
  // co do metra), zostają takie, jakie są — sufit nigdy nie kurczy tego, co już stoi.
  const LUZ_BANDY = 0.5;

  // nWymuszone: przy przebudowie trzymamy tę samą stronę, co przy stawianiu —
  // inaczej powiększana wolta potrafiłaby przeskoczyć na drugą stronę linii
  // Wymiary serpentyny „od ściany do ściany": łuki dotykają obu długich ścian,
  // a cała figura zajmuje plac na całej długości. To już nie są półkola, tylko
  // połówki elipsy — w placu 20 × 40 na trzy łuki wychodzi 13,3 m na 20 m.
  // „szerokosc" to rozpiętość figury w poprzek placu. Pełna wartość znaczy od ściany
  // do ściany; mniejsza daje tę samą figurę pomniejszoną proporcjonalnie, żeby dało się
  // ją ściągnąć ze ścian, a powiększanie zatrzymywało się na nich.
  function osieSerpentyny(t, luki, szerokosc) {
    const wzdluz = Math.abs(t.x) >= Math.abs(t.y) ? stan.dl : stan.sz;
    const wPoprzek = Math.abs(t.x) >= Math.abs(t.y) ? stan.sz : stan.dl;
    const bMax = wPoprzek / 2 - 0.25;
    const aMax = (wzdluz - 0.5) / (2 * luki);
    const b = (szerokosc != null && szerokosc > 0)
      ? Math.min(bMax, Math.max(1.5, szerokosc / 2)) : bMax;
    const k = b / bMax;
    return { a: aMax * k, b: b, wzdluz: wzdluz, bMax: bMax, aMax: aMax, pelna: 2 * bMax };
  }

  // Ile najwyżej może mieć ta figura — dla serpentyny ściennej to szerokość placu.
  function maksFigury(pierwszy, luki) {
    if (pierwszy.figSciana) {
      return osieSerpentyny({ x: pierwszy.figTx, y: pierwszy.figTy },
                            luki || pierwszy.figLuki || 3).pelna;
    }
    // figura przebudowywana z paska rośnie wokół swojego środka, nie od zaczepu
    return najwiekszaFigura(pierwszy, luki || pierwszy.figLuki || 3, !!pierwszy.figOsemka);
  }

  function punktyFigury(typ, p, t, srednica, luki, nWymuszone, sciana) {
    const r = srednica / 2;
    const n = nWymuszone || normalnaFigury(typ, p, t, srednica);
    const s = zwrotObiegu(n, t);
    const c = { x: p.x + n.x * r, y: p.y + n.y * r };
    const u = { x: p.x - c.x, y: p.y - c.y };

    if (typ === "wolta") {
      const pkt = lukPunkty(c, u, s * 2 * Math.PI, 12);
      pkt[pkt.length - 1] = { x: p.x, y: p.y };   // domykamy dokładnie tam, gdzie zaczęliśmy
      return pkt;
    }

    if (typ === "polwolta") {
      // Łuk nie kończy się na równym półkolu. Jedzie dalej — dokładnie tyle, żeby jego
      // styczna w punkcie wyjścia wskazała punkt powrotu na linii. Wtedy skos wychodzi
      // z łuku stycznie i w całej figurze nie ma ani jednego kąta.
      // Przy powrocie L = 3 × promień wychodzi łuk 216,87° i dojście do ściany pod 36,87°,
      // niezależnie od średnicy — kształt jest sam do siebie podobny.
      // Poprzednie podejście (równe półkole + prosta) łamało się o 41° i było to widać.
      const L = 3 * r;
      const beta = 2 * Math.atan(r / L);
      const pkt = lukPunkty(c, u, s * (Math.PI + beta), 12);
      const koniec = { x: p.x - t.x * L, y: p.y - t.y * L };
      const ostatni = pkt[pkt.length - 1];
      // Skos dzielimy na kilka punktów o krokach podobnych do cięciwy łuku. Jeden punkt
      // w połowie leżał tak daleko, że rozciągał styczną w ostatnim odcinku łuku
      // i krzywa wybrzuszała się tuż przed wyjściem — to było widać jako dziób.
      const cieciwa = 2 * r * Math.sin((Math.PI + beta) / 24);
      const dlSkosu = Math.hypot(koniec.x - ostatni.x, koniec.y - ostatni.y);
      const ile = Math.max(2, Math.round(dlSkosu / (2 * cieciwa)));
      for (let k = 1; k <= ile; k++) {
        pkt.push({ x: ostatni.x + (koniec.x - ostatni.x) * k / ile,
                   y: ostatni.y + (koniec.y - ostatni.y) * k / ile });
      }
      return pkt;
    }

    if (typ === "serpentyna") {
      // Łuki oparte na linii trasy, wybrzuszone na przemian w obie strony.
      // Z wpisaną średnicą to półkola; „od ściany do ściany" spłaszcza je albo
      // wyciąga tak, żeby zmieściły się w placu na całej jego długości.
      const osie = sciana ? osieSerpentyny(t, luki, srednica) : { a: r, b: r };
      const pkt = [];
      const wybrzuszenie = { x: t.y, y: -t.x };
      let zwrot = (wybrzuszenie.x * n.x + wybrzuszenie.y * n.y) >= 0 ? 1 : -1;
      for (let i = 0; i < luki; i++) {
        const ci = { x: p.x + t.x * (2 * osie.a * i + osie.a),
                     y: p.y + t.y * (2 * osie.a * i + osie.a) };
        for (let k = 1; k <= 8; k++) {
          const kat = Math.PI * k / 8;
          pkt.push({
            x: ci.x - t.x * osie.a * Math.cos(kat) + zwrot * wybrzuszenie.x * osie.b * Math.sin(kat),
            y: ci.y - t.y * osie.a * Math.cos(kat) + zwrot * wybrzuszenie.y * osie.b * Math.sin(kat)
          });
        }
        zwrot = -zwrot;
      }
      return pkt;
    }
    return [];
  }

  // Ile figura wystaje poza bandę. Zero znaczy, że mieści się w całości.
  // Koło 20 m na placu 20 m szerokim dotyka obu długich ścian, więc zero tolerancji
  // znaczyłoby, że nigdy nie da się go wstawić.
  // Tolerancja przy stawianiu figury: tyle, ile potrafią nazbierać zaokrąglenia.
  // Nie więcej — dwudziestometrowe koło ma dotknąć ścian placu 20 m, a nie wyjść
  // za nie o ćwierć metra. Odstęp od bandy przy powiększaniu to osobna sprawa
  // (LUZ_BANDY): tam figura rośnie, tu wchodzi w gotowy wymiar.
  const WYSTAJE_MAX = 0.05;
  function wystajePozaPlac(pkt, luz) {
    const l = luz || 0;
    let maks = 0;
    pkt.forEach((q) => {
      maks = Math.max(maks, l - q.x, q.x - (stan.dl - l), l - q.y, q.y - (stan.sz - l));
    });
    return Math.max(0, maks);
  }

  // Zaczep dla figury stawianej samodzielnie: tak dobrany, żeby wyszła na środku placu.
  // Serpentyna od ściany do ściany zaczyna się na środku krótkiej ściany, jak w A.
  function zaczepSciany(t, luki, szerokosc) {
    const osie = osieSerpentyny(t, luki, szerokosc);
    const dlugosc = 2 * osie.a * luki;
    return { x: stan.dl / 2 - t.x * (dlugosc / 2),
             y: stan.sz / 2 - t.y * (dlugosc / 2) };
  }

  function zaczepDlaFigury(typ, srednica, luki, sciana) {
    const r = srednica / 2;
    const wzdluz = stan.dl >= stan.sz ? { x: 1, y: 0 } : { x: 0, y: 1 };
    if (sciana) return { p: zaczepSciany(wzdluz, luki, srednica), t: wzdluz };
    const w = (a, b) => ({ x: stan.dl / 2 + a * wzdluz.x + b * wzdluz.y,
                           y: stan.sz / 2 + a * wzdluz.y - b * wzdluz.x });
    // „a" to przesunięcie wzdłuż osi placu, „b" w poprzek
    if (typ === "wolta") return { p: w(0, -r), t: wzdluz };
    if (typ === "polwolta")                  return { p: w(1.5 * r, -r), t: wzdluz };
    return { p: w(-luki * srednica / 2, 0), t: wzdluz };   // serpentyna
  }

  // Figura wchodzi jako osobny odcinek toru, na środku placu. Wszystkie jej punkty
  // dostają wspólny numer — dzięki temu przeciąga się ją w całości, a nie punkt po punkcie.
  function postawFigure(typ, srednica, luki, sciana) {
    if (sciana) {
      const wzdluz = stan.dl >= stan.sz ? { x: 1, y: 0 } : { x: 0, y: 1 };
      srednica = osieSerpentyny(wzdluz, luki).pelna;   // start od ściany do ściany
    }
    const z = zaczepDlaFigury(typ, srednica, luki, sciana);
    const n = normalnaFigury(typ, z.p, z.t, srednica);
    const pkt = punktyFigury(typ, z.p, z.t, srednica, luki, n, sciana);
    const caly = [{ x: okr(z.p.x), y: okr(z.p.y) }]
      .concat(pkt.map((q) => ({ x: okr(q.x), y: okr(q.y), ostry: q.ostry || undefined })));
    const wystaje = wystajePozaPlac(caly);
    if (wystaje > WYSTAJE_MAX) return pokazPodpowiedz(zaMalo(typ, srednica, luki, wystaje));
    zapiszHistorie();
    const nr = stan.nastFig = (stan.nastFig || 1) + 1;
    caly.forEach((q, i) => { q.fig = true; q.figId = nr; if (i === 0 && stan.tor.length) q.przerwa = true; });
    // parametry trzymamy na pierwszym punkcie: dzięki temu figurę da się potem
    // przebudować na inną średnicę, zamiast kasować i stawiać od nowa
    Object.assign(caly[0], { figTyp: typ, figD: srednica, figLuki: luki,
                             figTx: z.t.x, figTy: z.t.y, figNx: n.x, figNy: n.y,
                             figSciana: sciana || undefined });
    caly.forEach((q) => stan.tor.push(q));
    zaznaczony = null;
    zaznaczonaFigura = nr;
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
    odswiezLiczniki(); odswiezOstrzezenia();
    pokazPodpowiedz(sciana
      ? `Serpentyna ${luki} łuki od ściany do ściany — przeciągnij ją, gdzie ma być`
      : `${FIGURY[typ].nazwa} ${fmtL(srednica)} m — przeciągnij ją, gdzie ma być; średnicę zmienisz w pasku poniżej`);
  }

  // ---- figura po postawieniu: chwytanie, przesuwanie, przerabianie ----

  let zaznaczonaFigura = null;   // figId zaznaczonej figury
  let zaznaczonyPunkt = null;    // id zaznaczonego punktu na trasie
  let ciagnietyPunktTrasy = null;   // przeciągany wolny punkt na trasie
  let ciagnietaLinia = null;        // złapana linia trasy: puścić = ciąć, pociągnąć = wygiąć
  let ciagnietaFigura = null;    // { figId, od, punkty } w trakcie przeciągania
  let ciagnietyUchwyt = null;    // { figId, u } w trakcie rozciągania figury
  let ciagnietyOdcinek = null;   // { punkty, od } — przesuwanie całej linii za jej kropkę

  function odlOdOdcinka(p, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y, dl2 = dx * dx + dy * dy;
    if (!dl2) return Math.hypot(p.x - a.x, p.y - a.y);
    let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / dl2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
  }

  function indeksyFigury(figId) {
    const out = [];
    stan.tor.forEach((t, i) => { if (t.figId === figId) out.push(i); });
    return out;
  }

  function punktyFiguryZTor(figId) { return stan.tor.filter((t) => t.figId === figId); }

  // Drugie koło tej samej ósemki — po wspólnym numerze figOsemka. Zwraca null,
  // gdy koło zostało rozdzielone albo gdy pary nie da się jednoznacznie wskazać.
  function drugieKoloOsemki(figId) {
    const idx = indeksyFigury(figId);
    if (!idx.length) return null;
    const nr = stan.tor[idx[0]].figOsemka;
    if (!nr) return null;
    const inne = [];
    stan.tor.forEach((t) => {
      if (t.figOsemka === nr && t.figId !== figId && inne.indexOf(t.figId) < 0) inne.push(t.figId);
    });
    return inne.length === 1 ? inne[0] : null;
  }

  // Punkty do przeciągania: całe koło, a razem z nim drugie koło ósemki.
  // Ósemka przesuwa się w całości — dopóki się jej nie rozdzieli.
  function punktyDoPrzeciagniecia(figId) {
    const pkt = punktyFiguryZTor(figId);
    const drugie = drugieKoloOsemki(figId);
    return drugie ? pkt.concat(punktyFiguryZTor(drugie)) : pkt;
  }

  // Rozdziela ósemkę: oba koła zostają na miejscu, ale od tej pory są zwykłymi
  // woltami — jeżdżą osobno i rosną wokół własnego środka.
  function rozdzielOsemke(figId) {
    const drugie = drugieKoloOsemki(figId);
    zapiszHistorie();
    [figId, drugie].forEach((id) => {
      if (id == null) return;
      const i = indeksyFigury(id)[0];
      if (i !== undefined) delete stan.tor[i].figOsemka;
    });
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
    odswiezLiczniki(); odswiezOstrzezenia();
    pokazPodpowiedz(drugie != null
      ? "Ósemka rozdzielona — dwie osobne wolty, każda jeździ sama"
      : "To koło jest już osobną woltą");
  }

  const CHWYT_FIGURY = 0.9;   // jak blisko linii figury trzeba dotknąć, żeby ją złapać
  const CHWYT_ODCINKA = 0.9;  // kropka z obwódką na początku linii łapie z takiego promienia
  const CHWYT_LINII = 0.7;    // sama linia toru łapie się z takiego promienia

  let zaznaczonyOdcinek = null;   // pierwszy punkt zaznaczonej linii toru
  let zaznaczoneZlaczenie = null; // punkt styku dwoch zlaczonych linii, dotkniety palcem

  const POLACZENIE = 1.2;   // tak blisko musza znalezc sie koncowki, zeby sie zlaczyly

  // Zapisuje liste odcinkow z powrotem do stan.tor. Przerwa siedzi na pierwszym punkcie
  // kazdego odcinka poza pierwszym — to jedyne miejsce, w ktorym o niej decydujemy.
  function zapiszOdcinki(grupy) {
    const nowy = [];
    grupy.forEach((g, i) => {
      g.forEach((t, k) => {
        if (k === 0) { if (i === 0) delete t.przerwa; else t.przerwa = true; }
        else delete t.przerwa;
        nowy.push(t);
      });
    });
    stan.tor = nowy;
  }

  // Ograniczenie przesuniecia dla calej grupy punktow. Przycinanie kazdego punktu
  // z osobna splaszczalo figure przy bandzie — kolo przestawalo byc kolem.
  function zmiescPrzesuniecie(punkty, dx, dy) {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    punkty.forEach((q) => {
      if (q.x < minX) minX = q.x; if (q.x > maxX) maxX = q.x;
      if (q.y < minY) minY = q.y; if (q.y > maxY) maxY = q.y;
    });
    return { dx: Math.max(-minX, Math.min(stan.dl - maxX, dx)),
             dy: Math.max(-minY, Math.min(stan.sz - maxY, dy)) };
  }

  // Przeszkody wpięte w te punkty toru. Przesuwana linia ma je zabierać ze sobą:
  // wpięcie znaczy „to jedno", więc rozjeżdżanie się linii ze sprzętem byłoby
  // złamaniem tej umowy. Sprzęt oddzielony (pozaTrasa) nie ma wiązania i zostaje.
  function przeszkodyOdcinka(grupa) {
    const widziane = {}, lista = [];
    grupa.forEach((t) => {
      if (t.el === undefined || widziane[t.el]) return;
      const e = znajdz(t.el);
      if (!e) return;
      widziane[t.el] = true;
      lista.push({ e: e, x: e.x, y: e.y });
    });
    return lista;
  }

  // Przesunięcie przycięte tak, żeby i linia, i jej przeszkody zostały na piasku.
  function zmiescOdcinekZeSprzetem(ciag, dx, dy) {
    const ogr = zmiescPrzesuniecie(ciag.punkty, dx, dy);
    let wx = ogr.dx, wy = ogr.dy;
    (ciag.przeszkody || []).forEach((q) => {
      const g = granicaElementu(q.e);
      wx = Math.max(g.minX - q.x, Math.min(g.maksX - q.x, wx));
      wy = Math.max(g.minY - q.y, Math.min(g.maksY - q.y, wy));
    });
    return { dx: wx, dy: wy };
  }

  function przesunGrupe(g, dx, dy) {
    g.forEach((t) => { t.x = okr(t.x + dx); t.y = okr(t.y + dy); });
  }

  function scalGrupy(grupy, iA, iB) {
    const A = grupy[iA], B = grupy[iB];
    B[0].zlaczenie = true;                 // tu bedzie mozna je rozlaczyc
    const nowe = [];
    grupy.forEach((g, i) => {
      if (i === iA) nowe.push(A.concat(B));
      else if (i !== iB) nowe.push(g);
    });
    zapiszOdcinki(nowe);
    return { pierwszy: A[0], styk: B[0] };
  }

  // Po upuszczeniu linii sprawdzamy, czy jej koncowka nie wyladowala na koncowce innej.
  // Jesli tak — dosuwamy przeciagana linie dokladnie na styk i sklejamy je w jedna.
  // Laczymy tylko koniec z poczatkiem: odwracanie odcinka popsuloby figurom ich
  // wlasny kierunek, a z nim srednice i przerzucanie.
  // Linię narysowaną ręką da się przejechać w obie strony, więc przy łączeniu wolno
  // ją odwrócić. Figury nie: wolta i półwolta mają własny kierunek obiegu zapisany
  // w pierwszym punkcie (figTx, figNx), a odwrócenie kolejności zostawiłoby te dane
  // przy złym końcu i popsuło średnicę oraz przerzucanie.
  function daSieOdwrocic(g) { return g.every((t) => !t.figId); }

  function odwrocGrupe(grupy, i) {
    const g = grupy[i].slice().reverse();
    // przerwa i znacznik styku opisują początek odcinka, a nie konkretny punkt
    const pierwszy = grupy[i][0];
    delete pierwszy.przerwa;
    delete pierwszy.zlaczenie;
    grupy[i] = g;
    return g;
  }

  function sprobujPolaczyc(pierwszyPunkt) {
    const grupy = odcinkiToru(stan.tor);
    let iJa = grupy.findIndex((g) => g[0] === pierwszyPunkt);
    if (iJa < 0 || grupy[iJa].length < 2) return null;
    const blisko = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) < POLACZENIE;

    // Cztery możliwe styki. Dwa pierwsze wychodzą bez odwracania czegokolwiek,
    // dwa kolejne dopiero po odwróceniu tej linii, którą wolno odwrócić.
    const proby = [
      { odwrocMnie: false, odwrocJa: false, mojKoniec: true },
      { odwrocMnie: false, odwrocJa: false, mojKoniec: false },
      { odwrocMnie: true,  odwrocJa: false, mojKoniec: true },
      { odwrocMnie: false, odwrocJa: true,  mojKoniec: true }
    ];

    // Koła jednej ósemki stykają się z definicji — gdyby wolno je było sklejać,
    // każde przesunięcie ósemki zawiązywałoby na jej styku węzeł „Rozłącz",
    // czyli drugi, konkurencyjny sposób rozdzielania tej samej figury.
    const taSamaOsemka = (a, b) => a.figOsemka !== undefined && a.figOsemka === b.figOsemka;

    for (let i = 0; i < grupy.length; i++) {
      if (i === iJa || grupy[i].length < 2) continue;
      if (taSamaOsemka(grupy[iJa][0], grupy[i][0])) continue;

      for (const pr of proby) {
        if (pr.odwrocMnie && !daSieOdwrocic(grupy[iJa])) continue;
        if (pr.odwrocJa && !daSieOdwrocic(grupy[i])) continue;

        const ja = pr.odwrocMnie ? grupy[iJa].slice().reverse() : grupy[iJa];
        const inna = pr.odwrocJa ? grupy[i].slice().reverse() : grupy[i];
        const mojPkt = pr.mojKoniec ? ja[ja.length - 1] : ja[0];
        const jejPkt = pr.mojKoniec ? inna[0] : inna[inna.length - 1];
        if (!blisko(mojPkt, jejPkt)) continue;

        if (pr.odwrocMnie) odwrocGrupe(grupy, iJa);
        if (pr.odwrocJa) odwrocGrupe(grupy, i);
        const moja = grupy[iJa];
        const cel = pr.mojKoniec ? grupy[i][0] : grupy[i][grupy[i].length - 1];
        const zrodlo = pr.mojKoniec ? moja[moja.length - 1] : moja[0];
        const o = zmiescPrzesuniecie(moja, cel.x - zrodlo.x, cel.y - zrodlo.y);
        przesunGrupe(moja, o.dx, o.dy);
        return pr.mojKoniec ? scalGrupy(grupy, iJa, i) : scalGrupy(grupy, i, iJa);
      }
    }
    return null;
  }

  // Ostatnia narysowana linia — ta, przy której właśnie stoi ręka. Figury nie liczą się
  // same z siebie: szukamy odcinka, w którym są punkty postawione palcem.
  function ostatniaNarysowanaGrupa(grupy, pomin) {
    for (let i = grupy.length - 1; i >= 0; i--) {
      if (i === pomin) continue;
      if (grupy[i].length > 1 && grupy[i].some((t) => !t.figId)) return i;
    }
    return -1;
  }

  // Dotknięcie początku figury w trybie Tor: rysowana linia dojeżdża do figury
  // i obie stają się jedną trasą. Wcześniej takie dotknięcie tylko przestawiało
  // rysowanie na figurę, więc wyglądało, jakby edytor „przeskoczył" na woltę
  // zamiast ją podłączyć.
  function dolaczLinieDoFigury(pktFigury) {
    const grupy = odcinkiToru(stan.tor);
    const iFig = grupy.findIndex((g) => g[0] === pktFigury);
    if (iFig < 0) return false;
    // Najpierw ta linia, od której właśnie rysujemy — także wtedy, gdy jest nią
    // druga figura. Wolta doczepiona do serpentyny to zwykły przejazd, a nie
    // powód, żeby edytor przeskakiwał na woltę i zaczynał od zera.
    let iLinia = -1;
    if (kontynuacja && stan.tor[kontynuacja.indeks]) {
      const t = stan.tor[kontynuacja.indeks];
      const i = grupy.findIndex((g) => g.indexOf(t) >= 0);
      if (i >= 0 && i !== iFig) iLinia = i;
    }
    if (iLinia < 0) iLinia = ostatniaNarysowanaGrupa(grupy, iFig);
    if (iLinia < 0) return false;
    const ostatniFigury = grupy[iFig][grupy[iFig].length - 1];
    zapiszHistorie();
    scalGrupy(grupy, iLinia, iFig);
    // dalsze dotknięcia przedłużają trasę od drugiego końca figury
    const koniec = stan.tor.indexOf(ostatniFigury);
    kontynuacja = koniec >= 0 ? { indeks: koniec, przed: false } : null;
    zaznaczonyOdcinek = null; zaznaczoneZlaczenie = null;
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
    odswiezLiczniki(); odswiezOstrzezenia();
    pokazPodpowiedz("Połączone w jedną trasę — dalej rysujesz od drugiego końca tej figury; kółeczko na styku rozłącza");
    return true;
  }

  // Punkt sklejenia pod palcem.
  function zlaczeniePod(p) {
    let naj = null;
    stan.tor.forEach((t) => {
      if (!t.zlaczenie) return;
      const d = Math.hypot(t.x - p.x, t.y - p.y);
      if (d < CHWYT_ODCINKA && (!naj || d < naj.d)) naj = { d: d, t: t };
    });
    return naj ? naj.t : null;
  }

  function rozlacz(t) {
    zapiszHistorie();
    delete t.zlaczenie;
    t.przerwa = true;
    zaznaczonyOdcinek = null;
    zaznaczoneZlaczenie = null;
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
    odswiezLiczniki(); odswiezOstrzezenia();
    pokazPodpowiedz("Rozłączone — to znowu dwie osobne linie; przeciągnij jedną, żeby je rozsunąć");
  }

  function grupaOdcinka(pierwszy) {
    let wynik = null;
    odcinkiToru(stan.tor).forEach((g) => { if (!wynik && g[0] === pierwszy) wynik = g; });
    return wynik;
  }

  // Linia toru pod palcem — mierzone do samej linii, żeby dało się ją dotknąć
  // gdziekolwiek, nie tylko w kropkach.
  function odcinekPodLinia(p) {
    let naj = null;
    odcinkiToru(stan.tor).forEach((g) => {
      if (g.length < 2) return;
      for (let i = 0; i < g.length - 1; i++) {
        const d = odlOdOdcinka(p, g[i], g[i + 1]);
        if (!naj || d < naj.d) naj = { d: d, grupa: g };
      }
    });
    return (naj && naj.d < CHWYT_LINII) ? naj : null;
  }

  // Ile koń przejedzie po tej jednej linii.
  function dlugoscOdcinka(g) {
    let suma = 0;
    for (let i = 0; i < g.length - 1; i++) {
      let poprz = punktNaOdcinku(g, i, 0);
      for (let k = 1; k <= 12; k++) {
        const q = punktNaOdcinku(g, i, k / 12);
        suma += Math.hypot(q.x - poprz.x, q.y - poprz.y);
        poprz = q;
      }
    }
    return suma;
  }

  function usunOdcinek(pierwszy) {
    const g = grupaOdcinka(pierwszy);
    if (!g) return;
    const od = stan.tor.indexOf(g[0]);
    if (od < 0) return;
    zapiszHistorie();
    stan.tor.splice(od, g.length);
    // linia, która teraz stoi na tym miejscu, przejmuje przerwę po usuniętej
    if (od > 0 && stan.tor[od]) stan.tor[od].przerwa = true;
    zaznaczonyOdcinek = null;
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
    odswiezLiczniki(); odswiezOstrzezenia();
    pokazPodpowiedz("Linia usunięta — cofnij, jeśli to pomyłka");
  }

  // Kropka z obwódką zaczynająca linię jest jej uchwytem: ciągnięcie przesuwa
  // cały odcinek toru razem z figurami, które w nim siedzą.
  function odcinekPodKropka(p) {
    let naj = null;
    odcinkiToru(stan.tor).forEach((grupa) => {
      if (!grupa.length) return;
      const d = Math.hypot(grupa[0].x - p.x, grupa[0].y - p.y);
      if (d < CHWYT_ODCINKA && (!naj || d < naj.d)) naj = { d: d, grupa: grupa };
    });
    return naj;
  }
  const CHWYT_UCHWYTU = 1.1;  // uchwyt rozciągania łapie się z takiego promienia

  // Uchwyt do rozciągania: leży po drugiej stronie figury niż jej zaczep, więc
  // ciągnięcie go czyta się jak rozciąganie gumki — jeden koniec stoi, drugi jedzie.
  function uchwytFigury(figId) {
    const idx = indeksyFigury(figId);
    if (!idx.length) return null;
    const p = stan.tor[idx[0]];
    if (!p.figTyp || p.figNx === undefined) return null;
    const n = { x: p.figNx, y: p.figNy }, t = { x: p.figTx, y: p.figTy };
    const d = p.figD, r = d / 2;
    if (p.figTyp === "serpentyna") {
      // grzbiet pierwszego łuku: w bok o połowę szerokości, do przodu o połowę długości łuku
      const osie = p.figSciana
        ? osieSerpentyny(t, p.figLuki || 3, d)
        : { a: r, b: r };
      return { x: p.x + n.x * osie.b + t.x * osie.a, y: p.y + n.y * osie.b + t.y * osie.a,
               zaczep: p, n: n, t: t, typ: p.figTyp, luki: p.figLuki || 3, d: d,
               maks: p.figSciana ? osieSerpentyny(t, p.figLuki || 3).pelna
                                 : najwiekszaFigura(p, p.figLuki || 3, true) };
    }
    // wolta i półwolta: punkt najdalszy od zaczepu, na wprost przez środek.
    // Sufit to nie szerokość placu, tylko tyle, ile figura ma jeszcze przed sobą
    // od swojego zaczepu — inaczej rozciąganie przejeżdżałoby przez bandę.
    return { x: p.x + n.x * d, y: p.y + n.y * d,
             zaczep: p, n: n, t: t, typ: p.figTyp, luki: p.figLuki || 3, d: d,
             maks: najwiekszaFigura(p, p.figLuki || 3, true) };
  }

  // Średnica wynikająca z tego, gdzie trzymasz palec: rzut na oś figury.
  function srednicaZUchwytu(u, p) {
    const rzut = (p.x - u.zaczep.x) * u.n.x + (p.y - u.zaczep.y) * u.n.y;
    const d = (u.typ === "serpentyna") ? rzut * 2 : rzut;
    // sufit: serpentyna od ściany do ściany nie urośnie poza plac, tylko się na nim zatrzyma
    return Math.min(u.maks || 40, Math.max(MIN_FIG, Math.round(d * 4) / 4));
  }

  // Figura pod palcem — mierzone do linii, nie do samych kropek, bo między kropkami
  // wolty są dwa i pół metra pustki i trafianie w nie byłoby loterią.
  function figuraPod(p) {
    let naj = null;
    const grupy = new Map();
    stan.tor.forEach((t) => { if (t.figId) grupy.set(t.figId, (grupy.get(t.figId) || []).concat([t])); });
    grupy.forEach((pkt, id) => {
      for (let k = 0; k < pkt.length; k++) {
        let d = Math.hypot(pkt[k].x - p.x, pkt[k].y - p.y);
        if (pkt[k + 1]) d = Math.min(d, odlOdOdcinka(p, pkt[k], pkt[k + 1]));
        if (!naj || d < naj.d) naj = { d: d, figId: id };
      }
    });
    return (naj && naj.d < CHWYT_FIGURY) ? naj : null;
  }

  // Punkty, jakie figura będzie miała po przebudowie na daną średnicę. Wydzielone,
  // żeby pytanie „ile się jeszcze zmieści" liczyło dokładnie to samo, co przebudowa —
  // inaczej pasek obiecywałby rozmiar, którego przebudowa i tak nie przyjmie.
  function punktyPrzebudowy(pierwszy, srednica, luki, odZaczepu) {
    const typ = pierwszy.figTyp;
    const t = { x: pierwszy.figTx, y: pierwszy.figTy };
    const n = (pierwszy.figNx !== undefined)
      ? { x: pierwszy.figNx, y: pierwszy.figNy }
      : normalnaFigury(typ, pierwszy, t, pierwszy.figD || srednica);
    // Zaczep wolty leży na jej obwodzie, a serpentyny na jej początku. Gdyby został
    // w miejscu, powiększona figura rosłaby w jedną stronę i wypadała z placu.
    // Trzymamy więc środek, a zaczep przeliczamy.
    const p = { x: pierwszy.x, y: pierwszy.y };
    if (odZaczepu) {
      // nic nie przesuwamy: palec trzyma jeden koniec, zaczep zostaje na miejscu
    } else if (pierwszy.figSciana) {
      // serpentyna od ściany do ściany zawsze zajmuje całą długość placu, niezależnie
      // od liczby łuków — zaczep zostaje tam, gdzie stoi
    } else if (typ === "wolta") {
      const rStary = (pierwszy.figD || srednica) / 2, rNowy = srednica / 2;
      p.x += n.x * (rStary - rNowy); p.y += n.y * (rStary - rNowy);
    } else if (typ === "serpentyna") {
      const dlStara = (pierwszy.figLuki || luki) * (pierwszy.figD || srednica);
      const dlNowa = luki * srednica;
      p.x -= t.x * (dlNowa - dlStara) / 2; p.y -= t.y * (dlNowa - dlStara) / 2;
    }
    const pkt = punktyFigury(typ, p, t, srednica, luki, n, pierwszy.figSciana);
    const caly = [{ x: okr(p.x), y: okr(p.y) }]
      .concat(pkt.map((q) => ({ x: okr(q.x), y: okr(q.y), ostry: q.ostry || undefined })));
    return { p: p, t: t, n: n, caly: caly };
  }

  // Największa średnica, jaka mieści się na placu przy tym ustawieniu figury.
  // Szukamy krokiem siatki, bo wolta rośnie inaczej niż serpentyna, a półwolta
  // jeszcze inaczej — jedna formuła na wszystkie trzy byłaby zgadywaniem.
  const LUZ_FIGURY = 0.05;
  function najwiekszaFigura(pierwszy, luki, odZaczepu) {
    const typ = pierwszy.figTyp;
    if (!typ || pierwszy.figNx === undefined) return 40;
    if (pierwszy.figSciana) {
      return osieSerpentyny({ x: pierwszy.figTx, y: pierwszy.figTy },
                            luki || pierwszy.figLuki || 3).pelna;
    }
    const l = luki || pierwszy.figLuki || 3;
    const gora = Math.max(stan.dl, stan.sz) + 2;
    let naj = Math.max(MIN_FIG, pierwszy.figD || MIN_FIG);
    for (let d = MIN_FIG; d <= gora; d += 0.25) {
      if (wystajePozaPlac(punktyPrzebudowy(pierwszy, d, l, odZaczepu).caly, LUZ_BANDY) > LUZ_FIGURY) break;
      naj = d;
    }
    return naj;
  }

  // Przebudowa na inną średnicę albo liczbę łuków, w miejscu, w którym figura stoi.
  // opcje: { lekko } — w trakcie ciągnięcia nie zapisujemy i nie krzyczymy,
  //         { odZaczepu } — figura rośnie od swojego zaczepu, a nie wokół środka
  function przebudujFigure(figId, srednica, luki, opcje) {
    const lekko = opcje && opcje.lekko;
    const idx = indeksyFigury(figId);
    if (!idx.length) return;
    const pierwszy = stan.tor[idx[0]];
    // koło ósemki rośnie od punktu styku, żeby ósemka została ósemką
    const odZaczepu = (opcje && opcje.odZaczepu !== undefined)
      ? opcje.odZaczepu : !!pierwszy.figOsemka;
    const typ = pierwszy.figTyp;
    if (!typ) {
      if (lekko) return false;
      return pokazPodpowiedz("Ta figura jest ze starszego zapisu — nie znam jej wymiarów. Postaw ją na nowo");
    }
    const budowa = punktyPrzebudowy(pierwszy, srednica, luki, odZaczepu);
    const t = budowa.t, n = budowa.n, p = budowa.p, caly = budowa.caly;
    const wystaje = wystajePozaPlac(caly);
    if (wystaje > WYSTAJE_MAX) {
      if (lekko) return false;   // przy ciągnięciu po prostu dalej nie idziemy
      return pokazPodpowiedz(zaMalo(typ, srednica, luki, wystaje));
    }
    if (!lekko) zapiszHistorie();
    caly.forEach((q) => { q.fig = true; q.figId = figId; });
    if (pierwszy.przerwa) caly[0].przerwa = true;
    if (pierwszy.zlaczenie) caly[0].zlaczenie = true;
    Object.assign(caly[0], { figTyp: typ, figD: srednica, figLuki: luki,
                             figTx: t.x, figTy: t.y, figNx: n.x, figNy: n.y,
                             figSciana: pierwszy.figSciana, figOsemka: pierwszy.figOsemka });
    stan.tor.splice.apply(stan.tor, [idx[0], idx.length].concat(caly));
    odswiezWpiete();
    if (lekko) { rysuj(); return true; }
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
    odswiezLiczniki(); odswiezOstrzezenia();
    pokazPodpowiedz(`${pierwszy.figOsemka ? "Koło ósemki" : FIGURY[typ].nazwa} ${fmtL(srednica)} m`
      + (typ === "serpentyna" ? ` · ${luki} ${luki < 5 ? "łuki" : "łuków"} · ${fmtL(luki * srednica)} m wzdłuż placu` : ""));
  }

  // Odbita albo obrócona figura zajmuje inny kawałek placu i potrafi wyjść za bandę.
  // Zamiast odmawiać — a odmowa przy wolcie stojącej na środku byłaby regułą, nie
  // wyjątkiem — wsuwamy ją z powrotem najkrótszą drogą.
  function srodekProstokata(pkt) {
    const xs = pkt.map((q) => q.x), ys = pkt.map((q) => q.y);
    return { x: (Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2,
             y: (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2 };
  }

  // Odbita figura ma zostać tam, gdzie stała. Gdyby odbijać ją względem zaczepu,
  // wolta przeskakiwałaby o własną średnicę, a przerzucenie dwa razy nie wracałoby
  // do punktu wyjścia. Odbijamy więc kształt, a potem nasuwamy go na stare miejsce.
  function ustawWSrodku(pkt, srodekStary) {
    const teraz = srodekProstokata(pkt);
    const dx = srodekStary.x - teraz.x, dy = srodekStary.y - teraz.y;
    if (dx || dy) pkt.forEach((q) => { q.x = okr(q.x + dx); q.y = okr(q.y + dy); });
  }

  function wsunNaPlac(pkt) {
    const xs = pkt.map((q) => q.x), ys = pkt.map((q) => q.y);
    // wsuwamy z odstępem od bandy, ale tylko jeśli figura ma na niego miejsce —
    // odbita wolta wpisana w plac co do metra ma zostać taka, jaka była
    const szer = Math.max.apply(null, xs) - Math.min.apply(null, xs);
    const wys = Math.max.apply(null, ys) - Math.min.apply(null, ys);
    const l = Math.min(LUZ_BANDY,
                       Math.max(0, (stan.dl - szer) / 2), Math.max(0, (stan.sz - wys) / 2));
    let dx = 0, dy = 0;
    if (Math.min.apply(null, xs) < l) dx = l - Math.min.apply(null, xs);
    else if (Math.max.apply(null, xs) > stan.dl - l) dx = stan.dl - l - Math.max.apply(null, xs);
    if (Math.min.apply(null, ys) < l) dy = l - Math.min.apply(null, ys);
    else if (Math.max.apply(null, ys) > stan.sz - l) dy = stan.sz - l - Math.max.apply(null, ys);
    if (dx || dy) pkt.forEach((q) => { q.x = okr(q.x + dx); q.y = okr(q.y + dy); });
    return Math.hypot(dx, dy);
  }

  // Odbicie figury na drugą stronę własnej osi. Zaczep zostaje, więc wolta przeskakuje
  // na drugą stronę punktu, w którym siedzi, a półwolta zmienia rękę.
  function przerzucFigure(figId) {
    const idx = indeksyFigury(figId);
    if (!idx.length) return;
    const pierwszy = stan.tor[idx[0]];
    const typ = pierwszy.figTyp;
    if (!typ || pierwszy.figNx === undefined) {
      return pokazPodpowiedz("Ta figura jest ze starszego zapisu — nie znam jej ustawienia. Postaw ją na nowo");
    }
    const n = { x: -pierwszy.figNx, y: -pierwszy.figNy };
    const t = { x: pierwszy.figTx, y: pierwszy.figTy };
    const p = { x: pierwszy.x, y: pierwszy.y };
    const srednica = pierwszy.figD, luki = pierwszy.figLuki || 3;
    const stareMiejsce = srodekProstokata(idx.map((i) => stan.tor[i]));
    const pkt = punktyFigury(typ, p, t, srednica, luki, n, pierwszy.figSciana);
    const caly = [{ x: okr(p.x), y: okr(p.y) }]
      .concat(pkt.map((q) => ({ x: okr(q.x), y: okr(q.y), ostry: q.ostry || undefined })));
    ustawWSrodku(caly, stareMiejsce);
    const wsunieta = wsunNaPlac(caly);
    const wystaje = wystajePozaPlac(caly);
    if (wystaje > WYSTAJE_MAX) {
      return pokazPodpowiedz(`${FIGURY[typ].nazwa} ${fmtL(srednica)} m nie zmieści się po drugiej stronie na placu ${stan.dl} × ${stan.sz} m`);
    }
    zapiszHistorie();
    caly.forEach((q) => { q.fig = true; q.figId = figId; });
    if (pierwszy.przerwa) caly[0].przerwa = true;
    Object.assign(caly[0], { figTyp: typ, figD: srednica, figLuki: luki,
                             figTx: t.x, figTy: t.y, figNx: n.x, figNy: n.y,
                             figSciana: pierwszy.figSciana, figOsemka: pierwszy.figOsemka });
    stan.tor.splice.apply(stan.tor, [idx[0], idx.length].concat(caly));
    odswiezWpiete();
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
    odswiezLiczniki(); odswiezOstrzezenia();
    pokazPodpowiedz(`${FIGURY[typ].nazwa} przerzucona na drugą stronę`
      + (wsunieta > 0.05 ? `, wsunięta o ${fmtL(wsunieta)} m, żeby zmieściła się na placu` : ""));
  }

  // Obrót osi figury o 90°: półwolta w poprzek placu zamiast wzdłuż.
  function obrocFigure(figId) {
    const idx = indeksyFigury(figId);
    if (!idx.length) return;
    const pierwszy = stan.tor[idx[0]];
    const typ = pierwszy.figTyp;
    if (!typ || pierwszy.figNx === undefined) {
      return pokazPodpowiedz("Ta figura jest ze starszego zapisu — nie znam jej ustawienia. Postaw ją na nowo");
    }
    const t = { x: -pierwszy.figTy, y: pierwszy.figTx };
    const n = { x: -pierwszy.figNy, y: pierwszy.figNx };
    const p = { x: pierwszy.x, y: pierwszy.y };
    let srednica = pierwszy.figD;
    const luki = pierwszy.figLuki || 3;
    const stareMiejsce = srodekProstokata(idx.map((i) => stan.tor[i]));
    // serpentyna od ściany do ściany po obrocie mierzy się w drugą stronę placu,
    // więc jej zaczep trzeba policzyć od nowa
    if (pierwszy.figSciana) {
      // Po obrocie „pełna szerokość" znaczy co innego, bo plac ma inny bok w poprzek.
      // Figura, która dotykała ścian, ma ich dotykać dalej; węższa zachowuje swoje metry.
      const staraOs = { x: pierwszy.figTx, y: pierwszy.figTy };
      const bylaPelna = Math.abs(srednica - osieSerpentyny(staraOs, luki).pelna) < 0.3;
      if (bylaPelna) srednica = osieSerpentyny(t, luki).pelna;
      const z = zaczepSciany(t, luki, srednica);
      p.x = z.x; p.y = z.y;
    }
    const pkt = punktyFigury(typ, p, t, srednica, luki, n, pierwszy.figSciana);
    const caly = [{ x: okr(p.x), y: okr(p.y) }]
      .concat(pkt.map((q) => ({ x: okr(q.x), y: okr(q.y), ostry: q.ostry || undefined })));
    if (!pierwszy.figSciana) ustawWSrodku(caly, stareMiejsce);
    const wsunieta = wsunNaPlac(caly);
    const wystaje = wystajePozaPlac(caly);
    if (wystaje > WYSTAJE_MAX) {
      return pokazPodpowiedz(`${FIGURY[typ].nazwa} ${fmtL(srednica)} m nie zmieści się w poprzek placu ${stan.dl} × ${stan.sz} m`);
    }
    zapiszHistorie();
    caly.forEach((q) => { q.fig = true; q.figId = figId; });
    if (pierwszy.przerwa) caly[0].przerwa = true;
    Object.assign(caly[0], { figTyp: typ, figD: srednica, figLuki: luki,
                             figTx: t.x, figTy: t.y, figNx: n.x, figNy: n.y,
                             figSciana: pierwszy.figSciana, figOsemka: pierwszy.figOsemka });
    stan.tor.splice.apply(stan.tor, [idx[0], idx.length].concat(caly));
    odswiezWpiete();
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
    odswiezLiczniki(); odswiezOstrzezenia();
    pokazPodpowiedz(`${FIGURY[typ].nazwa} obrócona o 90°`
      + (wsunieta > 0.05 ? `, wsunięta o ${fmtL(wsunieta)} m, żeby zmieściła się na placu` : ""));
  }

  function usunFigure(figId) {
    const idx = indeksyFigury(figId);
    if (!idx.length) return;
    zaznaczonyOdcinek = null;
    zapiszHistorie();
    const bylaPrzerwa = stan.tor[idx[0]].przerwa;
    const bylZlaczeniem = stan.tor[idx[0]].zlaczenie;
    stan.tor.splice(idx[0], idx.length);
    // punkt, który szedł po figurze, przejmuje jej przerwę, żeby nie skleił się z poprzednim odcinkiem
    if (bylaPrzerwa && stan.tor[idx[0]]) stan.tor[idx[0]].przerwa = true;
    // figura wyjęta ze styku zostawia po sobie przerwę, żeby linia nie skakała przez nią
    else if (bylZlaczeniem && stan.tor[idx[0]]) stan.tor[idx[0]].przerwa = true;
    zaznaczonaFigura = null;
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
    odswiezLiczniki(); odswiezOstrzezenia();
    pokazPodpowiedz("Figura usunięta — cofnij, jeśli to pomyłka");
  }

  // Powód odmowy nazwany po imieniu: przy serpentynie problemem prawie zawsze jest
  // długość, czyli liczba łuków razy średnica, a nie sama średnica.
  // Ile figura wystaje poza plac, gdy postawić ją dokładnie tak, jak stawia ją
  // przycisk w oknie. Ta sama droga co w postawFigure — inaczej okno obiecywałoby
  // rozmiar, którego postawienie i tak nie przyjmie.
  function wystanieFigury(typ, srednica, luki, sciana) {
    const z = zaczepDlaFigury(typ, srednica, luki, sciana);
    const n = normalnaFigury(typ, z.p, z.t, srednica);
    const pkt = punktyFigury(typ, z.p, z.t, srednica, luki, n, sciana);
    const caly = [{ x: okr(z.p.x), y: okr(z.p.y) }]
      .concat(pkt.map((q) => ({ x: okr(q.x), y: okr(q.y) })));
    return wystajePozaPlac(caly);
  }

  // Największa średnica, jaką da się postawić na środku placu. Krokiem 0,5 m,
  // czyli tym samym, którym chodzi pole w oknie.
  function najwiekszaNaSrodku(typ, luki) {
    const gora = Math.max(stan.dl, stan.sz) + 2;
    let naj = 0;
    for (let d = MIN_FIG; d <= gora; d += 0.5) {
      if (wystanieFigury(typ, d, luki, false) > WYSTAJE_MAX) break;
      naj = d;
    }
    return naj;
  }

  // ---- ósemka: dwie wolty stykające się w jednym punkcie ----
  // Nie robimy z niej osobnego typu figury. Ósemka to po prostu DWIE wolty,
  // każda ze swoim figId — bo Luiza chce zmieniać każde koło osobno („często też
  // tak jest"), a przy okazji cała maszyneria przebudowy, chwytania i przesuwania
  // zostaje ta sama, więc nie ma gdzie dorobić nowych błędów.
  // Oba koła stykają się w jednym punkcie i obiegane są w przeciwne strony:
  // ten sam zaczep, ta sama styczna, przeciwne normalne.
  function osemkaOsie() {
    const wzdluz = stan.dl >= stan.sz ? { x: 1, y: 0 } : { x: 0, y: 1 };
    return {
      P: { x: stan.dl / 2, y: stan.sz / 2 },       // punkt styku — środek placu
      t: { x: -wzdluz.y, y: wzdluz.x },            // przez styk jedzie się w poprzek
      n: [wzdluz, { x: -wzdluz.x, y: -wzdluz.y }]  // koła po obu stronach styku
    };
  }

  function osemkaKola(d) {
    const o = osemkaOsie();
    return o.n.map((n) => [{ x: okr(o.P.x), y: okr(o.P.y) }]
      .concat(punktyFigury("wolta", o.P, o.t, d, 3, n)
        .map((q) => ({ x: okr(q.x), y: okr(q.y) }))));
  }

  function wystanieOsemki(d) {
    return Math.max.apply(null, osemkaKola(d).map((k) => wystajePozaPlac(k)));
  }

  function najwiekszaOsemka() {
    const gora = Math.max(stan.dl, stan.sz) + 2;
    let naj = 0;
    for (let d = MIN_FIG; d <= gora; d += 0.5) {
      if (wystanieOsemki(d) > WYSTAJE_MAX) break;
      naj = d;
    }
    return naj;
  }

  function postawOsemke(d) {
    const wystaje = wystanieOsemki(d);
    if (wystaje > WYSTAJE_MAX) {
      return pokazPodpowiedz(`Ósemka z kół po ${fmtL(d)} m zajmuje ${fmtL(2 * d)} m i wystaje o `
        + `${fmtL(wystaje)} m poza plac ${stan.dl} × ${stan.sz} m — zmniejsz średnicę`);
    }
    const o = osemkaOsie();
    zapiszHistorie();
    // wspólny numer obu kół: po nim poznajemy, że mają jeździć razem
    const osemkaNr = stan.nastFig = (stan.nastFig || 1) + 1;
    let pierwszeKolo = null;
    osemkaKola(d).forEach((caly, i) => {
      const nr = stan.nastFig = (stan.nastFig || 1) + 1;
      if (i === 0) pierwszeKolo = nr;
      caly.forEach((q, k) => { q.fig = true; q.figId = nr; if (k === 0 && stan.tor.length) q.przerwa = true; });
      // „figOsemka" znaczy dwie rzeczy: koło rośnie od punktu styku (a nie wokół
      // swojego środka — inaczej powiększenie jednej połowy rozjeżdżałoby ósemkę)
      // i jedzie razem z drugim kołem o tym samym numerze
      Object.assign(caly[0], { figTyp: "wolta", figD: d, figLuki: 3,
                               figTx: o.t.x, figTy: o.t.y,
                               figNx: o.n[i].x, figNy: o.n[i].y, figOsemka: osemkaNr });
      caly.forEach((q) => stan.tor.push(q));
    });
    zaznaczony = null;
    zaznaczonaFigura = pierwszeKolo;
    rysuj(); zapiszLokalnie(); odswiezPomiar(); odswiezKontekst();
    odswiezLiczniki(); odswiezOstrzezenia();
    pokazPodpowiedz(`Ósemka z dwóch wolt po ${fmtL(d)} m — dotknij koła, żeby zmienić je osobno`);
  }

  function zaMalo(typ, srednica, luki, wystaje) {
    const gdzie = `plac ${stan.dl} × ${stan.sz} m`;
    if (typ === "serpentyna") {
      return `Serpentyna ${luki} × ${fmtL(srednica)} m to ${fmtL(luki * srednica)} m wzdłuż placu — wystaje o ${fmtL(wystaje)} m poza ${gdzie}. Zmniejsz liczbę łuków albo średnicę`;
    }
    return `${FIGURY[typ].nazwa} ${fmtL(srednica)} m wystaje o ${fmtL(wystaje)} m poza ${gdzie} — zmniejsz średnicę`;
  }

  function oknoFigury(klucz) {
    const f = FIGURY[klucz];
    pokazOkno(f.nazwa, (t) => {
      const info = document.createElement("p");
      info.style.cssText = "color:var(--ink-soft); font-size:0.86rem; margin:0 0 0.6rem";
      info.textContent = f.opis.charAt(0).toUpperCase() + f.opis.slice(1)
        + ". Stanie na środku placu — potem przeciągniesz ją, gdzie ma być.";
      t.appendChild(info);

      const w = document.createElement("div");
      w.className = "wiersz";
      w.innerHTML = `<span class="etykieta">Średnica${klucz === "osemka"
        ? `<span style="opacity:0.6"> · jednego koła; drugie takie samo, potem zmienisz je osobno</span>` : ""}</span>`;
      const srednica = document.createElement("input");
      srednica.type = "number"; srednica.min = String(MIN_FIG); srednica.max = "40"; srednica.step = "0.5";
      srednica.placeholder = "m";
      w.appendChild(srednica);
      t.appendChild(w);

      let luki = null, odSciany = false, guzikSciany = null;
      if (klucz === "serpentyna") {
        const wl = document.createElement("div");
        wl.className = "wiersz";
        wl.innerHTML = `<span class="etykieta">Liczba łuków</span>`;
        luki = document.createElement("input");
        luki.type = "number"; luki.min = "2"; luki.max = "8"; luki.step = "1"; luki.value = "3";
        wl.appendChild(luki);
        t.appendChild(wl);

        const ws = document.createElement("div");
        ws.className = "wiersz";
        ws.innerHTML = `<span class="etykieta">Od ściany do ściany<span style="opacity:0.6"> · łuki dotykają obu długich ścian, wymiary z placu</span></span>`;
        guzikSciany = document.createElement("button");
        guzikSciany.className = "mini";
        guzikSciany.textContent = "Włącz";
        guzikSciany.addEventListener("click", () => {
          odSciany = !odSciany;
          guzikSciany.classList.toggle("on", odSciany);
          guzikSciany.textContent = odSciany ? "Włączone" : "Włącz";
          srednica.disabled = odSciany;
          wstaw.textContent = odSciany ? "Wstaw serpentynę od ściany do ściany" : "Wstaw serpentynę na plac";
          odswiezMiare();
        });
        ws.appendChild(guzikSciany);
        t.appendChild(ws);
      }

      // Odmowa musi stać w oknie. Podpowiedź na dole ekranu chowa się za zasłoną,
      // więc kliknięcie z za małą średnicą wyglądało jak martwy przycisk.
      const blad = document.createElement("p");
      blad.style.cssText = "margin:0.35rem 0 0; color:var(--blad); font-size:0.82rem; min-height:1.1rem";
      t.appendChild(blad);
      // Sufit liczymy dla tego, co okno naprawdę zrobi: postawi figurę na środku.
      const iluLukow = () => (luki ? Math.max(2, Math.min(8, +luki.value || 3)) : 3);
      const sufit = () => (klucz === "osemka") ? najwiekszaOsemka() : najwiekszaNaSrodku(klucz, iluLukow());
      const zaDuza = () => {
        if (odSciany) return "";
        const d = +srednica.value;
        if (!srednica.value.trim() || !(d >= MIN_FIG)) return "";
        const m = sufit();
        if (!m || d <= m + 0.01) return "";
        if (klucz === "serpentyna") {
          return `Przy ${iluLukow()} łukach na plac ${stan.dl} × ${stan.sz} m wejdzie najwyżej ${fmtL(m)} m — zmniejsz średnicę albo liczbę łuków`;
        }
        if (klucz === "osemka") {
          return `Dwa koła po ${fmtL(d)} m to ${fmtL(2 * d)} m — na plac ${stan.dl} × ${stan.sz} m wejdą koła po ${fmtL(m)} m`;
        }
        return `${fmtL(d)} m nie zmieści się na placu ${stan.dl} × ${stan.sz} m — największa ${FIGURY[klucz].nazwa.toLowerCase()} to ${fmtL(m)} m`;
      };
      const odswiezBlad = () => { blad.textContent = zaDuza(); };
      srednica.addEventListener("input", odswiezBlad);
      srednica.max = String(sufit() || 40);

      let miara = null;
      if (klucz === "serpentyna") {
        miara = document.createElement("p");
        miara.className = "drobne";
        miara.style.cssText = "margin:0.3rem 0 0; color:var(--ink-faint); font-size:0.78rem";
        t.appendChild(miara);
      }
      const odswiezMiare = () => {
        if (!miara) return;
        const d = +srednica.value, l = Math.max(2, Math.min(8, +luki.value || 3));
        const dlugi = Math.max(stan.dl, stan.sz), krotki = Math.min(stan.dl, stan.sz);
        if (odSciany) {
          miara.textContent = `${l} ${l < 5 ? "łuki" : "łuków"} po ${fmtL((dlugi - 0.5) / l)} m wzdłuż i ${fmtL(krotki - 0.5)} m w poprzek — cała długość placu`;
          miara.style.color = "var(--ink-faint)";
          return;
        }
        miara.textContent = d >= MIN_FIG
          ? `${l} × ${fmtL(d)} m to ${fmtL(l * d)} m wzdłuż placu (masz ${fmtL(dlugi)} m)`
          : `Długość serpentyny to liczba łuków razy średnica — plac ma ${fmtL(dlugi)} m`;
        miara.style.color = (d >= MIN_FIG && l * d > dlugi) ? "var(--blad)" : "var(--ink-faint)";
      };
      if (miara) {
        [srednica, luki].forEach((pole) => pole.addEventListener("input", odswiezMiare));
        // przy serpentynie sufit zależy też od liczby łuków
        luki.addEventListener("input", () => { srednica.max = String(sufit() || 40); odswiezBlad(); });
        odswiezMiare();
      }

      const wstaw = document.createElement("button");
      wstaw.className = "wstaw";
      wstaw.textContent = `Wstaw ${f.biernik || f.nazwa.toLowerCase()} na plac`;
      wstaw.addEventListener("click", () => {
        const l = luki ? Math.max(2, Math.min(8, +luki.value || 3)) : 3;
        if (odSciany) {
          $("zaslonaOkno").classList.remove("widoczna");
          return postawFigure(klucz, 10, l, true);   // średnica bez znaczenia, liczy z placu
        }
        const d = +srednica.value;
        if (!srednica.value.trim()) {
          blad.textContent = `Wpisz średnicę w metrach — najmniejsza to ${fmtL(MIN_FIG)} m`;
          srednica.focus();
          return;
        }
        if (!(d >= MIN_FIG)) {
          blad.textContent = `${fmtL(d)} m to za mało — najmniejsza figura ma ${fmtL(MIN_FIG)} m średnicy`;
          srednica.focus(); srednica.select();
          return;
        }
        const zaDuzo = zaDuza();
        if (zaDuzo) {
          blad.textContent = zaDuzo;
          srednica.focus(); srednica.select();
          return;
        }
        $("zaslonaOkno").classList.remove("widoczna");
        if (klucz === "osemka") return postawOsemke(d);
        postawFigure(klucz, d, l);
      });
      t.appendChild(wstaw);

      // Enter w polu robi to samo co przycisk — inaczej wpisanie liczby i Enter
      // wygląda, jakby nic się nie stało
      [srednica, luki].forEach((pole) => {
        if (!pole) return;
        pole.addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); wstaw.click(); } });
      });

      setTimeout(() => srednica.focus(), 30);
    });
    // w tym oknie „Gotowe" tylko zamykało okno i wyglądało jak zatwierdzenie —
    // stąd wrażenie, że figura nie działa
    $("oknoOk").textContent = "Anuluj";
  }

  // Po skasowanym elemencie punkt toru zostaje — przestaje tylko za czymś jechać.
  function odwiazOd(id) {
    stan.tor.forEach((t) => { if (t.el === id) delete t.el; });
  }

  // Wczytany zapis może wskazywać na przeszkody, których już nie ma — starsze zapisy
  // nie mają wiązań wcale i to jest w porządku, po prostu nic za niczym nie jedzie.
  function sprzatnijWiazania() {
    if (!Array.isArray(stan.tor)) return;
    stan.tor.forEach((t) => {
      if (t.el !== undefined && !znajdz(t.el)) delete t.el;
    });
    stan.elementy.forEach((e) => { delete e.swiezy; });
  }

  // Safari na iPhonie powiększa całą stronę gestem szczypania — to mu w tym przeszkadza,
  // żeby szczypanie zostało w placu, a nie ruszało paska narzędzi.
  ["gesturestart", "gesturechange", "gestureend"].forEach((nazwa) => {
    svg.addEventListener(nazwa, (ev) => ev.preventDefault());
  });

  // Odległość punktu od rzeczywistego kształtu elementu (w metrach).
  function odlegloscOd(e, p) {
    const dl = e.dlugosc || TYPY[e.typ].dlugosc;
    if (!dl) return Math.hypot(p.x - e.x, p.y - e.y);
    const rad = (e.kat || 0) * Math.PI / 180;
    const ux = Math.cos(rad), uy = Math.sin(rad);      // kierunek drąga
    const dx = p.x - e.x, dy = p.y - e.y;
    let t = dx * ux + dy * uy;                          // rzut na oś drąga
    t = Math.max(-dl / 2, Math.min(dl / 2, t));
    return Math.hypot(dx - t * ux, dy - t * uy);
  }

  // Najbliższy element w zasięgu — dzięki temu nie trzeba trafiać idealnie.
  const ZASIEG = 0.85; // metry — na tyle blisko wystarczy dotknąć, żeby złapać

  // Pachołek postawiony na stacjonacie leży na niej na rysunku, ale w pomiarze
  // przegrywał: do trzymetrowego drąga jest zero centymetrów wszędzie wzdłuż jego
  // długości, a do pachołka tyle, ile dzieli palec od jego środka. Dlatego najpierw
  // pytamy „na czym palec naprawdę stoi", od góry stosu, a dopiero potem szukamy
  // najbliższego w zasięgu.
  // Jak daleko od środka siedzi gałka obrotu — na tyle daleko, żeby nie zasłaniała
  // samej przeszkody, i zawsze w „górę" jej własnych osi.
  function ramieObrotu(e) {
    const pl = polElementu(e);
    // Gałka stoi „w górę" własnych osi przeszkody — czyli DOKŁADNIE tam, gdzie
    // górna kropka wpięcia. Odsuwamy ją za kropkę, żeby palec nie musiał wybierać
    // między obrotem a wpięciem. Na telefonie metry są małe, więc ramię ma też
    // dolną granicę liczoną w pikselach — inaczej gałka siada na przeszkodzie.
    return Math.max(1.5, pl.wpoprzek + ODSTEP_KROPKI + 0.95,
                    Math.min(4.5, 32 * metrNaPiksel()));
  }

  // Sama gałka — tak samo duża pod palcem na telefonie i na komputerze.
  function promienGalki() { return Math.max(0.38, 11 * metrNaPiksel()); }
  function chwytGalki() { return Math.max(0.75, 22 * metrNaPiksel()); }

  // Gdzie ta gałka leży na placu.
  function punktUchwytuObrotu(e) {
    const r = ramieObrotu(e);
    const kat = ((e.kat || 0) - 90 + SKOS_GALKI) * Math.PI / 180;
    return { x: e.x + Math.cos(kat) * r, y: e.y + Math.sin(kat) * r };
  }

  function promienDotyku(e) {
    const pl = polElementu(e);
    return Math.max(0.3, pl.wpoprzek);   // odlegloscOd liczy już wzdłuż kształtu
  }

  function trafiony(p) {
    for (let i = stan.elementy.length - 1; i >= 0; i--) {
      const e = stan.elementy[i];
      if (odlegloscOd(e, p) <= promienDotyku(e)) return e;
    }
    let naj = null, najD = ZASIEG;
    for (let i = stan.elementy.length - 1; i >= 0; i--) {
      const d = odlegloscOd(stan.elementy[i], p);
      if (d < najD) { najD = d; naj = stan.elementy[i]; }
    }
    return naj;
  }

  svg.addEventListener("pointerdown", (ev) => {
    palce.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (palce.size === 2) {
      // dwa palce = powiększanie i przesuwanie; przerywamy zaczęte przeciąganie
      ciagniety = null; ciagnietyPunkt = null; ciagnietyPunktTrasy = null;
      ciagnietaLinia = null; przesuwanieWidoku = null;
      const [a, b] = [...palce.values()];
      const srodek = naSvg({ clientX: (a.x + b.x) / 2, clientY: (a.y + b.y) / 2 });
      szczypanie = {
        dyst: Math.hypot(a.x - b.x, a.y - b.y),
        srodek: srodek,
        u: { x: (srodek.x - widok.dx) / widok.k, y: (srodek.y - widok.dy) / widok.k },
        k0: widok.k
      };
      return;
    }
    if (palce.size > 2) return;

    const p0 = naMetry(ev);
    zaznaczoneZlaczenie = null;

    // Poza piaskiem: przybornik się odkłada. To jedyny sposób, żeby zobaczyć plac
    // tak, jak wyjdzie na kartce — a wraca za jednym dotknięciem placu.
    const pozaPiaskiem = p0.x < -0.25 || p0.y < -0.25
                      || p0.x > stan.dl + 0.25 || p0.y > stan.sz + 0.25;
    if (pozaPiaskiem && !kropkiSchowane && !czekaNaPostawienie) {
      kropkiSchowane = true;
      zaznaczony = null; zaznaczonaFigura = null; zaznaczonyOdcinek = null;
      rysuj(); odswiezPomiar(); odswiezKontekst();
      pokazPodpowiedz("Kropki schowane — plac wygląda tak, jak wyjdzie na kartce · dotknij placu, żeby wróciły");
      return;
    }
    if (!pozaPiaskiem) kropkiSchowane = false;

    if (czekaNaPostawienie) {
      const co = czekaNaPostawienie;
      czekaNaPostawienie = null;
      dodaj(co, { gdzie: { x: Math.min(stan.dl - 0.5, Math.max(0.5, p0.x)),
                           y: Math.min(stan.sz - 0.5, Math.max(0.5, p0.y)) } });
      return;
    }

    if (trybNumerowania) {
      // Kropka ma pierwszeństwo przed samym dotknięciem elementu: ciągnięcie od
      // kropki do kropki jest głównym sposobem układania trasy, a dotykanie po
      // kolei zostaje jako droga na skróty.
      const kr = kropkaPod(p0);
      if (kr) {
        // Samo DOTKNIĘCIE kropki (bez pociągnięcia) ma dalej numerować to, co pod
        // spodem — kropki wolty leżą dokładnie na jej obwodzie i inaczej nie dałoby
        // się jej już dotknąć.
        ciagnietaKropka = { od: kr, p: p0, skad: p0, cel: null, ruszyl: false, tryb: "numeruj" };
        svg.setPointerCapture(ev.pointerId);
        rysuj();
        pokazPodpowiedz("Ciągnij do kropki przy tym, przez co koń jedzie dalej");
        return;
      }
      numerujPod(p0);
